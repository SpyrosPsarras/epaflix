# Block HTTPS record type (type 65) queries from being forwarded upstream.
# Without this, modern browsers (Firefox, Chrome) receive Cloudflare's HTTPS
# record for *.epaflix.com domains, which includes:
#   - ipv4hint pointing to Cloudflare public IPs (bypassing Pi-hole A record override)
#   - ECH keys for cloudflare-ech.com (Encrypted Client Hello to Cloudflare)
# This causes browsers to route traffic via Cloudflare instead of local K3s Traefik,
# potentially leading to TLS cert mismatches or self-signed cert errors.
# Returning NODATA forces browsers to use the A record (192.168.10.101) instead.
filter-rr=HTTPS
