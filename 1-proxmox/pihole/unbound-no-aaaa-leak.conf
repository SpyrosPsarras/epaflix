server:
    # AAAA leak guard for internal-only *.epaflix.com names. See #868.
    #
    # Install as /etc/unbound/unbound.conf.d/no-aaaa-leak.conf on the Pi-hole
    # LXC (1030, 192.168.10.30). Apply with:
    #     unbound-checkconf /etc/unbound/unbound.conf && unbound-control reload
    #
    # Mechanism: `address=/name/<IPv4>` in /etc/dnsmasq.d/ makes Pi-hole
    # authoritative for the A record only. An AAAA query for the same name is
    # forwarded to Unbound and out to public DNS, where the Cloudflare-proxied
    # `*.epaflix.com` wildcard synthesizes an AAAA. So an IPv6 client asking
    # for an internal-only name is sent to Cloudflare instead of the LAN.
    #
    # Why these four: each one points straight at a box on the LAN, not at
    # Traefik (192.168.10.101). For a .101 name a Cloudflare answer is a
    # hairpin back to a route that exists by design. For these it is a wrong
    # turn off the LAN.
    #
    # Why not a Cloudflare DNS-only shadow record, which is the other fix for
    # this class: it would publish 192.168.10.43, .10, .11 and .110 in public
    # DNS. A local-zone keeps the fix on the LAN and discloses nothing.
    #
    # Same directive as vm-epaflix.conf, which already guards the whole
    # vm.epaflix.com zone. dnsmasq still answers A from its own `address=`
    # line, so only the AAAA reaches Unbound. Verified on nick.vm.epaflix.com:
    # A = 192.168.10.41, AAAA = NOERROR with an empty answer.
    #
    # The LAN is IPv4-only today, so this whole class is latent, not
    # exploitable. Enabling IPv6 anywhere makes every unguarded name live.

    local-zone: "bastion.epaflix.com." static
    local-zone: "takaros.epaflix.com." static
    local-zone: "evanthoulaki.epaflix.com." static
    local-zone: "syncthing.epaflix.com." static
