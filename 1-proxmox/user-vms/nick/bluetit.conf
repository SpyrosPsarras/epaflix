# Bluetit directives for Nick's VM. Appended to the Suite's shipped bluetit.rc
# at container start (which carries the required bootserver/rsa* values).
#
# Syntax is DIRECTIVE<whitespace>VALUE - never `key = value`.
#
# This is the cluster's config from 2-k3s/08.servarr/qbittorrent/bluetit-config.yaml
# with one difference: airkey. Keep them in step when either changes.

airconnectatboot            quick
airvpntype                  wireguard
airport                     1637

# Country list, not named servers. A narrow airwhiteserverlist fails on first
# boot because the persistent lock suspends manifest refresh and the stale
# manifest baked into the image does not satisfy it - see issue #491. The
# blacklist below is what excludes the servers that actually misbehaved.
airwhitecountrylist         nl,de,se

# Measured on 2026-07-30: 6.7-9% packet loss each, all 2 Gbit boxes in
# Alblasserdam at 50-57% load. Nick's VM was pinned to Kajam specifically.
# AirVPN's own status API still reported health=ok for all three, so do not
# trust that flag - measure before editing this list.
airblackserverlist          Cygnus,Hassaleh,Kajam

# Home country. Must be pinned explicitly, because networklockpersist below
# disables automatic detection.
country                     NO
forbidquickhomecountry      yes

# networklockPERSIST, not networklock. The plain form only holds DURING a
# connection, so if the VPN container restarts the lock dies with it while
# qBittorrent keeps announcing to trackers. Persist holds for the whole Bluetit
# session. Do NOT simplify this back.
#
# allowprivatenetwork keeps the 172.28.0.0/16 compose network reachable so
# cloudflared can still reach the WebUI - it replaces the old LAN_NETWORK env.
# allowping is REQUIRED or the lock drops the ICMP the degradation probe needs,
# and the probe then reads a healthy tunnel as dead.
networklockpersist          iptables
allowprivatenetwork         yes
allowping                   yes

# These do NOT stop Bluetit assigning the device's IPv6 to tun0 - that is why
# the compose no longer disables IPv6 via sysctl. They only keep Bluetit from
# routing our own IPv6 traffic over the tunnel.
airipv6                     no
air6to4                     no

# REQUIRED. Without it Bluetit throws "Cannot set pushed DNS to system" and
# that exception tears down an ALREADY-CONNECTED tunnel, reporting only
# "Bluetit is not connected" with no error surfaced.
ignorednspush               yes

# SIGUSR2 reconnect only works with TUN persistence on.
tunpersist                  yes

# Nick's own AirVPN device key - NOT the cluster's `Default`. AirVPN allows one
# session per key, so sharing would knock the two offline in turn.
airkey                      nick
