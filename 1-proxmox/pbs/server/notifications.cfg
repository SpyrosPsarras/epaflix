sendmail: mail-to-root
	comment Send mails to root@pam's email address
	mailto-user root@pam

matcher: default-matcher
	comment Route PBS warning, error and unknown notifications to Discord with a role mention
	match-severity warning,error,unknown
	mode all
	target discord-pbs

matcher: quiet-matcher
	comment Route PBS info and notice notifications except prune jobs to Discord without a mention
	invert-match true
	match-field exact:type=prune
	match-severity warning,error,unknown
	mode any
	target discord-pbs-quiet

webhook: discord-pbs
	body eyJ1c2VybmFtZSI6IlBCUyIsImNvbnRlbnQiOiI8QCZ7eyBzZWNyZXRzLnJvbGUgfX0+IiwiYWxsb3dlZF9tZW50aW9ucyI6eyJyb2xlcyI6WyJ7eyBzZWNyZXRzLnJvbGUgfX0iXX0sImVtYmVkcyI6W3siZGVzY3JpcHRpb24iOiIqKnt7IGVzY2FwZSB0aXRsZSB9fSoqXG5cbnt7IGVzY2FwZSBtZXNzYWdlIH19In1dfQ==
	comment PBS warning/error/unknown notifications -> Discord channel webhook
	header name=Content-Type,value=YXBwbGljYXRpb24vanNvbg==
	method post
	url https://discord.com/api/webhooks/{{ secrets.id }}/{{ secrets.token }}

