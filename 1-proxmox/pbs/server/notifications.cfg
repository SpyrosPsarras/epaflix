sendmail: mail-to-root
	comment Send mails to root@pam's email address
	mailto-user root@pam

matcher: default-matcher
	comment Route PBS notifications except successful prune jobs to Discord
	invert-match true
	match-field exact:type=prune
	match-severity info
	mode all
	target discord-pbs

webhook: discord-pbs
	body eyJ1c2VybmFtZSI6IlBCUyIsImNvbnRlbnQiOiI8QCZ7eyBzZWNyZXRzLnJvbGUgfX0+IiwiYWxsb3dlZF9tZW50aW9ucyI6eyJyb2xlcyI6WyJ7eyBzZWNyZXRzLnJvbGUgfX0iXX0sImVtYmVkcyI6W3sidGl0bGUiOiJ7eyBlc2NhcGUgdGl0bGUgfX0iLCJkZXNjcmlwdGlvbiI6Int7IGVzY2FwZSBtZXNzYWdlIH19In1dfQ==
	comment PBS notifications -> Discord channel webhook
	header name=Content-Type,value=YXBwbGljYXRpb24vanNvbg==
	method post
	url https://discord.com/api/webhooks/{{ secrets.id }}/{{ secrets.token }}
