# Proxmox VE notification config — /etc/pve/notifications.cfg
#
# This is cluster-shared (/etc/pve is pmxcfs), so one copy covers BOTH takaros
# and evanthoulaki. Codified here because "a live-only fix is not a fix": the
# nightly vzdump job runs with `notification-mode notification-system`, so this
# file decides whether a failed backup is seen or lost (#597).
#
# Apply with:
#   scp 1-proxmox/pbs/notifications.cfg root@192.168.10.10:/etc/pve/notifications.cfg
# Verify:
#   ssh root@192.168.10.10 'pvesh get /cluster/notifications/targets'
#   ssh root@192.168.10.10 'pvesh create /cluster/notifications/targets/ntfy-pve/test'
#
# The two builtin stanzas (mail-to-root / default-matcher) are written out
# verbatim; they are what PVE materialises by default. They are kept so the
# behaviour is unchanged for info-level notifications, but NOTE that local mail
# delivery is dead on both nodes - postfix has no /etc/aliases.db, so every
# mail-to-root notification sits deferred in the queue forever ("alias database
# unavailable"). That is exactly why ~3 weeks of nightly backup failures went
# unnoticed. Fixing that is `newaliases`, tracked separately - the ntfy target
# below is the channel that is actually watched.

sendmail: mail-to-root
	comment Send mails to root@pam's email address
	mailto-user root@pam

matcher: default-matcher
	comment Route all notifications to mail-to-root
	mode all
	target mail-to-root

# ntfy target. 192.168.10.112:8091 is the LAN-only kube-vip LoadBalancer on the
# in-cluster ntfy Service (2-k3s/13.odysseus/ntfy.yaml). Topic `pve-backups` is
# separate from Alertmanager's `k8s-alertmanager` so PVE noise stays filterable.
#
# Header and body values are base64 per the API schema. Decoded:
#   Title    = {{ title }}          e.g. "vzdump backup job failed"
#   Tags     = warning              ntfy renders a warning glyph
#   Priority = 4                    ntfy "high" -> pushes through
#   body     = {{ title }}\n\n{{ message }}
# Verified against a live target: PVE renders {{ title }} in header values and
# the multi-line body, and POSTs with user-agent proxmox-sync-http-client/1.0.6.
webhook: ntfy-pve
	comment PVE notifications -> self-hosted ntfy topic pve-backups (#597)
	method post
	url http://192.168.10.112:8091/pve-backups
	header name=Title,value=e3sgdGl0bGUgfX0=
	header name=Tags,value=d2FybmluZw==
	header name=Priority,value=NA==
	body e3sgdGl0bGUgfX0KCnt7IG1lc3NhZ2UgfX0=

# Only warning+error severities reach ntfy, so a successful nightly job stays
# silent and a failed one pushes. vzdump sends severity `error` when any guest
# in the job fails, which is the case this issue is about.
matcher: ntfy-failures
	comment Route warning/error notifications (incl. failed vzdump jobs) to ntfy (#597)
	mode all
	match-severity warning,error
	target ntfy-pve
