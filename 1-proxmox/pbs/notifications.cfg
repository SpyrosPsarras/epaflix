sendmail: mail-to-root
	comment Send mails to root@pam's email address
	mailto-user root@pam

matcher: default-matcher
	comment Route all notifications to mail-to-root
	disable true
	mode all
	target mail-to-root

webhook: discord-pve
	body 
	comment PVE notifications -> Discord channel webhook
	header name=Content-Type,value=YXBwbGljYXRpb24vanNvbg==
	method post
	url https://discord.com/api/webhooks/{{ secrets.id }}/{{ secrets.token }}

matcher: discord-failures
	comment Route warning/error notifications (incl. failed vzdump jobs) to Discord
	match-severity warning,error
	mode all
	target discord-pve
