# Disable SSH password authentication (#745).
#
# One 12-character password was reused as the value of 20 credentials in
# secrets.yml, including root on BOTH Proxmox hosts, TrueNAS admin, all 7 k3s
# node passwords, the Postgres superuser and the router. Rather than rotate all
# twenty, the cheaper and stronger fix is to stop the password being usable
# remotely at all. Key auth is already the only method actually in use here -
# every automated and interactive session logs 'Accepted publickey for root'.
#
# This closes the SSH vector only. The Proxmox WEB UI still authenticates
# root@pam with that password; closing that needs TOTP on root@pam or
# restricting the UI to LAN, tracked separately in #745.
#
# Recovery if keys ever break: the Proxmox web UI console (noVNC/xterm.js) and
# physical/IPMI access both bypass sshd entirely, so this cannot lock you out of
# the host - only out of ssh.
#
# Revert: rm this file && systemctl reload ssh
PasswordAuthentication no
KbdInteractiveAuthentication no
