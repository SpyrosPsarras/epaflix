# SOPS creation rules.
#
# All files matching the regex below are encrypted to the listed age
# recipient(s). The matching private key is stored:
#   - on the maintainer workstation: ~/.config/sops/age/k3s-cluster.txt
#   - mirrored to TrueNAS at
#     /mnt/apps/encrypted-backups/sops-age-backup/k3s-cluster.txt — a
#     ZFS-encrypted (aes-256-gcm) dataset. #57 created it and #149 moved
#     the key there; the old pool1/dataset01/sops-age-backup/ path is
#     GONE. The dataset comes up LOCKED after a TrueNAS reboot, so the
#     backup is unreadable until it is unlocked — see the unlock options
#     in .github/instructions/sops.instructions.md.
#   - seeded into the cluster as Secret argocd/sops-age (read by the
#     ksops install on argocd-repo-server)
#
# Only the PUBLIC recipient below is needed to ENCRYPT. Decrypting (and
# so the `sops -d` verify step in any runbook) needs one of the private
# copies above.
#
# Convention: encrypted Secret files use the suffix `.enc.yaml` so they
# are easy to distinguish in PR diffs and so the pre-commit hook can
# treat unencrypted `kind: Secret` files as a hard error.
#
# `encrypted_regex` keeps apiVersion, kind, metadata in cleartext —
# diffs in PR review stay meaningful, only the actual secret data is
# ciphertext.
# Rules are matched top-down, FIRST match wins. The credential store rule
# must stay above the generic `.enc.yaml` rule: the store is a flat
# key/value file with no `data:`/`stringData:` key, so the generic
# `encrypted_regex` would match nothing and write it back in cleartext.
creation_rules:
  # The credential store, read by humans and agents (it replaced the
  # pre-SOPS plaintext credential file). No `encrypted_regex` on purpose:
  # every value is encrypted, key NAMES stay readable so the file doubles
  # as a committed index of "which credentials exist" without decrypting.
  - path_regex: ^\.github/instructions/secrets\.enc\.yaml$
    age: age1586thf5vkcdf5lcn3zwjpu8ltkwyq8efrhj8lr0vdrrt9k5f3qgsxeg7gx

  - path_regex: \.enc\.yaml$
    encrypted_regex: ^(data|stringData)$
    age: age1586thf5vkcdf5lcn3zwjpu8ltkwyq8efrhj8lr0vdrrt9k5f3qgsxeg7gx
