configs:
  permissions_actions_data:
    content: '[{"read_only": false, "mount_path": "/mnt/permission/redis_redis_data",
      "is_temporary": true, "identifier": "redis_redis_data", "recursive": true, "mode":
      "check", "uid": 568, "gid": 568, "chmod": null}]'
networks:
  ix-internal-open-webui-open-webui-net:
    enable_ipv6: false
    external: false
    labels:
      tn.network.internal: 'true'
    name: ix-internal-open-webui-open-webui-net
services:
  open-webui:
    cap_drop:
      - ALL
    depends_on:
      permissions:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4096M
    env_file:
      - /mnt/apps/open-webui/open-webui.env
    environment:
      CORS_ALLOW_ORIGIN: '*'
      ENV: dev
      GID: '568'
      GROUP_ID: '568'
      HOST: 0.0.0.0
      NVIDIA_VISIBLE_DEVICES: void
      PGID: '568'
      PORT: '31028'
      PUID: '568'
      TZ: Europe/Oslo
      UID: '568'
      UMASK: '002'
      UMASK_SET: '002'
      USER_ID: '568'
    extra_hosts:
      host.docker.internal: host-gateway
    group_add:
      - 568
    healthcheck:
      interval: 30s
      retries: 5
      start_interval: 2s
      start_period: 15s
      test:
        - CMD
        - curl
        - --request
        - GET
        - --silent
        - --output
        - /dev/null
        - --show-error
        - --fail
        - http://127.0.0.1:31028/health
      timeout: 5s
    image: ghcr.io/open-webui/open-webui:v0.12.5-ollama@sha256:4157f2f3a40048d2968610085e4f6e2415c760521014dbd8517e891b6122b818
    networks:
      ix-internal-open-webui-open-webui-net: {}
    platform: linux/amd64
    ports:
      - mode: ingress
        protocol: tcp
        published: 31028
        target: 31028
    privileged: false
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    stdin_open: false
    tty: false
    volumes:
      - bind:
          create_host_path: false
          propagation: rprivate
        read_only: false
        source: /mnt/apps/oi
        target: /app/backend/data
        type: bind
      - bind:
          create_host_path: false
          propagation: rprivate
        read_only: false
        source: /mnt/pool1/ollama
        target: /root/.ollama
        type: bind
  permissions:
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    cap_drop:
      - ALL
    configs:
      - mode: 320
        source: permissions_actions_data
        target: /script/actions.json
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M
    entrypoint:
      - python3
      - /script/permissions.py
    environment:
      GID: '568'
      GROUP_ID: '568'
      NVIDIA_VISIBLE_DEVICES: void
      PGID: '568'
      PUID: '568'
      TZ: Europe/Oslo
      UID: '568'
      UMASK: '002'
      UMASK_SET: '002'
      USER_ID: '568'
    group_add:
      - 568
    healthcheck:
      disable: true
    image: ghcr.io/truenas/containers/container-utils:1.1.2@sha256:6ddfdc314af9d18cfacb836ad266ef0ed91fecaa3686b20be72e464972860c08
    network_mode: none
    platform: linux/amd64
    privileged: false
    restart: on-failure:1
    security_opt:
      - no-new-privileges=true
    stdin_open: false
    tty: false
    user: 0:0
    volumes:
      - read_only: false
        source: redis_data
        target: /mnt/permission/redis_redis_data
        type: volume
        volume:
          nocopy: false
  redis:
    cap_drop:
      - ALL
    command:
      - --port
      - '6379'
    depends_on:
      permissions:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4096M
    env_file:
      - /mnt/apps/open-webui/redis.env
    environment:
      GID: '568'
      GROUP_ID: '568'
      NVIDIA_VISIBLE_DEVICES: void
      PGID: '568'
      PUID: '568'
      TZ: Europe/Oslo
      UID: '568'
      UMASK: '002'
      UMASK_SET: '002'
      USER_ID: '568'
    group_add:
      - 568
    healthcheck:
      interval: 30s
      retries: 5
      start_interval: 2s
      start_period: 15s
      test:
        - CMD
        - redis-cli
        - -h
        - 127.0.0.1
        - -p
        - '6379'
        - ping
      timeout: 5s
    image: ghcr.io/valkey-io/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    networks:
      ix-internal-open-webui-open-webui-net: {}
    platform: linux/amd64
    privileged: false
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    stdin_open: false
    stop_grace_period: 60s
    tty: false
    user: 568:568
    volumes:
      - read_only: false
        source: redis_data
        target: /data
        type: volume
        volume:
          nocopy: false
volumes:
  redis_data: {}
x-action-required: false
