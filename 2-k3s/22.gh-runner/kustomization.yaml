apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storage.yaml
  - deployment.yaml

generators:
  - ksops-generator.yaml

images:
  - name: ghcr.io/actions/actions-runner
    newTag: 2.338.1@sha256:e275409999c37162649aa050ca573f03eab2eabcb3a1e7fcc47548de6b4f9690

configMapGenerator:
  - name: gh-runner-migrate
    namespace: gh-runner
    files:
      - migrate-local-path.sh=files/migrate-local-path.sh
