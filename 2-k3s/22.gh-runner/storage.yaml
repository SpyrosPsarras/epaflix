---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gh-runner-data
  namespace: gh-runner
  labels:
    app.kubernetes.io/name: gh-runner
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
