---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gh-runner
  namespace: gh-runner
  labels:
    app.kubernetes.io/name: gh-runner
    app.kubernetes.io/component: runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gh-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gh-runner
        app.kubernetes.io/component: runner
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: register
          image: ghcr.io/actions/actions-runner:2.329.0
          env:
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gh-runner-secrets
                  key: access_token
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              cp -an /home/runner/. /data/ 2>/dev/null || true
              cd /data
              if [ ! -f .runner ]; then
                ./config.sh --unattended --url https://github.com/SpyrosPsarras/epaflix --token "$ACCESS_TOKEN" --labels epaflix --name epaflix-gh-runner
              else
                echo "runner already registered"
              fi
          volumeMounts:
            - name: state
              mountPath: /data
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:2.329.0
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              install -d -m 700 "$HOME/.ssh"
              install -m 600 /keys/id_ed25519 "$HOME/.ssh/id_ed25519"
              ssh-keyscan -H 192.168.10.30 192.168.10.10 192.168.10.11 >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
              cd /data
              exec ./run.sh
          volumeMounts:
            - name: state
              mountPath: /data
            - name: ssh-key
              mountPath: /keys
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: gh-runner-data
        - name: ssh-key
          secret:
            secretName: gh-runner-secrets
            items:
              - key: id_ed25519
                path: id_ed25519
