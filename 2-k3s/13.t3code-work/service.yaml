apiVersion: v1
kind: Service
metadata:
  name: t3code
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: t3code
  ports:
    - name: http
      port: 3773
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: t3code-ssh
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.10.114
  selector:
    app.kubernetes.io/name: t3code
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
