apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: work
  labels:
    app.kubernetes.io/name: t3code
spec:
  serviceName: t3code
  replicas: 1
  updateStrategy:
    type: OnDelete
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: t3code
  template:
    metadata:
      annotations:
        t3code.epaflix.com/inputs-grants-revision: "r3"
      labels:
        app.kubernetes.io/name: t3code
    spec:
      serviceAccountName: t3code
      automountServiceAccountToken: false
      enableServiceLinks: false
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      initContainers:
        - name: runtime-state
          image: t3-runtime-from-t3-container
          command: [bash, -c, "mkdir -p /home/t3/.t3/userdata && touch /runtime-state/server-runtime.json"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: home
              mountPath: /home/t3
            - name: runtime-state
              mountPath: /runtime-state
        - name: vault-storage
          image: t3-runtime-from-t3-container
          command: [bash, -ec, "chown 0:0 /vault /run/t3-vault; chmod 00700 /vault; mkdir -p /vault/client; chown 0:0 /vault/client; chmod 00700 /vault/client; chmod 00755 /run/t3-vault; chown 1001:1001 /vault/client /run/t3-vault; chown 1001:1001 /vault"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          volumeMounts:
            - name: vault-data
              mountPath: /vault
            - name: vault-scope
              mountPath: /run/t3-vault
      containers:
        - name: t3
          image: ghcr.io/spyrospsarras/t3-runtime:work-inputs-fc5527ed4472afaad95f437fd86f410b
          imagePullPolicy: IfNotPresent
          command: [bash, /scripts/entrypoint.sh]
          env:
            - name: HOME
              value: /home/t3
            - name: PATH
              value: /tools/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/t3/.local/bin
            - name: T3CODE_HOME
              value: /home/t3/.t3
            - name: MCP_HUB_INSTANCE
              value: work
            - name: T3_STATE_DB
              value: /home/t3/.t3/userdata/statev2.sqlite
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: t3-runtime-grants
                  key: model-token
            - name: MCP_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: t3-runtime-grants
                  key: hub-token
            - name: T3_VAULT_CLIENT
              value: "1"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: t3-runtime-grants
                  key: github-token
                  optional: true
          ports:
            - name: http
              containerPort: 3773
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: home
              mountPath: /home/t3
            - name: runtime-state
              mountPath: /home/t3/.t3/userdata/server-runtime.json
              subPath: server-runtime.json
            - name: inputs
              mountPath: /run/t3-inputs
              readOnly: true
            - name: work-ssh
              mountPath: /run/t3-work-ssh
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: vault-scope
              mountPath: /run/t3-vault
              readOnly: true
            - name: machine-info
              mountPath: /etc/machine-info
              subPath: machine-info
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 1080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 12Gi
        - name: sshd
          image: t3-runtime-from-t3-container
          imagePullPolicy: IfNotPresent
          command: [bash, /scripts/sshd.sh]
          env:
            - name: HOME
              value: /home/t3
            - name: T3_STATE_DB
              value: /home/t3/.t3/userdata/statev2.sqlite
          ports:
            - name: ssh
              containerPort: 2222
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: home
              mountPath: /home/t3
            - name: runtime-state
              mountPath: /home/t3/.t3/userdata/server-runtime.json
              subPath: server-runtime.json
              readOnly: true
            - name: vault-scope
              mountPath: /run/t3-vault
              readOnly: true
            - name: login
              mountPath: /run/t3-login
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command: [bash, /scripts/sshd.sh, check]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 8Gi
        - name: vault
          image: t3-runtime-from-t3-container
          imagePullPolicy: IfNotPresent
          command: [vault, serve]
          workingDir: /vault
          env:
            - name: HOME
              value: /vault
            - name: T3_VAULT_SSH_AGENT
              value: "1"
            - name: BW_EMAIL
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-agent
                  key: BW_EMAIL
            - name: BW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-agent
                  key: BW_PASSWORD
            - name: BW_SERVER
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-agent
                  key: BW_SERVER
            - name: BW_ORGANIZATION_ID
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-agent
                  key: BW_ORGANIZATION_ID
            - name: BW_COLLECTION_ID
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-agent
                  key: BW_COLLECTION_ID
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: vault-data
              mountPath: /vault
            - name: vault-scope
              mountPath: /run/t3-vault
            - name: work-ssh
              mountPath: /run/t3-work-ssh
              readOnly: true
            - name: vault-tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command: [test, -f, /run/t3-vault/scope.json]
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: [test, -f, /run/t3-vault/scope.json]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: machine-info
          configMap:
            name: t3code-machine-info
        - name: work-ssh
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: t3-work-ssh
                  optional: true
                  items:
                    - key: hosts.json
                      path: hosts.json
              - configMap:
                  name: t3code-work-ssh
                  items:
                    - key: work-ssh.py
                      path: work-ssh.py
        - name: vault-data
          persistentVolumeClaim:
            claimName: t3code-vault
        - name: vault-scope
          emptyDir: {}
        - name: vault-tmp
          emptyDir: {}
        - name: home
          persistentVolumeClaim:
            claimName: t3code-home
        - name: inputs
          secret:
            secretName: t3-runtime-inputs
            defaultMode: 0440
            items:
              - key: runtime.json
                path: runtime.json
              - key: bundle.json
                path: bundle.json
              - key: policies.json
                path: policies.json
              - key: services.json
                path: services.json
              - key: kubeconfig
                path: kubeconfig
              - key: authorized_keys
                path: authorized_keys
              - key: work-auth.json
                path: work-auth.json
        - name: login
          secret:
            secretName: t3-runtime-inputs
            defaultMode: 0440
            items:
              - key: authorized_keys
                path: authorized_keys
        - name: scripts
          projected:
            defaultMode: 0555
            sources:
              - configMap:
                  name: t3code-scripts
              - configMap:
                  name: t3code-work-ssh
        - name: tmp
          emptyDir: {}
        - name: runtime-state
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: t3code
automountServiceAccountToken: false
