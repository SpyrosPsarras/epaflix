---
# FileBrowser - HTTPS IngressRoute with Let's Encrypt TLS via Cloudflare
#
# Gated by Authentik forward-auth (issue #552) — 3-part shape, same as
# odysseus-proxy.yaml: app route priority 10 with security-headers FIRST then
# authentik-forwardauth (order per PR #694 — headers must still apply to the
# auth-deny 302), outpost route priority 15 for /outpost.goauthentik.io/.
#
# No /api bypass. FileBrowser's `/api/auth/oidc/callback` is a browser redirect
# back from Authentik, so it arrives with the outpost session cookie and passes
# the gate; nothing machine-to-machine calls this host.
#
# SSO objects live in 07.authentik-deployment/authentik-iac-blueprint.enc.yaml:
# proxy provider + application `filebrowser-forwardauth`, bound to group
# `Grafana Admins` — that is the group its EXISTING OIDC application (slug
# `filebrowser`, provider "Provider for fliebrowser") is already bound to, so
# the edge gate admits exactly the same people. The group name is wrong for this
# app; renaming it is tracked separately, not changed here, because changing the
# group and adding the gate in one step would make a lockout hard to attribute.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: filebrowser-https
  namespace: filebrowser
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`filebrowser.epaflix.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: security-headers
          namespace: traefik-system
        - name: authentik-forwardauth
          namespace: traefik-system
      services:
        - name: filebrowser
          port: 80
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
---
# Outpost route - handles the auth callback on filebrowser.epaflix.com.
# priority 15 > the app route's 10, else the callback loops.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: filebrowser-outpost-https
  namespace: filebrowser
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`filebrowser.epaflix.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 15
      services:
        - name: authentik-server
          namespace: app-authentik
          port: 80
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
---
# HTTP to HTTPS redirect for FileBrowser
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: filebrowser-http
  namespace: filebrowser
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`filebrowser.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: filebrowser
          port: 80
