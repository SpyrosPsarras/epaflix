# ksops generator — decrypts filebrowser-oidc.enc.yaml at render time.
# Decryption performed inside argocd-repo-server via the ksops binary
# installed by the install-ksops initContainer (see 2-k3s/11.argocd/
# helm-values.yaml). For local kustomize builds, run with:
#   KSOPS_BIN=$(which ksops) kustomize build --enable-alpha-plugins --enable-exec .
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: filebrowser-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - filebrowser-oidc.enc.yaml
