---
# FileBrowser Quantum Deployment.
#
# The `render-config` initContainer reads the OIDC client_id/secret from the
# imperatively-created `filebrowser-oidc` Secret and substitutes them into the
# ConfigMap template, writing the rendered config.yaml to an emptyDir that the
# main container reads via FILEBROWSER_CONFIG. This keeps real credentials out
# of the ArgoCD-managed ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: filebrowser
  labels:
    app: filebrowser
spec:
  replicas: 1
  strategy:
    type: Recreate  # Ensures only 1 instance runs at a time
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
      initContainers:
        - name: render-config
          image: bash:5.2-alpine3.19
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              CID="$(< /secret/client-id)"
              CSEC="$(< /secret/client-secret)"
              tpl="$(< /template/config.yaml)"
              tpl="${tpl//'${FILEBROWSER_OIDC_CLIENT_ID}'/$CID}"
              tpl="${tpl//'${FILEBROWSER_OIDC_CLIENT_SECRET}'/$CSEC}"
              printf '%s' "$tpl" > /rendered/config.yaml
              echo "render-config: wrote $(wc -c < /rendered/config.yaml) bytes"
          volumeMounts:
            - name: app-config-template
              mountPath: /template
              readOnly: true
            - name: filebrowser-oidc
              mountPath: /secret
              readOnly: true
            - name: app-config
              mountPath: /rendered
      containers:
        - name: filebrowser
          image: gtstef/filebrowser:latest
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: TZ
              value: "Europe/Oslo"
            - name: FILEBROWSER_CONFIG
              value: "/app-config/config.yaml"
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: config
              mountPath: /config  # SQLite DB and cache
            - name: app-config
              mountPath: /app-config  # rendered config.yaml (from initContainer)
            - name: animes
              mountPath: /srv/animes  # NFS: Anime library
            - name: movies
              mountPath: /srv/movies  # NFS: Movies library
            - name: tvshows
              mountPath: /srv/tvshows  # NFS: TV shows library
            - name: downloads
              mountPath: /srv/downloads  # NFS: Downloads directory
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            # No limits - allow pod to use as much memory/CPU as needed
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: filebrowser-config
        - name: app-config-template
          configMap:
            name: filebrowser-config
        - name: app-config
          emptyDir: {}
        - name: filebrowser-oidc
          secret:
            secretName: filebrowser-oidc
        - name: animes
          persistentVolumeClaim:
            claimName: filebrowser-animes
        - name: movies
          persistentVolumeClaim:
            claimName: filebrowser-movies
        - name: tvshows
          persistentVolumeClaim:
            claimName: filebrowser-tvshows
        - name: downloads
          persistentVolumeClaim:
            claimName: filebrowser-downloads
