---
# FileBrowser Media Storage - Using hostPath to the unified node NFS mount
#
# Was 4 separate PV/PVC pointing at the legacy per-category exports
# (/mnt/k3s-{animes,movies,tvshows,downloads}). Those exports were torn down
# in issue #247 (PR #514) — the #247 audit only checked the servarr namespace
# and missed that filebrowser had its own PVs on the same paths, which broke
# filebrowser (issue #553: Init:0/1, "hostPath type check failed"). The paths
# collapsed onto the single unified NFS export (TrueNAS share id 32,
# /mnt/pool1/dataset01) mounted on every worker at /mnt/k3s-media — the same
# pattern servarr already uses for servarr-media-pv (see
# 2-k3s/08.servarr/_shared/storage/media-pvcs.yaml).
#
# The Deployment mounts this one claim four times with subPath
# animes/movies/tvshows/downloads so the in-container /srv/* layout the UI
# shows is unchanged.

# Unified media PV
apiVersion: v1
kind: PersistentVolume
metadata:
  name: filebrowser-media-pv
spec:
  capacity:
    storage: 9Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: filebrowser-media
  hostPath:
    path: /mnt/k3s-media
    type: Directory
---
# Unified media PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filebrowser-media
  namespace: filebrowser
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: filebrowser-media
  resources:
    requests:
      storage: 9Ti
---
# Storage class for FileBrowser media.
# reclaimPolicy is intentionally left default (Delete) — irrelevant here since
# `no-provisioner` means PVs are static and obey their own
# persistentVolumeReclaimPolicy: Retain set above.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: filebrowser-media
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
