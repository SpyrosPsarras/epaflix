apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: t3code-work
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/13.t3code-work
  destination:
    server: https://kubernetes.default.svc
    namespace: t3code-work
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
        - /status
