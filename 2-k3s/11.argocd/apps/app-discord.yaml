---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: discord
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/35.discord
  destination:
    server: https://kubernetes.default.svc
    namespace: discord-media
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
