---
# ArgoCD Application: FileBrowser Quantum (web file manager + OIDC).
#
# Source:       this repo, path 2-k3s/09.filebrowser, plain manifests
#               (no Helm or Kustomize). directory.recurse picks up storage/
#               sub-dir with PVs/PVCs/StorageClass.
# Destination:  in-cluster `filebrowser` namespace.
# Sync:         automated self-heal after clean adoption on 2026-05-24
#               (initContainer + curl OIDC handshake + pod-restart probe all
#               PASSed). Mirrors the Traefik adoption sequence
#               8387f07 → db5d173 → 7d85fd1. Prune stays off.
# Secrets:      `filebrowser-oidc` is reconciled from
#               filebrowser-oidc.enc.yaml via the kustomization's ksops
#               generator (Issue #29 — sops + age). The render-config
#               initContainer reads the resulting Secret at pod start and
#               substitutes ${FILEBROWSER_OIDC_CLIENT_ID/_SECRET} into the
#               ConfigMap-templated config.yaml.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: filebrowser
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/09.filebrowser
    # kustomize-managed; the kustomization.yaml inflates the ksops
    # generator which decrypts filebrowser-oidc.enc.yaml at render
    # time. See Issue #29.
  destination:
    server: https://kubernetes.default.svc
    namespace: filebrowser
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
        - /status
