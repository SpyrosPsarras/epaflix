---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gh-runner
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/22.gh-runner
  destination:
    server: https://kubernetes.default.svc
    namespace: gh-runner
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /status
        - /spec/volumeName
