---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: t3code
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/13.t3code/one
  destination:
    server: https://kubernetes.default.svc
    namespace: t3code
  # Automated since the LXC sunset (2026-09-23). Prune removes superseded
  # hashed ConfigMaps; the home PVCs opt out of prune and delete (storage.yaml).
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
      - PruneLast=true
      - CreateNamespace=false
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
        - /status
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas
