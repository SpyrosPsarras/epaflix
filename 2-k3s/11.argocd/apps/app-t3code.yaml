---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: t3code
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/13.t3code/one
  destination:
    server: https://kubernetes.default.svc
    namespace: t3code
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: -1
      refresh: true
      backoff:
        duration: 1m
        factor: 2
        maxDuration: 30m
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
      - CreateNamespace=false
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
        - /status
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas
