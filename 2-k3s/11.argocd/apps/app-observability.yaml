---
# ArgoCD Application: observability stack (kube-prometheus-stack + Loki + Promtail).
#
# Source:       this repo, path 2-k3s/10.observability
#               (kustomization.yaml with three `helmCharts:` entries inflating
#               kube-prometheus-stack, loki, and promtail from their upstream
#               chart repos using the *-values.yaml in the same directory).
# Destination:  in-cluster `observability` namespace.
# Sync:         automated self-heal after clean manual adoption on 2026-05-24,
#               prune enabled 2026-05-31 after soak (#53). Mirrors the Traefik /
#               Authentik convention. Image-updater not enabled —
#               chart bumps are coordinated CRD migrations handled manually via
#               PRs editing helmCharts[*].version.
# Secrets:      grafana-db-secret, grafana-oauth-secret, grafana-admin-secret,
#               alertmanager-config-secret, and pve-exporter-secrets are
#               reconciled from git via the ksops generator (secrets/*.enc.yaml,
#               SOPS+age — issue #29 / PR #58) so prune treats them as desired
#               state, never deleting them.
# Image-updater: not enabled. kube-prometheus-stack chart bumps require
#               coordinated CRD migrations and are handled manually via PRs
#               editing `helmCharts[*].version` in kustomization.yaml.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/10.observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
        - /status
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/replicas
    - group: monitoring.coreos.com
      kind: Prometheus
      jsonPointers:
        - /spec/replicas
    - group: monitoring.coreos.com
      kind: Alertmanager
      jsonPointers:
        - /spec/replicas
