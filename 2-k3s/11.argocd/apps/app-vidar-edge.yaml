---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vidar-edge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/21.vidar-edge
  destination:
    server: https://kubernetes.default.svc
    namespace: vidar-edge
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
        - /status
