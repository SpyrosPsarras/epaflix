# Kustomization for the ArgoCD app-of-apps.
# Owned by the self-referential `app-of-apps` Application
# (app-of-apps.yaml below).
#
# Lists every child Application that should be reconciled from git.
# Order does not matter — these are CRs being submitted to the
# argocd namespace; no inter-resource dependencies.
#
# Closes Issue #48 (the "Projects, Applications" half of #19 / PR #45).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - app-of-apps.yaml
  - app-argocd.yaml
  - app-argocd-image-updater.yaml
  - app-authentik.yaml
  - app-cert-manager.yaml
  - app-coredns.yaml
  - app-filebrowser.yaml
  - app-kube-vip.yaml
  - app-kube-vip-cloud-provider.yaml
  - app-maintenance.yaml
  - app-observability.yaml
  - app-postgres.yaml
  - app-renovate.yaml
  - app-servarr.yaml
  - app-system-upgrade-controller.yaml
  - app-traefik.yaml
