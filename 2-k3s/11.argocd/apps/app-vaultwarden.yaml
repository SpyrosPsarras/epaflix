---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/26.vaultwarden
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultwarden
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: vaultwarden
      jsonPointers:
        - /spec/replicas
        - /metadata/annotations/vaultwarden.epaflix.com~1backup-paused
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
        - /status
    - group: postgresql.cnpg.io
      kind: Database
      jsonPointers:
        - /status
    - group: postgresql.cnpg.io
      kind: DatabaseRole
      jsonPointers:
        - /status
