---
# ArgoCD Application: system-upgrade-controller install (controller-only).
# Closes the controller-install half of Issue #44. The Plan onboarding
# (system-upgrade-plans.yaml) remains a separate follow-up — a maintainer-
# supervised first rolling K3s upgrade must validate the controller end-
# to-end before any Plan goes live.
#
# Source:       this repo, path 2-k3s/maintenance/system-upgrade/controller.
#               kustomization.yaml references the vendored upstream
#               crd.yaml + system-upgrade-controller.yaml at v0.19.2.
# Destination:  `system-upgrade` namespace (created by the upstream manifest).
# Sync:         MANUAL on first install (syncPolicy: {}). The controller is
#               benign without Plans, so a clean sync should produce zero
#               cluster activity beyond Deployment readiness. After a 48 h
#               soak, flip to:
#                 syncPolicy:
#                   automated: { selfHeal: true, prune: false }
#                   syncOptions: [ServerSideApply=true]

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-upgrade-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/maintenance/system-upgrade/controller
  destination:
    server: https://kubernetes.default.svc
    namespace: system-upgrade
  syncPolicy: {}
