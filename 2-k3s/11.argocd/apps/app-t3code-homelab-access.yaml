apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: t3code-homelab-access
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/13.t3code-homelab/rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: t3code-homelab
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
