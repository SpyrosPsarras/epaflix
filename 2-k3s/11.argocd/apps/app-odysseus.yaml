---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odysseus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/13.odysseus
  destination:
    server: https://kubernetes.default.svc
    namespace: odysseus
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
        - /status
    - group: ""
      kind: PersistentVolume
      jsonPointers:
        - /spec/claimRef
        - /status
    - group: apps
      kind: StatefulSet
      name: chromadb
      managedFieldsManagers:
        - k3s
      jsonPointers:
        - /spec/volumeClaimTemplates
    - group: ""
      kind: PersistentVolumeClaim
      name: chromadb-data
      managedFieldsManagers:
        - k3s
    - group: ""
      kind: ConfigMap
      name: v1-config
      jsonPointers:
        - /metadata/annotations
