---
# ArgoCD Application: servarr stack.
#
# Source:       this repo, path 2-k3s/08.servarr (kustomization.yaml).
# Destination:  in-cluster `servarr` namespace.
# Sync:         manual on first install (syncPolicy: {}) — live cluster has
#               imperative drift that would be overwritten. After reconciling
#               (see .history/2026-05-17-argocd-adoption-drift.diff) and
#               doing one explicit `argocd app sync servarr`, enable
#               `syncPolicy.automated: { selfHeal: true, prune: false }`.
#               Flip `prune: true` only after a week of clean operation.
#
# Image Updater annotations (argocd-image-updater.argoproj.io/*):
#   - Tracks images with `update-strategy: digest` so we re-roll whenever
#     upstream rebuilds the moving tag (`:latest` or `:development`).
#   - Write-back is `kustomization:.` — Image Updater runs
#     `kustomize edit set image <name>=<repo>:<tag>@<digest>` against
#     2-k3s/08.servarr/kustomization.yaml's `images:` block and commits
#     to `main`.
#   - Excluded by design (NOT in image-list):
#       qbittorrent (binhex/arch-qbittorrentvpn — VPN-coupled, manual bumps)
#       jellyseerr / seerr (custom :preview-OIDC fork tag)
#       lingarr     (pinned to a custom branch image)

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: servarr
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: |
      sonarr=lscr.io/linuxserver/sonarr,
      radarr=lscr.io/linuxserver/radarr,
      prowlarr=lscr.io/linuxserver/prowlarr,
      bazarr=lscr.io/linuxserver/bazarr,
      huntarr=huntarr/huntarr,
      cleanuparr=ghcr.io/cleanuparr/cleanuparr,
      flaresolverr=ghcr.io/flaresolverr/flaresolverr,
      jellyfin=jellyfin/jellyfin,
      homarr=ghcr.io/ajnart/homarr,
      wizarr=ghcr.io/wizarrrr/wizarr,
      bazarr-autotranslate=ghcr.io/zelak312/bazarr_autotranslate
    # Every tracked image uses digest strategy by default; per-image tag
    # restrictions go below.
    argocd-image-updater.argoproj.io/sonarr.update-strategy: digest
    argocd-image-updater.argoproj.io/sonarr.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/radarr.update-strategy: digest
    argocd-image-updater.argoproj.io/radarr.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/prowlarr.update-strategy: digest
    argocd-image-updater.argoproj.io/prowlarr.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/bazarr.update-strategy: digest
    # Bazarr deliberately runs the `:development` floating tag.
    argocd-image-updater.argoproj.io/bazarr.allow-tags: regexp:^development$
    argocd-image-updater.argoproj.io/huntarr.update-strategy: digest
    argocd-image-updater.argoproj.io/huntarr.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/cleanuparr.update-strategy: digest
    argocd-image-updater.argoproj.io/cleanuparr.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/flaresolverr.update-strategy: digest
    argocd-image-updater.argoproj.io/flaresolverr.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/jellyfin.update-strategy: digest
    argocd-image-updater.argoproj.io/jellyfin.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/homarr.update-strategy: digest
    argocd-image-updater.argoproj.io/homarr.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/wizarr.update-strategy: digest
    argocd-image-updater.argoproj.io/wizarr.allow-tags: regexp:^latest$
    argocd-image-updater.argoproj.io/bazarr-autotranslate.update-strategy: digest
    argocd-image-updater.argoproj.io/bazarr-autotranslate.allow-tags: regexp:^latest$
    # NOTE: lscr.io/linuxserver/sonarr is used by both `sonarr` and `sonarr2`
    # Deployments. `kustomize edit set image` matches by image name, so both
    # roll together to the same digest. This is correct — they ARE the same
    # image; sonarr2 is a second instance for anime.
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/write-back-target: kustomization:.
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/git-credentials: argocd:git-creds
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/08.servarr
  destination:
    server: https://kubernetes.default.svc
    namespace: servarr
  # Manual sync on first install — flip to `automated` after drift is
  # reconciled. Self-heal would otherwise overwrite live imperative edits.
  syncPolicy: {}
  # ignoreDifferences keeps Argo quiet about fields that controllers mutate.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas    # in case HPA-like manual scaling exists
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
