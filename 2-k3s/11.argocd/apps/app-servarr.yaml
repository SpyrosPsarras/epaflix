---
# ArgoCD Application: servarr stack.
#
# Source:       this repo, path 2-k3s/08.servarr (kustomization.yaml).
# Destination:  in-cluster `servarr` namespace.
# Sync:         manual on first install (syncPolicy: {}) — live cluster has
#               imperative drift that would be overwritten. After reconciling
#               (see .history/2026-05-17-argocd-adoption-drift.diff) and
#               doing one explicit `argocd app sync servarr`, enable
#               `syncPolicy.automated: { selfHeal: true, prune: false }`.
#               Flip `prune: true` only after a week of clean operation.
#
# Image bumps:   Digest/patch updates for the servarr stack are now delivered
#                by auto-merged Renovate PRs (see .github/renovate.json) that
#                bump the digest-pinned `images:` block in
#                2-k3s/08.servarr/kustomization.yaml. The old ArgoCD Image
#                Updater git write-back was retired (#192) — it pushed to main
#                directly, which the required `validate` check rejects.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: servarr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/08.servarr
  destination:
    server: https://kubernetes.default.svc
    namespace: servarr
  # Auto-sync ON 2026-05-17 after the live cluster was reconciled to match
  # repo (live = source of truth pull-up done earlier in the day). selfHeal
  # reverts any manual `kubectl edit` on managed resources. ServerSideApply
  # avoids noisy `tracking-id` annotation diffs. prune is OFF for now —
  # flip to `prune: true` after a week of clean operation so that
  # accidentally removing a manifest file doesn't yet delete the resource.
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
  # ignoreDifferences keeps Argo quiet about fields that controllers mutate.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas    # in case HPA-like manual scaling exists
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
