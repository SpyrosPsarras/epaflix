---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-hub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/23.mcp-hub
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp-hub
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
        - /status
