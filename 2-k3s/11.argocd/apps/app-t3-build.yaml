apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: t3-build
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/29.t3-build
  destination:
    server: https://kubernetes.default.svc
    namespace: t3-build
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - ServerSideApply=true
