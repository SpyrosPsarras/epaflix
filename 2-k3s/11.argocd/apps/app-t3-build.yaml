apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: t3-build
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/29.t3-build
  # Renders both builder namespaces (t3-build-homelab, t3-build-work); each object sets its own.
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - ServerSideApply=true
