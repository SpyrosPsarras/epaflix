---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SpyrosPsarras/epaflix.git
    targetRevision: main
    path: 2-k3s/16.reloader
  destination:
    server: https://kubernetes.default.svc
    namespace: servarr
  syncPolicy:
    automated: { selfHeal: true, prune: false }
    syncOptions: [ServerSideApply=true]
