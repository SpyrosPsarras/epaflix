apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "10.4.2"
    releaseName: argocd
    namespace: argocd
    valuesFile: helm-values.yaml
    includeCRDs: false

resources:
  - namespace.yaml
  - ingress.yaml
