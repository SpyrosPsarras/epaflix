---
# Internal entry point only (LAN + Tailscale, 192.168.10.102). ArgoCD can
# change the whole cluster, so it stays off the public tunnel even with OIDC
# (homelab exposure audit, 2026-10-02). Pi-hole points the name at .102.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-internal
  namespace: argocd
spec:
  entryPoints:
    - internal
  routes:
    - match: Host(`argocd.epaflix.com`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: traefik-system
      services:
        - name: argocd-server
          port: 80
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
