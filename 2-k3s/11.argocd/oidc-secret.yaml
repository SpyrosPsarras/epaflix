---
# Authentik OIDC credentials for ArgoCD.
#
# CRITICAL: This file is a TEMPLATE. Do NOT commit real values.
# Real credentials live in `.github/instructions/secrets.yml`
# (git-ignored) under keys ARGOCD_OIDC_CLIENT_ID / ARGOCD_OIDC_CLIENT_SECRET.
#
# To populate the real secret in-cluster (run from this directory):
#
#   CID=$(yq '.argocd.oidc.client_id'     ../../.github/instructions/secrets.yml)
#   CSEC=$(yq '.argocd.oidc.client_secret' ../../.github/instructions/secrets.yml)
#   kubectl -n argocd create secret generic argocd-secret \
#     --from-literal=oidc.authentik.clientId="$CID" \
#     --from-literal=oidc.authentik.clientSecret="$CSEC" \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n argocd rollout restart deploy/argocd-server
#
# NOTE: The argo-cd Helm chart creates its own `argocd-secret` with random
# server.secretkey. Applying THIS manifest as-is would clobber that. Instead
# use the `kubectl ... --dry-run=client -o yaml | kubectl apply` pattern above
# to MERGE just the oidc.* keys, or set the values via Helm `configs.secret`
# in helm-values.yaml (see helm-values comment).
#
# The file below is kept as documentation only — it is NOT in install.sh
# (commented out) and NOT in the servarr kustomization.

apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-secret
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  # Replace with real values from secrets.yml. DO NOT commit real values.
  oidc.authentik.clientId: "<ARGOCD_OIDC_CLIENT_ID>"
  oidc.authentik.clientSecret: "<ARGOCD_OIDC_CLIENT_SECRET>"
