---
# Git credentials used by argocd-image-updater to push commits.
#
# CRITICAL: This file is a TEMPLATE. Do NOT commit real values.
# Real PAT lives in `.github/instructions/secrets.yml` under
# `argocd.image_updater.github_pat`.
#
# The PAT needs `contents: write` on this repository only — nothing more.
# Use a fine-grained PAT, expire it in 6 months, set a calendar reminder.
#
# Create the live secret with:
#
#   PAT=$(yq '.argocd.image_updater.github_pat' \
#     ../../.github/instructions/secrets.yml)
#   kubectl -n argocd create secret generic git-creds \
#     --from-literal=username=git \
#     --from-literal=password="$PAT" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The `username: git` value is conventional for GitHub HTTPS auth with a PAT.
#
# The Application references this Secret via annotation:
#   argocd-image-updater.argoproj.io/git-credentials: argocd:git-creds

apiVersion: v1
kind: Secret
metadata:
  name: git-creds
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd-image-updater
type: Opaque
stringData:
  # Conventional username for HTTPS+PAT authentication against GitHub.
  username: git
  # Replace with the real PAT from secrets.yml. DO NOT commit.
  password: "<ARGOCD_GIT_PAT>"
