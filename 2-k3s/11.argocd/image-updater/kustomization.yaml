# ArgoCD-managed kustomization for argocd-image-updater.
# Owned by ArgoCD Application "argocd-image-updater"
# (2-k3s/11.argocd/apps/app-argocd-image-updater.yaml).
#
# Inflates the upstream argocd-image-updater Helm chart at the same pinned
# version that the original `helm install` (image-updater/install.sh) used.
# Same kustomize-with-helm pattern as the argocd self-management
# kustomization in 2-k3s/11.argocd/kustomization.yaml.
#
# NOTE on chart version pin: 0.14.0 (app v0.17.0). Chart 1.x switched to
# the CRD-driven ImageUpdater operator model and has a registry-prefix
# normalization bug at v1.1.x/1.2.x that breaks lscr.io/* matching. See
# image-updater/install.sh header for the full reasoning. Do NOT bump
# without verifying.
#
# Secrets reconciled via ksops generator (Issue #29):
#   - git-creds                   image-updater's git push credentials
#   - github-epaflix-repo         ArgoCD repository registration (labelled
#                                 argocd.argoproj.io/secret-type=repository)
#   - argocd-image-updater-secret holds `argocd.token` (the local
#                                 image-updater account API token, scoped
#                                 by the RBAC policy in
#                                 2-k3s/11.argocd/helm-values.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

helmCharts:
  - name: argocd-image-updater
    repo: https://argoproj.github.io/argo-helm
    version: "1.2.2"
    releaseName: argocd-image-updater
    namespace: argocd
    valuesFile: values.yaml
    includeCRDs: false

generators:
  - secrets/ksops-generator.yaml
