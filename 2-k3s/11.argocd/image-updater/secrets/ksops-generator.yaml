# ksops generator — decrypts image-updater Secret files at render time.
# Paths are relative to the parent kustomization
# (2-k3s/11.argocd/image-updater/kustomization.yaml).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: image-updater-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - secrets/git-creds.enc.yaml
  - secrets/github-epaflix-repo.enc.yaml
  - secrets/argocd-image-updater-secret.enc.yaml
