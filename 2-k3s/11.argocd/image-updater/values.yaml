---
# argocd-image-updater Helm values
#
# Chart: argo/argocd-image-updater 1.2.1 (app v1.2.0)

config:
  argocd:
    # Talk to ArgoCD via in-cluster Service.
    # argocd-server runs with `--insecure` (TLS terminated at Traefik),
    # so we use plaintext gRPC over the Service's port 80.
    grpcWeb: true
    serverAddress: argocd-server.argocd.svc.cluster.local
    insecure: true
    plaintext: true
  # Re-check images this often (default 2m). Bump if registry rate-limits bite.
  applicationsAPIKind: argocd
  logLevel: info
  gitCommitUser: argocd-image-updater
  gitCommitMail: argocd-image-updater@epaflix.com
  gitCommitTemplate: |
    [image-updater] bump {{ .AppName }}: {{ range .AppChanges }}{{ .Image }} {{ .OldTag }} → {{ .NewTag }} {{ end }}

# Image Updater scans Applications cluster-wide; no explicit allowlist needed.
serviceAccount:
  create: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

metrics:
  enabled: false
