apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level namespace: the DatabaseRole, Database and role Secret must land in postgres-system.
resources:
  - namespace.yaml
  - database.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - servicemonitor.yaml

generators:
  - ksops-generator.yaml

images:
