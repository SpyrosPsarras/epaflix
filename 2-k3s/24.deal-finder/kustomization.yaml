apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level namespace: the DatabaseRole, Database and role Secret must land in postgres-system.
resources:
  - namespace.yaml
  - database.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - servicemonitor.yaml

generators:
  - ksops-generator.yaml

images:
  # built by github.com/SpyrosPsarras/jbod-epaflix CI; bump the digest to roll out a new version
  - name: ghcr.io/spyrospsarras/deal-finder
    digest: sha256:0e5b5bf33f7ee9d8757f294c55d784b4e63da0ebcc1b70f7737ff88683aad9c1
