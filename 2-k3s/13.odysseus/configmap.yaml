---
apiVersion: v1
kind: ConfigMap
metadata:
  name: odysseus-config
  namespace: odysseus
  labels:
    app: odysseus
data:
  APP_BIND: "0.0.0.0"
  APP_PORT: "7000"
  AUTH_ENABLED: "true"
  LOCALHOST_BYPASS: "false"
  SECURE_COOKIES: "true"
  ALLOWED_ORIGINS: "https://odysseus.epaflix.com"
  SHELL_EXEC_HOST: "bastion"
  OLLAMA_BASE_URL: "http://192.168.10.200:30068/v1"
  LLM_HOST: "http://192.168.10.200:30068/v1"
  SEARXNG_INSTANCE: "http://searxng.searxng.svc.cluster.local:8080"
  CHROMADB_HOST: "chromadb"
  CHROMADB_PORT: "8000"
  NTFY_BASE_URL: "http://ntfy.observability.svc.cluster.local:8091"
  DATABASE_URL: "sqlite:////app/data/app.db"
