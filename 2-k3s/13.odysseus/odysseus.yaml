---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odysseus
  namespace: odysseus
  labels:
    app: odysseus
  annotations:
    secret.reloader.stakater.com/reload: "odysseus-secrets,cliproxy-client-key"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odysseus
  template:
    metadata:
      labels:
        app: odysseus
    spec:
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: odysseus
      initContainers:
        - name: seed-data
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /app/data
              for f in /seed/*; do
                [ -f "$f" ] || continue
                name=$(basename "$f")
                dest=/app/data/$name
                if [ -e "$dest" ]; then
                  echo "skip (exists): $dest"
                else
                  cp "$f" "$dest" && echo "seeded: $dest"
                fi
              done
              chown -R 1000:1000 /app/data
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: seed
              mountPath: /seed
              readOnly: true
        - name: seed-ssh
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /app/.ssh && chmod 700 /app/.ssh
              cp /src-key/id_bastion /app/.ssh/id_bastion && chmod 600 /app/.ssh/id_bastion
              cp /src-cfg/config /app/.ssh/config && chmod 600 /app/.ssh/config
              cp /src-cfg/known_hosts /app/.ssh/known_hosts && chmod 644 /app/.ssh/known_hosts
              chown -R 1000:1000 /app/.ssh
              echo "seeded /app/.ssh (owned 1000)"
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          volumeMounts:
            - name: bastion-ssh-key
              mountPath: /src-key
              readOnly: true
            - name: ssh-config
              mountPath: /src-cfg
              readOnly: true
            - name: ssh-home
              mountPath: /app/.ssh
        - name: install-claude
          image: ghcr.io/spyrospsarras/odysseus:73673258-bastion
          securityContext:
            runAsUser: 0
          env:
            - name: HOME
              value: /opt/claude
          command:
            - sh
            - -c
            - |
              set -e
              curl -fsSL https://claude.ai/install.sh | bash
              chmod -R a+rX /opt/claude
              /opt/claude/.local/bin/claude --version
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          volumeMounts:
            - name: claude-bin
              mountPath: /opt/claude
      containers:
        - name: odysseus
          image: ghcr.io/spyrospsarras/odysseus:73673258-bastion
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: ODYSSEUS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odysseus-secrets
                  key: ODYSSEUS_ADMIN_PASSWORD
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: odysseus-secrets
                  key: SEARXNG_SECRET
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: odysseus-secrets
                  key: OPENAI_API_KEY
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: odysseus-secrets
                  key: HF_TOKEN
            - name: ANTHROPIC_BASE_URL
              value: "http://cliproxy.remote-pi.svc.cluster.local:8317"
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cliproxy-client-key
                  key: ANTHROPIC_AUTH_TOKEN
            - name: CLAUDE_CONFIG_DIR
              value: "/app/data/.claude"
            - name: DISABLE_AUTOUPDATER
              value: "1"
          envFrom:
            - configMapRef:
                name: odysseus-config
          ports:
            - containerPort: 7000
              name: http
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: workspace
              mountPath: /workspace
            - name: ssh-home
              mountPath: /app/.ssh
            - name: claude-bin
              mountPath: /opt/claude
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: odysseus-data
        - name: seed
          secret:
            secretName: odysseus-data-seed
        - name: workspace
          persistentVolumeClaim:
            claimName: odysseus-bastion-workspace
        - name: bastion-ssh-key
          secret:
            secretName: odysseus-secrets
            items:
              - key: ODYSSEUS_BASTION_SSH_KEY
                path: id_bastion
        - name: ssh-config
          configMap:
            name: odysseus-ssh-config
        - name: ssh-home
          emptyDir: {}
        - name: claude-bin
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: odysseus
  namespace: odysseus
  labels:
    app: odysseus
spec:
  type: ClusterIP
  selector:
    app: odysseus
  ports:
    - name: http
      port: 7000
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odysseus-data
  namespace: odysseus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
