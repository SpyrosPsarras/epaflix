---
# ntfy — notification sidecar for Odysseus.
#
# The compose published host 8091 -> ntfy default 80. Here ntfy is told to
# listen on :8091 directly (NTFY_LISTEN_HTTP) so the in-cluster Service and
# NTFY_BASE_URL=http://ntfy:8091 line up.
#
# The cache is on a PVC, not an emptyDir. It holds the ONLY copy of every
# delivered message: subscribing is per client and there are no accounts (see
# the Service comment below), so a client that was offline catches up purely
# from this cache. An emptyDir meant every pod replacement silently discarded
# it, and the alerts on these topics are edge-triggered - one message per
# event - so a wipe loses the event itself, not a duplicate of it.
#
# This does NOT lengthen history: ntfy still prunes at its 12 h
# NTFY_CACHE_DURATION default. The PVC only stops restarts from wiping it.
# Sizing: cache.db was 94 KB after 12 h across three topics, so 1Gi is the
# repo's minimum PVC size rather than a real estimate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: odysseus
  labels:
    app: ntfy
spec:
  replicas: 1
  # Recreate, not RollingUpdate: one writer against a SQLite file on an RWO
  # volume. The default maxSurge would bring up a second pod sharing cache.db
  # (corruption risk), or wedge the rollout waiting on an RWO volume pinned to
  # another node. Same reason as homarr/syncthing/cliproxy in this repo.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      # Disable per-Service env-var injection across this namespace for
      # consistency/safety (searxng crashloops on it; ntfy is told its
      # listen addr explicitly via NTFY_* env).
      enableServiceLinks: false
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:latest
          args:
            - serve
          env:
            - name: NTFY_LISTEN_HTTP
              value: ":8091"
            - name: NTFY_CACHE_FILE
              value: "/var/cache/ntfy/cache.db"
            - name: NTFY_BASE_URL
              value: "http://ntfy:8091"
          ports:
            - containerPort: 8091
              name: http
          volumeMounts:
            - name: cache
              mountPath: /var/cache/ntfy
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: ntfy-cache
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: odysseus
  labels:
    app: ntfy
spec:
  # LAN-only LoadBalancer (kube-vip), pinned to 192.168.10.112 from
  # range-global. RFC1918, not internet-routable, so ntfy stays off the
  # Cloudflare-proxied *.epaflix.com wildcard (an IngressRoute would have
  # published an unauthenticated publish/subscribe endpoint to the internet).
  # Off-cluster publishers need this LB because they are not on the pod network:
  #   - Proxmox VE hosts       -> topic `pve-backups`     vzdump job failures (#597)
  #   - TrueNAS 192.168.10.200 -> topic `truenas-alerts`  GPU health, cron */15
  #     (`/root/gpu-health-check.sh` on the host - GPU lost/recovered, persistenced died)
  # In-cluster consumers are unaffected: ntfy:8091 still resolves for the
  # Alertmanager -> ntfy leg (topic k8s-alertmanager, #568) and for
  # NTFY_BASE_URL in odysseus-config.
  #
  # There is no such thing as registering a topic server-side here: login is
  # disabled, so ntfy has no accounts, no reservations and no subscription sync.
  # A topic exists as soon as something publishes to it, and SUBSCRIBING IS PER
  # CLIENT - the phone app or a browser pointed at http://192.168.10.112:8091.
  type: LoadBalancer
  loadBalancerIP: 192.168.10.112
  selector:
    app: ntfy
  ports:
    # In-cluster DNS ntfy:8091 — matches NTFY_BASE_URL in odysseus-config.
    - name: http
      port: 8091
      targetPort: http
---
# ntfy message cache - replaces the original emptyDir (see Deployment comment).
# local-path is node-local: the PV lands on whichever node the pod first
# schedules onto and the pod is pinned there afterwards. That is the same
# tradeoff every stateful app here already takes (syncthing, homarr,
# remote-pi), and it is acceptable for a cache. Modelled on odysseus-data,
# which is the same shape and needs no ArgoCD ignoreDifferences entry.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-cache
  namespace: odysseus
  labels:
    app: ntfy
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
