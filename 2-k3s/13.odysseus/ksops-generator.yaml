# ksops generator — decrypts odysseus Secret files at render time.
# Decryption performed inside argocd-repo-server via the ksops binary
# (see 2-k3s/11.argocd/helm-values.yaml).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: odysseus-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - odysseus-secrets.enc.yaml
  - odysseus-data-seed.enc.yaml
