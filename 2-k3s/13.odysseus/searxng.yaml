---
# SearXNG — web-search backend for Odysseus's web_search tool.
#
# THE SEARCH FIX (issue #184): on TrueNAS the JSON search endpoint returned
# 403 because the effective settings.yml was never the intended one (dead
# /tmp/...template glue). Here settings.yml is shipped by the
# `searxng-settings` ConfigMap and mounted at /etc/searxng/settings.yml — the
# REAL effective path — with search.formats:[html,json] and server.limiter:false
# so the JSON API works. The ConfigMap stays secret-free: server.secret_key is
# populated from the SEARXNG_SECRET env (SearXNG honours it), so no secret is
# committed into the ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: odysseus
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
        - name: searxng
          # Pinned from the compose stack.
          image: searxng/searxng:2026.5.31-7159b8aed
          env:
            # SearXNG reads SEARXNG_SECRET to populate server.secret_key,
            # keeping the committed settings.yml secret-free.
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: odysseus-secrets
                  key: SEARXNG_SECRET
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: odysseus
  labels:
    app: searxng
spec:
  type: ClusterIP
  selector:
    app: searxng
  ports:
    # In-cluster DNS searxng:8080 — matches SEARXNG_INSTANCE in odysseus-config.
    - name: http
      port: 8080
      targetPort: http
