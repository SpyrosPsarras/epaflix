apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: odysseus

helmCharts:
  - name: chromadb
    repo: https://amikos-tech.github.io/chromadb-chart/
    version: "0.2.2"  # renovate: datasource=helm depName=chromadb registryUrl=https://amikos-tech.github.io/chromadb-chart/
    releaseName: chromadb
    namespace: odysseus
    valuesFile: values/chromadb-values.yaml
    includeCRDs: true

resources:
  - namespace.yaml
  - configmap.yaml
  - odysseus.yaml
  - odysseus-ssh-config.yaml
  - odysseus-bastion-pv.yaml
  - pdb.yaml
  - backup-cronjob.yaml
generators:
  - ksops-generator.yaml

patches:
  - target:
      version: v1
      kind: ConfigMap
      name: v1-config
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-weight
