# ArgoCD-managed kustomization for the Odysseus tier (issue #184).
#
# Owned by ArgoCD Application "odysseus"
# (2-k3s/11.argocd/apps/app-odysseus.yaml) — MANUAL sync on first install.
#
# Secrets are reconciled via the ksops generator (ksops-generator.yaml):
#   - odysseus-secrets    from odysseus-secrets.enc.yaml
#                         (ODYSSEUS_ADMIN_PASSWORD, SEARXNG_SECRET,
#                          OPENAI_API_KEY, HF_TOKEN)
#   - odysseus-data-seed  from odysseus-data-seed.enc.yaml
#                         (small irreplaceable JSON state — auth.json /
#                          settings.json — consumed by the seed-data
#                          initContainer; see README for the tar-staging of
#                          app.db + the dir trees)
#
# No `images:` block — the odysseus image is pinned to the immutable numeric
# tag 73673258 in odysseus.yaml, so digest tracking is not needed initially.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: odysseus

# ChromaDB now comes from the amikos-tech Helm chart instead of the old
# hand-rolled chromadb.yaml (issue #215, closes #189). The chart renders a
# StatefulSet + Service both named "chromadb" (releaseName) on port 8000, so
# Odysseus's CHROMADB_HOST=chromadb / CHROMADB_PORT=8000 are unchanged. Mirror
# the cert-manager/traefik helmCharts: pattern. Pin the chart version (Renovate
# tracks the image tag via a hint in values/chromadb-values.yaml).
helmCharts:
  - name: chromadb
    repo: https://amikos-tech.github.io/chromadb-chart/
    version: "0.2.2"  # renovate: datasource=helm depName=chromadb registryUrl=https://amikos-tech.github.io/chromadb-chart/
    releaseName: chromadb
    namespace: odysseus
    valuesFile: values/chromadb-values.yaml
    includeCRDs: true

resources:
  - namespace.yaml
  - configmap.yaml
  - odysseus.yaml
  - odysseus-ssh-config.yaml
  - odysseus-bastion-pv.yaml
  - searxng.yaml
  - ntfy.yaml
  - pdb.yaml
generators:
  - ksops-generator.yaml
