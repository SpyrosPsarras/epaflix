---
apiVersion: v1
kind: ConfigMap
metadata:
  name: odysseus-data-backup-script
  namespace: odysseus
data:
  backup.sh: |
    set -euo pipefail

    RECIPIENT="age1586thf5vkcdf5lcn3zwjpu8ltkwyq8efrhj8lr0vdrrt9k5f3qgsxeg7gx"
    SRC=/source
    STAGE=/stage
    DATA_STAGE="${STAGE}/data"
    STAGED_TAR="${STAGE}/archive.tar.gz"
    OUT_DIR=/backups
    TS=$(date -u +%Y%m%d-%H%M%S)
    OUT="${OUT_DIR}/odysseus-data-${TS}.tar.gz.age"
    MIN_BYTES=1048576  # 1MB floor -- secondary guard, see the app.db member check below

    trap 'rm -f "${OUT}.tmp"' EXIT

    echo "=== odysseus-data backup @ $(date -u +%FT%TZ) ==="

    mkdir -p "$DATA_STAGE" "$OUT_DIR"

    echo "staging ${SRC} -> ${DATA_STAGE} (skipping bin/, fastembed_cache/)"
    find "$SRC" -mindepth 1 -maxdepth 1 ! -name bin ! -name fastembed_cache \
      -exec cp -a {} "$DATA_STAGE"/ \;

    for db in app.db scheduled_emails.db; do
      if [ -f "${SRC}/${db}" ]; then
        echo "sqlite3 .backup: ${db}"
        printf "PRAGMA busy_timeout=5000;\n.backup '${DATA_STAGE}/${db}'\n" | sqlite3 "${SRC}/${db}"
      else
        echo "skip (not present): ${db}"
      fi
    done

    echo "staging tar -> ${STAGED_TAR}"
    tar -C "$DATA_STAGE" -czf "$STAGED_TAR" .

    echo "verifying required member ./app.db is present"
    if ! tar -tzf "$STAGED_TAR" | grep -qx './app.db'; then
      echo "ERROR: ${STAGED_TAR} is missing ./app.db -- refusing to back up without the primary DB, see #282" >&2
      exit 1
    fi

    SIZE=$(wc -c < "$STAGED_TAR")
    echo "staged archive size: ${SIZE} bytes"
    if [ "$SIZE" -lt "$MIN_BYTES" ]; then
      echo "ERROR: ${STAGED_TAR} is only ${SIZE} bytes (< ${MIN_BYTES} floor) -- refusing a near-empty backup, see #282" >&2
      exit 1
    fi

    echo "encrypting -> ${OUT}"
    age -r "$RECIPIENT" -o "${OUT}.tmp" "$STAGED_TAR"
    mv "${OUT}.tmp" "$OUT"

    echo "pruning archives older than 14 days"
    find "$OUT_DIR" -maxdepth 1 -name 'odysseus-data-*.tar.gz.age' -mtime +14 -print -delete

    echo "=== done @ $(date -u +%FT%TZ): $(basename "$OUT") (${SIZE} bytes) ==="
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: odysseus-data-backup
  namespace: odysseus
  labels:
    app: odysseus-data-backup
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 2592000  # keep 30 days
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: odysseus-data-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:3.20
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  apk add --no-cache age sqlite >/dev/null
                  exec /bin/sh /script/backup.sh
              securityContext:
                runAsUser: 0
              volumeMounts:
                - name: source
                  mountPath: /source
                  readOnly: true
                - name: backups
                  mountPath: /backups
                  subPath: backups/odysseus-data
                - name: stage
                  mountPath: /stage
                - name: script
                  mountPath: /script
                  readOnly: true
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
          volumes:
            - name: source
              persistentVolumeClaim:
                claimName: odysseus-data
            - name: backups
              persistentVolumeClaim:
                claimName: odysseus-bastion-workspace
            - name: stage
              emptyDir:
                sizeLimit: 2Gi
            - name: script
              configMap:
                name: odysseus-data-backup-script
                defaultMode: 0555
