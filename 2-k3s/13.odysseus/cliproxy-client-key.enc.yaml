# CLIProxyAPI client API key for the Claude Code heartbeat Task (#184, #858).
#
# The Odysseus `run_local` cron Task runs `claude -p "just reply pong"` a few
# times a day. It used to authenticate straight to api.anthropic.com with a
# long-lived `sk-ant-oat` subscription token (Secret `claude-oauth-token`).
# It now goes through the in-cluster CLIProxyAPI instead
# (http://cliproxy.remote-pi.svc.cluster.local:8317), so this cluster keeps
# exactly ONE set of Claude subscription credentials - the provider accounts
# already authorised inside cliproxy's Postgres-backed auth store.
#
# THIS VALUE MUST EQUAL `omp-api-key` IN
# 2-k3s/17.remote-pi/cliproxy/cliproxy-secrets.enc.yaml.
# It is the same client key, duplicated only because a `secretKeyRef` cannot
# cross namespaces (cliproxy lives in `remote-pi`, odysseus in `odysseus`).
# That key is also typed into cliproxy's own `config.yaml` `api-keys:` by hand
# through the management API (see 2-k3s/17.remote-pi/README.md and #861), so a
# rotation is three edits: the management PUT, cliproxy-secrets.enc.yaml, and
# this file. Let them drift and the heartbeat gets 403 from /v1/messages.
#
# Encrypted in place with SOPS+age - see .github/instructions/sops.instructions.md.
apiVersion: v1
kind: Secret
metadata:
    name: cliproxy-client-key
    namespace: odysseus
    labels:
        app.kubernetes.io/name: cliproxy
        app.kubernetes.io/component: client-key
type: Opaque
stringData:
    ANTHROPIC_AUTH_TOKEN: ENC[AES256_GCM,data:vp4iSBGNuI2OWSYFqsFfCHfBN5OXEgPqeKV9zic2aY6X5R70dzZfIi/s4U6UBgXOS5RlPw==,iv:50An6N3u8Ff41MdREhrrmp7c9a7QG+kZ9TxcajJJYUQ=,tag:d7Zj/67NxdbdOevIRg+70g==,type:str]
