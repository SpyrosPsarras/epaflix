# ArgoCD-managed kustomization for cert-manager (jetstack chart) + ClusterIssuers.
# Owned by ArgoCD Application "cert-manager" (2-k3s/11.argocd/apps/app-cert-manager.yaml).
#
# CRDs are deliberately NOT inflated here (`includeCRDs: false`); they were
# installed at original `helm install` time and stay operator-managed.
# Re-rendering CRDs under ArgoCD ServerSideApply produces field-manager
# conflicts. Matches the repo-wide convention (authentik, traefik, observability).
#
# Secrets:
#   - cloudflare-api-token            reconciled via the ksops generator below
#                                      from cloudflare-api-token.enc.yaml
#                                      (Issue #29 / PR #58, follow-up #64).
#                                      Note: this is a separate Cloudflare API
#                                      token from the one used by Traefik —
#                                      cert-manager uses it for the DNS-01
#                                      solver of the `letsencrypt-dns`
#                                      ClusterIssuer.
#   - letsencrypt-dns-private-key     ACME account key, auto-generated by
#                                      cert-manager on first Issuer call —
#                                      stays operator-managed (similar to
#                                      CNPG webhook TLS).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: "v1.19.3"
    releaseName: cert-manager
    namespace: cert-manager
    valuesFile: values/cert-manager-values.yaml
    includeCRDs: false

resources:
  - namespace.yaml
  - issuers/letsencrypt-dns-issuer.yaml
  - issuers/self-signed-issuer.yaml

generators:
  - ksops-generator.yaml
