---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fytorium
  namespace: fytorium
  labels:
    app: fytorium
spec:
  namespaceSelector:
    matchNames:
      - fytorium
  selector:
    matchLabels:
      app: fytorium
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
