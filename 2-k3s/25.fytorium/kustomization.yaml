apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level namespace: the DatabaseRole, Database and role Secret must land in postgres-system.
resources:
  - namespace.yaml
  - database.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - servicemonitor.yaml

generators:
  - ksops-generator.yaml

images:
  # built by github.com/SpyrosPsarras/epaflix-fytorium CI; bump the digest to roll out a new version
  - name: ghcr.io/spyrospsarras/epaflix-fytorium
    digest: sha256:d964dbac864b7c77e73a7d46ec384ed43fbaf3067c32228d7a8e044737181bb4
