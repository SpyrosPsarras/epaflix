apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level namespace: the DatabaseRole, Database and role Secret must land in postgres-system.
resources:
  - namespace.yaml
  - database.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - servicemonitor.yaml

generators:
  - ksops-generator.yaml

images:
  # Built by source CI; bump SERVER_VERSION in deployment.yaml with this digest.
  - name: ghcr.io/spyrospsarras/epaflix-fytorium
    digest: sha256:9aa09b45a666fc12ae0d2b109414dba6109cf28a282b5a4a9afd690a1d550395
