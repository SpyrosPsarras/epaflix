apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level namespace: the DatabaseRole, Database and role Secret must land in postgres-system.
resources:
  - namespace.yaml
  - database.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - servicemonitor.yaml

generators:
  - ksops-generator.yaml

images:
  # Built by source CI; bump SERVER_VERSION in deployment.yaml with this digest.
  - name: ghcr.io/spyrospsarras/epaflix-fytorium
    digest: sha256:5afa88ea6f2f1820f95471f370d7d374ff017e3a5ef6abb45bf8d3d9df2d4671
