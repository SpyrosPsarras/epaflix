apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level namespace: the DatabaseRole, Database and role Secret must land in postgres-system.
resources:
  - namespace.yaml
  - database.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - servicemonitor.yaml

generators:
  - ksops-generator.yaml

images:
  # Built by source CI; bump SERVER_VERSION in deployment.yaml with this digest.
  - name: ghcr.io/spyrospsarras/epaflix-fytorium
    digest: sha256:b96ea3bea29208df1bfdffb2215f0d07ad013f2a9538af03d4e8939cac7b29f2
