apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level namespace: the DatabaseRole, Database and role Secret must land in postgres-system.
resources:
  - namespace.yaml
  - database.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - servicemonitor.yaml

generators:
  - ksops-generator.yaml

images:
  # Built by source CI; bump SERVER_VERSION in deployment.yaml with this digest.
  - name: ghcr.io/spyrospsarras/epaflix-fytorium
    digest: sha256:8d5e6ccd51d1cc439298d9d04b578df1202205240e1be8776c5a5ce6cc309cd3
