apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level namespace: the DatabaseRole, Database and role Secret must land in postgres-system.
resources:
  - namespace.yaml
  - database.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - servicemonitor.yaml

generators:
  - ksops-generator.yaml

images:
  # Built by source CI; bump SERVER_VERSION in deployment.yaml with this digest.
  - name: ghcr.io/spyrospsarras/epaflix-fytorium
    digest: sha256:771bdbffee00b514e76a3c7d5a80decac649a129cc5284d79085f24c188a0bae
