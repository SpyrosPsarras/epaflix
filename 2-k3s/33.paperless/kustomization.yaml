apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level namespace: the DatabaseRole, Database and role Secret must land in postgres-system.
resources:
  - namespace.yaml
  - database.yaml
  - storage.yaml
  - paperless.yaml
  - ingressroute.yaml
  - network-policy.yaml

generators:
  - ksops-generator.yaml

images:
