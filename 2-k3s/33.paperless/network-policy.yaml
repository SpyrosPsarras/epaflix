---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-ingress
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      app: paperless
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        # paperless-gpt in this namespace calls the API.
        - podSelector: {}
      ports:
        - port: 8000
          protocol: TCP
---
# No ingress rule denies all. kubectl port-forward goes through the API server and still works.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-gpt-ingress
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      app: paperless-gpt
  policyTypes:
    - Ingress
