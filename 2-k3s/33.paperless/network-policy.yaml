---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paperless-ingress
  namespace: paperless
spec:
  podSelector:
    matchLabels:
      app: paperless
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
        - podSelector: {}
      ports:
        - port: 8000
          protocol: TCP
