---
# Paperless gives every new shop, tag and document type an owner. No owner means every user sees it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-share-lists
  namespace: paperless
  labels:
    app: paperless-share-lists
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: paperless-share-lists
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          containers:
            # command replaces the image entrypoint, which would run migrations and install OCR packs.
            - name: share-lists
              image: ghcr.io/paperless-ngx/paperless-ngx:3.4.2
              workingDir: /usr/src/paperless/src
              command:
                - python3
                - manage.py
                - shell
                - -c
                - "from documents.models import Correspondent, DocumentType, Tag; print({m.__name__: m.objects.exclude(owner=None).update(owner=None) for m in (Correspondent, DocumentType, Tag)})"
              envFrom:
                - secretRef:
                    name: paperless-secrets
              env:
                - {name: PAPERLESS_URL, value: "https://paperless.epaflix.com"}
                - {name: PAPERLESS_COOKIE_PREFIX, value: "paperless_"}
                - {name: PAPERLESS_REDIS, value: "redis://127.0.0.1:6379"}
                - {name: PAPERLESS_DBENGINE, value: postgresql}
                - {name: PAPERLESS_DBHOST, value: postgres-cluster-rw.postgres-system.svc}
                - {name: PAPERLESS_DBNAME, value: paperless}
                - {name: PAPERLESS_DBUSER, value: paperless}
                - {name: PAPERLESS_DATA_DIR, value: /srv/paperless/data}
                - {name: PAPERLESS_MEDIA_ROOT, value: /srv/paperless/media}
                - {name: PAPERLESS_TIME_ZONE, value: Europe/Oslo}
                - {name: PAPERLESS_OCR_LANGUAGE, value: "nor+eng+deu+ell"}
                - {name: PAPERLESS_OCR_LANGUAGES, value: "nor ell"}
                - {name: USERMAP_UID, value: "1000"}
                - {name: USERMAP_GID, value: "1000"}
                - {name: PAPERLESS_APPS, value: allauth.socialaccount.providers.openid_connect}
                - {name: PAPERLESS_DISABLE_REGULAR_LOGIN, value: "true"}
                - {name: PAPERLESS_REDIRECT_LOGIN_TO_SSO, value: "true"}
                - {name: PAPERLESS_SOCIAL_AUTO_SIGNUP, value: "true"}
                - {name: PAPERLESS_ACCOUNT_ALLOW_SIGNUPS, value: "false"}
                - {name: PAPERLESS_SOCIAL_ACCOUNT_DEFAULT_GROUPS, value: receipts}
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: data
                  mountPath: /srv/paperless
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: paperless-data
