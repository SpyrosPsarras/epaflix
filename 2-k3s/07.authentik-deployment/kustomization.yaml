# Kustomize + Helm inflation for Authentik. Rendered by ArgoCD's repo-server
# with `kustomize build --enable-helm` (set via configs.cm.kustomize.buildOptions
# in 2-k3s/11.argocd/helm-values.yaml).
#
# Why this layer and not a direct Helm Application:
#   argocd-image-updater write-back for multi-source Helm Applications goes
#   through ArgoCD's gRPC `UpdateSpec`, which validates every source's repo
#   creds. The upstream `charts.goauthentik.io` repo has no creds (it's
#   public), but ArgoCD still rejects the update. Inflating the chart with
#   kustomize sidesteps the multi-source path: the Application has a single
#   git source, and image-updater writes back to the `images:` block below
#   exactly like the servarr stack.
#
# What image-updater touches:
#   `kustomize edit set image ghcr.io/goauthentik/server=ghcr.io/goauthentik/server:<newtag>`
#   rewrites the `newTag` field below; kustomize replaces the chart-rendered
#   server + worker image references in-place.
#
# Secrets:
#   - authentik-app-secrets (AUTHENTIK_SECRET_KEY, AUTHENTIK_POSTGRESQL__
#     PASSWORD, AUTHENTIK_EMAIL__PASSWORD) reconciled via the ksops
#     generator below from authentik-app-secrets.enc.yaml
#     (Issue #29 / PR #58, follow-up #59).
#     The placeholder file `secret-app.yaml` is kept for reference.
#   - authentik-iac-blueprint (single key `iac-service-account.yaml`)
#     reconciled via the same ksops generator from
#     authentik-iac-blueprint.enc.yaml. It is NOT an app runtime secret:
#     it is mounted via the chart's `blueprints.secrets` and applied by the
#     worker to declaratively create the `ak-iac` service account + its
#     "authentik Admins" membership + a non-expiring API token for IaC
#     automation (Issue #185; supersedes the retired personal token #175).
#   - The chart-generated `authentik` Secret (20 non-sensitive config
#     keys) stays operator-managed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-authentik
resources:
  - namespace.yaml
  - storage/pv-pvc.yaml
  - ingress/outpost-ingressroute.yaml
generators:
  - ksops-generator.yaml
helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io
    version: "2026.5.2" # bump in lockstep with the image MINOR
    releaseName: authentik
    namespace: app-authentik
    valuesFile: helm-values.yaml
    includeCRDs: false
images:
  - name: ghcr.io/goauthentik/server
    newTag: 2026.5.3
