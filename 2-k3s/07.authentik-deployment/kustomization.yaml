apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-authentik
resources:
  - namespace.yaml
  - storage/pv-pvc.yaml
  - ingress/outpost-ingressroute.yaml
  - blueprint-check-cronjob.yaml
generators:
  - ksops-generator.yaml
helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io
    version: "2026.8.1" # bump in lockstep with the image MINOR
    releaseName: authentik
    namespace: app-authentik
    valuesFile: helm-values.yaml
    includeCRDs: false
images:
  - name: ghcr.io/goauthentik/server
    newTag: 2026.8.1

configMapGenerator:
  - name: authentik-blueprint-check-script
    files:
      - files/check_authentik_blueprint.py
