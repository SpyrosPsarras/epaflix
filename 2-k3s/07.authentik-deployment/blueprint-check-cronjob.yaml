---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authentik-blueprint-check
  namespace: app-authentik
  labels:
    app: authentik-blueprint-check
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-blueprint-check
  namespace: app-authentik
  labels:
    app: authentik-blueprint-check
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["authentik-iac-blueprint"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-blueprint-check
  namespace: app-authentik
  labels:
    app: authentik-blueprint-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-blueprint-check
subjects:
  - kind: ServiceAccount
    name: authentik-blueprint-check
    namespace: app-authentik
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-blueprint-check
  namespace: app-authentik
  labels:
    app: authentik-blueprint-check
spec:
  schedule: "35 5 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      ttlSecondsAfterFinished: 2592000 # keep 30 days
      template:
        metadata:
          labels:
            app: authentik-blueprint-check
        spec:
          restartPolicy: Never
          serviceAccountName: authentik-blueprint-check
          automountServiceAccountToken: true
          containers:
            - name: blueprint-check
              image: alpine:3.20
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  apk add --no-cache kubectl python3 py3-yaml >/dev/null
                  echo "=== authentik blueprint check @ $(date -u +%FT%TZ) ==="

                  kubectl -n app-authentik get secret authentik-iac-blueprint \
                    -o json > /work/secret.json

                  exec python3 /script/check_authentik_blueprint.py \
                    --path 'secret/app-authentik/authentik-iac-blueprint' \
                    < /work/secret.json
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
          volumes:
            - name: script
              configMap:
                name: authentik-blueprint-check-script
                defaultMode: 0444
            - name: work
              emptyDir:
                medium: Memory
                sizeLimit: 16Mi
