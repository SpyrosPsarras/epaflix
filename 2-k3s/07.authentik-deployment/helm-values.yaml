
global:
  image:
    repository: ghcr.io/goauthentik/server
    tag: "2026.5.3"
    pullPolicy: IfNotPresent

  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  envFrom:
    - secretRef:
        name: authentik-app-secrets

  deploymentAnnotations:
    secret.reloader.stakater.com/reload: "authentik-app-secrets"

authentik:
  secret_key: ""

  log_level: info

  error_reporting:
    enabled: false

  postgresql:
    host: "postgres-rw.postgres-system.svc.cluster.local"
    port: 5432
    name: "authentik"
    user: "authentik"
    password: ""

  email:
    port: 587
    use_tls: true
    use_ssl: false
    timeout: 30

server:
  enabled: true
  name: server
  replicas: 1 # Single replica due to ReadWriteOnce storage

  deploymentStrategy:
    type: Recreate

  ingress:
    enabled: false

  service:
    type: ClusterIP
    servicePortHttp: 80
    servicePortHttps: 443

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"

  livenessProbe:
    httpGet:
      path: /-/health/live/
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /-/health/ready/
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  volumeMounts:
    - name: media
      mountPath: /media

  volumes:
    - name: media
      persistentVolumeClaim:
        claimName: authentik-media-pvc-iscsi

  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - authentik
          topologyKey: kubernetes.io/hostname

worker:
  enabled: true
  name: worker
  replicas: 1

  deploymentStrategy:
    type: Recreate

  deploymentAnnotations:
    secret.reloader.stakater.com/reload: "authentik-app-secrets,authentik-iac-blueprint"

  resources:
    requests:
      memory: "1024Mi"
      cpu: "500m"

  livenessProbe:
    exec:
      command:
        - ak
        - healthcheck
    initialDelaySeconds: 20
    periodSeconds: 60
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    exec:
      command:
        - ak
        - healthcheck
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5

  startupProbe:
    exec:
      command:
        - ak
        - healthcheck
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 20

  volumeMounts:
    - name: media
      mountPath: /media
    - name: blueprints-secret-authentik-iac-blueprint
      mountPath: /blueprints/mounted/secret-authentik-iac-blueprint/iac-service-account.yaml
      subPath: iac-service-account.yaml
      readOnly: true

  volumes:
    - name: media
      persistentVolumeClaim:
        claimName: authentik-media-pvc-iscsi
    - name: blueprints-secret-authentik-iac-blueprint
      secret:
        secretName: authentik-iac-blueprint

  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - authentik
          topologyKey: kubernetes.io/hostname

postgresql:
  enabled: false

serviceAccount:
  create: true
  fullnameOverride: "authentik"

additionalObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: authentik-http
      namespace: app-authentik
    spec:
      entryPoints:
        - web
      routes:
        - match: Host(`auth.epaflix.com`)
          kind: Rule
          middlewares:
            - name: redirect-https
              namespace: traefik-system
          services:
            - name: authentik-server
              port: 80

  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: authentik-https
      namespace: app-authentik
    spec:
      entryPoints:
        - websecure
      routes:
        - match: Host(`auth.epaflix.com`)
          kind: Rule
          middlewares:
            - name: security-headers
              namespace: traefik-system
          services:
            - name: authentik-server
              port: 80
      tls: {}
