---
# Authentik runtime secrets - applied imperatively, values taken from the
# credential store `.github/instructions/secrets.enc.yaml`.
# Picked up by Authentik server + worker via `global.envFrom` in
# helm-values.yaml (override on top of the chart-managed `authentik`
# Secret). Kept OUT of the values file so ArgoCD can safely render the
# chart from git without rewriting the live Secret with placeholder
# strings.
#
# Apply (substitute placeholders from the credential store first - read one key
# with: sops -d --extract '["<key_name>"]' .github/instructions/secrets.enc.yaml
# and never decrypt the whole file or echo the value):
#   kubectl apply -f secret-app.yaml
#
# Rotation: edit the live Secret + `kubectl rollout restart deploy/authentik-server
# deploy/authentik-worker -n app-authentik`. Never bake real values into git.
apiVersion: v1
kind: Secret
metadata:
  name: authentik-app-secrets
  namespace: app-authentik
type: Opaque
stringData:
  AUTHENTIK_SECRET_KEY: "<AUTHENTIK_SECRET_KEY>"
  AUTHENTIK_POSTGRESQL__PASSWORD: "<AUTHENTIK_DB_PASSWORD>"
  # Email transport. These four are NOT in helm-values.yaml — the repo is
  # public, so the relay hostname and the mailbox address live only here /
  # in the SOPS Secret (#461). Substitute from the credential store:
  #   __HOST     -> the real relay node (NOT mail.epaflix.com: that name has
  #                 no record of its own, so the proxied *.epaflix.com
  #                 Cloudflare wildcard answers and 587 times out)
  #   __USERNAME -> auth_email_username
  #   __PASSWORD -> auth_email_password
  #   __FROM     -> same mailbox as __USERNAME; the relay rejects a sender
  #                 that is not the authenticated mailbox
  AUTHENTIK_EMAIL__HOST: "<SMTP_HOST>"
  AUTHENTIK_EMAIL__USERNAME: "<SMTP_USERNAME>"
  AUTHENTIK_EMAIL__PASSWORD: "<SMTP_PASSWORD>"
  # Same value as __USERNAME on purpose: the relay rejects senders that are not
  # the authenticated mailbox. No auth_email_from store key exists (#979).
  AUTHENTIK_EMAIL__FROM: "<SMTP_FROM>"
