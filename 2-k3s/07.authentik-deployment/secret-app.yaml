---
# Authentik runtime secrets — applied imperatively from secrets.yml.
# Picked up by Authentik server + worker via `global.envFrom` in
# helm-values.yaml (override on top of the chart-managed `authentik`
# Secret). Kept OUT of the values file so ArgoCD can safely render the
# chart from git without rewriting the live Secret with placeholder
# strings.
#
# Apply (substitute placeholders from .github/instructions/secrets.yml first):
#   kubectl apply -f secret-app.yaml
#
# Rotation: edit the live Secret + `kubectl rollout restart deploy/authentik-server
# deploy/authentik-worker -n app-authentik`. Never bake real values into git.
apiVersion: v1
kind: Secret
metadata:
  name: authentik-app-secrets
  namespace: app-authentik
type: Opaque
stringData:
  AUTHENTIK_SECRET_KEY: "<AUTHENTIK_SECRET_KEY>"
  AUTHENTIK_POSTGRESQL__PASSWORD: "<AUTHENTIK_DB_PASSWORD>"
  AUTHENTIK_EMAIL__PASSWORD: "<SMTP_PASSWORD>"
