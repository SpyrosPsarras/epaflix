apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: discord-media

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - network-policy.yaml

helmCharts:
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: "2.2.20"
    releaseName: reloader-discord-media
    namespace: discord-media
    valuesFile: reloader-values.yaml

generators:
  - ksops-generator.yaml

configMapGenerator:
  - name: openclaw-config
    files:
      - openclaw.json
      - AGENTS.md

images:
  # Built by build-openclaw-discord.yml from images/openclaw-discord; pin the digest it prints.
  - name: ghcr.io/spyrospsarras/openclaw-discord
    digest: sha256:4358f91e35885b3ff475e900645e517a30f4cebbd1fc63643393565ef07ff38d
