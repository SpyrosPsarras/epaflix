---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lingarr-internal
  namespace: servarr
spec:
  entryPoints:
    - internal
  routes:
    - match: Host(`lingarr.epaflix.com`)
      kind: Rule
      services:
        - name: lingarr
          port: 9876
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
