---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lingarr
  namespace: servarr
  labels:
    app: lingarr
  annotations:
    secret.reloader.stakater.com/reload: "servarr-postgres"
spec:
  replicas: 1
  strategy:
    type: Recreate   # Single-writer; avoid double-writer races on config volume
  selector:
    matchLabels:
      app: lingarr
  template:
    metadata:
      labels:
        app: lingarr
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: lingarr
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
      initContainers:
        - name: enforce-db-invariants
          image: postgres:16
          command:
            - sh
            - -c
            - |
              set -e
              psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE" -c "
                DO \$\$
                BEGIN
                  IF EXISTS (SELECT 1 FROM information_schema.tables WHERE table_name = 'settings') THEN
                    UPDATE settings SET value = '900'
                     WHERE key = 'request_timeout'
                       AND (value ~ '^[0-9]+\$' AND value::int < 900);
                    INSERT INTO settings (key, value) VALUES ('use_batch_translation', 'true')
                    ON CONFLICT (key) DO UPDATE SET value = 'true';
                    INSERT INTO settings (key, value) VALUES ('max_batch_size', '25')
                    ON CONFLICT (key) DO UPDATE SET value = '25'
                     WHERE settings.value ~ '^[0-9]+\$' AND settings.value::int < 25;
                    INSERT INTO settings (key, value) VALUES ('strip_subtitle_formatting', 'true')
                    ON CONFLICT (key) DO UPDATE SET value = 'true';
                  END IF;
                END
                \$\$;"
              if ! psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_DATABASE" \
                     -f /sql/reconcile-job-queue.sql; then
                echo "FATAL: reconcile-job-queue failed, refusing to boot on an unreconciled job queue (#925)" >&2
                exit 1
              fi
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: lingarr-host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: lingarr-port
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: lingarr-database
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: lingarr-user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: lingarr-password
          volumeMounts:
            - name: jobqueue-guard
              mountPath: /sql
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      containers:
        - name: lingarr
          image: ghcr.io/lingarr-translate/lingarr:main
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:9876"
            - name: SONARR_URL
              value: "http://sonarr:8989"
            - name: RADARR_URL
              value: "http://radarr:7878"
            - name: DB_CONNECTION
              value: "postgres"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: lingarr-host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: lingarr-port
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: lingarr-database
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: lingarr-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: lingarr-password
          ports:
            - containerPort: 9876
              name: http
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: media
              mountPath: /media
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lingarr-config
        - name: media
          persistentVolumeClaim:
            claimName: servarr-media
        - name: jobqueue-guard
          configMap:
            name: lingarr-jobqueue-guard
---
apiVersion: v1
kind: Service
metadata:
  name: lingarr
  namespace: servarr
  labels:
    app: lingarr
spec:
  type: ClusterIP
  selector:
    app: lingarr
  ports:
    - name: http
      port: 9876
      targetPort: http
