---
# Lingarr — AI subtitle translator (forked image with zombie/concurrency fix, upstream PR #377)
#
# Lingarr keeps its Sonarr/Radarr API keys in its OWN Postgres (`lingarr-main`,
# `settings.sonarr_api_key` / `radarr_api_key`) and stores them ENCRYPTED
# (~176 chars), so a plaintext value scan does NOT find them - lingarr is an
# easy-to-miss consumer of every *arr API-key rotation. Write them only through
# `POST /api/setting/encrypted`; see the rotation runbook in
# 2-k3s/08.servarr/README.md (#712).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lingarr
  namespace: servarr
  labels:
    app: lingarr
  annotations:
    # Reloader (#299): rolls on servarr-postgres rotation (shared by
    # bazarr/lingarr/prowlarr/radarr/seerr, so all 5 restart together on a
    # credential change — accepted, see PR for the tradeoff).
    secret.reloader.stakater.com/reload: "servarr-postgres"
spec:
  replicas: 1
  strategy:
    type: Recreate   # Single-writer; avoid double-writer races on config volume
  selector:
    matchLabels:
      app: lingarr
  template:
    metadata:
      labels:
        app: lingarr
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: lingarr
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
      containers:
        - name: lingarr
          # Upstream Lingarr (off the retired SpyrosPsarras fork). Effective image is
          # digest-pinned in ../kustomization.yaml images: block (moving :main tag).
          # :main carries the #432 "convert DateTime to utc" fix (not in any release
          # tag yet — latest 1.2.4 predates it); revisit when upstream cuts >1.2.4. #270
          image: ghcr.io/lingarr-translate/lingarr:main
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:9876"
            # Postgres (managed by CloudNativePG in postgres-system ns)
            - name: DB_CONNECTION
              value: "postgres"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: lingarr-host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: lingarr-port
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: lingarr-database
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: lingarr-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: lingarr-password
          ports:
            - containerPort: 9876
              name: http
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: media
              mountPath: /media
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lingarr-config
        - name: media
          persistentVolumeClaim:
            claimName: servarr-media
---
apiVersion: v1
kind: Service
metadata:
  name: lingarr
  namespace: servarr
  labels:
    app: lingarr
spec:
  type: ClusterIP
  selector:
    app: lingarr
  ports:
    - name: http
      port: 9876
      targetPort: http
