apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: digarr-ingress
  namespace: servarr
spec:
  podSelector:
    matchLabels:
      app: digarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 3000
          protocol: TCP
