apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: slskd-ingress
  namespace: servarr
spec:
  podSelector:
    matchLabels:
      app: slskd
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app: soularr
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 5030
          protocol: TCP
