apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: navidrome-ingress
  namespace: servarr
spec:
  podSelector:
    matchLabels:
      app: navidrome
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - podSelector:
            matchLabels:
              app: digarr
      ports:
        - port: 4533
          protocol: TCP
