---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: navidrome-https
  namespace: servarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`navidrome.epaflix.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: security-headers
          namespace: traefik-system
        - name: authentik-forwardauth
          namespace: traefik-system
      services:
        - name: navidrome
          port: 4533
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: navidrome-outpost-https
  namespace: servarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`navidrome.epaflix.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 15
      services:
        - name: authentik-server
          namespace: app-authentik
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: navidrome-http
  namespace: servarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`navidrome.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: navidrome
          port: 4533
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: navidrome-strip-identity
  namespace: servarr
spec:
  headers:
    customRequestHeaders:
      X-authentik-username: ""
      True-Client-IP: ""
      X-Real-IP: ""
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: navidrome-apps-https
  namespace: servarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`navidrome.epaflix.com`) && (PathPrefix(`/rest/`) || PathPrefix(`/jellyfin/`))
      kind: Rule
      priority: 20
      middlewares:
        - name: security-headers
          namespace: traefik-system
        - name: navidrome-strip-identity
      services:
        - name: navidrome
          port: 4533
  tls: {}
