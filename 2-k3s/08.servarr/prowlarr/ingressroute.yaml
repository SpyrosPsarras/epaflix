---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prowlarr-internal
  namespace: servarr
spec:
  entryPoints:
    - internal
  routes:
    - match: Host(`prowlarr.epaflix.com`)
      kind: Rule
      services:
        - name: prowlarr
          port: 9696
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
