apiVersion: batch/v1
kind: CronJob
metadata:
  name: configarr
  namespace: servarr
  labels:
    app: configarr
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: configarr
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: configarr
              image: ghcr.io/raydak-labs/configarr:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: STOP_ON_ERROR
                  value: "true"
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: unpackerr-secret
                      key: UN_SONARR_0_API_KEY
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: unpackerr-secret
                      key: UN_RADARR_0_API_KEY
              volumeMounts:
                - name: config
                  mountPath: /app/config
                  readOnly: true
                - name: repos
                  mountPath: /app/repos
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
          volumes:
            - name: config
              configMap:
                name: configarr-config
            - name: repos
              emptyDir: {}
