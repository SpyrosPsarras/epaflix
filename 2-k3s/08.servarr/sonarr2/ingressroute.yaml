---
# Sonarr2 (anime) - Public Internet-facing IngressRoutes with Let's Encrypt TLS,
# fronted by Authentik forward-auth SSO (issue #176, servarr forward-auth rollout).
#
# Sonarr2 is an INTEGRATION TARGET: it is called machine-to-machine by seerr,
# cleanuparr, and newtarr. The browser UI is gated by the authentik-forwardauth
# middleware (Authentik embedded outpost, "Servarr users" group), but the /api
# path is EXEMPTED via a higher-priority route (priority:20, no middleware) so
# machine/API-key callers and deep-link traffic are not blocked by SSO. The
# Sonarr API is already protected by its own API key, so the carve-out is safe.
#
# Pattern mirrors newtarr/ingressroute.yaml:
#   - app route priority:10 + authentik-forwardauth middleware
#   - outpost route priority:15 matching PathPrefix(/outpost.goauthentik.io/)
#   - api route priority:20 PathPrefix(/api) with no middleware
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr2-https
  namespace: servarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sonarr2.epaflix.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: security-headers
          namespace: traefik-system
        - name: authentik-forwardauth
          namespace: traefik-system
      services:
        - name: sonarr2
          port: 8989
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
---
# Outpost route - handles auth callback on sonarr2.epaflix.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr2-outpost-https
  namespace: servarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`sonarr2.epaflix.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 15
      services:
        - name: authentik-server
          namespace: app-authentik
          port: 80
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
---
# NO /api exemption route here, deliberately (#296, removed 2026-08-10).
# A priority-20 `Host(`sonarr2.epaflix.com`) && PathPrefix(`/api`)` route with no
# middleware used to sit here, so API-key callers could bypass forward-auth over
# the public host. It also made the API internet-reachable with the API key as
# the only control. The comment it replaced named seerr/cleanuparr/newtarr as the
# reason - all three were checked live and use internal Service DNS
# (`http://sonarr2:8989`), so the reason no longer held. 30d of access logs showed
# no headless external caller. /api now matches `sonarr2-https` (priority 10) and
# is forward-auth'd. Re-adding this re-publishes the API to the internet. Don't.
---
# HTTP to HTTPS redirect for Sonarr2
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr2-http
  namespace: servarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`sonarr2.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: sonarr2
          port: 8989
