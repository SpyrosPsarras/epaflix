---
# Sonarr2 - Anime Manager
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr2
  namespace: servarr
  labels:
    app: sonarr2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr2
  template:
    metadata:
      labels:
        app: sonarr2
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: sonarr2
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
      containers:
        - name: sonarr2
          image: lscr.io/linuxserver/sonarr:latest
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: TZ
              value: "Europe/Oslo"
            # Using SQLite (PostgreSQL disabled due to permission issues)
          ports:
            - containerPort: 8989
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
            # Off-PVC backups (#282). subPath is safe here (unlike #195's media
            # mounts) - backup writes are never hardlinked.
            #
            # Two mount paths, one directory - deliberate (#538):
            #  - /backups        matches the live `backupFolder=/backups` row that
            #                    #282 set through the API. That row lives in the
            #                    Config table of sonarr.db on the local-path config
            #                    PVC - it is app state, NOT git, and a from-scratch
            #                    PVC rebuild loses it.
            #  - /config/Backups is Sonarr's DEFAULT backup folder (ConfigService
            #                    falls back to the relative path "Backups" under
            #                    the AppData dir, i.e. /config/Backups). A rebuilt
            #                    PVC with no Config row therefore still writes off
            #                    the PVC, onto this same NFS directory.
            #
            # Net effect: the backup lands here whether or not the app-side setting
            # survives, so #538's silent revert-to-on-PVC cannot happen. The
            # /backups entry becomes redundant if the Config row is ever cleared;
            # it is kept so no live API step is needed to make this safe.
            #
            # Ordering matters: /config must be mounted before /config/Backups, so
            # the `config` volumeMount has to stay above this block.
            - name: backups
              mountPath: /backups
              subPath: backups/sonarr2
            - name: backups
              mountPath: /config/Backups
              subPath: backups/sonarr2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr2-config
        - name: media
          persistentVolumeClaim:
            claimName: servarr-media
        - name: backups
          persistentVolumeClaim:
            claimName: servarr-media
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr2
  namespace: servarr
  labels:
    app: sonarr2
spec:
  type: ClusterIP
  selector:
    app: sonarr2
  ports:
    - name: http
      port: 8989
      targetPort: http
