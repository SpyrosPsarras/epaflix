---
# Seerr - Media Request Management (single canonical deployment)
#
# This is the ONLY media-request Deployment/Service in the stack — the
# redundant `jellyseerr` Deployment has been retired (consolidated here).
# This is a NAME consolidation, not an image migration: it runs the
# fallenbagel/jellyseerr:preview-OIDC fork image (UID 568) because OIDC is
# not in any stable seerr release. The jellyseerr-named data resources are
# retained legacy names (no migration): PVC jellyseerr-config, Postgres
# DB/user jellyseerr, and the jellyseerr-* keys in the servarr-postgres Secret.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: servarr
  labels:
    app: seerr
  annotations:
    # Reloader (#299): rolls on servarr-postgres rotation (shared by
    # bazarr/lingarr/prowlarr/radarr/seerr, so all 5 restart together on a
    # credential change — accepted, see PR for the tradeoff).
    secret.reloader.stakater.com/reload: "servarr-postgres"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: seerr
      # Security context for Jellyseerr OIDC preview (UID 568)
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
      initContainers:
        # Seed the /app/config PVC from the SOPS-encrypted seerr-config-seed
        # Secret (issue #518). This codifies settings.json (service definitions,
        # main API key, Sonarr/Radarr instance config) in git so a freshly
        # re-provisioned local-path PVC comes up pre-configured instead of
        # empty, and durably captures fixes that were previously PVC-only
        # (e.g. #253's is4k flag flip, #522's Sonarr2 seriesType fix).
        #
        # NON-CLOBBERING: only copied when settings.json does NOT already
        # exist on the PVC. On a populated PVC this is a no-op — the app
        # rewrites settings.json at runtime, and this never overwrites live
        # state. Same pattern as newtarr's seed-config initContainer (#137).
        - name: seed-config
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /app/config
              if [ -e /app/config/settings.json ]; then
                echo "skip (exists): /app/config/settings.json"
              else
                cp /seed/settings.json /app/config/settings.json
                echo "seeded: /app/config/settings.json"
              fi
              chown -R 568:568 /app/config
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: seerr
          # Using Jellyseerr OIDC preview image for OIDC support
          image: fallenbagel/jellyseerr:preview-OIDC
          imagePullPolicy: Always
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: TZ
              value: "Europe/Oslo"
            # PostgreSQL database configuration (same as jellyseerr)
            - name: DB_TYPE
              value: "postgres"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: jellyseerr-host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: jellyseerr-port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: jellyseerr-user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: jellyseerr-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: jellyseerr-database
          ports:
            - containerPort: 5055
              name: http
          volumeMounts:
            - name: config
              mountPath: /app/config
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            timeoutSeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "500m"
      volumes:
        - name: config
          persistentVolumeClaim:
            # Reusing the jellyseerr config PVC
            claimName: jellyseerr-config
        # SOPS-encrypted seed config (issue #518), reconciled by the servarr
        # ksops generator from _shared/secrets/seerr-config-seed.enc.yaml.
        # Consumed only by the seed-config initContainer.
        - name: seed
          secret:
            secretName: seerr-config-seed
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  namespace: servarr
  labels:
    app: seerr
spec:
  type: ClusterIP
  selector:
    app: seerr
  ports:
    - name: http
      port: 5055
      targetPort: http
