---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: servarr
  labels:
    app: seerr
  annotations:
    secret.reloader.stakater.com/reload: "servarr-postgres"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: seerr
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
      initContainers:
        - name: seed-config
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /app/config
              if [ -e /app/config/settings.json ]; then
                echo "skip (exists): /app/config/settings.json"
              else
                cp /seed/settings.json /app/config/settings.json
                echo "seeded: /app/config/settings.json"
              fi
              chown -R 568:568 /app/config
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: seerr
          image: fallenbagel/jellyseerr:preview-OIDC
          imagePullPolicy: Always
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: TZ
              value: "Europe/Oslo"
            - name: DB_TYPE
              value: "postgres"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: jellyseerr-host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: jellyseerr-port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: jellyseerr-user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: jellyseerr-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: jellyseerr-database
          ports:
            - containerPort: 5055
              name: http
          volumeMounts:
            - name: config
              mountPath: /app/config
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            timeoutSeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyseerr-config
        - name: seed
          secret:
            secretName: seerr-config-seed
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  namespace: servarr
  labels:
    app: seerr
spec:
  type: ClusterIP
  selector:
    app: seerr
  ports:
    - name: http
      port: 5055
      targetPort: http
