---
# Newtarr - Public Internet-facing IngressRoutes with Let's Encrypt TLS,
# fronted by Authentik forward-auth SSO (issue #134, Option B done).
#
# Access is SSO-ONLY: the authentik-forwardauth middleware (Authentik
# embedded outpost, provider + app slug `newtarr`) gates BOTH local and
# internet traffic to newtarr, authorized by the "Servarr users" group.
# newtarr's own in-app login is disabled (Authentication Mode = "No Login
# Mode" / general.proxy_auth_bypass=true in its /config) so there is no
# double login.
#
# Pattern mirrors 05.traefik-deployment/ingress/traefik-dashboard-sso.yaml:
#   - app route priority:10 + authentik-forwardauth middleware
#   - outpost route priority:15 matching PathPrefix(/outpost.goauthentik.io/)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: newtarr-https
  namespace: servarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`newtarr.epaflix.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: security-headers
          namespace: traefik-system
        - name: authentik-forwardauth
          namespace: traefik-system
      services:
        - name: newtarr
          port: 30262
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
---
# Outpost route - handles auth callback on newtarr.epaflix.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: newtarr-outpost-https
  namespace: servarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`newtarr.epaflix.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 15
      services:
        - name: authentik-server
          namespace: app-authentik
          port: 80
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
---
# HTTP to HTTPS redirect for Newtarr
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: newtarr-http
  namespace: servarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`newtarr.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: newtarr
          port: 30262
