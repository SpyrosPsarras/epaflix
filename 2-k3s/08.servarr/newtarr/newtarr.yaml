---
# Newtarr - Quality management for *arr apps
#
# This is the ElfHosted "newtarr" fork of Huntarr
# (ghcr.io/elfhosted/newtarr:rolling). It is community-maintained and carries
# NO upstream support guarantee — treat upgrades and behaviour changes with
# care.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newtarr
  namespace: servarr
  labels:
    app: newtarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: newtarr
  template:
    metadata:
      labels:
        app: newtarr
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: newtarr
      initContainers:
        # Seed the /config PVC from the SOPS-encrypted newtarr-config-seed
        # Secret (issue #137). This codifies the app's JSON config (sonarr.json,
        # radarr.json, …, scheduling/list.json) in git so a freshly-provisioned
        # local-path PVC comes up pre-configured instead of empty.
        #
        # IDEMPOTENT + NON-CLOBBERING: each seed key is only copied when the
        # destination file does NOT already exist. On a populated PVC every
        # file is skipped, so this is a no-op — the app rewrites these JSONs at
        # runtime (#135/#177), and we never overwrite live state. The
        # scheduling-list.json key is remapped to /config/scheduling/list.json
        # (k8s Secret keys cannot contain '/'). Secret projection exposes each
        # key as a symlink to a regular file under /seed, while the internal
        # ..data / ..<ts> dirs start with '.' and are not matched by /seed/*.
        - name: seed-config
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /config/scheduling
              for f in /seed/*; do
                [ -f "$f" ] || continue
                name=$(basename "$f")
                if [ "$name" = "scheduling-list.json" ]; then
                  dest=/config/scheduling/list.json
                else
                  dest=/config/$name
                fi
                if [ -e "$dest" ]; then
                  echo "skip (exists): $dest"
                else
                  cp "$f" "$dest" && echo "seeded: $dest"
                fi
              done
              chown -R 568:568 /config
          volumeMounts:
            - name: config
              mountPath: /config
            - name: seed
              mountPath: /seed
              readOnly: true
        # ENFORCE the Authentik forward-auth "No Login Mode" (#134/#174).
        # Runs AFTER seed-config so a fresh PVC is seeded first. Surgically
        # forces ONLY general.json's top-level proxy_auth_bypass=true and
        # preserves every other key. Idempotent: a correct PVC logs
        # "ok: already true" and writes nothing. It can ONLY set the flag to
        # true (keep Authentik in front) — it never writes false, so it can
        # never re-enable newtarr's own login behind the trusted route.
        # NOTE: assumes the newtarr app image provides `python3` on PATH (it is
        # a Python v1.0.0 rewrite). If a future tag drops python3 from PATH this
        # initContainer CrashLoops the pod — swap to the busybox+jq/sed pattern
        # used by seed-config (tracked: open a follow-up if it ever fires).
        - name: enforce-auth-bypass
          image: ghcr.io/elfhosted/newtarr:rolling
          securityContext:
            runAsUser: 0
          command:
            - python3
            - -c
            - |
              import json, os
              p = "/config/general.json"
              try:
                  with open(p) as fh:
                      cfg = json.load(fh)
                  if not isinstance(cfg, dict):
                      raise ValueError("not a JSON object")
              except Exception as e:
                  print(f"general.json absent/corrupt ({e!r}); writing minimal")
                  cfg = {}
              if cfg.get("proxy_auth_bypass") is True:
                  print("ok: already true")
              else:
                  cfg["proxy_auth_bypass"] = True
                  tmp = p + ".tmp"
                  with open(tmp, "w") as fh:
                      json.dump(cfg, fh, indent=2)
                  os.replace(tmp, p)
                  os.chown(p, 568, 568)
                  print("enforced: proxy_auth_bypass=true")
          volumeMounts:
            - name: config
              mountPath: /config
        # Pre-create the layout that the app container then mounts READ-ONLY at
        # STATEFUL_DIR (see the STATEFUL_DIR env comment below for the why).
        #
        # This init step is MANDATORY, not cosmetic: stateful_manager.py creates
        # the per-app subdirectories at *module import* time with
        #   for app_type in APP_TYPES: (STATEFUL_DIR / app_type).mkdir(exist_ok=True)
        # and that loop is NOT wrapped in try/except. `exist_ok=True` only
        # swallows FileExistsError, so on a read-only mount with missing subdirs
        # the mkdir raises EROFS at import and the pod CrashLoops. Pre-creating
        # all six APP_TYPES dirs means every mkdir hits an existing dir and is a
        # no-op. lock.json is pre-written so get_lock_info() reads a real file and
        # the UI's stateful panel shows sane dates instead of epoch 0.
        - name: stateful-void-init
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e
              for a in sonarr radarr lidarr readarr whisparr eros; do
                mkdir -p "/stateful-void/$a"
              done
              now=$(date +%s)
              printf '{"created_at":%s,"expires_at":%s}\n' "$now" "$((now + 604800))" \
                > /stateful-void/lock.json
              chown -R 568:568 /stateful-void
              echo "stateful-void prepared"
          volumeMounts:
            - name: stateful-void
              mountPath: /stateful-void
      containers:
        - name: newtarr
          image: ghcr.io/elfhosted/newtarr:rolling
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: TZ
              value: "Europe/Oslo"
            # Newtarr/Huntarr v1.0.0 binds its web UI on 0.0.0.0:9705 and reads
            # ONLY the PORT env (main.py: os.environ.get('PORT', 9705)). It does
            # NOT honour HUNTARR_PORT/NEWTARR_PORT. Leaving PORT unset keeps the
            # documented default of 9705 (see #131). The previous HUNTARR_PORT
            # env was inert AND collided with the k8s-injected HUNTARR_PORT from
            # the legacy huntarr Service, so it is removed.
            - name: UMASK
              value: "002"
            # Auth is handled ENTIRELY by Authentik forward-auth at Traefik
            # (issue #134). newtarr's in-app login is disabled via its
            # Authentication Mode = "No Login Mode" (general.proxy_auth_bypass=true,
            # persisted in the /config PVC, NOT an env var). This flag is now
            # ENFORCED declaratively on every pod start by the
            # enforce-auth-bypass initContainer above (#174), so a live UI edit
            # can't silently re-expose the in-app login. NOTE: newtarr v1.0.0
            # does NOT read LOCAL_NETWORK / BYPASS_AUTH_FOR_LOCAL_ADDRESSES — those
            # were inert and have been removed.
            # Point newtarr's "Stateful Management" store at a READ-ONLY empty
            # volume, which permanently neutralizes it. This is a WORKAROUND for a
            # hard defect in the fork, not a preference.
            #
            # The defect: newtarr records every hunted item in
            # STATEFUL_DIR/<app>/<Instance>.json and skips anything already in
            # that list (stateful_manager.py:is_processed). The list is supposed to
            # age out after `stateful_management_hours`, and check_expiration()
            # implements exactly that — but check_expiration() has ZERO callers in
            # the image. Nothing in the app ever calls it. The only code paths that
            # clear the list are the two HTTP reset routes behind the UI's manual
            # "Reset" button. So in practice newtarr searches each missing season
            # EXACTLY ONCE, EVER, and then reports "All seasons with missing
            # episodes have been processed" forever.
            #
            # Live effect before this change: the lock had expired 2026-06-07 and
            # 661 stale IDs covered every missing season, so all 34 of Sonarr's and
            # 7 of Sonarr2's missing seasons were skipped on every hourly cycle for
            # 51 days while releases for them sat available on the indexers.
            #
            # Why a read-only volume fixes it: get_processed_ids() returns an empty
            # set when the file is absent, so every cycle sees every missing season
            # as unprocessed, shuffles them (missing.py:293) and searches
            # `hunt_missing_items` of them. add_processed_id() then fails to write
            # and logs one caught error per hunted item (~1-3/hour) — cosmetic, and
            # far below the ServarrErrorSpike alert threshold of 25 lines/5m.
            # The dedupe list is only an indexer-politeness optimization; at 1 item
            # per 3600s with hourly_cap 20 it is not needed, and Sonarr will not
            # re-grab an episode it already has.
            #
            # NOTE: the UI's stateful "Reset" button now returns 500 (it cannot
            # write). That is fine — there is no longer any state to reset.
            # ROLLBACK: drop this env var + the stateful-void volume/mount/init and
            # the app falls back to /config/stateful on the PVC, restoring the old
            # hunt-once-forever behaviour.
            #
            # This replaces the former STATEFUL_EXPIRATION_HOURS env var, which was
            # inert: the app only ever reads general.json's
            # `stateful_management_hours`, and that value is never enforced anyway.
            - name: STATEFUL_DIR
              value: /stateful-void
          ports:
            # Web UI (the app binds 0.0.0.0:9705). v1.0.0 exposes NO separate
            # Prometheus endpoint — /metrics returns 404 — so the prior
            # "metrics" containerPort (which had wrongly claimed 9705, the real
            # web port) is dropped. See #131.
            - containerPort: 9705
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            # readOnly is the whole point — see the STATEFUL_DIR env comment.
            - name: stateful-void
              mountPath: /stateful-void
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: newtarr-config
        # SOPS-encrypted seed config (issue #137), reconciled by the servarr
        # ksops generator from _shared/secrets/newtarr-config-seed.enc.yaml.
        # Consumed only by the seed-config initContainer.
        - name: seed
          secret:
            secretName: newtarr-config-seed
        # Deliberately ephemeral AND mounted read-only in the app container, so
        # newtarr's broken processed-items list can never be read or written.
        # Prepared by the stateful-void-init initContainer above.
        - name: stateful-void
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: newtarr
  namespace: servarr
  labels:
    app: newtarr
spec:
  type: ClusterIP
  selector:
    app: newtarr
  ports:
    # Stable in-cluster Service port 30262 is preserved so the existing
    # IngressRoutes (svc newtarr port 30262) keep working unchanged; it now
    # targets the real web port 9705. The metrics port is dropped (no metrics
    # endpoint — see #131).
    - name: http
      port: 30262
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: newtarr-config
  namespace: servarr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
