---
# Newtarr - Quality management for *arr apps
#
# This is the ElfHosted "newtarr" fork of Huntarr
# (ghcr.io/elfhosted/newtarr:rolling). It is community-maintained and carries
# NO upstream support guarantee — treat upgrades and behaviour changes with
# care.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newtarr
  namespace: servarr
  labels:
    app: newtarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: newtarr
  template:
    metadata:
      labels:
        app: newtarr
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: newtarr
      containers:
        - name: newtarr
          image: ghcr.io/elfhosted/newtarr:rolling
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: TZ
              value: "Europe/Oslo"
            # Newtarr/Huntarr v1.0.0 binds its web UI on 0.0.0.0:9705 and reads
            # ONLY the PORT env (main.py: os.environ.get('PORT', 9705)). It does
            # NOT honour HUNTARR_PORT/NEWTARR_PORT. Leaving PORT unset keeps the
            # documented default of 9705 (see #131). The previous HUNTARR_PORT
            # env was inert AND collided with the k8s-injected HUNTARR_PORT from
            # the legacy huntarr Service, so it is removed.
            - name: UMASK
              value: "002"
            # Auth is handled ENTIRELY by Authentik forward-auth at Traefik
            # (issue #134). newtarr's in-app login is disabled via its
            # Authentication Mode = "No Login Mode" (general.proxy_auth_bypass=true,
            # persisted in the /config PVC, NOT an env var). NOTE: newtarr v1.0.0
            # does NOT read LOCAL_NETWORK / BYPASS_AUTH_FOR_LOCAL_ADDRESSES — those
            # were inert and have been removed.
            - name: STATEFUL_EXPIRATION_HOURS
              value: "72"
          ports:
            # Web UI (the app binds 0.0.0.0:9705). v1.0.0 exposes NO separate
            # Prometheus endpoint — /metrics returns 404 — so the prior
            # "metrics" containerPort (which had wrongly claimed 9705, the real
            # web port) is dropped. See #131.
            - containerPort: 9705
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: newtarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: newtarr
  namespace: servarr
  labels:
    app: newtarr
spec:
  type: ClusterIP
  selector:
    app: newtarr
  ports:
    # Stable in-cluster Service port 30262 is preserved so the existing
    # IngressRoutes (svc newtarr port 30262) keep working unchanged; it now
    # targets the real web port 9705. The metrics port is dropped (no metrics
    # endpoint — see #131).
    - name: http
      port: 30262
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: newtarr-config
  namespace: servarr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
