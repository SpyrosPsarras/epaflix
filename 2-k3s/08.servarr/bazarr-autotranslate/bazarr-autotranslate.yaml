---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr-autotranslate
  namespace: servarr
  labels:
    app: bazarr-autotranslate
  annotations:
    secret.reloader.stakater.com/reload: "bazarr-autotranslate-secret"
spec:
  replicas: 1
  # state.json on the logs PVC is single-writer; avoid two pods scanning at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bazarr-autotranslate
  template:
    metadata:
      labels:
        app: bazarr-autotranslate
    spec:
      containers:
        - name: bazarr-autotranslate
          image: ghcr.io/zelak312/bazarr_autotranslate:latest
          env:
            - name: BAZARR_BASE_URL
              value: "http://bazarr.servarr.svc.cluster.local:6767"
            - name: BAZARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bazarr-autotranslate-secret
                  key: BAZARR_API_KEY
            - name: BASE_LANGUAGES
              value: "en,no"
            - name: TO_LANGUAGES
              value: "el"
            - name: TRANSLATION_REQUEST_TIMEOUT
              value: "900"
            - name: REQUEST_TIMEOUT
              value: "300"
            - name: SEARCH_ROUNDS_BEFORE_TRANSLATE
              value: "3"
            - name: ROUND_SPACING_HOURS
              value: "8"
            - name: TRANSLATE_GRACE_HOURS
              value: "216"
            - name: INTERVAL_BETWEEN_SCANS
              value: "3600"
            - name: LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: logs
              mountPath: /usr/src/app/logs
            # subPath mounts never hot-reload: main.py changes need a pod restart
            - name: main-override
              mountPath: /usr/src/app/main.py
              subPath: main.py
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: main-override
          configMap:
            name: bazarr-autotranslate-main
        - name: logs
          persistentVolumeClaim:
            claimName: bazarr-autotranslate-logs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-autotranslate-logs
  namespace: servarr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
  storageClassName: local-path
