---
# Bazarr Auto-Translate - Automatic subtitle translation
#
# BAZARR_BASE_URL uses internal Service DNS (#752), not the public
# bazarr.epaflix.com hostname. This pod runs on worker-61 and hit the public
# hostname for its hourly wanted-subtitles scan (`/api/movies/wanted`,
# `/api/episodes/wanted`, `/api/movies?radarrid[]=...`) - the one in-cluster
# caller #561 missed, because that fix was scoped from the `?apikey=` log
# sample and this caller authenticates with a header, not a query string.
# Same pattern as #468/#561: internal DNS for the API call, public hostname
# only where a UI needs it (this app has no UI, so no external_url field).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr-autotranslate
  namespace: servarr
  labels:
    app: bazarr-autotranslate
  annotations:
    # Reloader (#299): env-var secretKeyRef consumers don't auto-roll on
    # Secret rotation otherwise. Kept scoped to the exact Secret, not
    # reloader.stakater.com/auto, to avoid surprise reloads from unrelated
    # namespace Secret edits.
    secret.reloader.stakater.com/reload: "bazarr-autotranslate-secret"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bazarr-autotranslate
  template:
    metadata:
      labels:
        app: bazarr-autotranslate
    spec:
      containers:
        - name: bazarr-autotranslate
          image: ghcr.io/zelak312/bazarr_autotranslate:latest
          env:
            - name: BAZARR_BASE_URL
              value: "http://bazarr.servarr.svc.cluster.local:6767"
            - name: BAZARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bazarr-autotranslate-secret
                  key: BAZARR_API_KEY
            - name: BASE_LANGUAGES
              value: "en,no"
            - name: TO_LANGUAGES
              value: "el"
            - name: TRANSLATION_REQUEST_TIMEOUT
              value: "900"
            - name: INTERVAL_BETWEEN_SCANS
              value: "3600"
            - name: LOG_LEVEL
              value: "info"
          volumeMounts:
            - name: logs
              mountPath: /usr/src/app/logs
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: bazarr-autotranslate-logs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-autotranslate-logs
  namespace: servarr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
  storageClassName: local-path
