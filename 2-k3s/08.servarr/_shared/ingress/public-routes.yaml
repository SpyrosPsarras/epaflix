---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seerr-https
  namespace: servarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`seerr.epaflix.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: security-headers
          namespace: traefik-system
        - name: seerr-oidc-login
      services:
        - name: seerr
          port: 5055
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: seerr-oidc-login
  namespace: servarr
spec:
  redirectRegex:
    regex: ^https://seerr\.epaflix\.com/login$
    replacement: https://seerr.epaflix.com/login?provider=seerr
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seerr-http
  namespace: servarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`seerr.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: seerr
          port: 5055
