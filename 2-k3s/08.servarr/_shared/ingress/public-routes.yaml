---
# Public Internet-facing IngressRoutes with Let's Encrypt TLS
#
# NOTE: jellyfin-https / jellyfin-http IngressRoutes intentionally NOT defined
# here. jellyfin.epaflix.com is served by ../../jellyfin/jellyfin-truenas-redirect.yaml,
# which routes to the Jellyfin instance on TrueNAS (192.168.10.200:30013) via
# an Endpoints/Service named `jellyfin-truenas`. Defining them in both files
# breaks kustomize accumulation under ArgoCD.
#
# Seerr - Media Requests. seerr.epaflix.com is the canonical host and targets
# the consolidated `seerr` Service. The legacy jellyseerr.epaflix.com host
# 301-redirects to seerr.epaflix.com (see jellyseerr-to-seerr Middleware below)
# so OIDC works: Authentik's `seerr` provider only allows seerr.epaflix.com
# redirect URIs, so the browser must land on seerr.epaflix.com before login.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seerr-https
  namespace: servarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`seerr.epaflix.com`)
      kind: Rule
      services:
        - name: seerr
          port: 5055
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
---
# HTTP to HTTPS redirect for Seerr
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: seerr-http
  namespace: servarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`seerr.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: seerr
          port: 5055
---
# Middleware: 301-redirect the legacy host jellyseerr.epaflix.com -> seerr.epaflix.com
# (preserves path + query). Required so OIDC login works: the browser must reach
# seerr.epaflix.com before initiating the Authentik flow, otherwise the app builds
# a redirect_uri on jellyseerr.epaflix.com which the `seerr` provider rejects
# (redirect_uri_no_match). Matches both http and https sources.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jellyseerr-to-seerr
  namespace: servarr
spec:
  redirectRegex:
    regex: ^https?://jellyseerr\.epaflix\.com/(.*)
    replacement: https://seerr.epaflix.com/${1}
    permanent: true
---
# Jellyseerr - Legacy domain. Permanent (301) redirect to seerr.epaflix.com.
# No longer backends the app directly; the redirect Middleware short-circuits
# with a 301 before the service is reached (the service entry is required by
# Traefik but is not hit for redirected requests).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyseerr-https
  namespace: servarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`jellyseerr.epaflix.com`)
      kind: Rule
      middlewares:
        - name: jellyseerr-to-seerr
          namespace: servarr
      services:
        - name: seerr
          port: 5055
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
---
# HTTP for Jellyseerr (legacy) - also 301-redirects to https://seerr.epaflix.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyseerr-http
  namespace: servarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`jellyseerr.epaflix.com`)
      kind: Rule
      middlewares:
        - name: jellyseerr-to-seerr
          namespace: servarr
      services:
        - name: seerr
          port: 5055
