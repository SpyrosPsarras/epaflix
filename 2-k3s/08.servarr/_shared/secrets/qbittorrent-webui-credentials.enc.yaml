# qBittorrent WebUI credential (Issue #483).
#
# Consumed by the `orphan-census` CronJob in 2-k3s/maintenance/ - it has to log
# in to the WebUI to enumerate torrents, and `WebUI\LocalHostAuth=true` with no
# `AuthSubnetWhitelist` means there is no unauthenticated path in.
#
# It lives HERE rather than next to the CronJob because CI's "Kustomize build
# (sops-free dirs)" step builds `2-k3s/maintenance` without the age key; a ksops
# generator in that overlay would drop the whole directory out of the gate.
# Cross-App Secret reference is the existing precedent - `newtarr-config-drift`
# already mounts the servarr-owned `newtarr-config-seed`.
#
# Source of truth stays the git-ignored .github/instructions/secrets.yml keys
# `qbittorrent_webui_username` / `qbittorrent_webui_password`. Rotating the WebUI
# password means rotating there, here (`sops <file>`), and in the Cleanuparr
# download-client row (PVC-only, see the #196 section of
# 2-k3s/08.servarr/RECOVERY-newtarr-cleanuparr.md).
apiVersion: v1
kind: Secret
metadata:
    name: qbittorrent-webui-credentials
    namespace: servarr
type: Opaque
stringData:
    QBT_USERNAME: ENC[AES256_GCM,data:nQs//9Mfy5M=,iv:WvPcBP0ZNf+pnVT4dnjmUXsswkxnE/yHmw0FurFfFYY=,tag:5GYX1ujA6m3cxjArHcM+uA==,type:str]
