# ksops generator — decrypts servarr Secret files at render time.
# Decryption performed inside argocd-repo-server via the ksops binary
# (see 2-k3s/11.argocd/helm-values.yaml).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: servarr-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - _shared/secrets/servarr-postgres.enc.yaml
  - _shared/secrets/newtarr-config-seed.enc.yaml
  - _shared/secrets/cleanuparr-blocklist-seed.enc.yaml
  - _shared/secrets/unpackerr-secret.enc.yaml
  - _shared/secrets/bazarr-autotranslate-secret.enc.yaml
  - _shared/secrets/airvpn-credentials.enc.yaml
  - _shared/secrets/airvpn-api-key.enc.yaml
  - _shared/secrets/homarr-secret.enc.yaml
