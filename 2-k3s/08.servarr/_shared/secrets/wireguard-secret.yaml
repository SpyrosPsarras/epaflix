---
# qBittorrent WireGuard VPN Configuration — template only.
#
# Provider: AirVPN (NL3 server) since 2026-05-22. Previous providers were
# ultra.cc Lancer-v2 (until 2026-05-22) and TrueNAS-hosted before that.
# AirVPN provides a single forwarded port (TCP+UDP); the current allocation
# is 39998 — also referenced from the Deployment's ADDITIONAL_PORTS env and
# Service ports, plus qBit's "Port used for incoming connections" set via
# the Web UI.
#
# Secret values live ONLY in .github/instructions/secrets.yml (git-ignored)
# under the `airvpn_*` block. To (re)apply the live Secret without
# committing private material:
#
#   kubectl create secret generic qbittorrent-wireguard \
#     --from-file=wg0.conf=/path/to/wg0.conf \
#     -n servarr --dry-run=client -o yaml | kubectl apply -f -
#
# Template below intentionally keeps PrivateKey / PresharedKey as
# placeholders. Public values (server pubkey, endpoint) are safe in repo.

apiVersion: v1
kind: Secret
metadata:
  name: qbittorrent-wireguard
  namespace: servarr
type: Opaque
stringData:
  wg0.conf: |
    [Interface]
    Address = <AIRVPN_TUNNEL_ADDRESS>
    PrivateKey = <AIRVPN_WG_PRIVATE_KEY>
    MTU = 1320
    DNS = 10.128.0.1

    [Peer]
    PublicKey = PyLCXAQT8KkM4T+dUsOQfn+Ub3pGxfGlxkIApuig+hk=
    PresharedKey = <AIRVPN_WG_PRESHARED_KEY>
    Endpoint = nl3.vpn.airdns.org:1637
    AllowedIPs = 0.0.0.0/0
    PersistentKeepalive = 15
