# Prowlarr API key (Issue #607).
#
# Consumed by the `prowlarr-indexer-health` CronJob in 2-k3s/maintenance/ - it
# polls Prowlarr's /api/v1/health endpoint, which requires X-Api-Key auth like
# every other *arr API.
#
# It lives HERE rather than next to the CronJob because CI's "Kustomize build
# (sops-free dirs)" step builds `2-k3s/maintenance` without the age key; a
# ksops generator in that overlay would drop the whole directory out of the
# gate. Cross-App Secret reference is the existing precedent -
# `orphan-census` already mounts the servarr-owned
# `qbittorrent-webui-credentials` the same way.
#
# Source of truth stays the git-ignored .github/instructions/secrets.yml key
# `prowlarr_api_key`. Rotating the Prowlarr API key means rotating there and
# here (`sops <file>`).
apiVersion: v1
kind: Secret
metadata:
    name: prowlarr-api-key
    namespace: servarr
type: Opaque
stringData:
    apiKey: ENC[AES256_GCM,data:On5bp8euww2daLiwLUrtVi3mC38/tpLILBb1/FiBMqg=,iv:6QEVGvwwp3LhzedYTlqIPyHWtO3hICuk7XDT52Xih9g=,tag:hFrxwwvr/NGs16oNK3rDsA==,type:str]
