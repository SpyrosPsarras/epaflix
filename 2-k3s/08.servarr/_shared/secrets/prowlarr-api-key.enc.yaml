# Prowlarr API key (Issue #607).
#
# Consumed by the `prowlarr-indexer-health` CronJob in 2-k3s/maintenance/ - it
# polls Prowlarr's /api/v1/health endpoint, which requires X-Api-Key auth like
# every other *arr API.
#
# It lives HERE rather than next to the CronJob because CI's "Kustomize build
# (sops-free dirs)" step builds `2-k3s/maintenance` without the age key; a
# ksops generator in that overlay would drop the whole directory out of the
# gate. Cross-App Secret reference is the existing precedent -
# `orphan-census` already mounts the servarr-owned
# `qbittorrent-webui-credentials` the same way.
#
# Source of truth is the credential store
# `.github/instructions/secrets.enc.yaml`, key `prowlarr_api_key` (the old
# plaintext secrets.yml is GONE). Rotating the Prowlarr API key means rotating
# in the store AND here (`sops <file>`) - the two drifted apart once and the
# CronJob 401'd for hours while Radarr kept working, because Radarr stores its
# own copy of the key per indexer. After rotating, verify the three agree:
#
#   sops -d --extract '["prowlarr_api_key"]' .github/instructions/secrets.enc.yaml | sha256sum
#   sops -d 2-k3s/08.servarr/_shared/secrets/prowlarr-api-key.enc.yaml | sed -n 's/^\s*apiKey:\s*//p' | sha256sum
#   kubectl --context epaflix -n servarr exec deploy/prowlarr -- sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /config/config.xml | sha256sum
