# Cleanuparr API key (Issue #606).
#
# Consumed by the `cleanuparr-queuecleaner-health` CronJob in 2-k3s/maintenance/
# - it polls cleanuparr's /api/stats endpoint, which requires X-Api-Key auth
# (cleanuparr's own per-user key, NOT a *arr-style config.xml value).
#
# Unlike the *arr apps, cleanuparr generates this key itself on first run and
# stores it in the `users` table of its SQLite users.db (PVC-only, no env var,
# no config file) - so it is NOT in the credential store
# .github/instructions/secrets.enc.yaml the way prowlarr_api_key is.
# Captured live from the running pod 2026-08-03:
#   kubectl -n servarr exec <cleanuparr-pod> -- \
#     python3 -c "import sqlite3; c=sqlite3.connect('/config/users.db'); \
#     print(c.execute('select api_key from users limit 1').fetchone()[0])"
# Rotating it means regenerating in the cleanuparr UI (Settings > General)
# and re-running the capture above into this file (`sops <file>`). A PVC
# rebuild will also mint a new key even without a manual rotation.
#
# It lives HERE (servarr's ksops-managed secrets), not next to the CronJob,
# for the same cross-App reason as qbittorrent-webui-credentials and the new
# prowlarr-api-key above - CI's sops-free kustomize gate on 2-k3s/maintenance.
