---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: servarr-media-pv
spec:
  capacity:
    storage: 9Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: media-storage
  hostPath:
    path: /mnt/k3s-media
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: servarr-media
  namespace: servarr
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: media-storage
  resources:
    requests:
      storage: 9Ti
