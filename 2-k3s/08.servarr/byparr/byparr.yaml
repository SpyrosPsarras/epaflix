---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: byparr
  namespace: servarr
  labels:
    app: byparr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: byparr
  template:
    metadata:
      labels:
        app: byparr
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: byparr
      containers:
        - name: byparr
          image: ghcr.io/thephaseless/byparr:latest
          env:
            - name: PORT
              value: "8191"
            - name: TZ
              value: "Europe/Oslo"
          ports:
            - containerPort: 8191
              name: http
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 45
            failureThreshold: 24   # ~6 min budget for cold start + first solve
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "2"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: byparr
  namespace: servarr
  labels:
    app: byparr
spec:
  type: ClusterIP
  selector:
    app: byparr
  ports:
    - name: http
      port: 8191
      targetPort: http
