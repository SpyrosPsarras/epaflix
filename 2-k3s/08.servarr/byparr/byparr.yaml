---
# Byparr — Cloudflare-challenge solver for Prowlarr indexers (drop-in
# FlareSolverr-API replacement, exposes the same /v1 endpoint on :8191).
# Replaces FlareSolverr (#275): FlareSolverr could detect but not SOLVE
# 1337x's "Just a moment…" Cloudflare challenge (timeout @60s) → 1337x
# perpetually disabled. Byparr (seleniumbase/Chromium) handles modern
# Cloudflare. Uses Camoufox (Firefox) — CPU/RAM-heavy; /health runs a real
# browser solve, so it needs real CPU headroom and a generous startupProbe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: byparr
  namespace: servarr
  labels:
    app: byparr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: byparr
  template:
    metadata:
      labels:
        app: byparr
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: byparr
      containers:
        - name: byparr
          image: ghcr.io/thephaseless/byparr:latest
          env:
            - name: PORT
              value: "8191"
            - name: TZ
              value: "Europe/Oslo"
          ports:
            - containerPort: 8191
              name: http
          # Camoufox (Firefox) needs more than the default 64Mi /dev/shm.
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          # /health runs a REAL browser solve (Camoufox) — expensive + slow,
          # so: a generous startupProbe gates on the first successful solve
          # (proves Byparr can bypass Cloudflare), then cheap TCP readiness/
          # liveness keep it serving without hammering the browser every probe.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 45
            failureThreshold: 24   # ~6 min budget for cold start + first solve
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "2"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: byparr
  namespace: servarr
  labels:
    app: byparr
spec:
  type: ClusterIP
  selector:
    app: byparr
  ports:
    - name: http
      port: 8191
      targetPort: http
