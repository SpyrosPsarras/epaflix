---
# qBittorrent with its VPN run by a Bluetit native sidecar
#
# Source of truth: live cluster state in `servarr` ns — see project memory
# `project_argocd_servarr` / drift policy: live wins on divergence.
#
# The AirVPN Bluetit sidecar (`airvpn` initContainer, restartPolicy: Always)
# owns the WireGuard tunnel and the iptables network lock. It replaces the
# old `tenseiken/qbittorrent-wireguard` image's built-in wg-quick + the
# postStart iptables hack that used to punch LAN/cluster CIDR holes in its
# default-DROP OUTPUT chain — Bluetit's own `networklockpersist iptables` +
# `allowprivatenetwork yes` (see bluetit-config.yaml) does that instead. The
# app container now runs the official `qbittorrentofficial/qbittorrent-nox`
# image and shares the pod netns with the sidecar, so it no longer touches
# the network itself.
#
# AirVPN credentials live in Secret `airvpn-credentials` (NOT in this repo —
# see secrets.yml + `_shared/secrets/airvpn-credentials.enc.yaml`).
#
# BT listen port: 39998, forwarded by AirVPN account-wide — it follows
# whichever server Bluetit picks, unlike a per-server forward. Declared via
# QBT_TORRENTING_PORT on the app container, so there's no manual WebUI step.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: servarr
  labels:
    app: qbittorrent
spec:
  replicas: 1
  strategy:
    # Recreate — VPN provider allows one session at a time; RollingUpdate
    # would have two pods kick each other off the tunnel.
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 192.168.10.30
          - 1.1.1.1
      initContainers:
        - name: init-sysctls
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              sysctl -w net.ipv4.conf.all.rp_filter=2
              sysctl -w net.ipv4.conf.all.src_valid_mark=1
          securityContext:
            privileged: true
        # Native sidecar (restartPolicy: Always) - starts before the app container
        # and keeps running. Replaces wg-quick inside the old qbittorrent image:
        # Bluetit takes a server whitelist/blacklist and picks an AirVPN-recommended
        # server, which WireGuard alone cannot do.
        - name: airvpn
          image: ghcr.io/spyrospsarras/airvpn-bluetit:latest
          restartPolicy: Always
          env:
            - name: AIRVPN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: airvpn-credentials
                  key: airusername
            - name: AIRVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airvpn-credentials
                  key: airpassword
          volumeMounts:
            - name: bluetit-config
              mountPath: /config
              readOnly: true
            # REQUIRED. Bluetit checks modules.builtin and loads iptable_* and
            # wireguard itself, even though the node already has them loaded.
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
          # Gates the app container: k8s only waits for a sidecar's PROCESS to
          # start, so without this qbittorrent would run for ~15s before the
          # tunnel and the iptables lock exist. Measured on a scratch pod:
          # ~20s from container start to "Connected to AirVPN server".
          startupProbe:
            exec:
              command: ["sh","-c","goldcrest --bluetit-status | grep -q 'Connected to AirVPN server'"]
            periodSeconds: 5
            failureThreshold: 36
            timeoutSeconds: 10
          livenessProbe:
            exec:
              # The connected output contains "Connected to AirVPN server <name>".
              # It does NOT say "Bluetit is connected" - that string never appears.
              # The disconnected form is "Bluetit is not connected", so do not
              # grep for a bare "connected".
              command: ["sh","-c","goldcrest --bluetit-status | grep -q 'Connected to AirVPN server'"]
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                # SYS_MODULE is REQUIRED, not defensive. Without it Bluetit fails
                # with "Error while loading kernel module wireguard (-3)" and never
                # connects, even though the module is already loaded on the node.
                - NET_ADMIN
                - SYS_MODULE
      containers:
        - name: qbittorrent
          # qBittorrent must be bound to the sidecar's tunnel device, tun0 - a
          # second, independent leak guard on top of the network lock, and a
          # strong one: a socket bound to tun0 breaks rather than silently
          # falling back to eth0. This lives in PVC state, NOT here:
          # /config/qBittorrent/config/qBittorrent.conf's Session\Interface,
          # Session\InterfaceName, Connection\Interface and
          # Connection\InterfaceName. The old tenseiken image created wg0 via
          # its internal wg-quick; that device no longer exists, so the conf
          # still pointing at wg0 makes qBittorrent open no listen socket while
          # the WebUI keeps answering (both probes stay green - see plan
          # Task 7). Must be changed to tun0 by hand post-deploy; not yet
          # codified as a SOPS seed (see plan Task 7 follow-up).
          image: qbittorrentofficial/qbittorrent-nox
          env:
            - { name: PUID, value: "568" }
            - { name: PGID, value: "568" }
            - { name: TZ, value: "Europe/Oslo" }
            - { name: QBT_LEGAL_NOTICE, value: "confirm" }
            - { name: QBT_WEBUI_PORT, value: "8080" }
            # Declarative BT port - replaces the old manual "set it in the WebUI" step.
            - { name: QBT_TORRENTING_PORT, value: "39998" }
          ports:
            - containerPort: 8080
              name: webui
            - containerPort: 39998
              name: bt-tcp
              protocol: TCP
            - containerPort: 39998
              name: bt-udp
              protocol: UDP
          livenessProbe:
            httpGet:
              path: /
              port: webui
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: webui
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
          # No longer touches the network - the sidecar owns the tunnel and the
          # lock, so this drops privileged and NET_ADMIN.
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: media
          persistentVolumeClaim:
            claimName: servarr-media
        - name: bluetit-config
          # Plain ConfigMap reference, not a configMapGenerator output - it has
          # no content-hash suffix, so editing the server pool does NOT roll
          # this pod automatically. Follow up with:
          #   kubectl -n servarr rollout restart deploy/qbittorrent
          configMap:
            name: airvpn-bluetit-config
            items:
              - key: bluetit.conf
                path: bluetit.conf
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: servarr
  labels:
    app: qbittorrent
spec:
  type: ClusterIP
  selector:
    app: qbittorrent
  ports:
    - name: webui
      port: 8080
      targetPort: webui
      protocol: TCP
    - name: bt-tcp
      port: 39998
      targetPort: bt-tcp
      protocol: TCP
    - name: bt-udp
      port: 39998
      targetPort: bt-udp
      protocol: UDP
