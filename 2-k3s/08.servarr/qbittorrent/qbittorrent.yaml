---
# qBittorrent with WireGuard VPN
#
# Source of truth: live cluster state in `servarr` ns. Manifest below was
# regenerated from `kubectl get deploy qbittorrent -o yaml` on 2026-05-17
# after ArgoCD adoption surfaced a wholesale divergence — repo had been
# tracking the older OpenVPN/binhex build for a long time, while live had
# already moved to `tenseiken/qbittorrent-wireguard:latest`. Live wins by
# design: see project memory `project_argocd_servarr` / drift policy.
#
# VPN config lives in Secret `qbittorrent-wireguard` (NOT in this repo —
# committed real values would leak; see secrets.yml + the
# `_shared/secrets/wireguard-secret.yaml` template).
#
# Why postStart iptables hack: tenseiken/qbittorrent-wireguard's
# `iptables.sh` installs a default-DROP OUTPUT chain so traffic is
# forced through `wg0`. We need to punch holes for the LAN (192.168.10.0/24)
# and cluster Pod / Service CIDRs (10.42.0.0/16, 10.43.0.0/16) so Pi-hole
# DNS and intra-cluster calls still work.
#
# BT listen port: 39998 (forwarded by AirVPN on nl3.vpn.airdns.org for
# tunnel IP 10.135.227.175, both TCP+UDP). Set qBit's "Connections →
# Port used for incoming connections" to 39998 in the Web UI so the
# bind matches the forwarded port. ADDITIONAL_PORTS below only opens
# the iptables holes; it does not change qBit's listen port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: servarr
  labels:
    app: qbittorrent
spec:
  replicas: 1
  strategy:
    # Recreate — VPN provider allows one session at a time; RollingUpdate
    # would have two pods kick each other off the tunnel.
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 192.168.10.30
          - 1.1.1.1
      initContainers:
        - name: init-sysctls
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              sysctl -w net.ipv4.conf.all.rp_filter=2
              sysctl -w net.ipv4.conf.all.src_valid_mark=1
              sysctl -w net.ipv6.conf.all.disable_ipv6=1
          securityContext:
            privileged: true
      containers:
        - name: qbittorrent
          image: tenseiken/qbittorrent-wireguard:latest
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: TZ
              value: "Europe/Oslo"
            - name: LAN_NETWORK
              value: "192.168.10.0/24,10.42.0.0/16,10.43.0.0/16"
            - name: NAME_SERVERS
              value: "192.168.10.30,1.1.1.1"
            - name: QBT_LEGAL_NOTICE
              value: "confirm"
            - name: VPN_ENABLED
              value: "yes"
            - name: ADDITIONAL_PORTS
              value: "39998"
            # Health-check tweaks (2026-05-25): after AirVPN swap the default
            # ping-1.1.1.1 every 300s with AMOUNT=1 kills the pod on any single
            # transient tunnel drop (~89 restarts in 2d4h). Ping the AirVPN
            # gateway instead (in-tunnel, no upstream ICMP filtering), and
            # require 3 consecutive misses before forcing restart.
            - name: HEALTH_CHECK_HOST
              value: "10.128.0.1"
            - name: HEALTH_CHECK_AMOUNT
              value: "3"
          ports:
            - containerPort: 8080
              name: webui
            - containerPort: 39998
              name: bt-tcp
              protocol: TCP
            - containerPort: 39998
              name: bt-udp
              protocol: UDP
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Wait for iptables.sh to finish setting up the DROP policy
                    until iptables -L OUTPUT -n 2>/dev/null | grep -q 'policy DROP'; do sleep 2; done
                    # Insert ACCEPT rules at position 1 for all LAN_NETWORK subnets
                    # so Pi-hole DNS (192.168.10.30) and cluster traffic are not blocked.
                    # Using -I (insert) ensures these rules take priority over the DROP policy.
                    iptables -I OUTPUT 1 -d 192.168.10.0/24 -j ACCEPT
                    iptables -I INPUT  1 -s 192.168.10.0/24 -j ACCEPT
                    iptables -I OUTPUT 2 -d 10.42.0.0/16 -j ACCEPT
                    iptables -I INPUT  2 -s 10.42.0.0/16 -j ACCEPT
                    iptables -I OUTPUT 3 -d 10.43.0.0/16 -j ACCEPT
                    iptables -I INPUT  3 -s 10.43.0.0/16 -j ACCEPT
          livenessProbe:
            httpGet:
              path: /
              port: webui
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: webui
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
            runAsUser: 0
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: wireguard-config
              mountPath: /config/wireguard
              readOnly: true
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: downloads
          persistentVolumeClaim:
            claimName: servarr-media-downloads
        - name: wireguard-config
          secret:
            secretName: qbittorrent-wireguard
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: servarr
  labels:
    app: qbittorrent
spec:
  type: ClusterIP
  selector:
    app: qbittorrent
  ports:
    - name: webui
      port: 8080
      targetPort: webui
      protocol: TCP
    - name: bt-tcp
      port: 39998
      targetPort: bt-tcp
      protocol: TCP
    - name: bt-udp
      port: 39998
      targetPort: bt-udp
      protocol: UDP
