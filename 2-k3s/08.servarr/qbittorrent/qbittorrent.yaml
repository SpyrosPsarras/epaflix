---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  annotations:
    secret.reloader.stakater.com/reload: "airvpn-credentials"
  namespace: servarr
  labels:
    app: qbittorrent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
      initContainers:
        - name: init-sysctls
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              sysctl -w net.ipv4.conf.all.rp_filter=2
              sysctl -w net.ipv4.conf.all.src_valid_mark=1
          securityContext:
            privileged: true
        - name: init-vpn-picker-shared
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /media-root/.vpn-picker
              mkdir -p /media-root/.vpn-picker/verdicts
              test -d /media-root/.vpn-picker
              test -d /media-root/.vpn-picker/verdicts
          volumeMounts:
            - name: media
              mountPath: /media-root
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: seed-webapi-key
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              conf=/config/qBittorrent/config/qBittorrent.conf
              key_file=/seed/QBT_WEBAPI_KEY

              [ -f "$key_file" ] || { echo "WebAPI key seed is missing" >&2; exit 1; }
              key_size=$(wc -c < "$key_file" | tr -d '[:space:]')
              [ "$key_size" = 32 ] || { echo "WebAPI key seed has invalid length" >&2; exit 1; }
              [ "$(dd if="$key_file" bs=1 count=4 2>/dev/null)" = "qbt_" ] \
                || { echo "WebAPI key seed has invalid prefix" >&2; exit 1; }

              if [ -e "$conf" ] && grep -q '^WebUI\\APIKey=' "$conf"; then
                echo "skip (exists): WebUI\\APIKey"
                exit 0
              fi

              mkdir -p "$(dirname "$conf")"
              if [ ! -e "$conf" ]; then
                umask 077
                {
                  printf '[Preferences]\n'
                  printf 'WebUI\\APIKey='
                  cat "$key_file"
                  printf '\n'
                } > "$conf"
                chown 568:568 "$conf"
                echo "seeded: WebUI\\APIKey in new qBittorrent.conf"
                exit 0
              fi

              tmp="${conf}.api-key-tmp"
              trap 'rm -f "$tmp"' EXIT
              cp -p "$conf" "$tmp"
              in_preferences=0
              inserted=0
              {
                while IFS= read -r line || [ -n "$line" ]; do
                  if [ "$line" = '[Preferences]' ]; then
                    in_preferences=1
                    printf '%s\n' "$line"
                    continue
                  fi
                  case "$line" in
                    \[*\])
                      if [ "$in_preferences" = 1 ] && [ "$inserted" = 0 ]; then
                        printf 'WebUI\\APIKey='
                        cat "$key_file"
                        printf '\n'
                        inserted=1
                      fi
                      in_preferences=0
                      ;;
                  esac
                  printf '%s\n' "$line"
                done < "$conf"

                if [ "$in_preferences" = 1 ] && [ "$inserted" = 0 ]; then
                  printf 'WebUI\\APIKey='
                  cat "$key_file"
                  printf '\n'
                  inserted=1
                elif [ "$inserted" = 0 ]; then
                  printf '\n[Preferences]\nWebUI\\APIKey='
                  cat "$key_file"
                  printf '\n'
                  inserted=1
                fi
              } > "$tmp"
              [ "$inserted" = 1 ] || { echo "failed to seed WebAPI key" >&2; exit 1; }
              mv "$tmp" "$conf"
              trap - EXIT
              echo "seeded: missing WebUI\\APIKey in existing qBittorrent.conf"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: webapi-key-seed
              mountPath: /seed
              readOnly: true

        - name: airvpn
          image: ghcr.io/spyrospsarras/airvpn-bluetit:latest
          restartPolicy: Always
          env:
            - name: AIRVPN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: airvpn-credentials
                  key: airusername
            - name: AIRVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airvpn-credentials
                  key: airpassword
          volumeMounts:
            - name: bluetit-config
              mountPath: /config
              readOnly: true
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: dbus
              mountPath: /run/dbus
          startupProbe:
            exec:
              command: ["sh","-c","goldcrest --bluetit-status | grep -q 'Connected to AirVPN server' && ping -c 2 -W 2 10.128.0.1 >/dev/null 2>&1"]
            periodSeconds: 5
            failureThreshold: 36
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["sh","-c","goldcrest --bluetit-status | grep -q 'Connected to AirVPN server' && ping -c 2 -W 2 10.128.0.1 >/dev/null 2>&1"]
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE

        - name: init-bind-interface
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              conf=/config/qBittorrent/config/qBittorrent.conf
              [ -f "$conf" ] || { echo "no conf yet, first run - qBittorrent will create it"; exit 0; }
              if grep -qE '^(Session|Connection)\\Interface(Name)?=tun0$' "$conf" \
                 && ! grep -qE '^(Session|Connection)\\Interface(Name)?=(wg0|eth0)$' "$conf"; then
                echo "already bound to tun0, nothing to do"; exit 0
              fi
              cp "$conf" "$conf.bak-$(date +%s)"
              sed -i -E 's/^(Session|Connection)\\Interface=.*/\1\\Interface=tun0/; s/^(Session|Connection)\\InterfaceName=.*/\1\\InterfaceName=tun0/' "$conf"
              echo "rebound qBittorrent to tun0:"
              grep -E '^(Session|Connection)\\Interface(Name)?=' "$conf"
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: qbittorrent
          image: qbittorrentofficial/qbittorrent-nox
          env:
            - { name: PUID, value: "568" }
            - { name: PGID, value: "568" }
            - { name: TZ, value: "Europe/Oslo" }
            - { name: QBT_LEGAL_NOTICE, value: "confirm" }
            - { name: QBT_WEBUI_PORT, value: "8080" }
            - { name: QBT_TORRENTING_PORT, value: "39998" }
          ports:
            - containerPort: 8080
              name: webui
            - containerPort: 39998
              name: bt-tcp
              protocol: TCP
            - containerPort: 39998
              name: bt-udp
              protocol: UDP
          livenessProbe:
            httpGet:
              path: /
              port: webui
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: webui
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media

        - name: agent
          image: ghcr.io/spyrospsarras/airvpn-bluetit:latest
          command:
            - /bin/sh
            - -c
            - >-
              /agent-entrypoint.sh ||
              { echo 'agent-entrypoint.sh missing or failed to run - agent disabled, see #617' >&2;
              exec sleep infinity; }
          env:
            - { name: TZ, value: "Europe/Oslo" }
            - name: AIRVPN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: airvpn-credentials
                  key: airusername
            - name: AIRVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airvpn-credentials
                  key: airpassword
            - { name: VPN_AGENT_DRY_RUN, value: "false" }
            - { name: VPN_AGENT_RANKING_PATH, value: "/media/.vpn-picker/ranking.json" }
            - { name: VPN_AGENT_VERDICT_DIR, value: "/vpn-picker-verdicts" }
            - { name: VPN_AGENT_CACHE_PATH, value: "/var/cache/vpn-agent/ranking.json" }
            - { name: VPN_AGENT_AIR_KEY, value: "Default" }
            - { name: VPN_AGENT_BAND, value: "5" }
            - { name: VPN_AGENT_PROBE_TARGET, value: "10.128.0.1" }
            - { name: VPN_AGENT_PROBE_COUNT, value: "50" }
            - { name: VPN_AGENT_PROBE_INTERVAL_SECONDS, value: "60" }
            - { name: VPN_AGENT_BAD_LOSS_PCT, value: "5" }
            - { name: VPN_AGENT_BAD_WINDOWS, value: "3" }
            - { name: VPN_AGENT_COOLDOWN_SECONDS, value: "21600" }
            - { name: VPN_AGENT_MAX_SWITCHES_PER_DAY, value: "3" }
            - { name: VPN_AGENT_RECOVERY_BUDGET_SECONDS, value: "120" }
            - { name: VPN_AGENT_QUICK_RESERVE_SECONDS, value: "35" }
            - { name: VPN_AGENT_JITTER_SECONDS, value: "30" }
          ports:
            - containerPort: 8081
              name: agent-metrics
          volumeMounts:
            - name: dbus
              mountPath: /run/dbus
            - name: media
              mountPath: /media
              readOnly: true
            - name: media
              mountPath: /vpn-picker-verdicts
              subPath: .vpn-picker/verdicts
            - name: agent-cache
              mountPath: /var/cache/vpn-agent
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          securityContext:
            runAsUser: 0
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: webapi-key-seed
          secret:
            secretName: qbittorrent-webapi-key
            items:
              - key: QBT_WEBAPI_KEY
                path: QBT_WEBAPI_KEY
        - name: media
          persistentVolumeClaim:
            claimName: servarr-media
        - name: dbus
          emptyDir: {}
        - name: agent-cache
          emptyDir: {}
        - name: bluetit-config
          configMap:
            name: airvpn-bluetit-config
            items:
              - key: bluetit.conf
                path: bluetit.conf
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: servarr
  labels:
    app: qbittorrent
spec:
  type: ClusterIP
  selector:
    app: qbittorrent
  ports:
    - name: webui
      port: 8080
      targetPort: webui
      protocol: TCP
    - name: bt-tcp
      port: 39998
      targetPort: bt-tcp
      protocol: TCP
    - name: bt-udp
      port: 39998
      targetPort: bt-udp
      protocol: UDP
    - name: agent-metrics
      port: 8081
      targetPort: agent-metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: qbittorrent-vpn-agent
  namespace: servarr
  labels:
    app: qbittorrent
spec:
  namespaceSelector:
    matchNames:
      - servarr
  selector:
    matchLabels:
      app: qbittorrent
  endpoints:
    - port: agent-metrics
      path: /metrics
      interval: 60s
