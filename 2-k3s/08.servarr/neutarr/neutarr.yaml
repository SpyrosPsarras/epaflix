---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neutarr
  namespace: servarr
  labels:
    app: neutarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neutarr
  template:
    metadata:
      labels:
        app: neutarr
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: neutarr
      initContainers:
        - name: seed-config
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /config/scheduling
              for f in /seed/*; do
                [ -f "$f" ] || continue
                name=$(basename "$f")
                if [ "$name" = "scheduling-list.json" ]; then
                  dest=/config/scheduling/list.json
                else
                  dest=/config/$name
                fi
                if [ -e "$dest" ]; then
                  echo "skip (exists): $dest"
                else
                  cp "$f" "$dest" && echo "seeded: $dest"
                fi
              done
              chown -R 568:568 /config
          volumeMounts:
            - name: config
              mountPath: /config
            - name: seed
              mountPath: /seed
              readOnly: true
        - name: stateful-void-init
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e
              for a in sonarr radarr lidarr readarr whisparr eros; do
                mkdir -p "/stateful-void/$a"
              done
              now=$(date +%s)
              printf '{"created_at":%s,"expires_at":%s}\n' "$now" "$((now + 604800))" \
                > /stateful-void/lock.json
              chown -R 568:568 /stateful-void
              echo "stateful-void prepared"
          volumeMounts:
            - name: stateful-void
              mountPath: /stateful-void
      containers:
        - name: neutarr
          image: iampuid0/neutarr:1.11.1
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: TZ
              value: "Europe/Oslo"
            - name: UMASK
              value: "002"
            - name: STATEFUL_DIR
              value: /stateful-void
          ports:
            - containerPort: 9705
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: stateful-void
              mountPath: /stateful-void
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: neutarr-config
        - name: seed
          secret:
            secretName: neutarr-config-seed
        - name: stateful-void
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: neutarr
  namespace: servarr
  labels:
    app: neutarr
spec:
  type: ClusterIP
  selector:
    app: neutarr
  ports:
    - name: http
      port: 30262
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neutarr-config
  namespace: servarr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
