---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jellyfin-metadata-healer
  namespace: servarr
  labels:
    app: jellyfin-metadata-healer
spec:
  schedule: "0 3 * * 6"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: jellyfin-metadata-healer
        spec:
          restartPolicy: Never
          containers:
            - name: healer
              image: python:3.13-alpine
              command: ["python3", "-u", "/scripts/metadata-healer.py"]
              env:
                - name: JELLYFIN_URL
                  value: http://jellyfin-truenas.servarr.svc.cluster.local:30013
                - name: JELLYFIN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: jellyfin-metadata-healer
                      key: apiKey
              resources:
                requests:
                  memory: 32Mi
                  cpu: 10m
                limits:
                  memory: 128Mi
                  cpu: 200m
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: jellyfin-metadata-healer-script
                defaultMode: 0555
