---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-https
  namespace: servarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`jellyfin.epaflix.com`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: traefik-system
      services:
        - name: jellyfin
          port: 8096
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-http
  namespace: servarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`jellyfin.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: jellyfin
          port: 8096
