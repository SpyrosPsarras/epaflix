---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-truenas
  namespace: servarr
  labels:
    app: jellyfin-truenas
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 30013
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jellyfin-truenas
  namespace: servarr
  labels:
    kubernetes.io/service-name: jellyfin-truenas
addressType: IPv4
ports:
  - name: http
    port: 30013
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.10.200
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-https
  namespace: servarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`jellyfin.epaflix.com`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: traefik-system
      services:
        - name: jellyfin-truenas
          port: 30013
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-http
  namespace: servarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`jellyfin.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: jellyfin-truenas
          port: 30013
