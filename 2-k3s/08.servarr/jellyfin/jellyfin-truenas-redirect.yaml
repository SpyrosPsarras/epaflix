# Redirect jellyfin.epaflix.com to TrueNAS Jellyfin (192.168.10.200:30013)
#
# This is automatically applied by deploy.sh to ensure persistence across reboots.
# The Jellyfin pod runs in k3s but jellyfin.epaflix.com routes to TrueNAS.
#
# To revert to k3s Jellyfin:
#   kubectl delete -f jellyfin-truenas-redirect.yaml
#   kubectl apply -f ../_shared/ingress/public-routes.yaml
#
# This creates an Endpoints/Service pointing to TrueNAS and overrides the IngressRoute
---
# Headless service for the external TrueNAS endpoint.
# No selector → backing endpoints come from the EndpointSlice below.
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-truenas
  namespace: servarr
  labels:
    app: jellyfin-truenas
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 30013
      protocol: TCP
---
# EndpointSlice instead of the legacy Endpoints object: ArgoCD's default
# resource.exclusions list silently drops `Endpoints` (k8s manages them
# automatically for Services with selectors), which produced an
# `ExcludedResourceWarning` on the Application. EndpointSlice is the v1
# replacement and is tracked normally.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jellyfin-truenas
  namespace: servarr
  labels:
    # Link to Service `jellyfin-truenas` (required for kube-proxy / Traefik
    # to discover the IP via Service name).
    kubernetes.io/service-name: jellyfin-truenas
addressType: IPv4
ports:
  - name: http
    port: 30013
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.10.200
    conditions:
      ready: true
---
# Override the HTTPS IngressRoute to point to TrueNAS
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-https
  namespace: servarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`jellyfin.epaflix.com`)
      kind: Rule
      services:
        - name: jellyfin-truenas
          port: 30013
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
---
# Override the HTTP IngressRoute (redirect to HTTPS)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin-http
  namespace: servarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`jellyfin.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: jellyfin-truenas
          port: 30013
