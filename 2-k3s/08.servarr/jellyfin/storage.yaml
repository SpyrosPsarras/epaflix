apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gpu-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-config-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gpu-local
  claimRef:
    namespace: servarr
    name: jellyfin-config
  local:
    path: /srv/jellyfin/config
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-worker-64
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: servarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gpu-local
  volumeName: jellyfin-config-pv
  resources:
    requests:
      storage: 10Gi
