---
apiVersion: v1
kind: ConfigMap
metadata:
  name: soularr-config
  namespace: servarr
data:
  config.ini: |
    [Lidarr]
    api_key = ${LIDARR_API_KEY}
    host_url = http://lidarr:8686
    download_dir = /media/downloads/soulseek
    disable_sync = False

    [Slskd]
    api_key = unused-no-auth-placeholder
    host_url = http://slskd:5030
    url_base = /
    download_dir = /media/downloads/soulseek
    delete_searches = False
    stalled_timeout = 3600
    remote_queue_timeout = 300

    [Release Settings]
    use_selected_lidarr_release = False
    use_most_common_tracknum = True
    allow_multi_disc = True
    accepted_countries = Europe,Japan,United Kingdom,United States,[Worldwide],Australia,Canada
    skip_region_check = False
    accepted_formats = CD,Digital Media,Vinyl

    [Search Settings]
    search_timeout = 5000
    maximum_peer_queue = 50
    minimum_peer_upload_speed = 0
    minimum_filename_match_ratio = 0.8
    minimum_search_interval = 5
    search_retry_wait_hours = 0
    allowed_filetypes = mp3 320,flac,flac 24/44.1,flac 24/48,flac 24/96,flac 24/192
    ignored_users =
    album_prepend_artist = False
    search_type = incrementing_page
    number_of_albums_to_grab = 10
    title_blacklist =
    search_blacklist =
    search_source = missing
    failed_import_denylist = True
    ignore_failed_users = False
    failed_user_ignore_hours = 168

    [Download Settings]
    download_filtering = True
    use_extension_whitelist = False
    extensions_whitelist = lrc,nfo,txt
    rename_download_folders = True

    [Logging]
    level = INFO
    # https://docs.python.org/3/library/logging.html#logrecord-attributes
    format = [%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s: %(message)s
    # https://docs.python.org/3/library/time.html#time.strftime
    datefmt = %Y-%m-%dT%H:%M:%S%z
    # Enable logging to a file in addition to stdout
    log_to_file = False
    # Log filename (resolved relative to the data/var directory)
    log_file = soularr.log
    # Maximum log file size in bytes before rotation (default: 1MB)
    max_bytes = 1048576
    # Number of rotated log files to keep
    backup_count = 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soularr
  annotations:
    secret.reloader.stakater.com/reload: "music-stack"
  namespace: servarr
  labels:
    app: soularr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: soularr
  template:
    metadata:
      labels:
        app: soularr
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
      containers:
        - name: soularr
          image: mrusse08/soularr
          command: ["tini", "-g", "--", "/app/run.sh"]
          args: ["--config-dir", "/config", "--var-dir", "/data"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - { name: TZ, value: Europe/Oslo }
            - { name: SCRIPT_INTERVAL, value: "300" }
            - { name: WEBUI_ENABLED, value: "false" }
            - name: LIDARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: music-stack
                  key: lidarr-api-key
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: media
              mountPath: /media/downloads
              subPath: downloads
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: soularr-config
        - name: data
          persistentVolumeClaim:
            claimName: soularr-data-pithari
        - name: media
          persistentVolumeClaim:
            claimName: servarr-media
