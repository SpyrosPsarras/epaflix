---
# Cleanuparr - Public Internet-facing IngressRoutes with Let's Encrypt TLS,
# fronted by Authentik forward-auth SSO (issue #176, servarr forward-auth rollout).
#
# Cleanuparr is a caller-only / pure-UI app: nothing calls into it, so there is
# NO inbound API integration and therefore NO /api bypass route. The WHOLE host
# is gated by the authentik-forwardauth middleware (Authentik embedded outpost,
# provider + app slug `cleanuparr`), authorized by the "Servarr users" group --
# same whole-host pattern as newtarr.
#
# Pattern mirrors 05.traefik-deployment/ingress/traefik-dashboard-sso.yaml:
#   - app route priority:10 + authentik-forwardauth middleware
#   - outpost route priority:15 matching PathPrefix(/outpost.goauthentik.io/)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cleanuparr-https
  namespace: servarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cleanuparr.epaflix.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: authentik-forwardauth
          namespace: traefik-system
      services:
        - name: cleanuparr
          port: 30263
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
---
# Outpost route - handles auth callback on cleanuparr.epaflix.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cleanuparr-outpost-https
  namespace: servarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cleanuparr.epaflix.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 15
      services:
        - name: authentik-server
          namespace: app-authentik
          port: 80
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
---
# HTTP to HTTPS redirect for Cleanuparr
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cleanuparr-http
  namespace: servarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`cleanuparr.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: cleanuparr
          port: 30263
