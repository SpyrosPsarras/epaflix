---
# Cleanuparr - Automated cleanup for *arr apps
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleanuparr
  namespace: servarr
  labels:
    app: cleanuparr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cleanuparr
  template:
    metadata:
      labels:
        app: cleanuparr
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cleanuparr
      initContainers:
        # Seed the /config PVC with the codified Sonarr custom blocklist
        # (issue #138 — the seriesId 40 S04E13 re-arm guard). Cleanuparr v2+
        # keeps its config in SQLite (cleanuparr.db), so the only file-seedable
        # artifact is the flat custom-blocklist-sonarr.txt referenced by the
        # content-blocker sonarr_blocklist_path DB row. This initContainer
        # restores that file on a fresh local-path PVC; the DB pointer itself is
        # a one-time manual UI step (see RECOVERY-newtarr-cleanuparr.md).
        #
        # IDEMPOTENT + NON-CLOBBERING: each seed file is copied only when the
        # destination does NOT already exist. On a populated PVC it is skipped
        # (no-op) so we never clobber a live, possibly edited, blocklist.
        - name: seed-config
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              set -e
              for f in /seed/*; do
                [ -f "$f" ] || continue
                name=$(basename "$f")
                dest=/config/$name
                if [ -e "$dest" ]; then
                  echo "skip (exists): $dest"
                else
                  cp "$f" "$dest" && echo "seeded: $dest"
                fi
              done
              chown -R 568:568 /config
          volumeMounts:
            - name: config
              mountPath: /config
            - name: seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: cleanuparr
          image: ghcr.io/cleanuparr/cleanuparr:latest
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: TZ
              value: "Europe/Oslo"
            - name: PORT
              value: "30263"
            - name: UMASK
              value: "002"
          ports:
            - containerPort: 30263
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            # Single unified media mount (issue #195 / #240): the whole export
            # tree (downloads + library) is one NFS submount, so Cleanuparr can
            # see hardlinks across downloads and library (nlink>1). The
            # unlinked-orphan rule itself stays DISABLED (in-app DB config);
            # Cleanuparr acts on downloads via the qbt API, not by deleting
            # library files on disk.
            - name: media
              mountPath: /media
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: cleanuparr-config
        - name: media
          persistentVolumeClaim:
            claimName: servarr-media
        # SOPS-encrypted Sonarr custom-blocklist seed (issue #138 — the
        # seriesId 40 S04E13 re-arm guard), reconciled by the servarr ksops
        # generator from _shared/secrets/cleanuparr-blocklist-seed.enc.yaml.
        # Consumed only by the seed-config initContainer.
        - name: seed
          secret:
            secretName: cleanuparr-blocklist-seed
---
apiVersion: v1
kind: Service
metadata:
  name: cleanuparr
  namespace: servarr
  labels:
    app: cleanuparr
spec:
  type: ClusterIP
  selector:
    app: cleanuparr
  ports:
    - name: http
      port: 30263
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cleanuparr-config
  namespace: servarr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
