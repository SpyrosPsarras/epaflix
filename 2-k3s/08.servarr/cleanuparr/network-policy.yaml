apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cleanuparr-ingress
  namespace: servarr
spec:
  podSelector:
    matchLabels:
      app: cleanuparr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector: {}
      ports:
        - port: 30263
          protocol: TCP
