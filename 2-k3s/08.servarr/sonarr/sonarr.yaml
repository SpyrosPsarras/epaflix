---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  annotations:
    secret.reloader.stakater.com/reload: "servarr-postgres"
    # SSA retains the legacy password Secret reference owned by kubectl-replace.
    argocd.argoproj.io/sync-options: ServerSideApply=false
  namespace: servarr
  labels:
    app: sonarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: sonarr
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: TZ
              value: "Europe/Oslo"
            - name: SONARR__POSTGRES__HOST
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: sonarr-host
            - name: SONARR__POSTGRES__PORT
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: sonarr-port
            - name: SONARR__POSTGRES__MAINDB
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: sonarr-database
            - name: SONARR__POSTGRES__LOGDB
              value: "sonarr-log"
            - name: SONARR__POSTGRES__USER
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: sonarr-user
            # Sonarr v4 logs this connection string before console cleansing.
            # Empty Password serializes without a value; Npgsql then uses the passfile.
            - name: SONARR__POSTGRES__PASSWORD
              value: ""
              # Client-side apply uses null to remove the legacy Secret reference.
              valueFrom: null
            - name: PGPASSFILE
              value: /run/sonarr-postgres/pgpass
          ports:
            - containerPort: 8989
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
            - name: postgres-passfile
              mountPath: /run/sonarr-postgres
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config-iscsi
        - name: media
          persistentVolumeClaim:
            claimName: servarr-media
        - name: postgres-passfile
          secret:
            secretName: servarr-postgres
            # root:fsGroup 568, readable by Sonarr but not other pod users.
            defaultMode: 0440
            items:
              - key: sonarr-pgpass
                path: pgpass
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: servarr
  labels:
    app: sonarr
spec:
  type: ClusterIP
  selector:
    app: sonarr
  ports:
    - name: http
      port: 8989
      targetPort: http
