apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lidarr-ingress
  namespace: servarr
spec:
  podSelector:
    matchLabels:
      app: lidarr
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8686
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: prowlarr
        - podSelector:
            matchLabels:
              app: cleanuparr
        - podSelector:
            matchLabels:
              app: configarr
        - podSelector:
            matchLabels:
              app: digarr
      ports:
        - port: 8686
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: discord-media
          podSelector:
            matchLabels:
              app.kubernetes.io/name: openclaw
      ports:
        - port: 8686
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9708
          protocol: TCP
