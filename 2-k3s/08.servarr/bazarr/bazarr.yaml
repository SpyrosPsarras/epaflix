---
# Bazarr - Subtitle Manager (Development Branch)
#
# Sonarr/Radarr connection settings (#465) - PVC-only, NOT git-seeded, verify
# after any config PVC rebuild (they come back empty/default otherwise):
#   sonarr: ip=sonarr.servarr.svc.cluster.local port=8989 ssl=false
#   radarr: ip=radarr.servarr.svc.cluster.local port=7878 ssl=false
#   sonarr.apikey / radarr.apikey = secrets.enc.yaml `sonarr_api_key` /
#     `radarr_api_key` - so bazarr is a consumer on every *arr key rotation
#     (#712, see the rotation runbook in 2-k3s/08.servarr/README.md).
# Live in /config/config/config.yaml on the bazarr pod, under `sonarr:`/`radarr:`.
# Why internal Service DNS and not the public *.epaflix.com hostname: bazarr's
# SignalR client has no Authentik session, so /signalr/negotiate on the public
# host returns a 302 (Authentik login) that bazarr can't parse as JSON -> the
# SignalR feed dies in a loop (20 restarts/4d10h, confirmed 2026-07-26, #466).
# /api/v3 calls kept working the whole time, because back then a priority-20
# `/api` bypass still existed on the public host, which is why it looked
# half-healthy. That bypass is gone since #296 (2026-08-10), so today the
# public host would fail bazarr on every path instead of only /signalr - the
# same conclusion, reached faster. See 2-k3s/08.servarr/README.md for the
# general in-cluster-DNS policy this follows (#465, #466, #468).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: servarr
  labels:
    app: bazarr
  annotations:
    # Reloader (#299): rolls on servarr-postgres rotation (shared by
    # bazarr/lingarr/prowlarr/radarr/seerr, so all 5 restart together on a
    # credential change — accepted, see PR for the tradeoff).
    secret.reloader.stakater.com/reload: "servarr-postgres"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: bazarr
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
      containers:
        - name: bazarr
          image: lscr.io/linuxserver/bazarr:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: TZ
              value: "Europe/Oslo"
            # PostgreSQL configuration
            - name: POSTGRES_ENABLED
              value: "true"
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: bazarr-host
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: bazarr-port
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: bazarr-database
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: bazarr-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: servarr-postgres
                  key: bazarr-password
            - name: PGSSLCERT
              value: "/tmp/postgresql.crt"
          ports:
            - containerPort: 6767
              name: http
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "2000m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bazarr-config
        - name: media
          persistentVolumeClaim:
            claimName: servarr-media
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr
  namespace: servarr
  labels:
    app: bazarr
spec:
  type: ClusterIP
  selector:
    app: bazarr
  ports:
    - name: http
      port: 6767
      targetPort: http
