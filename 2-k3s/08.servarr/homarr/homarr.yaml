---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: servarr
  labels:
    app: homarr
  annotations:
    secret.reloader.stakater.com/reload: "homarr-secret"
spec:
  replicas: 1
  strategy:
    type: Recreate   # Single-writer; avoid double-writer races on config volume
  selector:
    matchLabels:
      app: homarr
  template:
    metadata:
      labels:
        app: homarr
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: homarr
      securityContext:
        fsGroup: 568
      containers:
        - name: homarr
          image: ghcr.io/homarr-labs/homarr:latest
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: TZ
              value: "Europe/Oslo"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: homarr-secret
                  key: SECRET_ENCRYPTION_KEY
          ports:
            - containerPort: 7575
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /appdata
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: homarr
  namespace: servarr
  labels:
    app: homarr
spec:
  type: ClusterIP
  selector:
    app: homarr
  ports:
    - name: http
      port: 7575
      targetPort: http
