---
# Homarr - Dashboard
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  namespace: servarr
  labels:
    app: homarr
spec:
  replicas: 1
  strategy:
    type: Recreate   # Single-writer; avoid double-writer races on config volume
  selector:
    matchLabels:
      app: homarr
  template:
    metadata:
      labels:
        app: homarr
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: homarr
      # No runAsUser/runAsGroup: entrypoint.sh must start as root to chown
      # /app + nginx dirs to PUID/PGID, then su-execs to 568 itself (matches
      # the upstream homarr-labs Helm chart's empty securityContext).
      securityContext:
        fsGroup: 568
      containers:
        - name: homarr
          image: ghcr.io/homarr-labs/homarr:latest
          env:
            - name: PUID
              value: "568"
            - name: PGID
              value: "568"
            - name: TZ
              value: "Europe/Oslo"
            # V8's default old-space ceiling auto-scales off the cgroup memory
            # limit (observed ~258MB heap on a 512Mi limit) with no margin for
            # RSS overhead - the boot-time ingest of ~28,164 icons blows past
            # it every time the process starts. Pin the heap explicitly to
            # ~75% of the limit below instead of trusting auto-detection.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=1536"
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: homarr-secret
                  key: SECRET_ENCRYPTION_KEY
          ports:
            - containerPort: 7575
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /appdata
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              # 512Mi was heap-OOMing on every boot during the icon ingest
              # (see NODE_OPTIONS above). 2Gi matches the sibling Next.js app
              # (seerr: 256Mi/2Gi) and clears the ingest with headroom.
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: homarr
  namespace: servarr
  labels:
    app: homarr
spec:
  type: ClusterIP
  selector:
    app: homarr
  ports:
    - name: http
      port: 7575
      targetPort: http
