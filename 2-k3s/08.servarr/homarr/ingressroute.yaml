---
# Homarr - Public Internet-facing IngressRoutes with Let's Encrypt TLS,
# fronted by Authentik forward-auth SSO (issue #176, servarr forward-auth rollout).
#
# Homarr is a PURE-UI dashboard: nothing calls it programmatically, so the
# WHOLE host is gated by the authentik-forwardauth middleware (Authentik
# embedded outpost, "Servarr users" group) - there is NO /api bypass route.
# This mirrors the newtarr whole-host gating pattern.
#
# Pattern mirrors 05.traefik-deployment/ingress/traefik-dashboard-sso.yaml:
#   - app route priority:10 + authentik-forwardauth middleware
#   - outpost route priority:15 matching PathPrefix(/outpost.goauthentik.io/)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homarr-https
  namespace: servarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`homarr.epaflix.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: security-headers
          namespace: traefik-system
        - name: authentik-forwardauth
          namespace: traefik-system
      services:
        - name: homarr
          port: 7575
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
---
# Outpost route - handles auth callback on homarr.epaflix.com
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homarr-outpost-https
  namespace: servarr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`homarr.epaflix.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 15
      services:
        - name: authentik-server
          namespace: app-authentik
          port: 80
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
---
# HTTP to HTTPS redirect for Homarr
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homarr-http
  namespace: servarr
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`homarr.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: homarr
          port: 7575
