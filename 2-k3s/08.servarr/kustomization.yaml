  - name: ghcr.io/hotio/unpackerr
    digest: sha256:09ddde42bac0282114bff354fa015f3611582d21ead10b5f06ae40a0b40934a8
  - name: jellyfin/jellyfin
    digest: sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
  - name: ghcr.io/ajnart/homarr
    digest: sha256:e103abadfb527186af5b4bd43df4eff7c67afa5cd4df8e65fa97910c8840b2a9
  - name: ghcr.io/zelak312/bazarr_autotranslate
    digest: sha256:5388463f8e45320c00a472763a8e0fb4584a255d6d31b98f9063b9eb5cada5cf
  - name: lscr.io/linuxserver/bazarr
    digest: sha256:4b5e510042bf471c8bafab89cada9774fba2fb25f16ec64235151cacbe847c10
