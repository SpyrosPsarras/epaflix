  # TEMP OVERRIDE (batch-contract, see images/lingarr/README.md): build of upstream main
  # 28f6a19 + images/lingarr/batch-contract.patch. Upstream's chat batch path published
  # untranslated subtitles as translated (522 positions kept in English in 3h, 2026-09-13),
  # and its schema-less fallback crashed with NullReferenceException on null model content
  # (98 "All configured batch translation services failed." deaths 09-12..09-15, the signal
  # behind the lingarr-drain-watch failures that kept the maintenance App Degraded). The
  # content-translation API also cancelled work whenever the caller disconnected (Bazarr's
  # 1920s HTTP timeout), an endless retry loop on big files - the patch detaches the
  # translation from the request token and converges retries onto the running request
  # (upstream #542, maintainer-endorsed option 3). And the batch path treated provider
  # 429/503 as file-fatal (groq's shared TPM window 429s at ~8s intervals) where the
  # patch surfaces them to the retry loop.
  # Revert to ghcr.io/lingarr-translate/lingarr when upstream LocalAiService no longer
  # falls back to a schema-less request, validates returned positions against the batch,
  # RunBatch throws instead of filling original lines, /api/translate/content no longer
  # cancels on client disconnect, and 429/503 on the structured batch request is retried
  # (watched by upstream-release-watch).
  # Renovate must not track this image (disabled in .github/renovate.json).
  - name: ghcr.io/lingarr-translate/lingarr
    newName: ghcr.io/spyrospsarras/lingarr
    digest: sha256:84209cdd7905a7cd7338300787e46c77282940d7e6e1c934cab038781a87079e
