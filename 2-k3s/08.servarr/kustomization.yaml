configMapGenerator:
  - name: cleanuparr-seeding-guard
    files:
      - enforce-private-seeding.py=cleanuparr/files/enforce-private-seeding.py
  # Fixed name: maintenance CronJobs in this namespace mount it too.
  - name: tracker-rules
    files:
      - tracker-rules.json=cleanuparr/files/tracker-rules.json
    options:
      disableNameSuffixHash: true
  - name: cleanuparr-malware-blocklist
    files:
      - malware-blocklist.txt=cleanuparr/files/malware-blocklist.txt
  - name: lingarr-jobqueue-guard
    files:
      - reconcile-ai-provider.sql=lingarr/files/reconcile-ai-provider.sql
  - name: bazarr-autotranslate-main
    files:
      - main.py=bazarr-autotranslate/files/main.py
  - name: tdarr-plugin-checksums
    files:
      - tdarr/plugins.sha256
  - name: tdarr-seed
    files:
      - tdarr/flow-lg-c1.json
      - tdarr/library-seed.json
      - tdarr/seed.py
  - name: tdarr-notify-proxy
    files:
      - tdarr/notify-proxy.py
  - name: tdarr-media-proxy
    files:
      - tdarr/media-proxy.py
