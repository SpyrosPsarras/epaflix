---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn-picker
  annotations:
    secret.reloader.stakater.com/reload: "airvpn-api-key,vpn-picker-intake-token"
  namespace: servarr
  labels:
    app: vpn-picker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vpn-picker
  template:
    metadata:
      labels:
        app: vpn-picker
    spec:
      containers:
        - name: vpn-picker
          image: ghcr.io/spyrospsarras/vpn-picker:latest
          securityContext:
            capabilities:
              drop: ["ALL"]
          env:
            - name: TZ
              value: "Europe/Oslo"
            - name: AIRVPN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: airvpn-api-key
                  key: airvpn_api_key
            - name: VPN_PICKER_INTAKE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vpn-picker-intake-token
                  key: intake_token
            - name: VPN_PICKER_COUNTRIES
              value: "nl,de,se"
            - name: VPN_PICKER_MAX_LOAD
              value: "75"
            - name: VPN_PICKER_SHORTLIST
              value: "5"
            - name: VPN_PICKER_PROBE_COUNT
              value: "300"
            - name: VPN_PICKER_PROBE_RATE
              value: "5"
            - name: VPN_PICKER_MAX_LOSS_PCT
              value: "1.0"
            - name: VPN_PICKER_INTERVAL_SECONDS
              value: "900"
            - name: VPN_PICKER_TTL_SECONDS
              value: "2100"
            - name: VPN_PICKER_OUTPUT
              value: "/media/.vpn-picker/ranking.json"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 60
            failureThreshold: 3
          volumeMounts:
            - name: media
              mountPath: /media
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: servarr-media
