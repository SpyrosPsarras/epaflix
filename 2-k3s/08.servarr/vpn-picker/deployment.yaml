---
# vpn-picker scorer - Components 1-3 of
# docs/superpowers/specs/2026-08-01-vpn-picker-design.md (#596, map #498).
#
# Every 15 min it reads the AirVPN status API, ICMP-probes a shortlist, and
# publishes a ranked top 5 to /media/.vpn-picker/ranking.json plus the same
# bytes over HTTP.
#
# Why it lives here and not in the qbittorrent pod: a probe from inside that
# pod measures `our line -> connected server -> AirVPN backbone -> candidate`,
# because Bluetit's split routes and network lock only permit the one connected
# server. That is not the number we want, and for every other candidate it is
# not even allowed. The measurement has to come from a netns outside the tunnel.
#
# Nothing consumes this yet. Stage 1 of the spec's rollout is scorer only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn-picker
  annotations:
    # Reloader (#299/#715): roll this Deployment when airvpn-api-key
    # rotates. the AirVPN API key is read from env at start.
    # PR #714 wired the servarr Reloader but missed this workload.
    secret.reloader.stakater.com/reload: "airvpn-api-key"
  namespace: servarr
  labels:
    app: vpn-picker
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two scorers would probe the same candidates
  # twice and race each other publishing the same file.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vpn-picker
  template:
    metadata:
      labels:
        app: vpn-picker
    spec:
      containers:
        - name: vpn-picker
          # :latest until the first build publishes a digest to pin here and in
          # the `images:` block of 2-k3s/08.servarr/kustomization.yaml, the same
          # way airvpn-bluetit is pinned. Merging is the deploy (servarr is
          # automated + selfHeal), so publish the image before merging or the
          # pod sits in ImagePullBackOff until the build workflow catches up.
          image: ghcr.io/spyrospsarras/vpn-picker:latest
          # Unprivileged ICMP with a literally empty capability set. It works
          # because containerd's CRI sets net.ipv4.ping_group_range to
          # `0 2147483647` in every pod netns, even though all 7 hosts have it
          # DISABLED (`1 0`) - measured on both worker-61 and worker-62. That is
          # a container-runtime default this repo does not configure and cannot
          # control. If the cluster ever moves off containerd, or a hardened
          # sysctl/seccomp profile resets it per namespace, `ping` silently
          # loses its unprivileged socket and every probe fails - the fix then
          # is `add: ["NET_RAW"]` here, or TCP-connect probing instead of ICMP.
          securityContext:
            capabilities:
              drop: ["ALL"]
          env:
            - name: TZ
              value: "Europe/Oslo"
            - name: AIRVPN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: airvpn-api-key
                  key: airvpn_api_key
            # Defaults below are the spec's own numbers, set explicitly so a
            # change is a reviewable diff instead of an image rebuild.
            #
            # Must match `airwhitecountrylist` in qbittorrent/bluetit-config.yaml.
            # Bluetit refuses a winner outside its own pool on connect, it does
            # not silently fall back.
            - name: VPN_PICKER_COUNTRIES
              value: "nl,de,se"
            # Drops the 2 Gbit boxes at 78% load that `airconnectatboot quick`
            # kept picking, measured twice.
            - name: VPN_PICKER_MAX_LOAD
              value: "75"
            - name: VPN_PICKER_SHORTLIST
              value: "5"
            # 300 packets at 5/s, about 60 s. ~100 packets separates clean from
            # broken but cannot tell 4% from 9% apart; 300-500 settles the
            # mid-range to about +/-2 points.
            - name: VPN_PICKER_PROBE_COUNT
              value: "300"
            - name: VPN_PICKER_PROBE_RATE
              value: "5"
            # A gate, not a weight. AirVPN reported `health: ok` for a server we
            # measured at 22% loss.
            - name: VPN_PICKER_MAX_LOSS_PCT
              value: "1.0"
            - name: VPN_PICKER_INTERVAL_SECONDS
              value: "900"
            # 35 min = two missed cycles plus slack. Past its TTL the consumer
            # treats the ranking as absent.
            - name: VPN_PICKER_TTL_SECONDS
              value: "2100"
            # Dot-dir so the *arr media scanners never see the file.
            - name: VPN_PICKER_OUTPUT
              value: "/media/.vpn-picker/ranking.json"
          ports:
            - containerPort: 8080
              name: http
          # /healthz answers as soon as the HTTP server is up, deliberately
          # without waiting for a ranking. A scorer that cannot reach the API
          # must stay alive and keep serving the last good ranking, not get
          # restarted into an empty in-memory state.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 60
            failureThreshold: 3
          volumeMounts:
            - name: media
              mountPath: /media
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        # ReadWriteMany, already mounted by the five media pods. Sharing it is
        # the point: this is the only transport the qbittorrent pod can read,
        # because Bluetit's routes blackhole every RFC1918 destination.
        - name: media
          persistentVolumeClaim:
            claimName: servarr-media
