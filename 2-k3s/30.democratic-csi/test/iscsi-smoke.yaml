apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iscsi-smoke
  namespace: democratic-csi
spec:
  storageClassName: truenas-iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: iscsi-smoke
  namespace: democratic-csi
spec:
  restartPolicy: Never
  containers:
    - name: smoke
      image: docker.io/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      command:
        - sh
        - -ec
        - date -u > /data/timestamp; sync; cat /data/timestamp; sleep 3600
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: iscsi-smoke
