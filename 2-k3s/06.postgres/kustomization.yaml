# ArgoCD-managed kustomization for the Postgres/CNPG data plane.
# Owned by ArgoCD Application "postgres" (2-k3s/11.argocd/apps/app-postgres.yaml).
#
# Deliberately excluded (this is the DATA plane only):
#   - operator-kustomization/cnpg-operator.yaml   — operator + Barman plugin are now their
#                                     own ArgoCD Application "cnpg-operator"
#                                     (2-k3s/11.argocd/apps/app-cnpg-operator.yaml,
#                                     rendered from operator-kustomization/);
#                                     adopted under issue #93. Do NOT pull the
#                                     operator manifests into this kustomization.
#   - cluster/postgres-secret.yaml  — placeholder values. Live Secrets
#                                     postgres-superuser / postgres-app-user
#                                     are CNPG-bootstrap-generated and stay
#                                     operator-managed.
#
# Reconciled via the ksops generator below (Issue #29 / PR #58, follow-up #63):
#   - minio-backup-credentials      from minio-backup-credentials.enc.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: postgres-system
resources:
  - namespace.yaml
  - services/postgres-lb-rw.yaml
  - services/postgres-lb-ro.yaml
  - services/postgres-lb-r.yaml
  - services/postgres-pooler-lb.yaml
  - cluster/postgres-object-store.yaml
  - cluster/postgres-cluster.yaml
  - cluster/postgres-pooler.yaml
  - backup/backup-schedule.yaml

generators:
  - ksops-generator.yaml
