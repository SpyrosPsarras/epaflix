---
# NOTE: name MUST stay `postgres-pooler-lb`. The CNPG Pooler controller
# already owns a Service named `postgres-pooler` (ClusterIP, with
# ownerReferences → Pooler/postgres-pooler) and will revert any LoadBalancer
# spec applied to that name — infinite reconcile loop with ArgoCD.
apiVersion: v1
kind: Service
metadata:
  name: postgres-pooler-lb
  namespace: postgres-system
  labels:
    app: postgres-pooler
    service-type: pooler-lb
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.10.108
  selector:
    cnpg.io/poolerName: postgres-pooler
  ports:
    - name: pgbouncer
      port: 5432
      targetPort: 5432
      protocol: TCP
  sessionAffinity: None
