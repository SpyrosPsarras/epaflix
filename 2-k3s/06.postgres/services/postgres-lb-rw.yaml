---
apiVersion: v1
kind: Service
metadata:
  name: postgres-rw
  namespace: postgres-system
  labels:
    app: postgres
    service-type: primary
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.10.105
  allocateLoadBalancerNodePorts: false
  # kube-proxy applies the ranges to pod traffic too, and the servarr pods connect to this address.
  loadBalancerSourceRanges:
    - 10.42.0.0/16
    - 192.168.10.177/32
    - 192.168.10.191/32
  selector:
    cnpg.io/cluster: postgres-cluster
    role: primary
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  sessionAffinity: None
