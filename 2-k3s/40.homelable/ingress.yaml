---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-service-key
  namespace: homelable
spec:
  headers:
    customRequestHeaders:
      X-MCP-Service-Key: ""
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homelable-https
  namespace: homelable
spec:
  entryPoints:
    - internal
  routes:
    - match: Host(`homelable.epaflix.com`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: traefik-system
        - name: strip-service-key
      services:
        - name: homelable
          port: 80
  tls: {}
