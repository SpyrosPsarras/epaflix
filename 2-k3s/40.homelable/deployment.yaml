---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelable
  namespace: homelable
  labels:
    app: homelable
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homelable
  template:
    metadata:
      labels:
        app: homelable
    spec:
      enableServiceLinks: false
      containers:
        - name: backend
          image: ghcr.io/pouzor/homelable-backend
          command:
            - sh
            - -c
            - rm -f /app/data/scan_config.json && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_RAW
          envFrom:
            - secretRef:
                name: homelable-secrets
          env:
            - name: AUTH_MODE
              value: oidc
            - name: OIDC_DISCOVERY_URL
              value: https://auth.epaflix.com/application/o/homelable/.well-known/openid-configuration
            - name: OIDC_REDIRECT_URI
              value: https://homelable.epaflix.com/api/v1/auth/oidc/callback
            - name: OIDC_SCOPES
              value: openid profile email
            - name: OIDC_COOKIE_SECURE
              value: "true"
            - name: CORS_ORIGINS
              value: '["https://homelable.epaflix.com"]'
            - name: SCANNER_RANGES
              value: '["192.168.10.0/24"]'
            - name: STATUS_CHECKER_INTERVAL
              value: "60"
            - name: GIT_SYNC_REPO_URL
              value: https://git-internal.epaflix.com/homelab-bot/homelable-config.git
            - name: GIT_SYNC_BRANCH
              value: main
            - name: GIT_SYNC_USERNAME
              value: homelab-bot
            - name: GIT_SYNC_AUTHOR_NAME
              value: homelable
            - name: GIT_SYNC_AUTHOR_EMAIL
              value: homelab-bot@epaflix.com
            - name: HOME
              value: /tmp
          ports:
            - containerPort: 8000
              name: api
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: api
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: api
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
        - name: frontend
          image: ghcr.io/pouzor/homelable-frontend
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETUID
                - SETGID
                - NET_BIND_SERVICE
          env:
            - name: BACKEND_UPSTREAM
              value: 127.0.0.1:8000
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homelable-data-pithari
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
