---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homelable-ingress
  namespace: homelable
spec:
  podSelector:
    matchLabels:
      app: homelable
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app: homelab-sync
      ports:
        - port: 80
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homelable-egress
  namespace: homelable
spec:
  podSelector:
    matchLabels:
      app: homelable
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 8443}
    - to:
        - ipBlock: {cidr: 192.168.10.0/24}
        - ipBlock: {cidr: 10.0.0.0/24}
