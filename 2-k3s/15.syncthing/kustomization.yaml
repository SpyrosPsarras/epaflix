apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: syncthing

resources:
  - namespace.yaml
  - storage.yaml
  - deployment.yaml
  - service-gui.yaml
  - service-sync.yaml
  - ingressroute-tcp.yaml
  - keepass.yaml

configMapGenerator:
  - name: keepass-mcp
    files:
      - files/keepass_mcp.py

generators:
  - ksops-generator.yaml

# KEEPASS_HUB_SECRET is env and no Reloader watches this namespace: the
# Secret's plaintext revision annotation (23.mcp-hub/tools/sops_secret.py)
# is copied into the pod template so a new secret rolls the keepass pod.
replacements:
  - source:
      kind: Secret
      name: keepass-hub-secret
      fieldPath: metadata.annotations.[mcp-hub.epaflix.com/revision]
    targets:
      - select:
          kind: Deployment
          name: keepass
        fieldPaths:
          - spec.template.metadata.annotations.[mcp-hub.epaflix.com/hub-secret-revision]
        options:
          create: true

images:
  - name: syncthing/syncthing
    newTag: 2.1.5
