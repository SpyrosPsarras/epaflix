apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: syncthing

resources:
  - namespace.yaml
  - storage.yaml
  - deployment.yaml
  - service-gui.yaml
  - service-sync.yaml
  - ingressroute-tcp.yaml
  - keepass.yaml

configMapGenerator:
  - name: keepass-mcp
    files:
      - files/keepass_mcp.py

generators:
  - ksops-generator.yaml

images:
  - name: syncthing/syncthing
    newTag: 2.1.5
