---
# KeePass MCP server next to the Syncthing vault folder: one long-lived
# streamable-HTTP process at keepass.syncthing.svc:8000/keepass. Only the MCP
# hub (2-k3s/23.mcp-hub, path /keepass) may call it: the NetworkPolicy below
# admits only hub pods, and the process checks the shared X-Hub-Secret
# (Secret keepass-hub-secret, written by 23.mcp-hub/tools/sops_secret.py
# --keepass). Writes land in the synced folder, Syncthing carries them to the
# other devices.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keepass
  namespace: syncthing
  labels:
    app: keepass
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keepass
  template:
    metadata:
      labels:
        app: keepass
    spec:
      # syncthing-data is a local PV on this node.
      nodeSelector:
        kubernetes.io/hostname: k3s-worker-63
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keepass
          image: docker.io/library/python:3.13-alpine
          # ponytail: installs pinned wheels on every start (~20s). Bake an
          # image if restarts get frequent or PyPI becomes a problem.
          command:
            - sh
            - -c
            - >-
              pip install -q --no-cache-dir --disable-pip-version-check
              --target /opt/py pykeepass==4.2.0 mcp==2.2.0 &&
              python /app/keepass_mcp.py --selftest &&
              exec python /app/keepass_mcp.py --http
          env:
            - name: HOME
              value: /tmp
            - name: PYTHONPATH
              value: /opt/py
            - name: KEEPASS_DB
              value: /vault/Passwords.kdbx
            - name: KEEPASS_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: t3code-vault-passphrase
                  key: VAULT_PASSPHRASE
            - name: KEEPASS_HUB_SECRET
              valueFrom:
                secretKeyRef:
                  name: keepass-hub-secret
                  key: secret
          ports:
            - containerPort: 8000
              name: http
          # exec, not httpGet: the NetworkPolicy admits only hub pods.
          readinessProbe:
            exec:
              command: [python, -c, "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [python, -c, "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
          # One process now; each tool call opens the vault (~70-100Mi while
          # the KDF runs), in parallel for concurrent calls.
          resources:
            requests:
              cpu: 10m
              memory: 192Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: vault
              mountPath: /vault
              subPath: data/secrets-vault
            - name: app
              mountPath: /app
              readOnly: true
            - name: py
              mountPath: /opt/py
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: syncthing-data
        - name: app
          configMap:
            name: keepass-mcp
        - name: py
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keepass
  namespace: syncthing
  labels:
    app: keepass
spec:
  type: ClusterIP
  selector:
    app: keepass
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keepass-from-mcp-hub
  namespace: syncthing
spec:
  podSelector:
    matchLabels:
      app: keepass
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-hub
          podSelector:
            matchLabels:
              app: mcp-hub
      ports:
        - port: 8000
          protocol: TCP
