---
apiVersion: v1
kind: ConfigMap
metadata:
  name: newtarr-config-drift-script
  namespace: servarr
data:
  check.sh: |
    set -eu

    redact_diff() {
      sed 's/^\([+-][[:space:]]*"api_key"[[:space:]]*:[[:space:]]*\)"[^"]*"/\1"REDACTED"/'
    }

    selftest() {
      echo "=== newtarr-config-drift selftest (no cluster access) ==="

      cat > /tmp/st.diff <<'EOF'
    --- seed
    +++ live
    @@ -1,4 +1,4 @@
       "hourly_cap": 200,
    -  "api_key": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
    +  "api_key": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",
    -  "name": "sonarr-main"
    +  "name": "sonarr-renamed"
    EOF

      out=$(redact_diff < /tmp/st.diff)

      case "$out" in
        *aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa*|*bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb*)
          echo "FAIL: a raw api_key value survived redact_diff" >&2
          exit 1
          ;;
      esac

      case "$out" in
        *'"api_key": "REDACTED"'*) ;;
        *)
          echo "FAIL: expected a redacted api_key line, found none" >&2
          echo "$out" >&2
          exit 1
          ;;
      esac

      case "$out" in
        *'sonarr-renamed'*) ;;
        *)
          echo "FAIL: unrelated structural drift line was dropped too - detection changed" >&2
          echo "$out" >&2
          exit 1
          ;;
      esac

      echo "PASS: redact_diff blanks api_key values and keeps other drift lines intact."
    }

    if [ "${1:-}" = "--selftest" ]; then
      selftest
      exit 0
    fi

    echo "=== newtarr config-seed drift check @ $(date -u +%FT%TZ) ==="

    PAIRS="
    sonarr.json:/config/sonarr.json
    radarr.json:/config/radarr.json
    lidarr.json:/config/lidarr.json
    readarr.json:/config/readarr.json
    whisparr.json:/config/whisparr.json
    eros.json:/config/eros.json
    swaparr.json:/config/swaparr.json
    general.json:/config/general.json
    scheduling-list.json:/config/scheduling/list.json
    "

    POD=$(kubectl -n servarr get pod -l app=newtarr \
      -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' \
      | awk '{print $1}')
    if [ -z "$POD" ]; then
      echo "ERROR: no Running newtarr pod found (label app=newtarr)" >&2
      exit 1
    fi
    echo "live pod: $POD"

    drift=0
    for pair in $PAIRS; do
      [ -n "$pair" ] || continue
      key=${pair%%:*}
      live=${pair#*:}

      seedfile=/seed/$key
      if [ ! -f "$seedfile" ]; then
        echo "ERROR: seed key '$key' missing from newtarr-config-seed Secret" >&2
        drift=1
        continue
      fi

      if ! kubectl -n servarr exec "$POD" -- cat "$live" > /tmp/live.raw 2>/tmp/live.err; then
        echo "ERROR: cannot read live $live from pod $POD:" >&2
        cat /tmp/live.err >&2
        drift=1
        continue
      fi

      if ! jq -S . "$seedfile" > /tmp/seed.n 2>/dev/null; then
        echo "ERROR: seed key '$key' is not valid JSON" >&2
        drift=1
        continue
      fi
      if ! jq -S . /tmp/live.raw > /tmp/live.n 2>/dev/null; then
        echo "ERROR: live $live is not valid JSON" >&2
        drift=1
        continue
      fi

      if diff -u /tmp/seed.n /tmp/live.n > /tmp/diff.txt; then
        echo "OK: $key matches live $live (0 drift)."
      else
        echo "DRIFT DETECTED for $key (seed vs live $live):"
        redact_diff < /tmp/diff.txt | sed 's/^/    /'
        drift=1
      fi
    done

    echo
    if [ "$drift" -eq 0 ]; then
      echo "OK: committed newtarr-config-seed matches live /config (0 drift)."
      exit 0
    fi
    echo "ACTION: the committed seed has drifted from live newtarr /config (or a"
    echo "  read/exec failed). Re-snapshot via the MANUAL #137 runbook"
    echo "  (#179 section). The detector NEVER auto-fixes; refresh stays manual."
    exit 1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: newtarr-config-drift
  namespace: servarr
  labels:
    app: newtarr-config-drift
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: newtarr-config-drift
  namespace: servarr
  labels:
    app: newtarr-config-drift
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: newtarr-config-drift
  namespace: servarr
  labels:
    app: newtarr-config-drift
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: newtarr-config-drift
subjects:
  - kind: ServiceAccount
    name: newtarr-config-drift
    namespace: servarr
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: newtarr-config-drift
  namespace: servarr
  labels:
    app: newtarr-config-drift
spec:
  schedule: "45 6 * * 1"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 6
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      ttlSecondsAfterFinished: 2592000  # keep 30 days
      template:
        metadata:
          labels:
            app: newtarr-config-drift
        spec:
          restartPolicy: Never
          serviceAccountName: newtarr-config-drift
          containers:
            - name: drift-check
              image: alpine:3.20
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  apk add --no-cache jq kubectl >/dev/null
                  exec /bin/sh /script/check.sh
              volumeMounts:
                - name: seed
                  mountPath: /seed
                  readOnly: true
                - name: script
                  mountPath: /script
                  readOnly: true
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
          volumes:
            - name: seed
              secret:
                secretName: newtarr-config-seed
                defaultMode: 0444
            - name: script
              configMap:
                name: newtarr-config-drift-script
                defaultMode: 0444
