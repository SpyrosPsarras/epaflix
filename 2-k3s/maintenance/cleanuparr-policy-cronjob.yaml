---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanuparr-policy
  namespace: servarr
  labels:
    app: cleanuparr-policy
spec:
  # Hourly at :40, clear of the QueueCleaner (:00) and its health check (:25).
  schedule: "40 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: cleanuparr-policy
        spec:
          restartPolicy: Never
          containers:
            - name: policy
              image: python:3.13-alpine
              imagePullPolicy: IfNotPresent
              command: ["python3", "/script/cleanuparr-policy.py"]
              env:
                # report: print planned changes only. Cleanuparr's own Dry Run guards deletions.
                - name: SEEDING_POLICY
                  value: enforce
                - name: CLEANUPARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cleanuparr-api-key
                      key: apiKey
                - name: QBT_WEBAPI_KEY
                  valueFrom:
                    secretKeyRef:
                      name: qbittorrent-webapi-key
                      key: QBT_WEBAPI_KEY
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: unpackerr-secret
                      key: UN_RADARR_0_API_KEY
                      optional: true
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: unpackerr-secret
                      key: UN_SONARR_0_API_KEY
                      optional: true
                - name: PROWLARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: prowlarr-api-key
                      key: apiKey
                      optional: true
                - name: PROWLARR_URL
                  value: "http://prowlarr:9696"
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
                - name: tracker-rules
                  mountPath: /rules
                  readOnly: true
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "250m"
                  memory: "128Mi"
          volumes:
            - name: script
              configMap:
                name: cleanuparr-policy-script
                defaultMode: 0555
            - name: tracker-rules
              configMap:
                name: tracker-rules
