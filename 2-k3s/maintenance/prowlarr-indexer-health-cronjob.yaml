---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prowlarr-indexer-health-script
  namespace: servarr
data:
  check.py: |
    #!/usr/bin/env python3
    """Check Prowlarr backoff and banned indexers using BANNED_DEFINITIONS.

    Delete banned indexers in Prowlarr. Python stdlib only.
    Run with --selftest to exercise the classifiers against synthetic
    payloads without touching the network.
    """
    import http.client
    import json
    import os
    import sys
    import urllib.request

    TIMEOUT = 15
    WATCHED_SOURCE = "IndexerLongTermStatusCheck"
    BANNED_DEFINITIONS = {
        "limetorrents": "fake archive releases (removed 2026-10-24)",
    }

    PROWLARR_URL = os.environ.get(
        "PROWLARR_URL", "http://prowlarr.servarr.svc.cluster.local:9696"
    )
    API_KEY = os.environ.get("PROWLARR_API_KEY", "")


    def classify(health_items):
        """Return (ok, messages). ok=False means at least one indexer has been
        in backoff long enough for Prowlarr itself to raise
        IndexerLongTermStatusCheck. Defensive against missing/odd keys —
        malformed entries never crash the check, but they also never silently
        pass if they can't be evaluated (checked in selftest below)."""
        hits = []
        for item in health_items:
            if not isinstance(item, dict):
                continue
            if item.get("source") == WATCHED_SOURCE:
                hits.append(item.get("message", "(no message)"))
        return (len(hits) == 0, hits)


    def classify_banned(indexers):
        hits = []
        for item in indexers:
            if not isinstance(item, dict):
                continue
            definition = item.get("definitionName")
            if not isinstance(definition, str):
                continue
            reason = BANNED_DEFINITIONS.get(definition.lower())
            if reason:
                hits.append(f"{item.get('name', '(no name)')} (id={item.get('id', '?')}): {reason}")
        return (len(hits) == 0, hits)


    def fetch(path):
        req = urllib.request.Request(
            f"{PROWLARR_URL}{path}",
            headers={"X-Api-Key": API_KEY},
        )
        with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
            items = json.loads(resp.read().decode())
        if not isinstance(items, list):
            kind = "an indexer" if path == "/api/v1/indexer" else "a health"
            raise ValueError(f"expected {kind} list")
        return items


    def selftest():
        ok, hits = classify([])
        assert ok and hits == [], "empty health list must be OK"

        ok, hits = classify(
            [{"source": "IndexerNoDefinitionCheck", "type": "error", "message": "x"}]
        )
        assert ok and hits == [], "unrelated health source must not fail the check"

        ok, hits = classify(
            [
                {"source": "IndexerNoDefinitionCheck", "type": "error", "message": "x"},
                {
                    "source": "IndexerLongTermStatusCheck",
                    "type": "warning",
                    "message": "Indexers unavailable due to failures for more than 6 hours: 1337x, AvistaZ",
                },
            ]
        )
        assert not ok, "IndexerLongTermStatusCheck must fail the check"
        assert hits == [
            "Indexers unavailable due to failures for more than 6 hours: 1337x, AvistaZ"
        ]

        ok, hits = classify([{}, {"source": None}, "not-a-dict", 42])
        assert ok and hits == [], "malformed entries must not crash or false-positive"

        ok, hits = classify_banned([])
        assert ok and hits == [], "empty indexer list must be OK"

        ok, hits = classify_banned([{"definitionName": "other", "name": "Other", "id": 1}])
        assert ok and hits == [], "non-banned indexer must not fail the check"

        for definition in ("limetorrents", "LimeTorrents"):
            ok, hits = classify_banned(
                [{"definitionName": definition, "name": "LimeTorrents", "id": 2}]
            )
            assert not ok, "banned definition must fail regardless of case"
            assert hits == [
                "LimeTorrents (id=2): fake archive releases (removed 2026-10-24)"
            ]

        ok, hits = classify_banned(
            [{}, {"definitionName": None}, {"definitionName": 42},
             {"definitionName": []}, {"definitionName": {}}, "not-a-dict", 42, None]
        )
        assert ok and hits == [], "malformed indexers must not crash or false-positive"

        print("selftest OK")
        return 0


    def main():
        if "--selftest" in sys.argv:
            return selftest()

        if not API_KEY:
            print("ERROR: PROWLARR_API_KEY is empty", file=sys.stderr)
            return 1

        failed = False
        for endpoint, classifier, ok_message, fail_header, action in (
            (
                "health",
                classify,
                f"OK: no {WATCHED_SOURCE} warning (checked {{}} health entries).",
                f"FAIL: Prowlarr raised {WATCHED_SOURCE}:",
                "ACTION: check indexer credentials/rate-limits in the Prowlarr UI; see #471/#477.",
            ),
            (
                "indexer",
                classify_banned,
                "OK: no banned indexers (checked {} indexers).",
                "FAIL: banned Prowlarr indexers configured:",
                "ACTION: delete these indexers in Prowlarr; ban list: BANNED_DEFINITIONS in this script.",
            ),
        ):
            path = f"/api/v1/{endpoint}"
            try:
                items = fetch(path)
            except (OSError, http.client.HTTPException) as exc:
                print(f"ERROR: could not reach {PROWLARR_URL}{path}: {exc}", file=sys.stderr)
                failed = True
            except ValueError as exc:
                print(f"ERROR: unparseable response from Prowlarr {endpoint} endpoint: {exc}", file=sys.stderr)
                failed = True
            else:
                ok, hits = classifier(items)
                if ok:
                    print(ok_message.format(len(items)))
                else:
                    failed = True
                    print(fail_header)
                    for msg in hits:
                        print(f"  - {msg}")
                    print(action)

        return 1 if failed else 0


    if __name__ == "__main__":
        sys.exit(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prowlarr-indexer-health
  namespace: servarr
  labels:
    app: prowlarr-indexer-health
spec:
  schedule: "10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 6
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600  # keep 1 hour
      template:
        metadata:
          labels:
            app: prowlarr-indexer-health
        spec:
          restartPolicy: Never
          containers:
            - name: health-check
              image: python:3.13-alpine
              imagePullPolicy: IfNotPresent
              command: ["python3", "/script/check.py"]
              env:
                - name: PROWLARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: prowlarr-api-key
                      key: apiKey
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "250m"
                  memory: "128Mi"
          volumes:
            - name: script
              configMap:
                name: prowlarr-indexer-health-script
                defaultMode: 0555
