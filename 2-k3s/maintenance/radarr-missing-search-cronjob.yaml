---
apiVersion: v1
kind: ConfigMap
metadata:
  name: radarr-missing-search-script
  namespace: servarr
data:
  search.py: |
    #!/usr/bin/env python3
    """Radarr missing-movie search, rate-limited by stateless rotation (#1024).

    Run with --selftest to exercise the candidate filter and the rotation
    against synthetic movie payloads without touching the network.
    """
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.request

    RADARR_URL = os.environ.get("RADARR_URL", "http://radarr:7878")
    API_KEY = os.environ.get("RADARR_API_KEY", "")
    BATCH_SIZE = int(os.environ.get("BATCH_SIZE", "3"))
    DRY_RUN = os.environ.get("DRY_RUN", "false").lower() == "true"

    def _get(path):
        req = urllib.request.Request(
            RADARR_URL.rstrip("/") + path,
            headers={"X-Api-Key": API_KEY, "Accept": "application/json"},
        )
        with urllib.request.urlopen(req, timeout=60) as resp:
            return json.loads(resp.read().decode())

    def _post(path, payload):
        req = urllib.request.Request(
            RADARR_URL.rstrip("/") + path,
            data=json.dumps(payload).encode(),
            headers={
                "X-Api-Key": API_KEY,
                "Content-Type": "application/json",
                "Accept": "application/json",
            },
            method="POST",
        )
        with urllib.request.urlopen(req, timeout=60) as resp:
            return json.loads(resp.read().decode())

    def candidates(movies):
        """monitored, no file, and Radarr itself says it is available."""
        out = [
            m for m in movies
            if m.get("monitored")
            and not m.get("hasFile")
            and m.get("isAvailable")
        ]
        return sorted(out, key=lambda m: m["id"])

    def rotate(items, batch_size, day):
        """Deterministic, stateless slice.

        Every item gets a turn once per ceil(len/batch_size) days. Wraps around
        the end of the list so a short tail still gets a full-size batch.
        """
        if not items or batch_size <= 0:
            return []
        n = len(items)
        batch_size = min(batch_size, n)
        cycles = (n + batch_size - 1) // batch_size
        start = (day % cycles) * batch_size
        return [items[(start + i) % n] for i in range(batch_size)]

    def selftest():
        movies = [
            {"id": 1, "title": "has file", "monitored": True,
             "hasFile": True, "isAvailable": True},
            {"id": 2, "title": "unmonitored", "monitored": False,
             "hasFile": False, "isAvailable": True},
            {"id": 3, "title": "not yet out", "monitored": True,
             "hasFile": False, "isAvailable": False},
            {"id": 5, "title": "wanted a", "monitored": True,
             "hasFile": False, "isAvailable": True},
            {"id": 4, "title": "wanted b", "monitored": True,
             "hasFile": False, "isAvailable": True},
        ]
        cands = candidates(movies)
        assert [m["id"] for m in cands] == [4, 5], cands
        items = list(range(7))
        seen = set()
        for day in range(3):
            batch = rotate(items, 3, day)
            assert len(batch) == 3, batch
            seen.update(batch)
        assert seen == set(items), seen
        assert rotate([], 3, 0) == []
        assert rotate([1], 5, 9) == [1]
        assert rotate(items, 0, 1) == []
        print("selftest OK")
        return 0

    def main():
        if "--selftest" in sys.argv:
            return selftest()

        if not API_KEY:
            print("ERROR: RADARR_API_KEY is empty")
            return 2

        print("=== radarr missing-movie search @ %s ==="
              % time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()))

        try:
            movies = _get("/api/v3/movie")
        except (urllib.error.URLError, urllib.error.HTTPError, ValueError) as exc:
            print("ERROR: could not list movies from %s: %s" % (RADARR_URL, exc))
            return 2

        cands = candidates(movies)
        print("library: %d movies | monitored+missing+available: %d"
              % (len(movies), len(cands)))

        if not cands:
            print("OK: nothing missing and available - no search needed.")
            return 0

        day = int(time.time() // 86400)
        batch = rotate(cands, BATCH_SIZE, day)
        cycles = (len(cands) + min(BATCH_SIZE, len(cands)) - 1) \
            // min(BATCH_SIZE, len(cands))
        print("batch %d of a %d-day cycle (BATCH_SIZE=%d):"
              % (day % cycles + 1, cycles, BATCH_SIZE))
        for m in batch:
            print("    id=%-5s %s (%s)"
                  % (m["id"], m.get("title", "?"), m.get("year", "?")))

        if DRY_RUN:
            print("DRY_RUN - no MoviesSearch command sent.")
            return 0

        try:
            cmd = _post("/api/v3/command",
                        {"name": "MoviesSearch",
                         "movieIds": [m["id"] for m in batch]})
        except (urllib.error.URLError, urllib.error.HTTPError, ValueError) as exc:
            print("ERROR: MoviesSearch command failed: %s" % exc)
            return 2

        print("OK: queued MoviesSearch commandId=%s status=%s for %d movie(s)."
              % (cmd.get("id"), cmd.get("status"), len(batch)))
        print("A search that finds nothing writes no Radarr history row and is "
              "NOT an error - see this file's header.")
        return 0

    if __name__ == "__main__":
        sys.exit(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: radarr-missing-search
  namespace: servarr
  labels:
    app: radarr-missing-search
spec:
  schedule: "20 5 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 6
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      ttlSecondsAfterFinished: 2592000  # keep 30 days
      template:
        metadata:
          labels:
            app: radarr-missing-search
        spec:
          restartPolicy: Never
          containers:
            - name: missing-search
              image: python:3.13-alpine
              imagePullPolicy: IfNotPresent
              command: ["python3", "/script/search.py"]
              env:
                - name: RADARR_URL
                  value: "http://radarr:7878"
                - name: BATCH_SIZE
                  value: "3"
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: unpackerr-secret
                      key: UN_RADARR_0_API_KEY
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "250m"
                  memory: "128Mi"
          volumes:
            - name: script
              configMap:
                name: radarr-missing-search-script
                defaultMode: 0555
