---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cleanuparr-blocklist-drift-script
  namespace: servarr
data:
  check.sh: |
    set -eu
    UPSTREAM_URL="https://raw.githubusercontent.com/Cleanuparr/Cleanuparr/refs/heads/main/blacklist"
    echo "=== cleanuparr blocklist drift check @ $(date -u +%FT%TZ) ==="

    if ! wget -q -O /tmp/upstream "$UPSTREAM_URL"; then
      echo "ERROR: upstream fetch failed ($UPSTREAM_URL)"
      exit 1
    fi

    norm() { sed 's/[[:space:]]*$//' "$1" | sed '/^$/d' | LC_ALL=C sort; }
    norm /expected/cleanuparr-blocklist-expected.txt > /tmp/exp.n
    norm /tmp/upstream                                > /tmp/up.n

    if diff -u /tmp/exp.n /tmp/up.n > /tmp/diff.txt; then
      echo "OK: committed upstream baseline matches live upstream (0 drift)."
      exit 0
    fi
    echo "DRIFT DETECTED -- upstream Cleanuparr/Cleanuparr 'blacklist' has changed:"
    echo "  added-upstream (baseline bump only -- do NOT merge into the seed):"
    grep '^+' /tmp/diff.txt | grep -v '^+++' | sed 's/^+/    + /'
    echo "  removed-upstream:"
    grep '^-' /tmp/diff.txt | grep -v '^---' | sed 's/^-/    - /'
    echo
    echo "ACTION: refresh the BASELINE ONLY --"
    echo "  2-k3s/maintenance/files/cleanuparr-blocklist-expected.txt <- live upstream,"
    echo "  then branch+PR. Do NOT re-merge upstream into the cleanuparr-blocklist-seed"
    echo "  Secret: the upstream patterns were removed 2026-06-13 because they block"
    echo "  unpackerr's .rar/.rNN volumes. See runbook section: issue #182."
    exit 1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanuparr-blocklist-drift
  namespace: servarr
  labels:
    app: cleanuparr-blocklist-drift
spec:
  schedule: "30 6 * * 1"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 6
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      ttlSecondsAfterFinished: 2592000  # keep 30 days
      template:
        metadata:
          labels:
            app: cleanuparr-blocklist-drift
        spec:
          restartPolicy: Never
          containers:
            - name: drift-check
              image: alpine:3.20
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "/script/check.sh"]
              volumeMounts:
                - name: expected
                  mountPath: /expected
                  readOnly: true
                - name: script
                  mountPath: /script
                  readOnly: true
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
          volumes:
            - name: expected
              configMap:
                name: cleanuparr-blocklist-expected
                defaultMode: 0444
            - name: script
              configMap:
                name: cleanuparr-blocklist-drift-script
                defaultMode: 0444
