---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blind-queue-check-script
  namespace: servarr
data:
  check.py: |
    #!/usr/bin/env python3
    """Blind *arr queue detector (#835). Python stdlib only - no pip, no apk.

    Run with --selftest to exercise the classifier against synthetic history
    and queue payloads without touching the network.
    """
    import calendar
    import datetime
    import json
    import os
    import sys
    import urllib.error
    import urllib.parse
    import urllib.request

    TIMEOUT = 30
    PAGE_SIZE = 250
    MAX_PAGES = 8  # safety cap: 8 * 250 = 2000 history rows per *arr per run

    WINDOW_HOURS = float(os.environ.get("WINDOW_HOURS", "6"))

    GRACE_MINUTES = float(os.environ.get("GRACE_MINUTES", "15"))

    RESOLVED_EVENT_TYPES = {
        "downloadFolderImported", "downloadImported",
        "downloadFailed", "downloadIgnored",
    }

    ARRS = [
        ("sonarr", os.environ.get("SONARR_URL", "http://sonarr:8989"),
         os.environ.get("SONARR_API_KEY", "")),
        ("radarr", os.environ.get("RADARR_URL", "http://radarr:7878"),
         os.environ.get("RADARR_API_KEY", "")),
    ]


    def http_status(exc):
        """Status code only - never echo a response body, it can carry a key."""
        return str(exc.code) if isinstance(exc, urllib.error.HTTPError) else "-"


    def parse_epoch(date_str):
        """Parse a Sonarr/Radarr history timestamp to a UTC epoch.

        Handles the trailing 'Z' shape ("...T07:01:23Z") seen in this repo's
        own captured Sonarr output, the '+00:00' offset shape seen from
        cleanuparr's .NET serializer, and a variable-length fractional-second
        component - never assume a fixed width.
        """
        s = date_str.strip()
        if s.endswith("Z"):
            s = s[:-1]
        else:
            s = s.split("+")[0]
        if "." in s:
            s = s.split(".")[0]
        dt = datetime.datetime.strptime(s, "%Y-%m-%dT%H:%M:%S")
        return calendar.timegm(dt.timetuple())


    def api_get(url, key, path, query=None):
        q = urllib.parse.urlencode(query or {})
        full = "%s/api/v3/%s" % (url.rstrip("/"), path)
        if q:
            full += "?" + q
        req = urllib.request.Request(full, headers={"X-Api-Key": key})
        with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
            return json.load(resp)


    def fetch_queue_ids(name, url, key):
        """Live queue downloadIds, lowercased. Fails closed on every error -
        a silently-empty read here would make every grab look blind."""
        doc = api_get(url, key, "queue", {
            "page": 1, "pageSize": 1000,
            "includeUnknownSeriesItems": "true",
            "includeUnknownMovieItems": "true",
        })
        records = doc.get("records")
        if not isinstance(records, list):
            raise RuntimeError("%s: queue response has no 'records' array" % name)
        total = doc.get("totalRecords", len(records))
        if total > len(records):
            raise RuntimeError(
                "%s: queue is paginated (%d records, %d fetched) - refusing "
                "to judge against a partial queue" % (name, total, len(records)))
        return {r["downloadId"].strip().lower()
                for r in records
                if isinstance(r.get("downloadId"), str) and r["downloadId"].strip()}


    def fetch_history(name, url, key, now, window_hours):
        """All history records back to `window_hours` ago, newest first.

        Fails closed if the window is not fully covered within MAX_PAGES -
        same "refuse to judge on partial data" contract as fetch_queue_ids.
        """
        cutoff = now - window_hours * 3600.0
        records = []
        page = 1
        while page <= MAX_PAGES:
            doc = api_get(url, key, "history", {
                "page": page, "pageSize": PAGE_SIZE,
                "sortKey": "date", "sortDirection": "descending",
            })
            batch = doc.get("records")
            if not isinstance(batch, list):
                raise RuntimeError("%s: history response has no 'records' array"
                                    % name)
            records.extend(batch)
            if len(batch) < PAGE_SIZE:
                return records  # short page: this was the last one
            oldest = min((parse_epoch(r["date"]) for r in batch
                          if isinstance(r.get("date"), str)), default=now)
            if oldest < cutoff:
                return records  # full page but already past the window
            page += 1
        raise RuntimeError(
            "%s: history window not covered within %d pages (%d records) - "
            "refusing to judge on a partial history"
            % (name, MAX_PAGES, len(records)))


    def find_blind(history, queue_ids, now, window_hours, grace_minutes):
        """Return [(downloadId, age_minutes)] for grabs that are blind.

        Blind = a 'grabbed' event with a downloadId, inside the window, older
        than grace_minutes, with NEITHER a live queue row NOR any resolved
        history event (imported, failed or ignored) for that same downloadId. Order of the ok
        checks mirrors orphan-census's classify(): every exclusion below is a
        real reason a grab is fine, checked before it can ever be reported.
        """
        resolved_ids = {
            str(r.get("downloadId", "")).strip().lower()
            for r in history
            if r.get("eventType") in RESOLVED_EVENT_TYPES
            and isinstance(r.get("downloadId"), str) and r["downloadId"].strip()
        }
        seen = set()
        blind = []
        for r in history:
            if r.get("eventType") != "grabbed":
                continue
            did = str(r.get("downloadId", "")).strip().lower()
            if not did or did in seen:
                continue
            date = r.get("date")
            if not isinstance(date, str):
                continue
            age_s = now - parse_epoch(date)
            age_min = age_s / 60.0
            if age_s > window_hours * 3600.0:
                continue  # outside the window - too old to judge here
            if age_min < grace_minutes:
                continue  # too young - racing its own queue row
            seen.add(did)
            if did in queue_ids:
                continue  # tracked normally
            if did in resolved_ids:
                continue  # imported, failed or ignored - a recorded outcome,
            blind.append((did, age_min))
        return blind


    def selftest():
        now = 1_700_000_000.0

        def grabbed(did, minutes_ago):
            return {"eventType": "grabbed", "downloadId": did,
                    "date": _iso(now - minutes_ago * 60)}

        def failed(did, minutes_ago):
            return {"eventType": "downloadFailed", "downloadId": did,
                    "date": _iso(now - minutes_ago * 60)}

        def imported(did, minutes_ago):
            return {"eventType": "downloadFolderImported", "downloadId": did,
                    "date": _iso(now - minutes_ago * 60)}

        blind = find_blind([grabbed("aaaa", 60)], set(), now, 6.0, 15.0)
        assert [d for d, _ in blind] == ["aaaa"], blind

        assert find_blind([], set(), now, 6.0, 15.0) == []
        assert find_blind([imported("zzzz", 500)], set(), now, 6.0, 15.0) == []

        assert find_blind(
            [grabbed("bbbb", 90), imported("bbbb", 45)], set(), now, 6.0, 15.0
        ) == []

        assert find_blind([grabbed("cccc", 60)], {"cccc"}, now, 6.0, 15.0) == []

        assert find_blind([grabbed("dddd", 5)], set(), now, 6.0, 15.0) == []

        assert find_blind([grabbed("eeee", 500)], set(), now, 6.0, 15.0) == []

        assert find_blind([grabbed("FFFF", 60)], {"ffff"}, now, 6.0, 15.0) == []

        blind = find_blind(
            [grabbed("gggg", 60), grabbed("gggg", 55)], set(), now, 6.0, 15.0)
        assert [d for d, _ in blind] == ["gggg"], blind

        assert find_blind(
            [grabbed("f1", 60), failed("f1", 30)], set(), now, 6.0, 15.0) == []
        assert [d for d, _ in find_blind(
            [grabbed("f2", 60)], set(), now, 6.0, 15.0)] == ["f2"]

        print("selftest OK")
        return 0


    def _iso(epoch):
        return datetime.datetime.fromtimestamp(
            epoch, datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")


    def main():
        if "--selftest" in sys.argv:
            return selftest()

        import time
        now = time.time()
        print("=== blind *arr queue check @ %s ==="
              % time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(now)))
        print("window: %.0fh | grace: %.0fm" % (WINDOW_HOURS, GRACE_MINUTES))

        any_blind = False
        for name, url, key in ARRS:
            if not key:
                print("ERROR: %s API key is empty" % name, file=sys.stderr)
                return 2
            try:
                queue_ids = fetch_queue_ids(name, url, key)
                history = fetch_history(name, url, key, now, WINDOW_HOURS)
            except (urllib.error.URLError, urllib.error.HTTPError,
                    RuntimeError, ValueError) as exc:
                print("ERROR: %s: %s (http=%s)"
                      % (name, exc, http_status(exc)), file=sys.stderr)
                return 2

            grabbed_n = sum(1 for r in history if r.get("eventType") == "grabbed")
            blind = find_blind(history, queue_ids, now, WINDOW_HOURS,
                                GRACE_MINUTES)
            print("%s: %d grabbed event(s) in window | %d live queue row(s) | "
                  "%d blind" % (name, grabbed_n, len(queue_ids), len(blind)))
            for did, age_min in sorted(blind, key=lambda x: -x[1]):
                print("    downloadId=%s  age=%.0fm  no queue row, no import"
                      % (did[:12], age_min))
            if blind:
                any_blind = True

        if any_blind:
            print("\nFAIL: at least one *arr has a grab with a downloadId that "
                  "has neither a queue row nor a completed import - this is "
                  "the #834 blind-queue signature (stale TrackedDownloadService "
                  "cache, upstream root cause #705). ACTION: "
                  "`kubectl rollout restart deployment/<name> -n servarr` "
                  "released 21 imports in ~90s last time; check for an import "
                  "in flight first (#835).")
            return 1

        print("\nOK: every grab in the window has a live queue row or has "
              "already imported.")
        return 0


    if __name__ == "__main__":
        sys.exit(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: blind-queue-check
  namespace: servarr
  labels:
    app: blind-queue-check
spec:
  schedule: "40 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 6
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600  # keep 1 hour
      template:
        metadata:
          labels:
            app: blind-queue-check
        spec:
          restartPolicy: Never
          containers:
            - name: blind-queue-check
              image: python:3.13-alpine
              imagePullPolicy: IfNotPresent
              command: ["python3", "/script/check.py"]
              env:
                - name: WINDOW_HOURS
                  value: "6"
                - name: GRACE_MINUTES
                  value: "15"
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: unpackerr-secret
                      key: UN_SONARR_0_API_KEY
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: unpackerr-secret
                      key: UN_RADARR_0_API_KEY
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "250m"
                  memory: "128Mi"
          volumes:
            - name: script
              configMap:
                name: blind-queue-check-script
                defaultMode: 0555
