---

---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: system-upgrade
  labels:
    k3s-upgrade: server
spec:
  version: v1.36.4+k3s1

  concurrency: 1

  cordon: true

  drain:
    force: true
    skipWaitForDeleteTimeout: 60  # Skip pods that don't terminate within 60s
    timeout: 300s

  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values:
          - "true"

  serviceAccountName: system-upgrade

  tolerations:
    - {key: "CriticalAddonsOnly", operator: "Exists"}
    - {key: "node-role.kubernetes.io/control-plane", operator: "Exists", effect: "NoSchedule"}
    - {key: "node-role.kubernetes.io/master", operator: "Exists", effect: "NoSchedule"}
    - {key: "node-role.kubernetes.io/etcd", operator: "Exists", effect: "NoExecute"}

  upgrade:
    image: rancher/k3s-upgrade

---
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: system-upgrade
  labels:
    k3s-upgrade: agent
spec:
  version: v1.36.4+k3s1

  concurrency: 1

  cordon: true

  drain:
    force: true
    skipWaitForDeleteTimeout: 60  # Skip pods that don't terminate within 60s
    timeout: 300s

  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: NotIn
        values:
          - "true"

  prepare:
    image: rancher/k3s-upgrade
    args:
      - prepare
      - k3s-server  # Must match the server plan name above

  serviceAccountName: system-upgrade

  tolerations:
    - {key: "CriticalAddonsOnly", operator: "Exists"}
    - {key: "node-role.kubernetes.io/control-plane", operator: "Exists", effect: "NoSchedule"}
    - {key: "node-role.kubernetes.io/master", operator: "Exists", effect: "NoSchedule"}
    - {key: "node-role.kubernetes.io/etcd", operator: "Exists", effect: "NoExecute"}

  upgrade:
    image: rancher/k3s-upgrade
