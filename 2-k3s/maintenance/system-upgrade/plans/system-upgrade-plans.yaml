---
# K3s Automated Upgrade Plans using system-upgrade-controller
#
# Prerequisites:
#   Install the controller first (one-time):
#   kubectl apply -f https://github.com/rancher/system-upgrade-controller/releases/latest/download/system-upgrade-controller.yaml
#
# Deploy these plans:
#   kubectl apply -f system-upgrade-plans.yaml
#
# Monitor progress:
#   kubectl -n system-upgrade get plans,jobs -o wide
#   kubectl -n system-upgrade get pods
#
# How it works:
#   1. The controller compares each node's running K3s version to the pinned
#      spec.version below; when they differ it rolls the cluster to that version.
#      The version is PR-gated in git (issue #130) — not auto-tracked from a
#      release channel — so every bump is an explicit, reviewed change.
#   2. It upgrades server (master) nodes first, one at a time
#   3. Once ALL masters are upgraded, it upgrades worker (agent) nodes, one at a
#      time (see the `concurrency` note on the k3s-agent Plan for why not 2)
#   4. Each node is cordoned and drained before upgrading, then uncordoned after
#      a SUCCESSFUL upgrade - a drain that blows `drain.timeout` leaves the node
#      cordoned for a human to clear
#
# Upgrade order for this cluster:
#   Masters (one at a time): k3s-master-51 → k3s-master-52 → k3s-master-53
#   Workers (one at a time): k3s-worker-61 → 62 → 63 → 65

---
# Server (Master Node) Upgrade Plan
# Upgrades all nodes with the control-plane role, one at a time
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: system-upgrade
  labels:
    k3s-upgrade: server
spec:
  # Explicitly PINNED upgrade target — every bump is a reviewed git change
  # (issue #130). We no longer track the moving `channel: stable`. To bump,
  # edit this tag (and the matching one on k3s-agent below) and open a PR.
  version: v1.35.5+k3s1

  # Upgrade masters one at a time to maintain quorum (3-node etcd)
  concurrency: 1

  # Cordon the node so no new pods are scheduled during upgrade
  cordon: true

  # Drain the node before upgrading (evict all workloads gracefully)
  drain:
    force: true
    skipWaitForDeleteTimeout: 60  # Skip pods that don't terminate within 60s
    # Bound the drain instead of letting it hang (#413). Without this, a pod
    # that cannot be evicted - a PDB that can never be satisfied, an RWO volume
    # that will not detach - keeps `kubectl drain` blocking forever with the
    # node already cordoned, and the roll stalls with no timeout and no alert.
    #
    # Read this before changing the value:
    #  - It is passed straight through as `kubectl drain --timeout`; there is
    #    no controller-side timer.
    #  - On expiry the drain container exits non-zero. RestartPolicy is Never
    #    and BackoffLimit is 2, so the Job retries twice and then goes Failed.
    #  - Upstream does NOT un-cordon on failure. A blown timeout leaves the
    #    node cordoned and needs a manual `kubectl uncordon <node>` (see the
    #    README "Drain timeout" section). This bounds the hang, it does not
    #    self-heal.
    #  - Keep it under the Job's ActiveDeadlineSeconds (default 600s, set via
    #    the `default-controller-env` ConfigMap). A larger value here is cut
    #    short by the active deadline anyway; upstream only logs a warning.
    timeout: 300s

  # Only target master (control-plane) nodes
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values:
          - "true"

  # ServiceAccount created by system-upgrade-controller installation
  serviceAccountName: system-upgrade

  # REQUIRED: master/control-plane nodes carry the taint
  #   node-role.kubernetes.io/control-plane=true:NoSchedule
  # Without these tolerations the upgrade Job pod cannot be scheduled onto
  # the very nodes it must upgrade — it sits Pending/FailedScheduling and the
  # whole rollout deadlocks at 0/7. This is the standard SUC toleration set
  # covering control-plane / master / etcd taints.
  tolerations:
    - {key: "CriticalAddonsOnly", operator: "Exists"}
    - {key: "node-role.kubernetes.io/control-plane", operator: "Exists", effect: "NoSchedule"}
    - {key: "node-role.kubernetes.io/master", operator: "Exists", effect: "NoSchedule"}
    - {key: "node-role.kubernetes.io/etcd", operator: "Exists", effect: "NoExecute"}

  # The upgrade job image — handles the actual K3s binary replacement
  upgrade:
    image: rancher/k3s-upgrade

---
# Agent (Worker Node) Upgrade Plan
# Upgrades all worker nodes AFTER all masters have been upgraded
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: system-upgrade
  labels:
    k3s-upgrade: agent
spec:
  # Must match the same pinned version as the server plan
  version: v1.35.5+k3s1

  # One worker at a time. This was `2` until #413's readiness review measured
  # what a pair actually drains: the three CNPG postgres instances live on
  # workers 61 (primary), 62 and 63, all on RWO `local-path` PVCs, and worker
  # 65 hosts none. With 4 workers and pairs of 2, EVERY possible pairing puts
  # two of {61,62,63} in the same batch, and the `postgres-cluster-primary`
  # PDB allows 0 disruptions - so the second eviction is refused and the Plan
  # stalls. The `drain.timeout` below now bounds that stall instead of letting
  # it hang forever, but the node is still left cordoned when it blows, so
  # avoiding the pairing is the actual fix. `concurrency: 1` makes it
  # impossible. Cost: the worker leg takes 4 sequential drains, not 2 batches.
  concurrency: 1

  # Cordon the node so no new pods are scheduled during upgrade
  cordon: true

  # Drain the node before upgrading (evict all workloads gracefully)
  drain:
    force: true
    skipWaitForDeleteTimeout: 60  # Skip pods that don't terminate within 60s
    # Same bounded drain as the server Plan above (#413) - see that block for
    # the full behaviour notes: no controller-side timer, 3 attempts total,
    # and the node is left cordoned on expiry (manual `kubectl uncordon`).
    timeout: 300s

  # Only target worker (non-control-plane) nodes
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: NotIn
        values:
          - "true"

  # CRITICAL: Wait for all server nodes to complete their upgrade before
  # starting any worker upgrades. This ensures the control plane is stable.
  prepare:
    image: rancher/k3s-upgrade
    args:
      - prepare
      - k3s-server  # Must match the server plan name above

  # ServiceAccount created by system-upgrade-controller installation
  serviceAccountName: system-upgrade

  # Mirror the same SUC toleration set as the server Plan. Harmless on the
  # currently-untainted workers, and correct should any worker carry a
  # control-plane/etcd taint — ensures the upgrade Job can always schedule.
  tolerations:
    - {key: "CriticalAddonsOnly", operator: "Exists"}
    - {key: "node-role.kubernetes.io/control-plane", operator: "Exists", effect: "NoSchedule"}
    - {key: "node-role.kubernetes.io/master", operator: "Exists", effect: "NoSchedule"}
    - {key: "node-role.kubernetes.io/etcd", operator: "Exists", effect: "NoExecute"}

  # The upgrade job image — handles the actual K3s binary replacement
  upgrade:
    image: rancher/k3s-upgrade
