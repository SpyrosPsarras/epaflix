---
# Downloads new episodes of Greek shows from star.gr into their Sonarr series
# folders, because no indexer carries them. One CronJob per show, all sharing
# the script below.
#
# The star.gr player hides the video outside GR/CY, but that check is only a
# cookie in the browser. The HLS stream itself plays from any country, so the
# job reads the stream URL from each episode page and copies it with ffmpeg
# (no re-encode, highest variant, 1080p at the time of writing).
#
# The job asks Sonarr which episode aired on each date and names the file
# S09E04 style, so Sonarr (standard series type) and Jellyfin both match it.
#
# SEASONAL: when a show's season ends, delete its CronJob. For a later season,
# point its TAG_URL at that season's tag page (and SERIES_DIR if it changes).
apiVersion: v1
kind: ConfigMap
metadata:
  name: star-gr-download-script
  namespace: servarr
data:
  download.py: |
    #!/usr/bin/env python3
    """Download every episode listed on the star.gr tag page that is not on disk.

    Files are named "<Title> - S09E04.mp4" when Sonarr knows which episode
    aired on that date, because Jellyfin cannot map a date to an episode. Until
    TVDB lists the episode the file is named "<Title> - <date>.mp4", and a
    later run renames it. An episode Sonarr already has a file for is skipped,
    whatever that file is called.

    Exits non-zero if the tag page yields no episodes, an episode page has no
    stream URL or date, two pages share a date, or a download fails or comes
    out shorter than the source, so problems fail the Job loudly.
    """
    import os
    import re
    import subprocess
    import sys
    import json
    import urllib.request
    from html import unescape

    TAG_URL = os.environ.get("TAG_URL", "")
    SERIES_DIR = os.environ.get("SERIES_DIR", "")
    SERIES_TITLE = os.environ.get("SERIES_TITLE", "")
    SONARR_URL = os.environ.get("SONARR_URL", "http://sonarr.servarr.svc.cluster.local:8989")
    SONARR_SERIES_ID = os.environ.get("SONARR_SERIES_ID", "")
    SONARR_API_KEY = os.environ.get("SONARR_API_KEY", "")
    BASE = "https://www.star.gr"
    UA = "Mozilla/5.0"


    def fail(msg):
        print("FAIL: " + msg, file=sys.stderr)


    def fetch(url):
        req = urllib.request.Request(url, headers={"User-Agent": UA})
        with urllib.request.urlopen(req, timeout=30) as r:
            return unescape(r.read().decode("utf-8", "replace"))


    def episode_links(html, tag_url):
        # Episode links sit under the show path (relative or absolute); skip tag pages.
        show_path = re.sub(r"^https?://[^/]+", "", tag_url).rsplit("/", 1)[0]
        pat = r'href="(?:%s)?(%s/[^"/]+)"' % (re.escape(BASE), re.escape(show_path))
        return sorted({BASE + p for p in re.findall(pat, html) if "/tag_" not in p})


    def sonarr(path, body=None):
        req = urllib.request.Request(
            SONARR_URL + "/api/v3/" + path, method="POST" if body else "GET",
            data=json.dumps(body).encode() if body else None,
            headers={"X-Api-Key": SONARR_API_KEY, "Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=30) as r:
            return json.load(r)


    def episodes_by_date(episodes):
        """Map air date to its regular (non-special) episodes."""
        by_date = {}
        for e in episodes:
            if e.get("seasonNumber") and e.get("airDate"):
                by_date.setdefault(e["airDate"], []).append(e)
        return by_date


    def stream_url(html):
        m = re.search(r'https?://[^"\s]+\.m3u8\?key=[^"\s]+', html)
        return m.group(0) if m else None


    def air_date(html):
        # PlayerTitle holds the air date as day.month.year, e.g.
        # "GNTM 2026 - 22.9.2026" or "24.9.2026 - First Dates".
        m = re.search(r'"PlayerTitle":"[^"]*?(\d{1,2})\.(\d{1,2})\.(\d{4})', html)
        return "%s-%02d-%02d" % (m.group(3), int(m.group(2)), int(m.group(1))) if m else None


    def duration(target):
        r = subprocess.run(["ffprobe", "-v", "error", "-user_agent", UA,
                            "-show_entries", "format=duration", "-of", "csv=p=0", target],
                           capture_output=True, text=True)
        try:
            return float(r.stdout.strip())
        except ValueError:
            return None


    def selftest():
        tag = BASE + "/tv/x/show/tag_1998"
        page = ('<a href="/tv/x/show/ep-2292026"><a href="/tv/x/show/ep-2292026">'
                '<a href="https://www.star.gr/tv/x/show/ep-2392026">'
                '<a href="/tv/x/show/tag_1998"><a href="/tv/x/other/ep">')
        assert episode_links(page, tag) == [BASE + "/tv/x/show/ep-2292026",
                                            BASE + "/tv/x/show/ep-2392026"]
        ep = '"PlayerTitle":"GNTM 2026 - 1.10.2026 - X","Url":"https://a.b/k/s.m3u8?key=Ab_1"'
        assert air_date(ep) == "2026-10-01"
        assert air_date('"PlayerTitle":"24.9.2026 - First Dates"') == "2026-09-24"
        assert stream_url(ep) == "https://a.b/k/s.m3u8?key=Ab_1"
        assert air_date("no title") is None and stream_url("none") is None
        eps = episodes_by_date([
            {"seasonNumber": 9, "episodeNumber": 4, "airDate": "2026-09-29"},
            {"seasonNumber": 9, "episodeNumber": 5, "airDate": "2026-10-05"},
            {"seasonNumber": 9, "episodeNumber": 6, "airDate": "2026-10-05"},
            {"seasonNumber": 0, "episodeNumber": 1, "airDate": "2026-10-06"},
            {"seasonNumber": 9, "episodeNumber": 7}])
        assert sorted(eps) == ["2026-09-29", "2026-10-05"]
        assert eps["2026-09-29"][0]["episodeNumber"] == 4 and len(eps["2026-10-05"]) == 2
        print("selftest ok")


    def download(url, date, ep):
        """Return "skip", "renamed" or "done", or None after reporting a failure."""
        dated = os.path.join(SERIES_DIR, "%s - %s.mp4" % (SERIES_TITLE, date))
        out = dated
        if ep:
            if ep.get("hasFile"):
                print("skip  %s (Sonarr has a file)" % date)
                return "skip"
            out = os.path.join(SERIES_DIR, "%s - S%02dE%02d.mp4"
                               % (SERIES_TITLE, ep["seasonNumber"], ep["episodeNumber"]))
            if os.path.exists(dated) and not os.path.exists(out):
                os.rename(dated, out)
                print("renamed %s -> %s" % (date, os.path.basename(out)))
                return "renamed"
        if os.path.exists(out):
            print("skip  %s (on disk)" % date)
            return "skip"
        expected = duration(url)
        if not expected:
            fail("%s: cannot read source duration" % date)
            return None
        tmp = out + ".part"
        print("get   %s (%.0f min)" % (date, expected / 60))
        # No -map: ffmpeg picks the highest-resolution video and one audio.
        r = subprocess.run(
            ["ffmpeg", "-nostdin", "-loglevel", "warning", "-y",
             "-user_agent", UA, "-seg_max_retry", "5", "-i", url,
             "-c", "copy", "-bsf:a", "aac_adtstoasc",
             "-movflags", "+faststart", "-f", "mp4", tmp],
            stderr=subprocess.PIPE, text=True)
        if r.stderr:
            print(r.stderr[-2000:], file=sys.stderr, end="")
        # ffmpeg skips a segment it cannot fetch and still exits 0, so check the
        # warning and the length (the source and a good copy differ by < 1 s).
        holes = "failed too many times, skipping" in r.stderr
        got = duration(tmp) if r.returncode == 0 and not holes else None
        if not got or got < expected - 5:
            fail("%s: ffmpeg exit %d, skipped segments %s, got %s of %.0f s"
                 % (date, r.returncode, holes, got, expected))
            if os.path.exists(tmp):
                os.remove(tmp)
            return None
        os.rename(tmp, out)  # atomic: Sonarr/Jellyfin never see a partial file
        print("done  %s -> %s (%.1f GB)" % (date, os.path.basename(out),
                                              os.path.getsize(out) / 1e9))
        return "done"


    def main():
        if not (TAG_URL and SERIES_DIR and SERIES_TITLE and SONARR_SERIES_ID and SONARR_API_KEY):
            fail("TAG_URL, SERIES_DIR, SERIES_TITLE, SONARR_SERIES_ID, SONARR_API_KEY must be set")
            return 2
        # Started as root only to apk-add ffmpeg; write files as the *arr user.
        os.setgroups([])
        os.setgid(568)
        os.setuid(568)
        os.umask(0o002)
        os.makedirs(SERIES_DIR, exist_ok=True)

        links = episode_links(fetch(TAG_URL), TAG_URL)
        print("tag page: %d episode link(s)" % len(links))
        if not links:
            fail("no episode links on %s, star.gr layout changed?" % TAG_URL)
            return 1

        eps = episodes_by_date(sonarr("episode?seriesId=" + SONARR_SERIES_ID))
        failed, changed, seen = 0, False, {}
        for link in links:
            html = fetch(link)
            url, date = stream_url(html), air_date(html)
            if not (url and date):
                fail("%s stream=%s date=%s" % (link, bool(url), date))
                failed += 1
            elif date in seen:
                fail("%s and %s both dated %s" % (seen[date], link, date))
                failed += 1
            elif len(eps.get(date, [])) > 1:
                # Cannot tell which episode this page is; never guess or duplicate.
                fail("%s: Sonarr has %d episodes on %s" % (link, len(eps[date]), date))
                failed += 1
            else:
                seen[date] = link
                result = download(url, date, (eps.get(date) or [None])[0])
                if result is None:
                    failed += 1
                elif result != "skip":
                    changed = True

        if changed:  # import new files now instead of at Sonarr's next refresh
            sonarr("command", {"name": "RescanSeries", "seriesId": int(SONARR_SERIES_ID)})
            print("asked Sonarr to rescan series %s" % SONARR_SERIES_ID)
        return 1 if failed else 0


    if __name__ == "__main__":
        if sys.argv[1:] == ["--selftest"]:
            selftest()
            sys.exit(0)
        sys.exit(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gntm-star-download
  namespace: servarr
  labels:
    app: gntm-star-download
spec:
  schedule: "23 */3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 21600  # a backlog of 2h episodes can take hours
      ttlSecondsAfterFinished: 86400  # keep 1 day
      template:
        metadata:
          labels:
            app: gntm-star-download
        spec:
          restartPolicy: Never
          containers:
            - name: gntm-star-download
              image: python:3.13-alpine
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - apk add --no-cache ffmpeg >/dev/null && exec python3 -u /script/download.py
              env:
                - name: TAG_URL
                  value: "https://www.star.gr/tv/psychagogia/greeces-next-top-model/tag_1998"
                - name: SERIES_DIR
                  value: "/media/tvshows/Greece's Next Top Model (2009) [tvdbid-320284]"
                - name: SERIES_TITLE
                  value: "Greece's Next Top Model"
                - name: SONARR_SERIES_ID
                  value: "404"
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: unpackerr-secret
                      key: UN_SONARR_0_API_KEY
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
                - name: media
                  mountPath: /media
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
          volumes:
            - name: script
              configMap:
                name: star-gr-download-script
                defaultMode: 0555
            - name: media
              persistentVolumeClaim:
                claimName: servarr-media
---
