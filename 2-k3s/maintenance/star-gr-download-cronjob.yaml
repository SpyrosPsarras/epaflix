apiVersion: batch/v1
kind: CronJob
metadata:
  name: camping-megatv-download
  namespace: servarr
  labels:
    app: camping-megatv-download
spec:
  schedule: "38 */3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: camping-megatv-download
        spec:
          restartPolicy: Never
          nodeSelector:  # the one node approved for the PPTP conntrack helper below
            kubernetes.io/hostname: k3s-worker-62
          hostPID: true
          initContainers:
            - name: pptp-nat-helper
              image: debian:trixie-slim
              imagePullPolicy: IfNotPresent
              securityContext:
                privileged: true
              command:
                - nsenter
                - -t
                - "1"
                - -m
                - -n
                - --
                - sh
                - -ec
                - |
                  modprobe nf_conntrack_pptp
                  modprobe nf_nat_pptp
                  R='PREROUTING -s 10.42.0.0/16 -p tcp --dport 1723 -j CT --helper pptp'
                  iptables -t raw -C $R 2>/dev/null || iptables -t raw -A $R
              resources:
                requests:
                  cpu: "10m"
                  memory: "16Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
            - name: vpn
              image: debian:trixie-slim
              imagePullPolicy: IfNotPresent
              restartPolicy: Always
              securityContext:
                privileged: true
              env:
                - name: VPN_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: hcn-libero-vpn
                      key: username
                - name: VPN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: hcn-libero-vpn
                      key: password
                - name: VPN_GATEWAY
                  valueFrom:
                    secretKeyRef:
                      name: hcn-libero-vpn
                      key: gateway
              command:
                - sh
                - -ec
                - |
                  if ! { apt-get update && apt-get install -y --no-install-recommends ppp pptp-linux iproute2; } >/dev/null 2>&1; then
                    echo "VPN package installation failed" >&2
                    exit 1
                  fi
                  umask 077
                  printf '"%s" PPTP "%s" *\n' "$VPN_USERNAME" "$VPN_PASSWORD" > /etc/ppp/chap-secrets
                  chmod 600 /etc/ppp/chap-secrets
                  GW_IP=$(getent ahostsv4 "$VPN_GATEWAY" | awk '{print $1; exit}')
                  ETH_GW=$(ip route show 10.42.0.0/16 | awk '$1 == "10.42.0.0/16" {for (i=2; i<NF; i++) if ($i == "via") {print $(i+1); exit}}')
                  test -n "$GW_IP" || { echo "VPN gateway resolution failed" >&2; exit 1; }
                  test -n "$ETH_GW" || { echo "Pod eth0 gateway not found" >&2; exit 1; }
                  ip route replace "$GW_IP/32" via "$ETH_GW" dev eth0
                  pppd pty "pptp $GW_IP --nolaunchpppd" name "$VPN_USERNAME" remotename PPTP \
                    require-mppe-128 refuse-eap refuse-pap refuse-chap noauth nobsdcomp nodeflate \
                    nodefaultroute nodetach lcp-echo-interval 10 lcp-echo-failure 3 >/dev/null 2>&1 &
                  PPP_PID=$!
                  trap 'exit 0' TERM INT
                  for attempt in $(seq 1 60); do
                    if ip -4 addr show dev ppp0 2>/dev/null | grep -q 'inet '; then
                      break
                    fi
                    if ! kill -0 "$PPP_PID" 2>/dev/null || [ "$attempt" -eq 60 ]; then
                      echo "VPN tunnel startup failed" >&2
                      exit 1
                    fi
                    sleep 1
                  done
                  ip route replace 10.42.0.0/16 via "$ETH_GW" dev eth0
                  ip route replace 10.43.0.0/16 via "$ETH_GW" dev eth0
                  trap 'ip route replace unreachable default; kill "$PPP_PID" 2>/dev/null || true' EXIT
                  ip route replace default dev ppp0
                  echo "VPN tunnel ready"
                  wait "$PPP_PID" || true
                  echo "VPN tunnel exited" >&2
                  exit 1
              startupProbe:
                exec:
                  command:
                    - sh
                    - -ec
                    - ip route show default | grep -q '^default dev ppp0'
                periodSeconds: 5
                timeoutSeconds: 2
                failureThreshold: 60
              resources:
                requests:
                  cpu: "25m"
                  memory: "64Mi"
                limits:
                  cpu: "250m"
                  memory: "192Mi"
          containers:
            - name: camping-megatv-download
              image: python:3.13-alpine
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - apk add --no-cache ffmpeg >/dev/null && exec python3 -u /script/megatv.py
              env:
                - name: SHOW_URL
                  value: "https://www.megatv.com/ekpompes/2427394/kampingk/"
                - name: SHOW_LABEL
                  value: "Κάμπινγκ"
                - name: SEASON
                  value: "1"
                - name: SERIES_DIR
                  value: "/media/tvshows/Camping (2026) [tvdbid-481762]"
                - name: SERIES_TITLE
                  value: "Camping"
                - name: SONARR_SERIES_ID
                  value: "424"
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: unpackerr-secret
                      key: UN_SONARR_0_API_KEY
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
                - name: media
                  mountPath: /media
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
          volumes:
            - name: script
              configMap:
                name: star-gr-download-script
                defaultMode: 0555
            - name: media
              persistentVolumeClaim:
                claimName: servarr-media
