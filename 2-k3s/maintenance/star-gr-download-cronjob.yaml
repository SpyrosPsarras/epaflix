---
# Downloads Greek shows from star.gr and MEGA into their Sonarr folders,
# because no indexer carries them. MEGA needs a Greek PPTP VPN for geo-blocking
# and a node conntrack helper so GRE replies reach the pod.
#
# The star.gr player hides the video outside GR/CY, but that check is only a
# cookie in the browser. The HLS stream itself plays from any country, so the
# job gets the stream URL from each episode page and copies it with ffmpeg
# (no re-encode, highest variant, 1080p at the time of writing).
#
# The job asks Sonarr which episode aired on each date and names the file
# S09E04 style, so Sonarr (standard series type) and Jellyfin both match it.
#
# SEASONAL: when a show's season ends, delete its CronJob. For a later season,
# update TAG_URL, or SHOW_URL and SEASON for MEGA (and SERIES_DIR if it changes).
apiVersion: v1
kind: ConfigMap
metadata:
  name: star-gr-download-script
  namespace: servarr
data:
  download.py: |
    #!/usr/bin/env python3
    """Download every episode listed on the star.gr tag page that is not on disk.

    Files are named "<Title> - S09E04.mp4" when Sonarr knows which episode
    aired on that date, because Jellyfin cannot map a date to an episode. Until
    TVDB lists the episode the file is named "<Title> - <date>.mp4", and a
    later run renames it. An episode Sonarr already has a file for is skipped,
    whatever that file is called.

    Exits non-zero if the tag page yields no episodes, an episode page has no
    date, a missing episode has no star.gr stream, two pages share a date,
    Sonarr has multiple episodes on a date, or a download fails or comes out
    shorter than the source, so problems fail the Job loudly.
    """
    import os
    import re
    import subprocess
    import sys
    import json
    import urllib.request
    from html import unescape

    TAG_URL = os.environ.get("TAG_URL", "")
    SERIES_DIR = os.environ.get("SERIES_DIR", "")
    SERIES_TITLE = os.environ.get("SERIES_TITLE", "")
    SONARR_URL = os.environ.get("SONARR_URL", "http://sonarr.servarr.svc.cluster.local:8989")
    SONARR_SERIES_ID = os.environ.get("SONARR_SERIES_ID", "")
    SONARR_API_KEY = os.environ.get("SONARR_API_KEY", "")
    BASE = "https://www.star.gr"
    UA = "Mozilla/5.0"


    def fail(msg):
        print("FAIL: " + msg, file=sys.stderr)


    def fetch(url):
        req = urllib.request.Request(url, headers={"User-Agent": UA})
        with urllib.request.urlopen(req, timeout=30) as r:
            return unescape(r.read().decode("utf-8", "replace"))


    def episode_links(html, tag_url):
        # Episode links sit under the show path (relative or absolute); skip tag pages.
        show_path = re.sub(r"^https?://[^/]+", "", tag_url).rsplit("/", 1)[0]
        pat = r'href="(?:%s)?(%s/[^"/]+)"' % (re.escape(BASE), re.escape(show_path))
        return sorted({BASE + p for p in re.findall(pat, html) if "/tag_" not in p})


    def sonarr(path, body=None):
        req = urllib.request.Request(
            SONARR_URL + "/api/v3/" + path, method="POST" if body else "GET",
            data=json.dumps(body).encode() if body else None,
            headers={"X-Api-Key": SONARR_API_KEY, "Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=30) as r:
            return json.load(r)


    def episodes_by_date(episodes):
        """Map air date to its regular (non-special) episodes."""
        by_date = {}
        for e in episodes:
            if e.get("seasonNumber") and e.get("airDate"):
                by_date.setdefault(e["airDate"], []).append(e)
        return by_date


    def stream_url(html):
        m = re.search(r'https?://[^"\s]+\.m3u8\?key=[^"\s]+', html)
        if m:
            return m.group(0)
        if re.search(r'"LivestreamModeStr"\s*:\s*"Kaltura"', html):
            return None
        m = re.search(r'"VideoID"\s*:\s*"([^"\s]+)"', html)
        return "https://deliver2.siliconweb.com/kwik/star.m3u8?key=" + m.group(1) if m else None


    def air_date(html):
        # PlayerTitle holds the air date as day.month.year, e.g.
        # "GNTM 2026 - 22.9.2026" or "24.9.2026 - First Dates".
        m = (re.search(r'"PlayerTitle":"[^"]*?(\d{1,2})\.(\d{1,2})\.(\d{4})', html)
             or re.search(r'"name"\s*:\s*"[^"]*?(\d{1,2})\.(\d{1,2})\.(\d{4})', html))
        return "%s-%02d-%02d" % (m.group(3), int(m.group(2)), int(m.group(1))) if m else None


    def duration(target):
        r = subprocess.run(["ffprobe", "-v", "error", "-user_agent", UA,
                            "-show_entries", "format=duration", "-of", "csv=p=0", target],
                           capture_output=True, text=True)
        try:
            return float(r.stdout.strip())
        except ValueError:
            return None


    def selftest():
        tag = BASE + "/tv/x/show/tag_1998"
        page = ('<a href="/tv/x/show/ep-2292026"><a href="/tv/x/show/ep-2292026">'
                '<a href="https://www.star.gr/tv/x/show/ep-2392026">'
                '<a href="/tv/x/show/tag_1998"><a href="/tv/x/other/ep">')
        assert episode_links(page, tag) == [BASE + "/tv/x/show/ep-2292026",
                                            BASE + "/tv/x/show/ep-2392026"]
        ep = '"PlayerTitle":"GNTM 2026 - 1.10.2026 - X","Url":"https://a.b/k/s.m3u8?key=Ab_1"'
        assert air_date(ep) == "2026-10-01"
        assert air_date('"PlayerTitle":"24.9.2026 - First Dates"') == "2026-09-24"
        video = '{"@type": "VideoObject", "name": "23.9.2026 - First Dates - Πρεμιέρα!"}'
        assert air_date('"name": "Star TV",' + video) == "2026-09-23"
        assert air_date('"name": "Star TV"') is None
        assert air_date(video + ',"PlayerTitle":"24.9.2026 - First Dates"') == "2026-09-24"
        assert download(None, "2026-09-23", {"hasFile": True}) == "skip"
        assert stream_url(ep) == "https://a.b/k/s.m3u8?key=Ab_1"
        custom = '"LivestreamModeStr":"Custom","VideoID":"n0z3nOXvwtbeJgkkq9l14A"'
        assert stream_url(custom) == "https://deliver2.siliconweb.com/kwik/star.m3u8?key=n0z3nOXvwtbeJgkkq9l14A"
        assert stream_url('"LivestreamModeStr":"Kaltura","VideoID":"Ab_1"') is None
        assert air_date("no title") is None and stream_url("none") is None
        eps = episodes_by_date([
            {"seasonNumber": 9, "episodeNumber": 4, "airDate": "2026-09-29"},
            {"seasonNumber": 9, "episodeNumber": 5, "airDate": "2026-10-05"},
            {"seasonNumber": 9, "episodeNumber": 6, "airDate": "2026-10-05"},
            {"seasonNumber": 0, "episodeNumber": 1, "airDate": "2026-10-06"},
            {"seasonNumber": 9, "episodeNumber": 7}])
        assert sorted(eps) == ["2026-09-29", "2026-10-05"]
        assert eps["2026-09-29"][0]["episodeNumber"] == 4 and len(eps["2026-10-05"]) == 2
        import contextlib
        import io
        import tempfile
        global SERIES_DIR
        series_dir = SERIES_DIR
        try:
            with tempfile.TemporaryDirectory() as SERIES_DIR:
                errors = io.StringIO()
                link = BASE + "/tv/x/show/ep-2392026"
                with contextlib.redirect_stderr(errors):
                    assert download(None, "2026-09-23", None, link) is None
                assert "FAIL: %s: no star.gr stream" % link in errors.getvalue()
                assert download(None, None, {"hasFile": True}) == "skip"
                ep = {"seasonNumber": 1, "episodeNumber": 1}
                out = os.path.join(SERIES_DIR, "%s - S01E01.mp4" % SERIES_TITLE)
                with open(out, "w"):
                    pass
                assert download(None, None, ep) == "skip"
                os.remove(out)
                from unittest.mock import patch
                with contextlib.redirect_stderr(errors), patch(__name__ + ".duration", return_value=None) as probe:
                    assert download("https://example.test/video.m3u8", None, ep, link) is None
                    probe.assert_not_called()
                assert "FAIL: %s: no air date" % link in errors.getvalue()
        finally:
            SERIES_DIR = series_dir
        print("selftest ok")


    def download(url, date, ep, page_url=None):
        """Return "skip", "renamed" or "done", or None after reporting a failure."""
        dated = os.path.join(SERIES_DIR, "%s - %s.mp4" % (SERIES_TITLE, date))
        out = dated
        if ep:
            if ep.get("hasFile"):
                print("skip  %s (Sonarr has a file)" % date)
                return "skip"
            out = os.path.join(SERIES_DIR, "%s - S%02dE%02d.mp4"
                               % (SERIES_TITLE, ep["seasonNumber"], ep["episodeNumber"]))
            if os.path.exists(dated) and not os.path.exists(out):
                os.rename(dated, out)
                print("renamed %s -> %s" % (date, os.path.basename(out)))
                return "renamed"
        if os.path.exists(out):
            print("skip  %s (on disk)" % date)
            return "skip"
        if not date:
            fail("%s: no air date" % (page_url or date))
            return None
        if url is None:
            fail("%s: no star.gr stream" % (page_url or date))
            return None
        expected = duration(url)
        if not expected:
            fail("%s: cannot read source duration" % date)
            return None
        tmp = out + ".part"
        print("get   %s (%.0f min)" % (date, expected / 60))
        # No -map: ffmpeg picks the highest-resolution video and one audio.
        r = subprocess.run(
            ["ffmpeg", "-nostdin", "-loglevel", "warning", "-y",
             "-user_agent", UA, "-seg_max_retry", "5", "-i", url,
             "-c", "copy", "-bsf:a", "aac_adtstoasc",
             "-movflags", "+faststart", "-f", "mp4", tmp],
            stderr=subprocess.PIPE, text=True)
        if r.stderr:
            print(r.stderr[-2000:], file=sys.stderr, end="")
        # ffmpeg skips a segment it cannot fetch and still exits 0, so check the
        # warning and the length (the source and a good copy differ by < 1 s).
        holes = "failed too many times, skipping" in r.stderr
        got = duration(tmp) if r.returncode == 0 and not holes else None
        if not got or got < expected - 5:
            fail("%s: ffmpeg exit %d, skipped segments %s, got %s of %.0f s"
                 % (date, r.returncode, holes, got, expected))
            if os.path.exists(tmp):
                os.remove(tmp)
            return None
        os.rename(tmp, out)  # atomic: Sonarr/Jellyfin never see a partial file
        print("done  %s -> %s (%.1f GB)" % (date, os.path.basename(out),
                                              os.path.getsize(out) / 1e9))
        return "done"


    def prepare_directory():
        # Started as root only to apk-add ffmpeg; write files as the *arr user.
        os.setgroups([])
        os.setgid(568)
        os.setuid(568)
        os.umask(0o002)
        os.makedirs(SERIES_DIR, exist_ok=True)


    def rescan():
        sonarr("command", {"name": "RescanSeries", "seriesId": int(SONARR_SERIES_ID)})
        print("asked Sonarr to rescan series %s" % SONARR_SERIES_ID)


    def main():
        if not (TAG_URL and SERIES_DIR and SERIES_TITLE and SONARR_SERIES_ID and SONARR_API_KEY):
            fail("TAG_URL, SERIES_DIR, SERIES_TITLE, SONARR_SERIES_ID, SONARR_API_KEY must be set")
            return 2
        prepare_directory()
        links = episode_links(fetch(TAG_URL), TAG_URL)
        print("tag page: %d episode link(s)" % len(links))
        if not links:
            fail("no episode links on %s, star.gr layout changed?" % TAG_URL)
            return 1

        eps = episodes_by_date(sonarr("episode?seriesId=" + SONARR_SERIES_ID))
        failed, changed, seen = 0, False, {}
        for link in links:
            html = fetch(link)
            url, date = stream_url(html), air_date(html)
            if not date:
                fail("%s stream=%s date=%s" % (link, bool(url), date))
                failed += 1
            elif date in seen:
                fail("%s and %s both dated %s" % (seen[date], link, date))
                failed += 1
            elif len(eps.get(date, [])) > 1:
                # Cannot tell which episode this page is; never guess or duplicate.
                fail("%s: Sonarr has %d episodes on %s" % (link, len(eps[date]), date))
                failed += 1
            else:
                seen[date] = link
                result = download(url, date, (eps.get(date) or [None])[0], link)
                if result is None:
                    failed += 1
                elif result != "skip":
                    changed = True

        if changed:  # import new files now instead of at Sonarr's next refresh
            rescan()
        return 1 if failed else 0


    if __name__ == "__main__":
        if sys.argv[1:] == ["--selftest"]:
            selftest()
            sys.exit(0)
        sys.exit(main())
  megatv.py: |
    #!/usr/bin/env python3
    import os
    import re
    import sys
    from http.client import HTTPException
    from html.parser import HTMLParser
    from urllib.parse import urljoin, urlsplit

    import download as shared

    SHOW_URL = os.environ.get("SHOW_URL", "")
    SHOW_LABEL = os.environ.get("SHOW_LABEL", "")
    SEASON = os.environ.get("SEASON", "")


    class Page(HTMLParser):
        def __init__(self, html):
            super().__init__(convert_charrefs=True)
            self.tags = []
            self.feed(html)

        def handle_starttag(self, tag, attrs):
            self.tags.append(dict(attrs))


    def episode_links(html, show_url):
        links = set()
        for attrs in Page(html).tags:
            link = urljoin(show_url, attrs.get("href") or "")
            parts = urlsplit(link)
            if (parts.scheme in ("http", "https") and parts.netloc == urlsplit(show_url).netloc
                    and re.fullmatch(r"/tvshows/\d+/epeisodio-\d+-[^/]+/?", parts.path)):
                links.add(link)
        return sorted(links)


    def episode_data(html, show_label):
        for attrs in Page(html).tags:
            match = re.match(r"^%s: Επεισόδιο (\d+)(?:\s|$)" % re.escape(show_label),
                             attrs.get("data-kwik_label") or "")
            if match:
                return (int(match.group(1)), attrs.get("data-kwik_source") or None,
                        attrs.get("data-kwik_pudate") or None)
        return None


    def selftest():
        show = "https://www.megatv.com/ekpompes/2427394/kampingk/"
        page = ('<a href="/tvshows/123/epeisodio-21-a/">'
                '<a href="https://www.megatv.com/tvshows/123/epeisodio-21-a/">'
                "<a href='/tvshows/124/epeisodio-20-b/'>"
                '<a href="https://other.test/tvshows/125/epeisodio-19-c/">'
                '<a href="/ekpompes/2427394/kampingk/">')
        assert episode_links(page, show) == [
            "https://www.megatv.com/tvshows/123/epeisodio-21-a/",
            "https://www.megatv.com/tvshows/124/epeisodio-20-b/"]
        player = ('<div data-kwik_source="https://a.msvdn.net/vod/123/PK6/playlist.m3u8?a=1&amp;b=2" '
                  'data-kwik_label="Κάμπινγκ: Επεισόδιο 21 " data-kwik_pudate="2026-11-17">')
        assert episode_data(player, "Κάμπινγκ") == (
            21, "https://a.msvdn.net/vod/123/PK6/playlist.m3u8?a=1&b=2", "2026-11-17")
        assert episode_data(player.replace("Κάμπινγκ", "Άλλη σειρά"), "Κάμπινγκ") is None
        assert episode_data(player.replace("21 ", "21extra"), "Κάμπινγκ") is None
        assert episode_data(player.replace("Κάμπινγκ", "Κ&#940;μπινγκ"), "Κάμπινγκ")[0] == 21
        assert episode_data('<div data-kwik_label="Κάμπινγκ: Επεισόδιο 1">', "Κάμπινγκ") == (1, None, None)
        assert episode_data("no player", "Κάμπινγκ") is None
        import contextlib
        import http.client
        import io
        import tempfile
        from unittest.mock import patch
        links = ["https://www.megatv.com/tvshows/123/epeisodio-1-a/",
                 "https://www.megatv.com/tvshows/124/epeisodio-2-b/"]
        listing = "".join('<a href="%s">' % link for link in links)
        ep = {"seasonNumber": 1, "episodeNumber": 1, "hasFile": True}
        second = ('<div data-kwik_label="Κάμπινγκ: Επεισόδιο 2" '
                  'data-kwik_source="https://example.test/v.m3u8" data-kwik_pudate="2026-11-17">')
        cases = [
            ("no player", True, False, 1, "no Κάμπινγκ episode label"),
            ('<div data-kwik_label="Κάμπινγκ: Επεισόδιο 1">', True, False, 0, ""),
            ('<div data-kwik_label="Κάμπινγκ: Επεισόδιο 1">', False, True, 0, ""),
            ('<div data-kwik_label="Κάμπινγκ: Επεισόδιο 1" data-kwik_source="https://example.test/v.m3u8">',
             False, False, 1, "no air date"),
            (http.client.IncompleteRead(b"", 10), True, False, 1, "IncompleteRead"),
        ]
        for first, has_file, on_disk, status, error in cases:
            with tempfile.TemporaryDirectory() as directory:
                ep["hasFile"] = has_file
                if on_disk:
                    with open(os.path.join(directory, "Test - S01E01.mp4"), "w"):
                        pass
                pages = iter([listing, first, second])
                def fetch(url):
                    page = next(pages)
                    if isinstance(page, Exception):
                        raise page
                    return page
                output, errors = io.StringIO(), io.StringIO()
                with (patch.multiple(sys.modules[__name__], SHOW_URL=show, SHOW_LABEL="Κάμπινγκ", SEASON="1"),
                      patch.multiple(shared, SERIES_DIR=directory, SERIES_TITLE="Test",
                                     SONARR_SERIES_ID="1", SONARR_API_KEY="test"),
                      patch.object(shared, "prepare_directory"), patch.object(shared, "fetch", fetch),
                      patch.object(shared, "sonarr", return_value=[ep, {"seasonNumber": 1, "episodeNumber": 2, "hasFile": True}]),
                      contextlib.redirect_stdout(output), contextlib.redirect_stderr(errors)):
                    assert main() == status, (first, errors.getvalue())
                assert "Sonarr has a file" in output.getvalue(), output.getvalue()
                assert next(pages, None) is None
                assert ("FAIL:" in errors.getvalue()) == bool(status), errors.getvalue()
                assert error in errors.getvalue(), errors.getvalue()
        print("selftest ok")


    def main():
        if not (SHOW_URL and SHOW_LABEL and SEASON and shared.SERIES_DIR and shared.SERIES_TITLE
                and shared.SONARR_SERIES_ID and shared.SONARR_API_KEY):
            shared.fail("SHOW_URL, SHOW_LABEL, SEASON, SERIES_DIR, SERIES_TITLE, SONARR_SERIES_ID, SONARR_API_KEY must be set")
            return 2
        season = int(SEASON)
        if season < 1:
            shared.fail("SEASON must be positive")
            return 2
        shared.prepare_directory()
        links = episode_links(shared.fetch(SHOW_URL), SHOW_URL)
        print("show page: %d episode link(s)" % len(links))
        if not links:
            shared.fail("no episode links on %s, MEGA layout changed?" % SHOW_URL)
            return 1
        eps = {(ep["seasonNumber"], ep["episodeNumber"]): ep
               for ep in shared.sonarr("episode?seriesId=" + shared.SONARR_SERIES_ID)}
        failed, changed, seen = 0, False, {}
        for link in links:
            try:
                data = episode_data(shared.fetch(link), SHOW_LABEL)
                if data is None:
                    shared.fail("%s: no %s episode label" % (link, SHOW_LABEL))
                    failed += 1
                    continue
                number, url, date = data
                if number in seen:
                    shared.fail("%s and %s both episode %d" % (seen[number], link, number))
                    failed += 1
                    continue
                seen[number] = link
                ep = eps.get((season, number))
                if ep is None:
                    shared.fail("%s: Sonarr has no S%02dE%02d" % (link, season, number))
                    failed += 1
                else:
                    result = shared.download(url, date, ep, link)
                    if result is None:
                        failed += 1
                    elif result != "skip":
                        changed = True
            except (OSError, ValueError, HTTPException) as exc:
                shared.fail("%s: %s" % (link, exc))
                failed += 1
        if not seen:
            shared.fail("zero matching %s episodes on %s" % (SHOW_LABEL, SHOW_URL))
            failed += 1
        if changed:
            shared.rescan()
        return 1 if failed else 0


    if __name__ == "__main__":
        if sys.argv[1:] == ["--selftest"]:
            selftest()
            sys.exit(0)
        try:
            sys.exit(main())
        except (OSError, ValueError, HTTPException) as exc:
            shared.fail(str(exc))
            sys.exit(1)
