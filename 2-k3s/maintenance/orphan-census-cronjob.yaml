---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orphan-census-script
  namespace: servarr
data:
  census.py: |
    #!/usr/bin/env python3
    """qBittorrent orphan census (#483). Python stdlib only - no pip, no apk.

    Run with --selftest to exercise the classifier against synthetic torrents
    without touching the network.
    """
    import http.cookiejar
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    TIMEOUT = 30

    ARMED = os.environ.get("ARMED", "false").strip().lower() == "true"

    DELETE_FILES = "true"

    MIN_AGE_HOURS = float(os.environ.get("MIN_AGE_HOURS", "24"))

    NO_PROGRESS_HOURS = float(os.environ.get("NO_PROGRESS_HOURS", "24"))

    CATEGORY_ARR = dict(
        pair.split("=", 1)
        for pair in os.environ.get(
            "CATEGORY_ARR_MAP",
            "tv-sonarr=sonarr,animes=sonarr,radarr=radarr").split(",")
        if "=" in pair
    )

    KEEP_CATEGORIES = {
        c.strip()
        for c in os.environ.get(
            "KEEP_CATEGORIES", "avistaz-reseed,manual-import"
        ).split(",")
        if c.strip()
    }

    KEEP_HASH_PREFIXES = ()

    ACTIVE_WITHIN_HOURS = float(os.environ.get("ACTIVE_WITHIN_HOURS", "6"))

    MAX_HISTORY_LOOKUPS = int(os.environ.get("MAX_HISTORY_LOOKUPS", "4"))

    QBT_URL = os.environ.get("QBT_URL", "http://qbittorrent:8080").rstrip("/")
    ARRS = [
        ("sonarr", os.environ.get("SONARR_URL", "http://sonarr:8989"),
         os.environ.get("SONARR_API_KEY", "")),
        ("radarr", os.environ.get("RADARR_URL", "http://radarr:7878"),
         os.environ.get("RADARR_API_KEY", "")),
    ]

    GB = 1024.0 ** 3


    def fail(msg):
        """Abort LOUD. Never let a failed read look like 'no orphans'."""
        print("ERROR: " + msg, file=sys.stderr)
        sys.exit(2)


    def http_status(exc):
        """Status code only - never echo a response body, it can carry a key."""
        return str(exc.code) if isinstance(exc, urllib.error.HTTPError) else "-"


    def qbt_login():
        cj = http.cookiejar.CookieJar()
        opener = urllib.request.build_opener(
            urllib.request.HTTPCookieProcessor(cj))
        body = urllib.parse.urlencode({
            "username": os.environ.get("QBT_USERNAME", ""),
            "password": os.environ.get("QBT_PASSWORD", ""),
        }).encode()
        req = urllib.request.Request(
            QBT_URL + "/api/v2/auth/login", data=body,
            headers={"Referer": QBT_URL})
        try:
            answer = opener.open(req, timeout=TIMEOUT).read().decode().strip()
        except Exception as exc:  # noqa: BLE001 - any failure is fatal here
            fail("qBittorrent login request failed (%s, http=%s)"
                 % (type(exc).__name__, http_status(exc)))
        if answer and answer != "Ok.":
            fail("qBittorrent login rejected")
        return opener


    def qbt_torrents(opener):
        try:
            with opener.open(QBT_URL + "/api/v2/torrents/info",
                             timeout=TIMEOUT) as resp:
                torrents = json.load(resp)
        except urllib.error.HTTPError as exc:
            if exc.code == 403:
                fail("qBittorrent rejected the session (http=403) - the WebUI "
                     "credential in Secret qbittorrent-webui-credentials is "
                     "wrong or the client IP is banned")
            fail("qBittorrent torrent list failed (HTTPError, http=%d)"
                 % exc.code)
        except Exception as exc:  # noqa: BLE001
            fail("qBittorrent torrent list failed (%s, http=%s)"
                 % (type(exc).__name__, http_status(exc)))
        if not isinstance(torrents, list):
            fail("qBittorrent torrent list was not a JSON array")
        return torrents


    def arr_download_ids(name, url, key):
        """Return the set of live downloadIds for one *arr, lowercased.

        Fails closed on EVERY error path. A silently-empty queue here would make
        every torrent in the client look like an orphan.
        """
        if not key:
            fail("%s: API key is empty" % name)
        query = urllib.parse.urlencode({
            "page": 1,
            "pageSize": 1000,
            "includeUnknownSeriesItems": "true",
            "includeUnknownMovieItems": "true",
        })
        req = urllib.request.Request(
            "%s/api/v3/queue?%s" % (url.rstrip("/"), query),
            headers={"X-Api-Key": key})
        try:
            with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                doc = json.load(resp)
        except Exception as exc:  # noqa: BLE001
            fail("%s: queue fetch failed (%s, http=%s)"
                 % (name, type(exc).__name__, http_status(exc)))
        records = doc.get("records")
        if not isinstance(records, list):
            fail("%s: queue response has no 'records' array" % name)
        total = doc.get("totalRecords", len(records))
        if total > len(records):
            fail("%s: queue is paginated (%d records, %d fetched) - refusing to "
                 "run against a partial queue" % (name, total, len(records)))
        ids = {r["downloadId"].strip().lower()
               for r in records
               if isinstance(r.get("downloadId"), str) and r["downloadId"].strip()}
        return ids, len(records)


    def orphans_by_arr(orphans):
        """{*arr name or None: count} for a list of torrents, by category (#632).

        None is the bucket for categories no *arr owns - no per-*arr guard can
        speak for those.
        """
        out = {}
        for t in orphans:
            arr = CATEGORY_ARR.get(str(t.get("category", "")))
            out[arr] = out.get(arr, 0) + 1
        return out


    def queue_read_path_suspect(arr_rows, active_by_arr):
        """Names of *arrs whose empty queue looks BROKEN rather than idle.

        Per-*arr (#632): *arr X reports 0 queue rows AND at least one
        RECENTLY ACTIVE torrent sits in a category X owns. Something that
        moved bytes in the last ACTIVE_WITHIN_HOURS is being worked on right
        now, so the *arr that owns it must have a queue row for it. Zero rows
        against live traffic is a blind *arr - the #631 shape exactly, where
        nine Sonarr grabs sat at metaDL while the queue read returned nothing.

        What this deliberately no longer looks at is orphan-shape. That was
        the original #632 test and it is self-defeating: an orphan has no
        queue row BY DEFINITION, and it is stale and old by definition too,
        so "0 rows + an orphan in my category" is exactly what a real orphan
        looks like on an idle *arr. Judging on that made the guard fire on
        every genuine finding, and the census never once completed - it had
        no successful run in the four days after it shipped, which also left

        Torrents in categories no *arr owns can only be judged fleet-wide, so
        they keep the original all-zero rule, now likewise on live activity.

        A genuinely idle cluster (queues at 0, nothing moving) is legitimate
        and must stay quiet.
        """
        suspect = [name for name, n in sorted(arr_rows.items())
                   if n == 0 and active_by_arr.get(name, 0) > 0]
        if active_by_arr.get(None) and arr_rows and all(
                n == 0 for n in arr_rows.values()):
            suspect.append("unmapped-categories")
        return suspect


    def is_live_work(torrent, now):
        """True if this torrent is incomplete AND moved bytes recently.

        Completeness is not optional here. `last_activity` counts UPLOAD too, so
        a finished torrent that seeds looks active forever while legitimately
        having no queue row.
        """
        if float(torrent.get("progress", 0.0)) >= 1.0 or int(
                torrent.get("amount_left", 1) or 0) <= 0:
            return False
        return idle_hours(torrent, now) < ACTIVE_WITHIN_HOURS


    def active_hashes_by_arr(torrents, now):
        """{*arr name or None: set of UPPERCASE hashes} still moving bytes.

        The hashes matter because a suspect *arr has to be asked about its own
        torrents by downloadId, and the *arr APIs store the infohash uppercased
        while qBittorrent reports it lowercased (#834).

        A torrent with no usable hash is skipped, because an empty string sent
        as a downloadId filter is an *arr-side wildcard risk, not a lookup. It
        is NOT dropped from the problem: recently_active_by_arr() still counts
        it, and main() refuses to clear an *arr whose hash count and active
        count disagree. Unqueryable therefore means unexplained.
        """
        out = {}
        for t in torrents:
            if not is_live_work(t, now):
                continue
            digest = str(t.get("hash", "")).strip().upper()
            if not digest:
                continue
            arr = CATEGORY_ARR.get(str(t.get("category", "")))
            out.setdefault(arr, set()).add(digest)
        return out


    def recently_active_by_arr(torrents, now):
        """{*arr name or None: count} of torrents that moved bytes recently.

        This is the positive health signal the guard needs: proof that work is
        in flight for that *arr right now. Absence of it is NOT proof of
        breakage, which is why an idle *arr is allowed to report orphans.

        Completeness is not optional here. `last_activity` counts UPLOAD too,
        so a finished torrent that is seeding looks "recently active" forever
        while legitimately having no queue row - the *arr imported it and
        dropped it long ago. Counting seeders made the first version of this
        guard abort with "sonarr reads 0 rows while 27 of its torrents are
        active", against a client holding 208 mostly-seeding torrents. Only an
        INCOMPLETE torrent that is still moving is work an *arr queue must
        know about.
        """
        out = {}
        for t in torrents:
            if not is_live_work(t, now):
                continue
            arr = CATEGORY_ARR.get(str(t.get("category", "")))
            out[arr] = out.get(arr, 0) + 1
        return out


    def newest_is_failure(records):
        """True if the newest *arr history record is a terminal failure.

        Pure, so the selftest can pin it. records[0] must be the newest, and the
        caller VERIFIES that rather than trusting the sort it asked for.

        `downloadFailed` ONLY. `downloadIgnored` is deliberately not here: #834
        established the mechanism for `Failed`, and an ignored download licenses
        a weaker conclusion. Adding it would widen the silence past the evidence.
        """
        return bool(records) and records[0].get("eventType") == "downloadFailed"


    def check_history_response(name, digest, records):
        """Abort unless the *arr answered the question that was actually asked.

        Two ways a well-formed 200 can still be the wrong answer, and both of
        them resolve to "explained" if they go unchecked:

        1. The filter was not applied. An empty downloadId returns
           totalRecords 8462 on this instance, so an unapplied filter means
           "newest event of the WHOLE instance", which would explain every hash
           at once and clear a genuinely blind *arr. A renamed parameter or a
           proxy that strips the query string lands exactly there.
        2. The sort was not honoured, so records[0] is not the newest. A stale
           downloadFailed under a newer grabbed would then explain a re-grab
           that is downloading right now (#1133).

        A record with no usable `date` is not evidence of ordering, so it aborts
        rather than passing an empty-string comparison. Equal dates are
        ambiguous for the same reason.
        """
        for rec in records:
            got = str(rec.get("downloadId", "")).strip().upper()
            if got != digest:
                fail("%s: history filter was not applied for %s (server "
                     "answered for %s) - refusing to read that as an answer "
                     "about this torrent"
                     % (name, digest[:8], got[:8] or "<none>"))
        if len(records) < 2:
            return
        dates = [str(r.get("date", "")).strip() for r in records[:2]]
        if not all(dates):
            fail("%s: history record for %s carries no date, so the sort "
                 "cannot be verified - refusing to treat record 0 as the "
                 "newest event" % (name, digest[:8]))
        if dates[0] <= dates[1]:
            fail("%s: history for %s did not come back newest-first despite "
                 "sortDirection=descending - refusing to treat record 0 as the "
                 "newest event" % (name, digest[:8]))


    def arr_cleared(queryable, live, unexplained):
        """True if a suspect *arr's zero-row queue read is fully accounted for.

        Every live torrent must have been asked about (queryable == live) and
        every answer must have been a failure (no unexplained left). A partial
        answer is not an answer: `queryable < live` means at least one live
        torrent had no hash to look up, and that *arr stays suspect.
        """
        return not unexplained and queryable == live


    def unexplained_active(active_hashes, failed_hashes):
        """Hashes that a zero queue read still does not account for.

        A download the *arr itself has marked failed is NOT work in flight, so
        its absence from the queue is correct rather than evidence of a broken
        read. Sonarr pins such a tracked download at `Failed` and re-seeds that
        state from DownloadHistory on every restart, and `DownloadIsTrackable()`
        keeps `Failed` out of the queue permanently, so the torrent can sit in
        the client forever with no queue row and a working queue read (#834).

        Everything else stays unexplained, which keeps the guard fail-closed:
        an empty failed set leaves every active hash unexplained and the *arr
        stays suspect.

        "Explained" is a claim about the QUEUE READ, not about the torrent. The
        torrent is not fine: it keeps downloading into a Failed tracked state,
        it will never be imported, and it leaves this census's scope for good
        once it completes. That population belongs to #1029.
        """
        return sorted(h for h in active_hashes if h not in failed_hashes)


    def arr_failed_downloadids(name, url, key, hashes):
        """Subset of `hashes` whose NEWEST *arr history event is a failure.

        One request per hash, and only ever called for an *arr already flagged
        suspect, so the call count is bounded by that *arr's live torrents.

        Fails closed like every other read in this script. A history read that
        breaks must not resolve into "explained" - that would turn this guard
        into a check that cannot fail.

        `downloadId` filtering is case-SENSITIVE: the lowercase hash that
        qBittorrent reports returns totalRecords 0, which is indistinguishable
        from "no history at all". Callers must pass uppercase hashes.

        Only the v1 `hash` is looked up, while classify() also matches
        `infohash_v1`/`infohash_v2` against the queue. For a v2 or hybrid torrent
        whose *arr downloadId is the v1 infohash, this lookup returns 0 records,
        the torrent stays unexplained and the abort stands. That asymmetry is
        deliberate and points the safe way. Do not "fix" it into the other one.
        """
        if len(hashes) > MAX_HISTORY_LOOKUPS:
            fail("%s: %d live torrents to look up, over the %d cap - refusing "
                 "to spend the Job's whole deadline on serial history reads. "
                 "Raise MAX_HISTORY_LOOKUPS if this is legitimate."
                 % (name, len(hashes), MAX_HISTORY_LOOKUPS))
        failed = set()
        for digest in sorted(hashes):
            query = urllib.parse.urlencode({
                "downloadId": digest,
                "page": 1,
                "pageSize": 2,
                "sortKey": "date",
                "sortDirection": "descending",
            })
            req = urllib.request.Request(
                "%s/api/v3/history?%s" % (url.rstrip("/"), query),
                headers={"X-Api-Key": key})
            try:
                with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                    doc = json.load(resp)
            except Exception as exc:  # noqa: BLE001
                fail("%s: history fetch for %s failed (%s, http=%s)"
                     % (name, digest[:8], type(exc).__name__, http_status(exc)))
            records = doc.get("records")
            if not isinstance(records, list):
                fail("%s: history response for %s has no 'records' array"
                     % (name, digest[:8]))
            check_history_response(name, digest, records)
            if newest_is_failure(records):
                failed.add(digest)
        return failed


    def idle_hours(torrent, now):
        """Hours since qBittorrent last moved a byte for this torrent (#631).

        Falls back to age when `last_activity` is missing or <= 0 (never
        transferred anything). A future timestamp (clock skew) yields a
        negative value, which reads as 'active' - the fail-safe direction.
        """
        last = float(torrent.get("last_activity", 0) or 0)
        if last <= 0:
            last = float(torrent.get("added_on", now))
        return (now - last) / 3600.0


    def classify(torrent, queued, now):
        """('ok'|'held'|'orphan', reason). Order matters.

        The three 'ok' tests run FIRST so that the held list only ever contains
        things that WOULD have been reported as orphans - it stays short and
        every line in it is a real exclusion, not noise.
        """
        ids = {str(torrent.get(k, "")).strip().lower()
               for k in ("hash", "infohash_v1", "infohash_v2")}
        ids.discard("")
        if torrent.get("amount_left", 1) == 0 or float(
                torrent.get("progress", 0.0)) >= 1.0:
            return "ok", "complete"
        if ids & queued:
            return "ok", "in-arr-queue"
        age_h = (now - float(torrent.get("added_on", now))) / 3600.0
        if age_h < MIN_AGE_HOURS:
            return "ok", "too-young"
        if int(torrent.get("dlspeed", 0)) > 0 or int(
                torrent.get("upspeed", 0)) > 0:
            return "ok", "transferring"
        if idle_hours(torrent, now) < NO_PROGRESS_HOURS:
            return "ok", "recent-progress"
        if any(i.startswith(KEEP_HASH_PREFIXES) for i in ids):
            return "held", "keep-hash"
        if str(torrent.get("category", "")) in KEEP_CATEGORIES:
            return "held", "keep-category"
        if int(torrent.get("uploaded", 0)) > 0:
            return "held", "uploaded>0"
        return "orphan", ""


    def selftest():
        global MIN_AGE_HOURS, NO_PROGRESS_HOURS, CATEGORY_ARR
        global ACTIVE_WITHIN_HOURS, KEEP_HASH_PREFIXES
        MIN_AGE_HOURS = 24.0
        NO_PROGRESS_HOURS = 24.0
        ACTIVE_WITHIN_HOURS = 6.0
        KEEP_HASH_PREFIXES = ("deadbeef",)
        CATEGORY_ARR = {"tv-sonarr": "sonarr", "animes": "sonarr",
                        "radarr": "radarr"}

        now = 1000000.0
        old = now - 200 * 3600
        base = {"hash": "a" * 40, "progress": 0.4, "amount_left": 10,
                "added_on": old, "category": "tv-sonarr", "uploaded": 0,
                "last_activity": old, "dlspeed": 0, "upspeed": 0}

        def verdict(**over):
            t = dict(base)
            t.update(over)
            return classify(t, set(), now)[0]

        assert verdict() == "orphan"
        assert verdict(progress=1.0, amount_left=0) == "ok"
        assert verdict(amount_left=0) == "ok"
        assert classify(dict(base), {"a" * 40}, now)[0] == "ok"
        assert classify(dict(base, hash=("a" * 40).upper()),
                        {"a" * 40}, now)[0] == "ok"
        assert verdict(added_on=now - 3600) == "ok"
        assert verdict(category="avistaz-reseed", progress=0.835) == "held"
        assert verdict(category="manual-import") == "held"
        assert verdict(hash="deadbeef" + "0" * 32, category="tv-sonarr") == "held"
        assert verdict(uploaded=1) == "held"
        assert verdict(hash="feedface" + "0" * 32, category="tv-sonarr") == "orphan"

        assert verdict(dlspeed=1465643) == "ok"
        assert verdict(upspeed=1) == "ok"
        assert verdict(last_activity=now - 3600) == "ok"
        assert verdict(last_activity=now - 23.9 * 3600) == "ok"
        assert verdict(last_activity=now - 24.1 * 3600) == "orphan"
        assert verdict(last_activity=0) == "orphan"
        assert classify({k: v for k, v in base.items()
                         if k != "last_activity"}, set(), now)[0] == "orphan"
        assert verdict(last_activity=now + 3600) == "ok"
        assert verdict(category="avistaz-reseed", dlspeed=1) == "ok"
        assert idle_hours({"added_on": now - 7200}, now) == 2.0
        assert idle_hours({"added_on": now - 7200, "last_activity": 0},
                          now) == 2.0
        assert idle_hours({"added_on": old, "last_activity": now - 3600},
                          now) == 1.0

        assert orphans_by_arr([{"category": "tv-sonarr"},
                               {"category": "animes"},
                               {"category": "tv-sonarr"},
                               {"category": "nobody-owns-this"}]) == {
            "sonarr": 3, None: 1}

        rows = {"sonarr": 0, "radarr": 3}
        assert queue_read_path_suspect(rows, {"sonarr": 1}) == ["sonarr"]
        assert queue_read_path_suspect(rows, {"radarr": 2}) == []
        assert queue_read_path_suspect({"sonarr": 0, "radarr": 0}, {}) == []
        assert queue_read_path_suspect({"sonarr": 0, "radarr": 0},
                                       {None: 0}) == []
        assert queue_read_path_suspect(
            {"sonarr": 0, "radarr": 0}, {None: 1}) == ["unmapped-categories"]
        assert queue_read_path_suspect(rows, {None: 1}) == []
        assert queue_read_path_suspect(
            {"sonarr": 0, "radarr": 0},
            {"sonarr": 1, "radarr": 1}) == [
                "radarr", "sonarr"]
        now_t = 1000000.0
        assert recently_active_by_arr(
            [{"category": "tv-sonarr", "progress": 0.4, "amount_left": 10,
              "last_activity": now_t - 3600},
             {"category": "tv-sonarr", "progress": 0.4, "amount_left": 10,
              "last_activity": now_t - 400000},
             {"category": "radarr", "progress": 0.1, "amount_left": 99,
              "last_activity": now_t - 60}],
            now_t) == {"sonarr": 1, "radarr": 1}
        assert recently_active_by_arr(
            [{"category": "tv-sonarr", "progress": 1.0, "amount_left": 0,
              "last_activity": now_t - 60}] * 27, now_t) == {}
        assert active_hashes_by_arr(
            [{"category": "tv-sonarr", "progress": 0.4, "amount_left": 10,
              "last_activity": now_t - 60, "hash": "abcdef01"}],
            now_t) == {"sonarr": {"ABCDEF01"}}
        assert recently_active_by_arr(
            [{"category": "tv-sonarr", "progress": 0.4, "amount_left": 10,
              "last_activity": now_t - 60, "hash": "aa"},
             {"category": "tv-sonarr", "progress": 0.2, "amount_left": 99,
              "last_activity": now_t - 60, "hash": "bb"}],
            now_t) == {"sonarr": 2}
        hashless = [{"category": "tv-sonarr", "progress": 0.4,
                     "amount_left": 10, "last_activity": now_t - 60}]
        assert active_hashes_by_arr(hashless, now_t) == {}
        assert recently_active_by_arr(hashless, now_t) == {"sonarr": 1}
        assert newest_is_failure([{"eventType": "downloadFailed"}]) is True
        assert newest_is_failure([{"eventType": "grabbed"}]) is False
        assert newest_is_failure([{"eventType": "downloadIgnored"}]) is False
        assert newest_is_failure([]) is False
        assert newest_is_failure([{}]) is False
        assert newest_is_failure(
            [{"eventType": "grabbed"}, {"eventType": "downloadFailed"}]) is False
        assert arr_cleared(3, 3, []) is True
        assert arr_cleared(3, 3, ["A"]) is False
        assert arr_cleared(2, 3, []) is False
        assert arr_cleared(0, 1, []) is False
        good = [{"downloadId": "AA", "date": "2026-08-02T00:00:00Z"},
                {"downloadId": "AA", "date": "2026-08-01T00:00:00Z"}]
        assert check_history_response("t", "AA", good) is None
        assert check_history_response("t", "AA", good[:1]) is None
        assert check_history_response("t", "AA", []) is None

        def raises(records, digest="AA"):
            try:
                check_history_response("t", digest, records)
            except SystemExit:
                return True
            return False

        assert raises([{"downloadId": "BB", "date": "2026-08-02T00:00:00Z"}])
        assert raises(good[:1] + [{"downloadId": "BB",
                                   "date": "2026-08-01T00:00:00Z"}])
        assert raises([{"date": "2026-08-02T00:00:00Z"}])
        assert raises(list(reversed(good)))
        assert raises([{"downloadId": "AA", "date": "2026-08-02T00:00:00Z"},
                       {"downloadId": "AA", "date": "2026-08-02T00:00:00Z"}])
        assert raises([{"downloadId": "AA"}, {"downloadId": "AA"}])
        assert raises([{"downloadId": "AA", "date": "2026-08-02T00:00:00Z"},
                       {"downloadId": "AA", "date": ""}])
        assert unexplained_active({"A", "B"}, {"A", "B"}) == []
        assert unexplained_active({"A", "B"}, {"A"}) == ["B"]
        assert unexplained_active({"A", "B"}, set()) == ["A", "B"]
        assert unexplained_active({"A"}, {"X", "Y"}) == ["A"]

        print("selftest OK")
        return 0


    def main():
        if "--selftest" in sys.argv:
            return selftest()

        now = time.time()
        print("=== qbittorrent orphan census @ %s ==="
              % time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(now)))
        print("mode: %s | min age: %.0fh | no progress for: %.0fh | "
              "keep-categories: %s | keep-hashes: %s"
              % ("ARMED (WILL DELETE)" if ARMED else "DISARMED (report only)",
                 MIN_AGE_HOURS, NO_PROGRESS_HOURS,
                 ",".join(sorted(KEEP_CATEGORIES)) or "-",
                 ",".join(KEEP_HASH_PREFIXES)))
        print("category -> *arr: %s"
              % (" ".join("%s=%s" % kv for kv in sorted(CATEGORY_ARR.items()))
                 or "-"))

        opener = qbt_login()
        torrents = qbt_torrents(opener)

        queued = set()
        arr_rows = {}
        for name, url, key in ARRS:
            ids, n = arr_download_ids(name, url, key)
            queued |= ids
            arr_rows[name] = n
        counts = " ".join("%s=%d" % (n, arr_rows[n]) for n, _, _ in ARRS)
        print("qbittorrent: %d torrents | arr queue rows: %s | %d distinct "
              "downloadIds" % (len(torrents), counts, len(queued)))

        orphans, held = [], []
        for t in torrents:
            verdict, reason = classify(t, queued, now)
            if verdict == "orphan":
                orphans.append(t)
            elif verdict == "held":
                held.append((str(t.get("hash", ""))[:8], reason))

        by_arr = orphans_by_arr(orphans)
        print("orphans by owning *arr: %s unmapped=%d"
              % (" ".join("%s=%d" % (n, by_arr.get(n, 0)) for n, _, _ in ARRS),
                 by_arr.get(None, 0)))

        active_by_arr = recently_active_by_arr(torrents, now)
        print("recently active (<%.0fh) by owning *arr: %s unmapped=%d"
              % (ACTIVE_WITHIN_HOURS,
                 " ".join("%s=%d" % (n, active_by_arr.get(n, 0))
                          for n, _, _ in ARRS),
                 active_by_arr.get(None, 0)))
        suspect = queue_read_path_suspect(arr_rows, active_by_arr)
        if suspect:
            arr_by_name = {n: (u, k) for n, u, k in ARRS}
            active_hashes = active_hashes_by_arr(torrents, now)
            still_suspect = []
            for name in suspect:
                if name not in arr_by_name:  # "unmapped-categories"
                    still_suspect.append(name)
                    continue
                url, key = arr_by_name[name]
                mine = active_hashes.get(name, set())
                live = active_by_arr.get(name, 0)
                failed = arr_failed_downloadids(name, url, key, mine)
                left = unexplained_active(mine, failed)
                print("%s: %d live torrent(s), %d queryable, %d already failed "
                      "in its own history, %d unexplained"
                      % (name, live, len(mine), len(failed), len(left)))
                if not arr_cleared(len(mine), live, left):
                    still_suspect.append(name)
            suspect = still_suspect
        if suspect:
            fail("%s report(s) 0 queue rows (all: %s) while qBittorrent is "
                 "actively moving bytes for torrents in their OWN categories "
                 "inside the last %.0fh (see the activity line above) - live "
                 "work must have a queue row, so that looks like a broken "
                 "*arr queue read path, not an idle *arr (#631/#632). "
                 "Refusing to treat those queue-less torrents as orphans."
                 % (", ".join(suspect), counts, ACTIVE_WITHIN_HOURS))

        print("\nheld back (orphan-shaped, excluded, never reaped): %d"
              % len(held))
        for digest, reason in sorted(held):
            print("    %-8s  %s" % (digest, reason))

        if not orphans:
            print("\nOK: 0 orphans (incomplete + no progress for %.0fh + no "
                  "*arr queue row + older than %.0fh)."
                  % (NO_PROGRESS_HOURS, MIN_AGE_HOURS))
            return 0

        size = sum(int(t.get("size", 0)) for t in orphans)
        on_disk = sum(int(t.get("completed", 0)) for t in orphans)
        print("\nORPHANS: %d | torrent size %.2f GB | on disk %.2f GB"
              % (len(orphans), size / GB, on_disk / GB))
        print("    %-8s  %-14s  %-12s  %-8s  %7s  %8s  %8s  %-5s  %9s"
              % ("hash8", "category", "state", "arr", "prog%", "age_h",
                 "idle_h", "priv", "up_MB"))
        for t in sorted(orphans, key=lambda x: x.get("added_on", 0)):
            private = t.get("private", t.get("is_private"))
            print("    %-8s  %-14s  %-12s  %-8s  %7.2f  %8.1f  %8.1f  %-5s  "
                  "%9.1f" % (
                      str(t.get("hash", ""))[:8],
                      str(t.get("category", ""))[:14] or "-",
                      str(t.get("state", ""))[:12],
                      CATEGORY_ARR.get(str(t.get("category", "")), "unmapped"),
                      float(t.get("progress", 0.0)) * 100.0,
                      (now - float(t.get("added_on", now))) / 3600.0,
                      idle_hours(t, now),
                      {True: "yes", False: "no"}.get(private, "?"),
                      int(t.get("uploaded", 0)) / (1024.0 * 1024.0),
                  ))

        if not ARMED:
            print("\nDISARMED - nothing was changed. To reap these, set ARMED="
                  '"true" on the orphan-census CronJob in git and let ArgoCD '
                  "sync it.")
            print("ACTION: also apply the #196 `private stalled` rule split, or new "
                  "orphans keep being manufactured (#483).")
            return 1

        hashes = "|".join(str(t.get("hash", "")) for t in orphans)
        body = urllib.parse.urlencode(
            {"hashes": hashes, "deleteFiles": DELETE_FILES}).encode()
        req = urllib.request.Request(
            QBT_URL + "/api/v2/torrents/delete", data=body,
            headers={"Referer": QBT_URL})
        try:
            opener.open(req, timeout=TIMEOUT).read()
        except Exception as exc:  # noqa: BLE001
            fail("delete failed for %d orphans (%s, http=%s)"
                 % (len(orphans), type(exc).__name__, http_status(exc)))
        print("\nARMED - deleted %d orphans from qBittorrent (deleteFiles=%s)."
              % (len(orphans), DELETE_FILES))
        return 1


    if __name__ == "__main__":
        sys.exit(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: orphan-census
  namespace: servarr
  labels:
    app: orphan-census
spec:
  schedule: "0 7 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 6
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      ttlSecondsAfterFinished: 2592000  # keep 30 days
      template:
        metadata:
          labels:
            app: orphan-census
        spec:
          restartPolicy: Never
          containers:
            - name: orphan-census
              image: python:3.13-alpine
              imagePullPolicy: IfNotPresent
              command: ["python3", "/script/census.py"]
              env:
                - name: ARMED
                  value: "true"
                - name: NO_PROGRESS_HOURS
                  value: "24"
                - name: CATEGORY_ARR_MAP
                  value: "tv-sonarr=sonarr,animes=sonarr,radarr=radarr"
                - name: MAX_HISTORY_LOOKUPS
                  value: "4"
                - name: QBT_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: qbittorrent-webui-credentials
                      key: QBT_USERNAME
                - name: QBT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: qbittorrent-webui-credentials
                      key: QBT_PASSWORD
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: unpackerr-secret
                      key: UN_SONARR_0_API_KEY
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: unpackerr-secret
                      key: UN_RADARR_0_API_KEY
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
          volumes:
            - name: script
              configMap:
                name: orphan-census-script
                defaultMode: 0444
