---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
  labels:
    app: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: FORGEJO__database__DB_TYPE
              value: postgres
            - name: FORGEJO__database__HOST
              value: postgres-cluster-rw.postgres-system.svc:5432
            - name: FORGEJO__database__NAME
              value: forgejo
            - name: FORGEJO__database__USER
              value: forgejo
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: DB_PASSWD
            - name: FORGEJO__database__SSL_MODE
              value: disable
            - name: FORGEJO__security__INSTALL_LOCK
              value: "true"
            - name: FORGEJO__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: SECRET_KEY
            - name: FORGEJO__security__INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-secrets
                  key: INTERNAL_TOKEN
            - name: FORGEJO__server__ROOT_URL
              value: https://git.epaflix.com/
            - name: FORGEJO__server__DOMAIN
              value: git.epaflix.com
            - name: FORGEJO__server__HTTP_PORT
              value: "3000"
            - name: FORGEJO__server__DISABLE_SSH
              value: "true"
            - name: FORGEJO__server__START_SSH_SERVER
              value: "false"
            - name: FORGEJO__service__DISABLE_REGISTRATION
              value: "false"
            - name: FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION
              value: "true"
            - name: FORGEJO__service__ENABLE_INTERNAL_SIGNIN
              value: "false"
            - name: FORGEJO__service__ENABLE_BASIC_AUTHENTICATION
              value: "false"
            - name: FORGEJO__service__REQUIRE_SIGNIN_VIEW
              value: "true"
            - name: FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION
              value: "true"
            - name: FORGEJO__oauth2_client__USERNAME
              value: email
            - name: FORGEJO__oauth2_client__ACCOUNT_LINKING
              value: disabled
            - name: FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES
              value: 10.42.0.0/16
            - name: FORGEJO__repository__ENABLE_PUSH_CREATE_USER
              value: "true"
            - name: FORGEJO__mailer__ENABLED
              value: "false"
            - name: FORGEJO__oauth2__ENABLED
              value: "false"
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: config
              mountPath: /etc/gitea
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data-pithari
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
