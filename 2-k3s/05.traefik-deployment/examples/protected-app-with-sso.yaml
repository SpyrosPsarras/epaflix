---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: myapp-https
  namespace: app-myapp
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`myapp.epaflix.com`)
      kind: Rule
      priority: 10 # Lower than outpost routes (15)
      middlewares:
        - name: authentik-forwardauth
          namespace: traefik-system
        - name: security-headers
          namespace: traefik-system
      services:
        - name: myapp-service
          port: 80
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: myapp-outpost-https
  namespace: app-myapp
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`myapp.epaflix.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 15 # Higher than app route
      services:
        - name: authentik-server
          namespace: app-authentik # Cross-namespace reference
          port: 80
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
