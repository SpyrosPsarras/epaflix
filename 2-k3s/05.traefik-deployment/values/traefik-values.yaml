service:
  enabled: true
  type: LoadBalancer
  spec:
    loadBalancerIP: 192.168.10.101
  annotations: {}
  additionalServices:
    internal:
      spec:
        type: LoadBalancer
        loadBalancerIP: 192.168.10.102
        allocateLoadBalancerNodePorts: false


podSecurityContext:
  fsGroup: 986

securityContext:
  runAsUser: 986
  runAsGroup: 986

ports:
  web:
    port: 80
    exposedPort: 80
    http:
      redirections:
        entryPoint:
          permanent: true
          scheme: https
          to: websecure
  websecure:
    port: 443
    exposedPort: 443
  internal:
    port: 8443
    exposedPort: 443
    expose: {default: false, internal: true}
  syncthing:
    port: 22000
    expose:
      default: true
    exposedPort: 22000
    protocol: TCP

ingressRoute:
  dashboard:
    enabled: false
    matchRule: Host(`traefik.epaflix.com`)
    entryPoints: ["websecure"]
    tls:
      certResolver: cloudflare

log:
  level: INFO
accessLog:
  enabled: true

metrics:
  prometheus:
    addServicesLabels: true
    addEntryPointsLabels: true
    service:
      enabled: true


env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: api-token

persistence:
  enabled: true
  storageClass: local-path
  accessMode: ReadWriteOnce
  size: 128Mi

deployment:
  replicas: 1 # ACME requires single replica for certificate management
  annotations:
    secret.reloader.stakater.com/reload: "cloudflare-api-token"
  initContainers:
    - name: fix-acme-permissions
      image: busybox:latest
      command:
        ["sh", "-c", "touch /data/acme.json && chmod 600 /data/acme.json"]
      securityContext:
        runAsUser: 986
        runAsGroup: 986
      volumeMounts:
        - name: data
          mountPath: /data

additionalArguments:
  - "--providers.kubernetesingress.ingressclass=traefik"
  - "--providers.kubernetescrd"
  - "--providers.kubernetescrd.allowCrossNamespace=true"
  - "--certificatesresolvers.cloudflare.acme.email=admin@epaflix.com"
  - "--certificatesresolvers.cloudflare.acme.storage=/data/acme.json"
  - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
  - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
  - "--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53"
  - "--certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=30"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
