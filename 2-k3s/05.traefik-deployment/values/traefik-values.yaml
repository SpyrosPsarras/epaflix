service:
  enabled: true
  type: LoadBalancer
  spec:
    loadBalancerIP: 192.168.10.101
  annotations: {}
  additionalServices:
    internal:
      spec:
        type: LoadBalancer
        loadBalancerIP: 192.168.10.102
        allocateLoadBalancerNodePorts: false


podSecurityContext:
  fsGroup: 986

securityContext:
  runAsUser: 986
  runAsGroup: 986

ports:
  web:
    port: 80
    exposedPort: 80
    http:
      redirections:
        entryPoint:
          permanent: true
          scheme: https
          to: websecure
  websecure:
    port: 443
    exposedPort: 443
    transport:
      respondingTimeouts:
        readTimeout: 0s
  internal:
    port: 8443
    exposedPort: 443
    expose: {default: false, internal: true}
    transport:
      respondingTimeouts:
        readTimeout: 0s
  syncthing:
    port: 22000
    expose:
      default: true
    exposedPort: 22000
    protocol: TCP

ingressRoute:
  dashboard:
    enabled: false
    matchRule: Host(`traefik.epaflix.com`)
    entryPoints: ["websecure"]
    tls: {}

tlsStore:
  default:
    defaultCertificate:
      secretName: epaflix-wildcard-tls

log:
  level: INFO
accessLog:
  enabled: true
  fields:
    queryParameters:
      # Drop all query parameters from access logs (#702, #911): the jellyfin
      # TV clients put their ApiKey in the URL, and the full URI lands in
      # traefik's stdout (~1.4k lines/day) where `kubectl logs` can read it.
      # alloy redacts the Loki copy, never the source. Paths, methods,
      # statuses, routers and durations stay.
      defaultMode: drop

metrics:
  prometheus:
    addServicesLabels: true
    addEntryPointsLabels: true
    service:
      enabled: true


deployment:
  replicas: 2

topologySpreadConstraints:
  - topologyKey: topology.kubernetes.io/zone
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-traefik-system
  - topologyKey: kubernetes.io/hostname
    maxSkew: 1
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-traefik-system

podDisruptionBudget:
  enabled: true
  minAvailable: 1

additionalArguments:
  - "--providers.kubernetesingress.ingressclass=traefik"
  - "--providers.kubernetescrd"
  - "--providers.kubernetescrd.allowCrossNamespace=true"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  # No CPU limit: with 500m, one TLS download throttled Traefik in every
  # CFS period and ran at ~150 Mbps (HTTP/2) vs ~2.5 Gbps direct.
  limits:
    memory: 512Mi
