repositories:
  - name: traefik
    url: https://traefik.github.io/charts

releases:
  - name: traefik
    namespace: traefik-system
    chart: traefik/traefik
    version: "39.0.1" # Matches the live Helm release adopted by ArgoCD
    values:
      - values/traefik-values.yaml
    installed: true
    wait: true
    timeout: 300
    atomic: true
