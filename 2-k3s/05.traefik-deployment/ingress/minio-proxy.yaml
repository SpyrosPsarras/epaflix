---

apiVersion: v1
kind: Endpoints
metadata:
  name: minio-external
  namespace: traefik-system
subsets:
  - addresses:
      - ip: 192.168.10.200
    ports:
      - name: api
        port: 9000
        protocol: TCP
      - name: console
        port: 9001
        protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: minio-external
  namespace: traefik-system
  labels:
    app: minio-external
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: api
      port: 9000
      protocol: TCP
    - name: console
      port: 9001
      protocol: TCP

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-http
  namespace: traefik-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`minio.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: minio-external
          port: 9000

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-https
  namespace: traefik-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`minio.epaflix.com`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: traefik-system
      services:
        - name: minio-external
          port: 9000
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-console-http
  namespace: traefik-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`minio-console.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: minio-external
          port: 9001

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-console-https
  namespace: traefik-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`minio-console.epaflix.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: security-headers
          namespace: traefik-system
        - name: authentik-forwardauth
          namespace: traefik-system
      services:
        - name: minio-external
          port: 9001
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-console-outpost-https
  namespace: traefik-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`minio-console.epaflix.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 15
      services:
        - name: authentik-server
          namespace: app-authentik
          port: 80
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
