---
# Proxy odysseus.epaflix.com (192.168.10.101, Traefik) → in-cluster Odysseus
# Service `odysseus` in namespace `odysseus`, port 7000 (the k3s GitOps tier
# 13.odysseus — issue #184). Cross-namespace reference relies on Traefik's
# providers.kubernetescrd.allowCrossNamespace=true.
#
# This SUPERSEDES the earlier TrueNAS-backend cutover (Endpoints/headless
# Service → 192.168.10.200:30070). Now that the workload runs on k3s the route
# targets it directly — no manual Endpoints object needed.
#
# Backend is plain HTTP (uvicorn :7000), so NO ServersTransport. The real
# Let's Encrypt wildcard cert terminates at Traefik; DNS-01 ACME via Cloudflare
# proves domain ownership.
#
# This is the perimeter for a publicly (Cloudflare-proxied) reachable, GPU-less
# agent app whose agent has a built-in shell tool. The route is gated by
# Authentik forward-auth (authentik-forwardauth middleware) — mirrors
# traefik-dashboard-sso.yaml:
#   - app route (priority 10) carries the authentik-forwardauth middleware
#   - outpost route (priority 15) handles /outpost.goauthentik.io/ auth callbacks
#     and MUST out-prioritise the app route or callbacks break.
# This only gates the perimeter — Odysseus has NO trusted-header SSO, so it ALSO
# keeps its own built-in login (AUTH_ENABLED=true). Result is a double login by
# design (see README).
#
# SSO objects (group "Odysseus users", proxy provider + application slug odysseus,
# embedded-outpost binding) must exist in Authentik BEFORE this is merged, else the
# route would expose the raw backend behind only Odysseus's own login.

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: odysseus-http
  namespace: traefik-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`odysseus.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: odysseus
          namespace: odysseus
          port: 7000

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: odysseus-https
  namespace: traefik-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`odysseus.epaflix.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: authentik-forwardauth
          namespace: traefik-system
      services:
        - name: odysseus
          namespace: odysseus
          port: 7000
          scheme: http
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: odysseus-outpost-https
  namespace: traefik-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`odysseus.epaflix.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 15
      services:
        - name: authentik-server
          namespace: app-authentik
          port: 80
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
