---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: odysseus-http
  namespace: traefik-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`odysseus.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: odysseus
          namespace: odysseus
          port: 7000

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: odysseus-https
  namespace: traefik-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`odysseus.epaflix.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: security-headers
          namespace: traefik-system
        - name: authentik-forwardauth
          namespace: traefik-system
      services:
        - name: odysseus
          namespace: odysseus
          port: 7000
          scheme: http
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: odysseus-api
  namespace: traefik-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`odysseus.epaflix.com`) && PathPrefix(`/api`)
      kind: Rule
      priority: 20
      services:
        - name: odysseus
          namespace: odysseus
          port: 7000
          scheme: http
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: odysseus-outpost-https
  namespace: traefik-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`odysseus.epaflix.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 15
      services:
        - name: authentik-server
          namespace: app-authentik
          port: 80
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
