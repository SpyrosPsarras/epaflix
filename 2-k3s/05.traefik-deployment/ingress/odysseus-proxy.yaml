---
# Proxy odysseus.epaflix.com (192.168.10.101, Traefik) → Odysseus in-cluster
# Deployment in the `odysseus` namespace (Service odysseus:7000, plain HTTP).
#
# BACKEND MOVED TO K3S (issue #184): Odysseus was migrated off the TrueNAS
# Custom App (192.168.10.200:30070) into the GitOps tier 2-k3s/13.odysseus.
# The previous out-of-band `kind: Endpoints` + headless Service (→ TrueNAS)
# are GONE; the IngressRoutes now reference the in-cluster ClusterIP Service
# cross-namespace (services[].namespace: odysseus). Cross-namespace refs are
# permitted because Traefik runs with
# `--providers.kubernetescrd.allowCrossNamespace=true`
# (2-k3s/05.traefik-deployment/values/traefik-values.yaml) — the outpost route
# below already relies on this to reach authentik-server in app-authentik.
#
# Backend is plain HTTP, so NO ServersTransport (unlike truenas/pegaprox which
# are HTTPS-with-skipverify). Real Let's Encrypt wildcard cert terminates at
# Traefik; DNS-01 ACME via Cloudflare proves domain ownership.
#
# This is the perimeter for a publicly (Cloudflare-proxied) reachable agent app
# whose agent has a built-in shell tool. The route is gated by Authentik
# forward-auth (authentik-forwardauth middleware) — mirrors
# traefik-dashboard-sso.yaml:
#   - app route (priority 10) carries the authentik-forwardauth middleware
#   - outpost route (priority 15) handles /outpost.goauthentik.io/ auth callbacks
#     and MUST out-prioritise the app route or callbacks break.
# This only gates the perimeter — Odysseus has NO trusted-header SSO, so it ALSO
# keeps its own built-in login (AUTH_ENABLED=true). Result is a double login by
# design (see 2-k3s/13.odysseus/README.md). With the TrueNAS backend
# decommissioned, the old raw host port 0.0.0.0:30070 LAN bypass is gone — the
# only entry is now via Traefik (Authentik-gated), a net security improvement.
#
# SSO objects (group "Odysseus users", proxy provider pk83 + application slug
# odysseus, embedded-outpost binding) are UNCHANGED by this backend move — they
# must continue to exist in Authentik, else the route would expose the raw
# backend behind only Odysseus's own login.

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: odysseus-http
  namespace: traefik-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`odysseus.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: odysseus
          namespace: odysseus
          port: 7000

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: odysseus-https
  namespace: traefik-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`odysseus.epaflix.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: authentik-forwardauth
          namespace: traefik-system
      services:
        - name: odysseus
          namespace: odysseus
          port: 7000
          scheme: http
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: odysseus-outpost-https
  namespace: traefik-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`odysseus.epaflix.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 15
      services:
        - name: authentik-server
          namespace: app-authentik
          port: 80
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
