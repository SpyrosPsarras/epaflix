---

apiVersion: v1
kind: Endpoints
metadata:
  name: truenas-ui
  namespace: traefik-system
subsets:
  - addresses:
      - ip: 192.168.10.200
    ports:
      - name: https
        port: 8443
        protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: truenas-ui
  namespace: traefik-system
  labels:
    app: truenas-ui
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: https
      port: 8443
      protocol: TCP

---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: truenas-insecure
  namespace: traefik-system
spec:
  insecureSkipVerify: true
  serverName: truenas.epaflix.com

---
# LAN DNS points at 192.168.10.102, which exposes only the internal listener.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: truenas-internal-https
  namespace: traefik-system
spec:
  entryPoints:
    - internal
  routes:
    - match: Host(`truenas.epaflix.com`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: traefik-system
      services:
        - name: truenas-ui
          port: 8443
          scheme: https
          serversTransport: truenas-insecure
  tls: {}
