# ksops generator — decrypts cloudflare-api-token.enc.yaml at render
# time. Decryption performed inside argocd-repo-server via the ksops
# binary installed by the install-ksops initContainer (see 2-k3s/
# 11.argocd/helm-values.yaml). For local kustomize builds: ksops decrypts with
# the sops Go library, it never execs the `sops` binary, so the KeePassXC
# wrapper on PATH does not apply here. Pass the key in the render's own
# environment (verified 2026-08-21, without it the build fails with
# "trouble decrypting file: Error getting data key"):
#   PATH=/opt/kustomize:$PATH \
#   SOPS_AGE_KEY=$(~/.pi/shared/skills/keepassxc-secrets/scripts/kpx.sh get sops-age-k3s-cluster) \
#   kustomize build --enable-helm --enable-alpha-plugins --enable-exec .
# Do NOT point SOPS_AGE_KEY_FILE at ~/.config/sops/age/: that file was shredded
# on 2026-08-21. See .github/instructions/sops.instructions.md.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: traefik-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - cloudflare-api-token.enc.yaml
