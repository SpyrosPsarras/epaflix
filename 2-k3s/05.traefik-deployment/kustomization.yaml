apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: traefik-system
resources:
  - namespace.yaml
  - middleware/tls-options.yaml
  - middleware/redirect-https.yaml
  - middleware/security-headers.yaml
  - middleware/authentik-forwardauth.yaml
  - certificates/epaflix-wildcard.yaml
  - ingress/https-redirect.yaml
  - ingress/traefik-dashboard-sso.yaml
  - ingress/truenas-proxy.yaml
  - ingress/pegaprox-proxy.yaml
  - ingress/minio-proxy.yaml
  - ingress/t3code-proxy.yaml
  - servicemonitor.yaml
helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: "42.1.3"
    releaseName: traefik
    namespace: traefik-system
    valuesFile: values/traefik-values.yaml
    includeCRDs: false
