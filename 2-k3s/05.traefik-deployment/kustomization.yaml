# Kustomize + Helm inflation for Traefik. Rendered by ArgoCD's repo-server
# with `kustomize build --enable-helm` (set via configs.cm.kustomize.buildOptions
# in 2-k3s/11.argocd/helm-values.yaml).
#
# Secrets and ACME state:
# - cloudflare-api-token is reconciled from cloudflare-api-token.enc.yaml
#   via the ksops generator below (Issue #29 / PR #58, follow-up #60).
# - /data/acme.json lives on the chart-managed persistence volume.
# - certificates/cloudflare-origin-cert.yaml is only a placeholder/template.
# - Traefik CRDs already exist from the Helmfile bootstrap and are not adopted
#   here, avoiding server-side apply conflicts with Helm-owned CRD fields.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: traefik-system
resources:
  - namespace.yaml
  - middleware/tls-options.yaml
  - middleware/redirect-https.yaml
  - middleware/security-headers.yaml
  - middleware/authentik-forwardauth.yaml
  - ingress/https-redirect.yaml
  - ingress/traefik-dashboard-sso.yaml
  - ingress/truenas-proxy.yaml
  - ingress/pegaprox-proxy.yaml
  - ingress/minio-proxy.yaml
  - ingress/odysseus-proxy.yaml
generators:
  - ksops-generator.yaml
helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: "40.3.0"
    releaseName: traefik
    namespace: traefik-system
    valuesFile: values/traefik-values.yaml
    includeCRDs: false
