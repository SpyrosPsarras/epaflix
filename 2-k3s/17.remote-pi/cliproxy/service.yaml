---
apiVersion: v1
kind: Service
metadata:
  name: cliproxy
  namespace: remote-pi
  labels:
    app.kubernetes.io/name: cliproxy
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cliproxy
  ports:
    - name: http
      port: 8317
      targetPort: 8317
      protocol: TCP
