# Owned by ArgoCD Application "remote-pi".
# Rationale: run exactly one CLIProxyAPI writer against the shared CNPG Postgres
# store, so provider tokens and config survive pod replacement without a PVC.
#
# Hardened to match the relay pod next door: non-root, read-only root
# filesystem, all capabilities dropped. #862.
#
# This was NOT possible as originally reasoned, and the original reasoning was
# wrong. It assumed the process rewrites `/CLIProxyAPI/config.yaml` in place and
# needs `/root/.cli-proxy-api`. With the Postgres backend it does neither -
# checked on the running pod, both paths were absent. Config and auth live in
# Postgres and are mirrored to `PGSTORE_LOCAL_PATH`, which is the mounted
# emptyDir. The only writes are there, plus `/tmp`.
#
# Proven before changing anything, with a throwaway probe Deployment running
# this same image under runAsNonRoot + readOnlyRootFilesystem and an isolated
# PGSTORE_SCHEMA so it could not touch the live tables: it reached 1/1, logged
# `postgres-backed token store enabled`, downloaded the management SPA, and
# served /management.html with HTTP 200 as uid 1000 with a read-only rootfs.
#
# HOME is redirected because the image's default is /root, which uid 1000
# cannot write. Anything that still wants a home lands on the emptyDir.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxy
  namespace: remote-pi
  labels:
    app.kubernetes.io/name: cliproxy
    app.kubernetes.io/component: proxy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cliproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cliproxy
        app.kubernetes.io/component: proxy
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Reconciles the two config values git must own, before the proxy starts.
        # Neither has an environment variable, so without this they are live-only
        # database state that a rebuild loses - #861.
        #
        # Plain psql on purpose. The first attempt pip-installed psycopg2 and
        # pyyaml at pod start and failed twice over: no writable HOME under the
        # non-root securityContext from #862, and psycopg2-binary ships no musl
        # wheels. This needs no network, no interpreter and no packages.
        - name: reconcile-config
          image: docker.io/library/postgres:16
          command:
            - psql
          args:
            - --no-psqlrc
            - --set=ON_ERROR_STOP=1
            - --file=/scripts/reconcile-config.psql
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cliproxy-secrets
                  key: pg-password
            - name: PGPASSWORD
              value: $(PG_PASSWORD)
            - name: PGHOST
              value: postgres-rw.postgres-system.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: cliproxy
            - name: PGDATABASE
              value: cliproxy
            - name: PGSSLMODE
              value: require
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
        # Places the pi-bridge plugin .so on the plugins emptyDir. Git owns the
        # version because the read-only rootfs leaves the panel's store-install
        # button nowhere durable to write. Fails closed on checksum mismatch,
        # open on an unreachable GitHub - see the script and #858.
        - name: fetch-pi-bridge
          image: docker.io/library/alpine:3.21
          command:
            - sh
            - /scripts/fetch-pi-bridge.sh
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: plugins
              mountPath: /plugins
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
      containers:
        - name: cliproxy
          image: docker.io/eceasy/cli-proxy-api:v7.2.123
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # PG_PASSWORD MUST stay above PGSTORE_DSN. The DSN below uses
            # kubelet dependent-env-var expansion, and kubelet only substitutes
            # `$(VAR)` from variables already declared earlier in this list.
            # Move it down and the pod gets a literal `$(PG_PASSWORD)` in its
            # connection string.
            # The image's HOME is /root, which uid 1000 cannot write.
            - name: HOME
              value: /var/lib/cliproxy/home
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cliproxy-secrets
                  key: pg-password
            - name: MANAGEMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cliproxy-secrets
                  key: management-password
            # Storage backend is picked by env-var presence at startup:
            # PGSTORE_DSN > OBJECTSTORE_ENDPOINT > GITSTORE_GIT_URL > local
            # files. Setting this is what selects Postgres.
            - name: PGSTORE_DSN
              value: postgresql://cliproxy:$(PG_PASSWORD)@postgres-rw.postgres-system.svc.cluster.local:5432/cliproxy?sslmode=require
            # Both of these default to paths relative to the WORKDIR. Point
            # them at the emptyDir so the spool and the downloaded management
            # SPA do not grow the container layer.
            #
            # PGSTORE_LOCAL_PATH, not PGSTORE_SPOOL_DIR. Some upstream docs name
            # the latter but this build does not read it - #867. The name was
            # verified against the running binary, not the docs:
            #   grep -oa 'PGSTORE_[A-Z_]*' /CLIProxyAPI/CLIProxyAPI | sort -u
            # on v7.2.123 returns exactly PGSTORE_DSN, PGSTORE_LOCAL_PATH and
            # PGSTORE_SCHEMA. With the wrong name the spool silently falls back
            # to the WORKDIR and grows the container layer instead - there is no
            # error, so check the startup log line `workspace path:` after any
            # image bump.
            # LOCAL_PATH is a BASE directory - the binary appends `pgstore/`
            # to it itself. Setting it to /var/lib/cliproxy/pgstore produced
            # /var/lib/cliproxy/pgstore/pgstore, which worked but read wrong.
            - name: PGSTORE_LOCAL_PATH
              value: /var/lib/cliproxy
            - name: MANAGEMENT_STATIC_PATH
              value: /var/lib/cliproxy/static
            # Where request-log payload files land (#1007). The ONLY env var the
            # binary offers for the log directory - verified in
            # internal/util/util.go WritablePath(), which reads WRITABLE_PATH or
            # writable_path and nothing else. There is no *LOG* env var at all:
            #   grep -oa 'CLIPROXY[A-Z_]*\|[A-Z_]*LOG[A-Z_]*' CLIProxyAPI
            # returns no logging knob, which is why `request-log` itself has to
            # be reconciled into the Postgres config row instead.
            #
            # Without this, ResolveLogDirectory() falls through: `./logs`
            # relative to the WORKDIR is unwritable under #862's read-only
            # rootfs, so it lands on `<auth-dir>/logs` =
            # /var/lib/cliproxy/pgstore/auths/logs. That happens to work, but it
            # buries request payloads inside the credential directory. Naming the
            # base explicitly puts them in /var/lib/cliproxy/logs instead.
            - name: WRITABLE_PATH
              value: /var/lib/cliproxy
          ports:
            - name: http
              containerPort: 8317
              protocol: TCP
          volumeMounts:
            - name: work
              mountPath: /var/lib/cliproxy
            # With a read-only rootfs /tmp must be a volume or anything writing
            # a temp file fails.
            - name: tmp
              mountPath: /tmp
            # `plugins.dir` in config.yaml points here. A subdirectory of the
            # image WORKDIR, so the rest of /CLIProxyAPI stays read-only.
            - name: plugins
              mountPath: /CLIProxyAPI/plugins
          # tcpSocket, not httpGet. `/v1/*` requires a client API key, and
          # `/management.html` can legitimately 404 until the SPA download from
          # GitHub finishes. A listening socket is the only honest signal here.
          readinessProbe:
            tcpSocket:
              port: 8317
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8317
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "25m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
              ephemeral-storage: "1Gi"
      terminationGracePeriodSeconds: 30
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # The pi-bridge .so is ~10 MiB; the zip is deleted after unpacking.
        - name: plugins
          emptyDir:
            sizeLimit: 64Mi
        - name: scripts
          configMap:
            name: cliproxy-scripts
            defaultMode: 0555
