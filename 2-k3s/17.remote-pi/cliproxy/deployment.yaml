---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxy
  namespace: remote-pi
  labels:
    app.kubernetes.io/name: cliproxy
    app.kubernetes.io/component: proxy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cliproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cliproxy
        app.kubernetes.io/component: proxy
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: reconcile-config
          image: docker.io/library/postgres:16
          command:
            - psql
          args:
            - --no-psqlrc
            - --set=ON_ERROR_STOP=1
            - --file=/scripts/reconcile-config.psql
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cliproxy-secrets
                  key: pg-password
            - name: PGPASSWORD
              value: $(PG_PASSWORD)
            - name: PGHOST
              value: postgres-rw.postgres-system.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: cliproxy
            - name: PGDATABASE
              value: cliproxy
            - name: PGSSLMODE
              value: require
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cliproxy-secrets
                  key: openrouter-api-key
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
        - name: fetch-pi-bridge
          image: docker.io/library/alpine:3.21
          command:
            - sh
            - /scripts/fetch-plugin.sh
          args:
            - pi-bridge
            # renovate: datasource=github-releases depName=abix5/pi-cliproxyapi-bridge
            - "0.9.1"
            - 7cfea7b47888c870acc8afca73d8f78cb8454559040c401a2aa08a870107db26
            - abix5/pi-cliproxyapi-bridge
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: plugins
              mountPath: /plugins
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
        - name: fetch-copilot-plugin
          image: docker.io/library/alpine:3.21
          command:
            - sh
            - /scripts/fetch-plugin.sh
          args:
            - cliproxyapi-copilot
            # renovate: datasource=github-releases depName=arthur-sommer-etc/cliproxyapi-copilot-plugin
            - "0.3.3"
            - 6ac5c58fe2507468d08bc33d6365cfb822180ba3f37ae51e06cea884b933ca3a
            - arthur-sommer-etc/cliproxyapi-copilot-plugin
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: plugins
              mountPath: /plugins
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
        - name: transcripts
          restartPolicy: Always
          image: docker.io/library/python:3.13-alpine
          command:
            - python3
            - /scripts/emit-transcripts.py
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: work
              mountPath: /var/lib/cliproxy
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
      containers:
        - name: cliproxy
          image: docker.io/eceasy/cli-proxy-api:v7.2.123
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /var/lib/cliproxy/home
            - name: TZ
              value: Europe/Oslo
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cliproxy-secrets
                  key: pg-password
            - name: MANAGEMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cliproxy-secrets
                  key: management-password
            - name: PGSTORE_DSN
              value: postgresql://cliproxy:$(PG_PASSWORD)@postgres-rw.postgres-system.svc.cluster.local:5432/cliproxy?sslmode=require
            - name: PGSTORE_LOCAL_PATH
              value: /var/lib/cliproxy
            - name: MANAGEMENT_STATIC_PATH
              value: /var/lib/cliproxy/static
            - name: WRITABLE_PATH
              value: /var/lib/cliproxy
          ports:
            - name: http
              containerPort: 8317
              protocol: TCP
          volumeMounts:
            - name: work
              mountPath: /var/lib/cliproxy
            - name: tmp
              mountPath: /tmp
            - name: plugins
              mountPath: /CLIProxyAPI/plugins
          readinessProbe:
            tcpSocket:
              port: 8317
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8317
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "25m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
              ephemeral-storage: "1Gi"
      terminationGracePeriodSeconds: 30
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: plugins
          emptyDir:
            sizeLimit: 128Mi
        - name: scripts
          configMap:
            name: cliproxy-scripts
            defaultMode: 0555
