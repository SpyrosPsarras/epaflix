---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxy
  namespace: remote-pi
  labels:
    app.kubernetes.io/name: cliproxy
    app.kubernetes.io/component: proxy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cliproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cliproxy
        app.kubernetes.io/component: proxy
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fetch-pi-bridge
          image: docker.io/library/alpine:3.21
          command:
            - sh
            - /scripts/fetch-plugin.sh
          args:
            - pi-bridge
            # TEMP OVERRIDE (model-token-usage): fork build of abix5/pi-cliproxyapi-bridge that registers
            # the usage.handle sink and serves cumulative token counters per model ("models") and per
            # account ("accounts[].tokens") on the contract v2 usage document (consumed by the
            # dms-cliproxy-quota widget).
            # Revert to abix5/pi-cliproxyapi-bridge once upstream ships the usage sink (tracked in the
            # upstream-release-watch row; drop this comment and restore the # renovate: marker then).
            # Offered upstream as abix5/pi-cliproxyapi-bridge#3.
            # The # renovate: marker is deliberately absent: renovate would "downgrade" the fork to
            # upstream v0.9.1.
            - "0.12.0"
            - 2ee7087f759e7b3bab584e790d5b7d21d3235effe45f0ef3fff6e6b41f87bd7e
            - SpyrosPsarras/pi-cliproxyapi-bridge
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: plugins
              mountPath: /plugins
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
        - name: fetch-copilot-plugin
          image: docker.io/library/alpine:3.21
          command:
            - sh
            - /scripts/fetch-plugin.sh
          args:
            - cliproxyapi-copilot
            # renovate: datasource=github-releases depName=arthur-sommer-etc/cliproxyapi-copilot-plugin
            - "0.3.3"
            - 6ac5c58fe2507468d08bc33d6365cfb822180ba3f37ae51e06cea884b933ca3a
            - arthur-sommer-etc/cliproxyapi-copilot-plugin
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: plugins
              mountPath: /plugins
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
        - name: fetch-opencode-cloak
          image: docker.io/library/alpine:3.21
          command:
            - sh
            - /scripts/fetch-plugin.sh
          args:
            - opencode-cloak
            # renovate: datasource=github-releases depName=conversun/cliproxy-plugin-opencode-cloak
            - "0.2.3"
            - 199537e3c216f4ffb5e7fa137e527e6315285c03cb74fcccd70cda3322905da4
            - conversun/cliproxy-plugin-opencode-cloak
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: plugins
              mountPath: /plugins
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
        - name: fetch-quota-router
          image: docker.io/library/alpine:3.21
          command:
            - sh
            - /scripts/fetch-plugin.sh
          args:
            - kpatdev-quota-router
            # renovate: datasource=github-releases depName=kpatdev/quota-router
            - "1.1.0"
            - fd672946ba17ff79257154b6373ee20b04477dc0c2ae112dbee7a1fcf08d9f4b
            - kpatdev/quota-router
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: plugins
              mountPath: /plugins
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
        - name: transcripts
          restartPolicy: Always
          image: docker.io/library/python:3.13-alpine
          command:
            - python3
            - /scripts/emit-transcripts.py
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: work
              mountPath: /var/lib/cliproxy
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "256Mi"
      containers:
        - name: cliproxy
          image: docker.io/eceasy/cli-proxy-api:v7.2.123
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HOME
              value: /var/lib/cliproxy/home
            - name: TZ
              value: Europe/Oslo
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cliproxy-secrets
                  key: pg-password
            - name: MANAGEMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cliproxy-secrets
                  key: management-password
            - name: CLIPROXY_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cliproxy-secrets
                  key: github-token
            - name: PGSTORE_DSN
              value: postgresql://cliproxy:$(PG_PASSWORD)@postgres-rw.postgres-system.svc.cluster.local:5432/cliproxy?sslmode=require
            - name: PGSTORE_LOCAL_PATH
              value: /var/lib/cliproxy
            - name: MANAGEMENT_STATIC_PATH
              value: /var/lib/cliproxy/static
            - name: WRITABLE_PATH
              value: /var/lib/cliproxy
          ports:
            - name: http
              containerPort: 8317
              protocol: TCP
          volumeMounts:
            - name: work
              mountPath: /var/lib/cliproxy
            - name: tmp
              mountPath: /tmp
            - name: plugins
              mountPath: /CLIProxyAPI/plugins
          readinessProbe:
            tcpSocket:
              port: 8317
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8317
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "25m"
              memory: "128Mi"
            limits:
              memory: "1Gi"
              ephemeral-storage: "1Gi"
      terminationGracePeriodSeconds: 30
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: plugins
          emptyDir:
            sizeLimit: 256Mi
        - name: scripts
          configMap:
            name: cliproxy-scripts
            defaultMode: 0555
