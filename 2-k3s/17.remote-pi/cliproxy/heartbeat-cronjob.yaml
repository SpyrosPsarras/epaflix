---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cliproxy-heartbeat
  namespace: remote-pi
  labels:
    app.kubernetes.io/name: cliproxy-heartbeat
    app.kubernetes.io/component: heartbeat
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "0 3,8,13 * * *"
  timeZone: Europe/Oslo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          # Not app.kubernetes.io/name=cliproxy: the cliproxy Service selects on that
          # label alone, and a Job pod with no readiness probe counts as Ready, so a
          # running heartbeat pod could join the Service endpoints with nothing on
          # 8317. Any caller routed to it, the heartbeat included, could get
          # connection refused. A test run with the old label failed 3 of 3 that way.
          labels:
            app.kubernetes.io/name: cliproxy-heartbeat
            app.kubernetes.io/component: heartbeat
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 100
            fsGroup: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: heartbeat
              image: docker.io/library/python:3.13-alpine
              command:
                - python3
                - /scripts/heartbeat.py
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: HOME
                  value: /tmp
                - name: CLIPROXY_URL
                  value: http://cliproxy.remote-pi.svc.cluster.local:8317
                - name: CLIPROXY_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cliproxy-secrets
                      key: omp-api-key
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: "10m"
                  memory: "32Mi"
                limits:
                  memory: "128Mi"
          volumes:
            - name: scripts
              configMap:
                name: cliproxy-heartbeat-scripts
                defaultMode: 0555
            - name: tmp
              emptyDir:
                sizeLimit: 16Mi
