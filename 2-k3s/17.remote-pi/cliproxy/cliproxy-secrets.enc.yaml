# Owned by ArgoCD Application "remote-pi".
# Rationale: one file holds both halves of the same password - the CNPG role
# credential the operator reads, and the copy the CLIProxyAPI pod builds its DSN
# from. Keeping them together makes a rotation one edit, not two.
#
# The two documents MUST carry the same password value. `cliproxy-db-role` is
# what CNPG sets the role's password to; `cliproxy-secrets.pg-password` is what
# the pod puts in `PGSTORE_DSN`. They drift, the pod cannot log in.
#
# Encrypted in place with SOPS+age - age key lives in KeePassXC (entry sops-age-k3s-cluster), config in .sops.yaml.
# Placeholders below are replaced with real values before encryption; never
# commit a real value in cleartext.
