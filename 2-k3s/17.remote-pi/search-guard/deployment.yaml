---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-guard
  namespace: remote-pi
  labels:
    app.kubernetes.io/name: search-guard
    app.kubernetes.io/component: guard
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: search-guard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: search-guard
        app.kubernetes.io/component: guard
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: search-guard
          image: docker.io/library/python:3.13-alpine
          command:
            - python3
            - /scripts/search-guard.py
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: SEARCH_GUARD_BIND
              value: "0.0.0.0"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8893
              protocol: TCP
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: 8893
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8893
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
      terminationGracePeriodSeconds: 30
      volumes:
        - name: scripts
          configMap:
            name: search-guard-scripts
            defaultMode: 0555
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
