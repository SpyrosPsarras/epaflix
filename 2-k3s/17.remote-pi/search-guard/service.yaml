---
apiVersion: v1
kind: Service
metadata:
  name: search-guard
  namespace: remote-pi
  labels:
    app.kubernetes.io/name: search-guard
    app.kubernetes.io/component: guard
spec:
  type: LoadBalancer
  # Pinned: web-search.json points the pi harness at this exact address, and
  # the SSRF allowRanges entry names it. Never let this drift to a pool-assigned
  # IP; change the two files together.
  loadBalancerIP: 192.168.10.115
  selector:
    app.kubernetes.io/name: search-guard
  ports:
    - name: http
      port: 8893
      targetPort: 8893
      protocol: TCP
