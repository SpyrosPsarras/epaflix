# Owned by ArgoCD Application "remote-pi".
# Rationale: run exactly one relay writer against the SQLite membership database.
# The pinned digest below is published as v0.3.1 and latest (2026-08-12);
# v1.0.0 and v1.0.1 remain older stale pushes from 2026-05-22, not a newer
# release. Upstream ships the relay and the pi extension as a pair and requires
# the relay to be upgraded FIRST: this digest is the v0.3.1 half of the pair
# whose other half is npm remote-pi@0.7.0, pushed 52 seconds apart. There is no
# published 0.6.x on npm - the extension stream jumps 0.5.5 -> 0.7.0. #832.
# Not tracked by Renovate on purpose: this image is not in the kustomization's
# images: block, because upstream's tag stream is not trustworthy enough to
# bump unattended. Bumps are manual, by digest, verified against the extension.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-pi-relay
  namespace: remote-pi
  labels:
    app.kubernetes.io/name: remote-pi-relay
    app.kubernetes.io/component: relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: remote-pi-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remote-pi-relay
        app.kubernetes.io/component: relay
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: docker.io/jacobmoura7/remote-pi-relay@sha256:7255159041fe32b02a30ba2e09a671fa00783f24c217750cbdf74c5f8b77a7b6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: REMOTEPI_MESH_DB_PATH
              value: /data/mesh.db
            - name: REMOTEPI_RELAY_PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: remote-pi-data
