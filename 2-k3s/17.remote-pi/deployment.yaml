# Owned by ArgoCD Application "remote-pi".
# Rationale: run exactly one relay writer against the SQLite membership database.
# The pinned digest below is published as v0.2.3 and latest; no v0.3.0 tag
# exists, while v1.0.0 and v1.0.1 are older stale pushes.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-pi-relay
  namespace: remote-pi
  labels:
    app.kubernetes.io/name: remote-pi-relay
    app.kubernetes.io/component: relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: remote-pi-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remote-pi-relay
        app.kubernetes.io/component: relay
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: docker.io/jacobmoura7/remote-pi-relay@sha256:65b35f753561f5cf9387fa04b3e73f4b19ac537bf02648c7a4696e56a96b375e
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: REMOTEPI_MESH_DB_PATH
              value: /data/mesh.db
            - name: REMOTEPI_RELAY_PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: remote-pi-data
