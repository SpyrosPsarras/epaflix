apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storage.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - cliproxy/database.yaml
  - cliproxy/deployment.yaml
  - cliproxy/service.yaml
  - cliproxy/ingress.yaml
  - cliproxy/heartbeat-cronjob.yaml
  - search-guard/deployment.yaml
  - search-guard/service.yaml
  - cliproxy-free/deployment.yaml
  - cliproxy-free/service.yaml
  - cpamanager/storage.yaml
  - cpamanager/deployment.yaml
  - cpamanager/service.yaml
  - cpamanager/ingress.yaml

generators:
  - cliproxy/ksops-generator.yaml
  - cliproxy-free/ksops-generator.yaml
  - cpamanager/ksops-generator.yaml

images:
  - name: docker.io/eceasy/cli-proxy-api
    newTag: v8.0.22@sha256:fb287227792ae14eff38063479568049c90cb692b1f299e39c6f54650584428f
  - name: docker.io/seakee/cpa-manager-plus
    newTag: v1.14.4@sha256:efbcf628d27fc9058c1c13de4a97b3b7cd5f3c67479518937dfa591cdd9224e2

configMapGenerator:
  - name: cliproxy-scripts
    namespace: remote-pi
    files:
      - cliproxy/files/reconcile-config.psql
      - cliproxy/files/fetch-plugin.sh
      - cliproxy/files/emit-transcripts.py
      - cliproxy/files/payload_lib.py
  - name: search-guard-scripts
    namespace: remote-pi
    files:
      - search-guard/search-guard.py
  - name: cliproxy-heartbeat-scripts
    namespace: remote-pi
    files:
      - cliproxy/files/heartbeat.py
