# Owned by ArgoCD Application "remote-pi".
# Rationale: render the complete relay namespace, workload, storage, and internal route,
# plus the CLIProxyAPI workload that shares this namespace and this manual-sync gate.
#
# NO top-level `namespace:` transformer on purpose. cliproxy/database.yaml and one
# of the two Secrets in cliproxy/cliproxy-secrets.enc.yaml belong to
# `postgres-system`, next to the CNPG Cluster. A namespace transformer here would
# drag them into `remote-pi` and the operator would never see them.
#
# Reconciled via the ksops generator (cliproxy/ksops-generator.yaml):
#   - cliproxy-db-role   (postgres-system) - CNPG role password, basic-auth shape
#   - cliproxy-secrets   (remote-pi)       - same password for the pod's DSN,
#                                            plus the management password
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storage.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - cliproxy/database.yaml
  - cliproxy/deployment.yaml
  - cliproxy/service.yaml
  - cliproxy/ingress.yaml

generators:
  - cliproxy/ksops-generator.yaml

# Digest-pinned so a moving tag cannot swap the running build under us, and so
# Renovate has something to bump. `newTag: <tag>@<digest>`, NOT a bare
# `digest:` - this repo publishes 800+ real `vX.Y.Z` tags, and a tagless entry
# leaves Renovate's kustomize manager with no currentValue to resolve against.
# Never set `newTag:` and `digest:` together, that is
# skipReason: invalid-dependency-specification and silently kills tracking.
# v7.2.123 and `latest` resolve to the same manifest index today.
images:
  - name: docker.io/eceasy/cli-proxy-api
    newTag: v7.2.130@sha256:7fca20b67690f919d88a868e3dcfcba8bbda5f42fef9e5169c0b95853ff6fb8c

# Owned by ArgoCD Application "remote-pi".
# The reconcile script the cliproxy initContainer runs. Generated rather than
# hand-written as a ConfigMap so the file stays reviewable as real Python.
configMapGenerator:
  - name: cliproxy-scripts
    files:
      - cliproxy/files/reconcile-config.psql
    options:
      disableNameSuffixHash: true
