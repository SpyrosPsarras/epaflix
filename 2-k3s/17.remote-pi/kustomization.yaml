apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storage.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - cliproxy/database.yaml
  - cliproxy/deployment.yaml
  - cliproxy/service.yaml
  - cliproxy/ingress.yaml
  - cliproxy/heartbeat-cronjob.yaml
  - cpamanager/storage.yaml
  - cpamanager/deployment.yaml
  - cpamanager/service.yaml
  - cpamanager/ingress.yaml

generators:
  - cliproxy/ksops-generator.yaml
  - cpamanager/ksops-generator.yaml

images:
  # TEMP OVERRIDE (pr-5411): non-release build of router-for-me/CLIProxyAPI#5411 so Zed's Fable 5.1
  # thinking.adaptive.block_binding requests pass. Revert to docker.io/eceasy/cli-proxy-api
  # when a release >= v7.2.149 ships containing #5411 (watched by upstream-release-watch).
  # Renovate must not track this image (disabled in .github/renovate.json) - a PR build has
  # no tag stream, so tracking it is permanent lookup-failure noise.
  - name: docker.io/eceasy/cli-proxy-api
    newName: ghcr.io/spyrospsarras/cli-proxy-api
    newTag: pr-5411-merged@sha256:889632d564efe313c1a334690fc0ddad1a0545ff78c48aab595f0e2028dbe8e7
  - name: docker.io/seakee/cpa-manager-plus
    newTag: v1.12.8@sha256:d7628d4790a951433069fd3e657bb27e72cde3b76323a5e9688538434a267993

configMapGenerator:
  - name: cliproxy-scripts
    files:
      - cliproxy/files/reconcile-config.psql
      - cliproxy/files/fetch-plugin.sh
      - cliproxy/files/emit-transcripts.py
      - cliproxy/files/payload_lib.py
    options:
      disableNameSuffixHash: true
