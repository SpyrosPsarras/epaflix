# Owned by ArgoCD Application "remote-pi".
# Rationale: CPAMP's admin key must be SUPPLIED, not generated.
#
# Left unset, the Manager Server generates one and prints it:
#   apps/manager-server/cmd/cpa-manager-plus/main.go:128
#     log.Printf("CPA Manager Plus admin key generated: %s", ...)
# That is stdout, and this cluster ships container stdout to Loki with 31 days
# of retention, so the panel's admin credential would be searchable in the log
# store - and any "read it back" recipe would echo it into a terminal
# transcript too, which CLAUDE.md forbids outright.
#
# With CPA_MANAGER_ADMIN_KEY set, that branch is not taken and the line becomes
# the value-free "CPA Manager Plus admin credential initialized" (verified by
# running the image both ways before this file existed). Git owns the key, sops
# keeps it unreadable, and nothing ever prints it.
#
# Read it, when a human needs to log in, WITHOUT echoing it:
#   sops -d --extract '["stringData"]["admin-key"]' \
#     2-k3s/17.remote-pi/cpamanager/cpamanager-secrets.enc.yaml | wl-copy
# Never cat this file decrypted, and never grep the pod log for it.
apiVersion: v1
kind: Secret
metadata:
    name: cpa-manager-plus-secrets
    namespace: remote-pi
    annotations:
        argocd.argoproj.io/sync-wave: "-2"
    labels:
        app.kubernetes.io/name: cpa-manager-plus
type: Opaque
stringData:
