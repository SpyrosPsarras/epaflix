# Owned by ArgoCD Application "remote-pi".
# Rationale: CPAMP full mode keeps request history, model prices, inspection and
# automation state in SQLite under /data. Nothing else in this namespace may
# write it, and SQLite in WAL mode tolerates exactly one writer - hence RWO plus
# `strategy: Recreate` on the Deployment.
#
# local-path is node-local: the pod is pinned to whichever node binds this claim
# first (WaitForFirstConsumer). That is acceptable because the data is
# observability history, not the gateway's own state - losing the node loses the
# dashboard's back-catalogue, not a single model request. It is NOT backed up by
# anything today. Two manual copy paths exist, neither automated: CPAMP's JSONL
# export, and its `manager-data-snapshot` command, whose archive carries
# data.key and is therefore secret material.
#
# THE 2Gi BELOW BOUNDS NOTHING. local-path is a bind mount with no quota, so the
# claim is advisory - the same property this repo already documents at
# 2-k3s/10.observability/prometheus-values.yaml:9-16, where a 25Gi advisory claim
# let Prometheus grow to 30G and push k3s-worker-62 to 85%, breaking kubelet
# image GC (#463). The real bound is the node root disk (48G), shared with every
# other pod on that node.
#
# And CPAMP has no age-based retention to stay under it. No PRODUCTION path
# age-prunes the raw usage history: the `delete from` statements against
# usage_events appear only in _test.go, and the usage-derived deletes are rebuild
# and maintenance bookkeeping keyed on structure_revision, checkpoint and cursor
# names. Other tables (api_key_aliases, codex_inspection_leases, settings) have
# ordinary lifecycle deletes, unrelated to history. For RAW USAGE HISTORY the
# only time-based retention in the chain is CPA's 60s usage-queue retention;
# CPAMP's own 24h TTL covers import SESSIONS, not stored events
# (apps/manager-server/internal/config/config.go:25, DefaultUsageImportSessionTTL). Upstream's backup doc treats "the old
# usage.sqlite is very large" as normal, with a fresh data directory as the
# remedy. So history grows until the NODE runs out, and the ~7 days the taskbar
# widget wants is a subset of "everything".
#
# Why that is nevertheless accepted here, with the arithmetic rather than a
# shrug: the pi-bridge usage document on 2026-08-28 showed ~160 requests/day
# across all providers (2238 + 904 successes on a 20-day-old deployment). At an
# order of 1-2KiB per stored event that is ~0.2-0.3 MiB/day, ~100 MiB/year -
# years inside 2Gi and nowhere near node pressure. That is an ESTIMATE, not a
# measurement; the measurement that replaces it, and the conditions that reopen
# the decision, are in docs/accepted-risks.md -> "2026-08-28 CPAMP request
# history is unbacked, node-local and growth-unbounded". Full working:
# docs/superpowers/plans/2026-08-28-cpamp-manager-server-deployment.md
#
# If it ever does fill, events are LOST, not deferred. The collector pops a batch
# from CPA before it writes
# (apps/manager-server/internal/collector/collector.go:360 `client.Pop` -> :372
# `processItems` -> :434 `InsertEvents`), so a failing insert discards a batch
# CPAMP already took. In the default `auto` mode it is worse than a lost pop:
# CPA's Enqueue hands payloads straight to live subscribers and RETURNS without
# queueing them (internal/redisqueue/queue.go:72-76), so nothing is left behind
# to age out. CPA keeps serving model requests throughout.
#
# A fresh database is 4KiB of schema plus a ~350KiB WAL (measured on v1.9.2 at
# first start). local-path supports no expansion (ALLOWVOLUMEEXPANSION false), so
# changing the request means a new claim and a copy - though since the claim is
# advisory, that only matters for the accounting, not for the actual limit.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cpa-manager-plus-data
  namespace: remote-pi
  labels:
    app.kubernetes.io/name: cpa-manager-plus
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
