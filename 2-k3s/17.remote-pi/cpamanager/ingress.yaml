---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cpa-manager-plus-https
  namespace: remote-pi
  labels:
    app.kubernetes.io/name: cpa-manager-plus
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`cpamp.epaflix.com`)
      priority: 10
      middlewares:
        - name: security-headers
          namespace: traefik-system
        - name: authentik-forwardauth
          namespace: traefik-system
      services:
        - name: cpa-manager-plus
          port: 18317
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cpa-manager-plus-outpost-https
  namespace: remote-pi
  labels:
    app.kubernetes.io/name: cpa-manager-plus
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`cpamp.epaflix.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: app-authentik
          port: 80
  tls:
    certResolver: cloudflare
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cpa-manager-plus-http
  namespace: remote-pi
  labels:
    app.kubernetes.io/name: cpa-manager-plus
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`cpamp.epaflix.com`)
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: cpa-manager-plus
          port: 18317
