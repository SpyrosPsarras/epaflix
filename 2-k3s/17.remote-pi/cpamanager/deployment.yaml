---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpa-manager-plus
  namespace: remote-pi
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: cpa-manager-plus
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cpa-manager-plus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpa-manager-plus
        app.kubernetes.io/component: observability
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cpa-manager-plus
          image: docker.io/seakee/cpa-manager-plus:v1.12.6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: HTTP_ADDR
              value: "0.0.0.0:18317"
            - name: USAGE_DB_PATH
              value: /data/usage.sqlite
            - name: CPA_MANAGER_DATA_KEY_PATH
              value: /data/data.key
            - name: CPA_MANAGER_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: cpa-manager-plus-secrets
                  key: admin-key
          ports:
            - name: http
              containerPort: 18317
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 18317
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 18317
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              memory: "512Mi"
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cpa-manager-plus-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
