# Rendered into the cliproxy-free-config sops secret by render-config.sh; this
# file is the reviewable policy, config.enc.yaml is the deployed copy. Edit
# here, re-render, never edit the encrypted file by hand.
#
# Everything not listed keeps the binary's default. Relevant defaults that the
# policy relies on: plugins.enabled false, logging-to-file false (access lines
# stay on stdout for Loki), force-model-prefix false.
port: 8317
auth-dir: "/var/lib/cliproxy/auths"

# The management API is disabled outright (404 on /v0/management) - an empty
# secret-key does that. There is nothing to manage: the policy is this file.
remote-management:
  allow-remote: false
  secret-key: ""

# The one client. lingarr reads it from the lingarr-cliproxy-api-key secret in
# 08.servarr; the main cliproxy never sees this key, so it 401s there.
api-keys:
  - "__LINGARR_API_KEY__"

# Per-key usage counters, same as the main instance. request-log stays off: those
# files carry the client Authorization header verbatim, and this instance has no
# request-log-by-id consumer. The stdout access line (model, status, latency)
# is the observability surface.
usage-statistics-enabled: true

# Client requests may carry OpenRouter routing fields that would let a caller
# escape the free pool: `models` (fallback array, billed by whichever model
# answers), `provider` (order/only/sort/max_price), `route`, `plugins`,
# `transforms`. Strip all of them from every payload before it leaves this
# process. `name: "*"` matches any model; there is only one anyway.
payload:
  filter:
    - models:
        - name: "*"
      params:
        - "models"
        - "provider"
        - "route"
        - "plugins"
        - "transforms"

# The free-provider pool: every entry exposes its model under the ONE alias
# or-free, and CLIProxyAPI rotates requests across the pool (RoundRobinSelector,
# per-alias pool rotation). Rotation is the point: OpenRouter's shared free tier
# holds requests up to ~30 min at peak (#1239), so one upstream alone set the
# drain rate. openrouter/free (the random free router) stays banned: it hands
# lingarr's batches to non-translators (safety classifiers, 2.6B models
# answering in Arabic, reasoning models running for minutes), and lingarr then
# logs "Failed to parse JSON response" and keeps the original lines.
#
# Every upstream here is zero-cost by policy; verify.sh enforces the allowlist.
#
# Model history, 2026-09-13, all on lingarr's exact 25-line structured request:
#   nvidia/nemotron-3-super-120b-a12b:free  structurally 25/25 but rejected on
#     translation quality by independent review of a 100-line job (invented
#     words, mixed Vietnamese/Polish/Cyrillic tokens, "Anything" -> "Τιποτά"),
#     plus a 24-line batch lost when its structured response came back as
#     chain-of-thought prose and the retry returned zero choices. The
#     reasoning-effort override that lived here went with it.
#   google/gemma-4-31b-it:free  rejected by OpenRouter's guardrail policy for
#     this account (404, 0 endpoints).
#   dots-studio/dots-3-note-preview:free  25/25, judged inferior to nex.
#   nex-agi/nex-n2.5-pro:free  25/25 in 83s with 1608 reasoning tokens,
#     judged faithful Greek on the same 25 dialogue lines
#     (lingarr-batch-fix/76-candidates-3). Chosen. No reasoning override:
#     none was measured for this model, and the catalog exposes no
#     reasoning effort block for it.
#
# Pool expansion, 2026-09-21, each candidate run on lingarr's exact 25-line
# structured request through a canary CLIProxyAPI, then a 111-line controlled
# job in production-size chunks:
#   openai/gpt-oss-120b (Groq free plan: 30 RPM / 1K RPD / 200K TPD)  25-line
#     2/2 in 3.7s; chunks 5/5, 111/111 lines in 3.4-5.2s each. Review: no
#     invented words, ~5% wobbly lines (worst: "forty" -> "πενήντα", #13
#     broken genitive). Groq's json_schema enforcement fails above ~30 input
#     lines ("Failed to validate JSON"), so the max_batch_size=25 pin is load-
#     bearing for this upstream. Groq sits behind Cloudflare (403/1010 on
#     python-urllib user agents); the Go client passes.
#   gemini-3.5-flash (Google AI Studio free tier; data may be used to improve
#     Google products - accepted by the owner when the OpenRouter ZDR guardrail
#     was relaxed)  25-line OK in 15.9s; 111-line job 200 in 30.8s, 111/111,
#     judged the most idiomatic Greek of all candidates ("καΐκι που μπάζει",
#     "σεντίνα"). 3.6/3.7-flash and flash-latest 503 under high demand;
#     3.5-flash answered every time it was tried. 2.5-flash is closed to new
#     projects. Pinned to the specific version because -latest aliases point
#     at the overloaded newest.
#   ling-3.0-flash-vl:free (OpenRouter)  reachable and structurally 8/8 with a
#     proxy-side response_format strip plus a JSON-instructing ai_prompt, but
#     its 111-line review hit invented/garbled tokens in 1 of 2 runs - the
#     nemotron failure class. Not pooled.
#   qwen3.8-27b:free (OpenRouter)  the only other guardrail-legal structured
#     model; upstream-429 saturated for 4h+ on 2026-09-20. Superseded by the
#     Groq entry of the same model family.
# Canary rotation check (2026-09-21): 9/9 structurally OK across the pool with
# strict gemini -> groq -> nex rotation; per-batch 2.4-4.9s (groq), 10.8-13.5s
# (gemini), 102-118s (nex). To add a model: pass batch-repro.sh 3/3 first, then
# add it as an entry with the same alias (CLIProxyAPI pools the alias).
openai-compatibility:
  # Pool tiers: groq and gemini share tier 10 (the selector round-robins within
  # a tier; observed split shifts with cooldown events); nex sits at the
  # default 0 and would serve only while both higher tiers are cooling.
  #
  # nex is disabled as of 2026-09-21: during cooldown windows it served
  # malformed batches (OpenRouter 400 json_validate_failed - bare array,
  # mangled entries - and 17/25 position truncations), and a single 400 is
  # file-fatal for lingarr (strict-fail, no retry on 4xx). Two healthy
  # upstreams beat three with one poison pill; re-enable by flipping the flag
  # when OpenRouter's free tier behaves again.
  # Priority is a strict ladder (selector.go, availableAuthsFromPriorityBuckets
  # with allPriorities=false): only the highest available tier is picked.
  #
  # Cooling is ON for every entry, deliberately. The 2026-09-13 disable-cooling
  # rationale ("a cooldown here is a blackout, not a failover - 247 batch
  # failures in 6 min from one Nvidia 502") held for a single-upstream config:
  # with one entry, cooling the only credential meant answering synthetic 503s
  # until the window closed. In a pool the cooldown is the failover: a saturated
  # entry cools, the selector drops to the healthy tier, and the synthetic 503
  # fires only when every upstream is cooling at once. With cooling disabled a
  # 429-exhausted entry would keep receiving half the traffic and failing it.
  #
  # request-retry: up to 3 extra upstream attempts INSIDE one client call for
  # 403/408/429/500/502/503/504 (config.example.yaml), absorbing transient blips
  # before a cooldown is even considered. Measured on the pinned binary against
  # a mock upstream, 21-cooling-mock-test: 502-then-200 one client call: baseline
  # 502, this config 200 (upstream saw 502,200). 429-then-200: 200. Upstream
  # down (8x502): client 502, exactly 4 upstream attempts per call, then the
  # next call after recovery is 200.
  - name: "openrouter"
    disabled: true
    request-retry: 3
    base-url: "https://openrouter.ai/api/v1"
    api-key-entries:
      - api-key: "__OPENROUTER_API_KEY__"
    models:
      - name: "nex-agi/nex-n2.5-pro:free"
        alias: "or-free"
        display-name: "Nex N2.5 Pro free (lingarr)"
        # context_length from openrouter.ai/api/v1/models, 2026-09-13
        max-context-length: 262144

  # Groq free plan.
  - name: "groq"
    priority: 10
    request-retry: 3
    base-url: "https://api.groq.com/openai/v1"
    api-key-entries:
      - api-key: "__GROQ_API_KEY__"
    models:
      - name: "openai/gpt-oss-120b"
        alias: "or-free"
        display-name: "Groq gpt-oss-120b free (lingarr)"
        # Groq models page, 2026-09-21
        max-context-length: 131072

  # Google AI Studio free tier via Google's OpenAI-compatibility layer.
  - name: "gemini"
    priority: 10
    request-retry: 3
    base-url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api-key-entries:
      - api-key: "__GEMINI_API_KEY__"
    models:
      - name: "gemini-3.5-flash"
        alias: "or-free"
        display-name: "Gemini 3.5 Flash free (lingarr)"
        # Google's documented 1M-token flash context
        max-context-length: 1048576
