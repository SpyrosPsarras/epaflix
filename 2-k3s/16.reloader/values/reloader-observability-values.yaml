# stakater/reloader v1.4.21 (chart 2.2.16) — instance scoped to the
# observability namespace only (issue #715), so a `grafana-admin-secret`
# rotation rolls `kube-prometheus-stack-grafana` automatically instead of
# needing a manual `kubectl rollout restart`. See kustomization.yaml for why
# this is a separate release per watched namespace rather than one shared
# instance.
#
# The annotation lives in this repo's kube-prometheus-stack values, not on a
# manifest we template directly: `grafana.annotations` in
# 2-k3s/10.observability/prometheus-values.yaml. That key is the one the
# grafana subchart renders into the Deployment's own `metadata.annotations`,
# which is where Reloader looks; `grafana.podAnnotations` lands on the pod
# template instead and would be a silent no-op (verified against the pinned
# kube-prometheus-stack 87.21.0 grafana subchart templates, not assumed).
#
# Reloader is content-hash driven, not sync driven: it injects
# `STAKATER_<NAME>_SECRET=<sha1 of the Secret data>` into the pod template and
# rolls only when that hash changes, so a routine ArgoCD sync that re-applies
# the same Secret bytes rolls nothing. Grafana runs 2 replicas behind a
# topology spread constraint, so a rotation rolls rather than blackholes the UI.
reloader:
  watchGlobally: false
  ignoreCronJobs: true
  ignoreJobs: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
