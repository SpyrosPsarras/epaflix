apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: "2.2.16"
    releaseName: reloader-servarr
    namespace: servarr
    valuesFile: values/reloader-servarr-values.yaml
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: "2.2.16"
    releaseName: reloader-traefik-system
