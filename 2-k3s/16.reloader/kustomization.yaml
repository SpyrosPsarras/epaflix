    valuesFile: values/reloader-traefik-system-values.yaml
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: "2.2.16"
    releaseName: reloader-odysseus
    namespace: odysseus
    valuesFile: values/reloader-odysseus-values.yaml
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: "2.2.16"
    releaseName: reloader-app-authentik
    namespace: app-authentik
    valuesFile: values/reloader-app-authentik-values.yaml
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: "2.2.16"
    releaseName: reloader-argocd
    namespace: argocd
    valuesFile: values/reloader-argocd-values.yaml
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: "2.2.16"
    releaseName: reloader-observability
    namespace: observability
    valuesFile: values/reloader-observability-values.yaml
