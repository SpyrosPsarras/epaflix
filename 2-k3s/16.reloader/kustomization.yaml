# ArgoCD-managed kustomization for stakater/Reloader (issue #299).
#
# Owned by ArgoCD Application "reloader" (2-k3s/11.argocd/apps/app-reloader.yaml).
#
# THREE separate Reloader releases, one per watched namespace, NOT one shared
# instance with a namespace list. Verified against the pulled chart
# (v1.4.19 / 2.2.14) templates: `reloader.namespaces` is not a real key in
# this version, and `watchGlobally: false` ties the pod + ServiceAccount +
# Role + RoleBinding all to a single namespace (`.Values.namespace` or the
# release namespace) — there is no way to grant real namespace-scoped Role
# RBAC (as opposed to a cluster-wide ClusterRole) for more than one
# namespace per release. Three tiny instances (10m CPU / 32Mi mem each) is
# the price of keeping RBAC scoped instead of reaching for
# `watchGlobally: true`, which would need a ClusterRole able to read every
# Secret in the cluster just to ignore most of them via `ignoreNamespaces`.
#
# Rendered via kustomize's built-in helm inflator (kustomize.buildOptions:
# --enable-helm, already set for this cluster's ArgoCD — same mechanism as
# cert-manager/authentik/traefik). Chart pinned below; Renovate's default
# kustomize manager tracks `helmCharts[].version` bumps like every other
# chart in this repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: "2.2.14"
    releaseName: reloader-servarr
    namespace: servarr
    valuesFile: values/reloader-servarr-values.yaml
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: "2.2.14"
    releaseName: reloader-traefik-system
    namespace: traefik-system
    valuesFile: values/reloader-traefik-system-values.yaml
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: "2.2.14"
    releaseName: reloader-odysseus
    namespace: odysseus
    valuesFile: values/reloader-odysseus-values.yaml
