apiVersion: batch/v1
kind: Job
metadata:
  name: vault-org-setup
  namespace: vaultwarden
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: vaultwarden-org-setup}
    spec:
      serviceAccountName: vaultwarden-org-setup
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: kubectl
          image: alpine/kubectl
          command: [sh, -ec, 'cp "$(command -v kubectl)" /tools/kubectl']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tools, mountPath: /tools}
      containers:
        - name: setup
          image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
          command: [bash, -ec]
          args:
            - |
              umask 077
              cp /scripts/package*.json /work/
              cd /work
              npm ci --ignore-scripts --no-audit --no-fund > /work/install.log 2>&1 || { printf 'Pinned dependency installation failed.\n'; exit 1; }
              cp /scripts/setup.cjs /scripts/identities.json /work/
              exec node /work/setup.cjs
          env:
            - {name: HOME, value: /work}
            - {name: PATH, value: /work/node_modules/.bin:/tools:/usr/local/bin:/usr/bin:/bin}
            - {name: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD, value: "1"}
            - {name: NODE_ENV, value: production}
            - {name: npm_config_cache, value: /work/npm-cache}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: tools, mountPath: /tools, readOnly: true}
            - {name: work, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap: {name: vaultwarden-org-setup-scripts}
        - name: tools
          emptyDir: {medium: Memory, sizeLimit: 96Mi}
        - name: work
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
