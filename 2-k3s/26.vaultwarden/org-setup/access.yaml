apiVersion: v1
kind: ServiceAccount
metadata:
  name: vaultwarden-org-setup
  namespace: vaultwarden
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vaultwarden-org-setup
  namespace: vaultwarden
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [vaultwarden-org-setup]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [vaultwarden]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vaultwarden-org-setup
  namespace: vaultwarden
subjects:
  - {kind: ServiceAccount, name: vaultwarden-org-setup, namespace: vaultwarden}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: vaultwarden-org-setup}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vaultwarden-org-setup
  namespace: t3code-homelab
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [vaultwarden-agent]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vaultwarden-org-setup
  namespace: t3code-homelab
subjects:
  - {kind: ServiceAccount, name: vaultwarden-org-setup, namespace: vaultwarden}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: vaultwarden-org-setup}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vaultwarden-org-setup
  namespace: t3code-work
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [vaultwarden-agent]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vaultwarden-org-setup
  namespace: t3code-work
subjects:
  - {kind: ServiceAccount, name: vaultwarden-org-setup, namespace: vaultwarden}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: vaultwarden-org-setup}
