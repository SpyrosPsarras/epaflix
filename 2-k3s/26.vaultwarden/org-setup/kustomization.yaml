apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - access.yaml
configMapGenerator:
  - name: vaultwarden-org-setup-scripts
    namespace: vaultwarden
    options:
      disableNameSuffixHash: true
    files:
      - setup.cjs
      - identities.json
      - package.json
      - package-lock.json
patches:
  - target: {kind: Deployment, name: vaultwarden}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vaultwarden
      spec:
        template:
          spec:
            containers:
              - name: vaultwarden
                env:
                  - name: ORG_CREATION_USERS
                    value: null
                    valueFrom:
                      secretKeyRef: {name: vaultwarden-org-setup, key: BW_EMAIL}
                  - {name: _ENABLE_SMTP, value: "false"}
                  - name: ADMIN_TOKEN
                    valueFrom:
                      secretKeyRef: {name: vaultwarden-org-setup, key: ADMIN_TOKEN}
