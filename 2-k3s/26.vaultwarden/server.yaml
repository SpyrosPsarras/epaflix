apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate-config
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER]}
          command: ["sh", "/migrate/migrate-local-path.sh", "/old", "/data"]
          volumeMounts:
            - {name: vaultwarden-data-local-path, mountPath: /old, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: migrate-local-path, mountPath: /migrate, readOnly: true}
      containers:
        - name: vaultwarden
          image: vaultwarden/server
          env:
            - {name: DOMAIN, value: "https://vaultwarden.epaflix.com"}
            - {name: DATA_FOLDER, value: /data}
            - {name: ROCKET_PORT, value: "8080"}
            - {name: DB_CONNECTION_RETRIES, value: "0"}
            - {name: SIGNUPS_ALLOWED, value: "false"}
            - {name: SIGNUPS_VERIFY, value: "false"}
            - {name: INVITATIONS_ALLOWED, value: "true"}
            - {name: EMERGENCY_ACCESS_ALLOWED, value: "false"}
            - {name: ORG_CREATION_USERS, value: spypsarras@gmail.com}
            - {name: PUSH_ENABLED, value: "false"}
            - {name: SMTP_DEBUG, value: "false"}
            - {name: LOG_LEVEL, value: warn}
            - {name: IP_HEADER_TRUSTED_PROXIES, value: "10.42.0.0/16"}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: vaultwarden-db, key: DATABASE_URL}
          envFrom:
            - secretRef: {name: vaultwarden-smtp}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /alive, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          # /alive acquires a database connection. Never use it for liveness.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: vaultwarden-data-iscsi}
        - name: vaultwarden-data-local-path
          persistentVolumeClaim: {claimName: vaultwarden-data, readOnly: true}
        - name: migrate-local-path
          configMap: {name: vaultwarden-migrate}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  selector: {app: vaultwarden}
  ports:
    - {name: http, port: 80, targetPort: http}
