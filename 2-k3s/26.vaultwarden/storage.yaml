apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data-iscsi
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: truenas-iscsi
  resources:
    requests:
      storage: 1Gi
