apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level namespace: the DatabaseRole, Database and role Secret must land in postgres-system.
resources:
  - namespace.yaml
  - database.yaml
  - home-assistant.yaml
  - ingressroute.yaml
  - network-policy.yaml

helmCharts:
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: "2.2.20"
    releaseName: reloader-home-assistant
    namespace: home-assistant
    valuesFile: reloader-values.yaml

generators:
  - ksops-generator.yaml

images:
  - name: ghcr.io/home-assistant/home-assistant
    newTag: 2026.11.1@sha256:6785d1eca68747a524c156faae1b139ed415c07357386ae6fe17291986e59e82
  - name: ghcr.io/stakater/reloader
    newTag: v1.4.24@sha256:3ab43d3eb96c59798644bf826b0444a846c0197d22ab4b6c101c4da3e1d6ef23
