---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: home-assistant
spec:
  storageClassName: truenas-iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-configuration
  namespace: home-assistant
data:
  configuration.yaml: |
    default_config:

    recorder:
      db_url: !secret recorder_db_url
      db_max_retries: 100

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    mqtt:
      binary_sensor:
        - name: Tibber bridge
          unique_id: tibber_bridge
          state_topic: homelab/tibber-bridge/state
          payload_on: "1"
          payload_off: "0"
          device_class: connectivity
  # Seeds .storage/http once: Home Assistant 2026.11 ignores http: YAML after a one-time import that must be confirmed in the UI.
  http.json: |
    {
      "version": 3,
      "minor_version": 1,
      "key": "http",
      "data": {
        "stable": {
          "server_port": 8123,
          "use_x_forwarded_for": true,
          "trusted_proxies": ["10.42.0.0/16"],
          "cors_allowed_origins": ["https://cast.home-assistant.io"],
          "login_attempts_threshold": -1,
          "ip_ban_enabled": true,
          "ssl_profile": "intermediate_v6",
          "use_x_frame_options": true,
          "created_at": "2026-11-13T00:00:00+00:00",
          "error": null,
          "error_message": null
        },
        "pending": null,
        "yaml_migration_done": true
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app: home-assistant
  annotations:
    secret.reloader.stakater.com/reload: home-assistant-secrets
    configmap.reloader.stakater.com/reload: home-assistant-configuration
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      initContainers:
        - name: configuration
          image: ghcr.io/home-assistant/home-assistant
          command:
            - sh
            - -c
            - |
              set -e
              cp /defaults/configuration.yaml /config/configuration.yaml
              mkdir -p /config/.storage
              [ -e /config/.storage/http ] || cp /defaults/http.json /config/.storage/http
              [ -e /config/automations.yaml ] || echo '[]' > /config/automations.yaml
              [ -e /config/scripts.yaml ] || echo '{}' > /config/scripts.yaml
              [ -e /config/scenes.yaml ] || echo '[]' > /config/scenes.yaml
              target=/config/custom_components/tibber_pulse_mqtt
              if ! grep -q "\"version\": \"$TIBBER_PULSE_MQTT_VERSION\"" "$target/manifest.json" 2>/dev/null; then
                zip=/tmp/tibber_pulse_mqtt.zip
                if wget -q -T 30 -O "$zip" "https://github.com/mrhedstrom/ha-tibber-pulse-mqtt/releases/download/v$TIBBER_PULSE_MQTT_VERSION/tibber_pulse_mqtt.zip"; then
                  echo "$TIBBER_PULSE_MQTT_SHA256  $zip" | sha256sum -c -
                  rm -rf /config/.tibber_pulse_mqtt.new
                  unzip -q "$zip" -d /config/.tibber_pulse_mqtt.new
                  mkdir -p /config/custom_components
                  rm -rf "$target"
                  mv /config/.tibber_pulse_mqtt.new "$target"
                else
                  echo "WARNING: could not download tibber_pulse_mqtt $TIBBER_PULSE_MQTT_VERSION, starting with the installed copy if any"
                fi
              fi
          env:
            - name: TIBBER_PULSE_MQTT_VERSION
              # renovate: datasource=github-releases depName=mrhedstrom/ha-tibber-pulse-mqtt
              value: "0.4.7"
            - name: TIBBER_PULSE_MQTT_SHA256
              value: "a3b5daf5eaf14cdcf5b82699b549f3eea0c6470e68ea9c5977d65e283b3f8a55"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration
              mountPath: /defaults
              readOnly: true
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: secrets
              mountPath: /config/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: configuration
          configMap:
            name: home-assistant-configuration
        - name: secrets
          secret:
            secretName: home-assistant-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  type: ClusterIP
  selector:
    app: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      protocol: TCP
