---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config
  namespace: home-assistant
spec:
  storageClassName: truenas-iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-configuration
  namespace: home-assistant
data:
  configuration.yaml: |
    default_config:

    recorder:
      db_url: !secret recorder_db_url
      db_max_retries: 100

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml
  # Home Assistant 2026.11 keeps http settings in .storage/http and ignores the http: YAML after a one-time, UI-confirmed import.
  http.json: |
    {
      "version": 3,
      "minor_version": 1,
      "key": "http",
      "data": {
        "stable": {
          "server_port": 8123,
          "use_x_forwarded_for": true,
          "trusted_proxies": ["10.42.0.0/16"],
          "cors_allowed_origins": ["https://cast.home-assistant.io"],
          "login_attempts_threshold": -1,
          "ip_ban_enabled": true,
          "ssl_profile": "intermediate_v6",
          "use_x_frame_options": true,
          "created_at": "2026-11-13T00:00:00+00:00",
          "error": null,
          "error_message": null
        },
        "pending": null,
        "yaml_migration_done": true
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app: home-assistant
  annotations:
    secret.reloader.stakater.com/reload: home-assistant-secrets
    configmap.reloader.stakater.com/reload: home-assistant-configuration
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      initContainers:
        - name: configuration
          image: ghcr.io/home-assistant/home-assistant
          command:
            - sh
            - -c
            - |
              set -e
              cp /defaults/configuration.yaml /config/configuration.yaml
              mkdir -p /config/.storage
              cp /defaults/http.json /config/.storage/http
              [ -e /config/automations.yaml ] || echo '[]' > /config/automations.yaml
              [ -e /config/scripts.yaml ] || echo '{}' > /config/scripts.yaml
              [ -e /config/scenes.yaml ] || echo '[]' > /config/scenes.yaml
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration
              mountPath: /defaults
              readOnly: true
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: secrets
              mountPath: /config/secrets.yaml
              subPath: secrets.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: configuration
          configMap:
            name: home-assistant-configuration
        - name: secrets
          secret:
            secretName: home-assistant-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  type: ClusterIP
  selector:
    app: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      protocol: TCP
