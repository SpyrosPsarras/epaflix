---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: esphome-config
  namespace: home-assistant
spec:
  storageClassName: truenas-iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: esphome
  namespace: home-assistant
  labels:
    app: esphome
  annotations:
    secret.reloader.stakater.com/reload: esphome-auth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: esphome
  template:
    metadata:
      labels:
        app: esphome
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: esphome
          image: ghcr.io/esphome/esphome
          ports:
            - name: http
              containerPort: 6052
              protocol: TCP
          env:
            - name: ESPHOME_USERNAME
              valueFrom:
                secretKeyRef:
                  name: esphome-auth
                  key: ESPHOME_USERNAME
            - name: ESPHOME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: esphome-auth
                  key: ESPHOME_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /version
              port: 6052
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: esphome-config
---
apiVersion: v1
kind: Service
metadata:
  name: esphome
  namespace: home-assistant
spec:
  type: ClusterIP
  selector:
    app: esphome
  ports:
    - name: http
      port: 6052
      targetPort: 6052
      protocol: TCP
