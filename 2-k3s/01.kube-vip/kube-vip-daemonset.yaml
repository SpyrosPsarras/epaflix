apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-vip
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-vip-role
rules:
  - apiGroups: [""]
    resources: ["services", "services/status", "nodes", "endpoints"]
    verbs: ["list", "get", "watch", "update"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "get", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["list", "get", "watch", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-vip-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-vip-role
subjects:
  - kind: ServiceAccount
    name: kube-vip
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: kube-vip
  template:
    metadata:
      labels:
        name: kube-vip
    spec:
      serviceAccountName: kube-vip
      hostNetwork: true
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip
          imagePullPolicy: IfNotPresent
          args:
            - manager
          env:
            - name: vip_interface
              value: "eth0"
            - name: vip_arp
              value: "true"
            - name: address
              value: "192.168.10.100"
            - name: vip_subnet
              value: "24"
            - name: port
              value: "6443"
            - name: cp_enable
              value: "true"
            - name: cp_namespace
              value: "kube-system"
            - name: svc_enable
              value: "true"
            - name: svc_election
              value: "true"
            - name: lb_class_name
              value: "kube-vip.io/control-plane-only"
            - name: lb_class_only
              value: "true"
            - name: health_check_port
              value: "2113"
            - name: vip_leaderelection
              value: "true"
            - name: vip_leaseduration
              value: "30"
            - name: vip_renewdeadline
              value: "20"
            - name: vip_retryperiod
              value: "5"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 2113
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip-services
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: kube-vip-services
  template:
    metadata:
      labels:
        name: kube-vip-services
    spec:
      serviceAccountName: kube-vip
      hostNetwork: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip
          imagePullPolicy: IfNotPresent
          args:
            - manager
          env:
            - name: vip_interface
              value: "eth0"
            - name: vip_arp
              value: "true"
            - name: vip_subnet
              value: "24"
            - name: cp_enable
              value: "false"
            - name: svc_enable
              value: "true"
            - name: svc_election
              value: "true"
            - name: health_check_port
              value: "2113"
            - name: vip_leaderelection
              value: "true"
            - name: vip_leaseduration
              value: "30"
            - name: vip_renewdeadline
              value: "20"
            - name: vip_retryperiod
              value: "5"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 2113
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
