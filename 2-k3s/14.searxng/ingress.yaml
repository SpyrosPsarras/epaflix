---
# SearXNG - HTTPS IngressRoute with Let's Encrypt TLS via Cloudflare
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: searxng-https
  namespace: searxng
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`searxng.epaflix.com`)
      kind: Rule
      # #547: this is the entry point the whole internet reaches, including
      # anyone resolving straight to the origin IP around Cloudflare.
      # Traefik enforces this, so the bypass path is gated too.
      # LAN keeps an unauthenticated path via searxng-internal on 102.
      middlewares:
        - name: authentik-forwardauth
          namespace: traefik-system
      services:
        - name: searxng
          port: 8080
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
---
# HTTP to HTTPS redirect for SearXNG
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: searxng-http
  namespace: searxng
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`searxng.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: searxng
          port: 8080
---
# SearXNG on the INTERNAL entry point (192.168.10.102), deliberately with no
# forward-auth. #547: the public route is gated through Authentik, but LAN
# clients and the owner's own SearXNG API queries need an unauthenticated
# path, and an IP-based bypass is impossible because Traefik cannot see
# client IPs while the LoadBalancers run externalTrafficPolicy: Cluster
# (#560). Same pattern as cliproxy and remote-pi.
# Pi-hole resolves searxng.epaflix.com to 192.168.10.102 so LAN lands here.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: searxng-internal
  namespace: searxng
spec:
  entryPoints:
    - internal
  routes:
    - match: Host(`searxng.epaflix.com`)
      kind: Rule
      services:
        - name: searxng
          port: 8080
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
