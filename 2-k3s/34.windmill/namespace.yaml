---
apiVersion: v1
kind: Namespace
metadata:
  name: windmill
  labels:
    app: windmill
  annotations:
    # before the wave -2 Secrets: ArgoCD orders by wave before kind
    argocd.argoproj.io/sync-wave: "-3"
---
# Jobs run user code with the worker's ServiceAccount, so it gets no token and no Role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: windmill-worker
  namespace: windmill
automountServiceAccountToken: false
