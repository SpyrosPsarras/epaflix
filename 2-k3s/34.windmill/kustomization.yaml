apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level namespace: the DatabaseRoles, Database and role Secret must land in postgres-system.
resources:
  - namespace.yaml
  - database.yaml
  - ingressroute.yaml
  - network-policy.yaml

generators:
  - ksops-generator.yaml

helmCharts:
  - name: windmill
    repo: https://windmill-labs.github.io/windmill-helm-charts
    version: "4.0.313"
    releaseName: windmill
    namespace: windmill
    valuesFile: values.yaml
