apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level namespace: the DatabaseRoles, Database and role Secret must land in postgres-system.
resources:
  - namespace.yaml
  - database.yaml
  - ingressroute.yaml
  - network-policy.yaml
  - deploy-cronjob.yaml

generators:
  - ksops-generator.yaml

configMapGenerator:
  - name: windmill-deploy-script
    namespace: windmill
    files:
      - deploy.mjs
      - package.json=deploy-cli/package.json
      - package-lock.json=deploy-cli/package-lock.json

helmCharts:
  - name: windmill
    repo: https://windmill-labs.github.io/windmill-helm-charts
    version: "4.0.313"
    releaseName: windmill
    namespace: windmill
    valuesFile: values.yaml
