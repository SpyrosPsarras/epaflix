---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: windmill-https
  namespace: windmill
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`windmill.epaflix.com`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: traefik-system
        - name: authentik-forwardauth
          namespace: traefik-system
      services:
        - name: windmill-app
          port: 8000
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: windmill-http
  namespace: windmill
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`windmill.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: windmill-app
          port: 8000
