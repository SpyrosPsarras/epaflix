summary: Four-strategy screener (long pullback and breakout, short rally rejection and breakdown) by market regime
description: See 2-k3s/34.windmill/README.md in the homelab repo.
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - finviz_url
    - tickers
    - strategy
    - max_tickers
    - track_days
    - validation_days
    - settings
    - email
  properties:
    finviz_url:
      type: string
      description: Finviz screener address for discovery, https://finviz.com/screener.ashx?...
      default: ''
    tickers:
      type: string
      description: Or a comma-separated list of tickers instead of a Finviz URL
      default: ''
    strategy:
      type: string
      description: 'Which strategies to run: all, long, short, both (= long, kept for older runs) or a single one'
      enum:
        - all
        - long
        - short
        - both
        - pullback
        - breakout
        - rally_rejection
        - breakdown
      default: all
    max_tickers:
      type: integer
      description: Most tickers to fetch and screen, 1 to 200
      default: 50
    track_days:
      type: integer
      description: Also report the status of the signals of this many previous sessions, 0 to 60
      default: 10
    validation_days:
      type: integer
      description: Walk-forward validation over this many past sessions, 0 to skip
      default: 0
    settings:
      type: object
      description: 'Optional overrides of the thresholds, e.g. {"min_rel_volume": 2}. See DEFAULTS in the script'
      default: {}
    email:
      type: string
      description: Optional address to email the candidates to (uses resource f/screener/smtp); empty sends nothing
      default: ''
  required: []
