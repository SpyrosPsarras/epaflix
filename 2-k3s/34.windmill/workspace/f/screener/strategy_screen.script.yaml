summary: Strategy screener (long pullback, breakout, squeeze; short rally rejection, run break, dead cat, breakdown only by name at the 200-day line as bear put debit spreads in a decline or an overextended bull market) by market regime and phase
description: See 2-k3s/34.windmill/README.md in the homelab repo.
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - finviz_url
    - tickers
    - strategy
    - max_tickers
    - track_days
    - validation_days
    - settings
    - email
    - persist
  properties:
    finviz_url:
      type: string
      description: One or more Finviz screener addresses (up to 3, one per line), https://finviz.com/screener.ashx?...
      default: ''
    tickers:
      type: string
      description: Or a comma-separated list of tickers instead of a Finviz URL
      default: ''
    strategy:
      type: string
      description: 'Which strategies to run: all, long, short, both (= long, kept for older runs) or a single one. all and short leave out breakdown, which lost in every backtest; ask for it by name'
      enum:
        - all
        - long
        - short
        - both
        - pullback
        - breakout
        - squeeze
        - rally_rejection
        - breakdown
        - run_break
        - dead_cat
      default: all
    max_tickers:
      type: integer
      description: Most tickers to take from each Finviz URL (or from the list), 1 to 200
      default: 50
    track_days:
      type: integer
      description: Also report the status of the signals of this many previous sessions, 0 to 60
      default: 10
    validation_days:
      type: integer
      description: Walk-forward validation over this many past sessions, 0 to skip
      default: 0
    settings:
      type: object
      description: 'Optional overrides of the thresholds, e.g. {"min_rel_volume": 2}. See DEFAULTS in the script'
      default: {}
    email:
      type: string
      description: Optional address to email the candidates to (uses resource f/screener/smtp); empty sends nothing
      default: ''
    persist:
      type: boolean
      description: Store every signal in the data table main (schema screener) and follow it until it closes; also report hold or sell for your positions recorded with f/screener/positions
      default: false
  required: []
