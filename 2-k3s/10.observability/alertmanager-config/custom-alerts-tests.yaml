# promtool cannot read the PrometheusRule CR. Generate the bare rules file, then run:
#   python3 -c "import yaml;yaml.safe_dump(yaml.safe_load(open('custom-alerts.yaml'))['spec'],open('custom-alerts-rules.yaml','w'))"
#   promtool test rules custom-alerts-tests.yaml
rule_files:
  - custom-alerts-rules.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'promtail_custom_credential_lines_redacted_total{namespace="observability",pod="promtail-abc",container="promtail",exported_namespace="traefik-system",exported_container="traefik",exported_pod="traefik-6444675d5-x6mdf"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: CredentialRedactedFromLogs
        exp_alerts:
          - exp_labels:
              exported_namespace: traefik-system
              exported_container: traefik
              severity: warning
              component: security
            exp_annotations:
              summary: "An app logged a credential in traefik-system (redacted before Loki)"
              description: "15 log line(s) from traefik-system/traefik contained a credential-shaped key=value in the last 15m. promtail redacted the value before pushing, so it is NOT in Loki - but it IS in the pod's own stdout and visible via `kubectl logs`. The exported_* labels name the offending app; plain namespace/pod/container are promtail itself (#911). Most likely causes: sonarr/radarr/prowlarr restarting and logging their Postgres connection string (#634), or traefik access lines carrying jellyfin's query-string ApiKey (#702). If it is a new offender treat that credential as exposed and rotate it. Do NOT grep Loki for the literal value."

  - interval: 1m
    input_series:
      - series: 'promtail_custom_credential_lines_redacted_total{namespace="observability",pod="promtail-abc",container="promtail",exported_namespace="servarr",exported_container="sonarr",exported_pod="sonarr-68855b8c7f-s8879"}'
        values: "4x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: CredentialRedactedFromLogs
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_last_collect_success{job="truenas-gpu-exporter", instance="192.168.10.200"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: NvidiaGpuExporterCollectionFailing
        exp_alerts:
          - exp_labels:
              job: truenas-gpu-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-gpu
            exp_annotations:
              summary: "GPU metric collection is failing on 192.168.10.200"
              description: >-
                  The exporter on 192.168.10.200 cannot collect GPU metrics. Run nvidia-smi on the host by hand
                  and check dmesg for NVRM/Xid messages. The most common cause is a driver/library mismatch after
                  a driver upgrade. THIS IS THE 2026-08-09 SIGNATURE: exporter serving, card gone, every
                  application still answering on CPU. Never silence this one.

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_last_collect_success{job="truenas-gpu-exporter", instance="192.168.10.200"}'
        values: "1x45"
      - series: 'nvidia_smi_last_collect_duration_seconds{job="truenas-gpu-exporter", instance="192.168.10.200"}'
        values: "0.12x45"
      - series: 'nvidia_smi_gpu_info{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s"}'
        values: "1x45"
      - series: 'nvidia_smi_gpu_recovery_action{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s"}'
        values: "0x45"
    alert_rule_test:
      - eval_time: 40m
        alertname: NvidiaGpuExporterCollectionFailing
        exp_alerts: []
      - eval_time: 40m
        alertname: NvidiaGpuExporterCollectionSlow
        exp_alerts: []
      - eval_time: 40m
        alertname: NvidiaGpuMissing
        exp_alerts: []
      - eval_time: 40m
        alertname: NvidiaGpuRecoveryActionNeeded
        exp_alerts: []
      - eval_time: 40m
        alertname: NvidiaGpuXidCritical
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_gpu_info{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s"}'
        values: "1x15"
      - series: 'nvidia_smi_last_collect_success{job="truenas-gpu-exporter", instance="192.168.10.200"}'
        values: "1x45"
    alert_rule_test:
      - eval_time: 40m
        alertname: NvidiaGpuMissing
        exp_alerts:
          - exp_labels:
              job: truenas-gpu-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-gpu
            exp_annotations:
              summary: "A GPU disappeared on 192.168.10.200"
              description: >-
                  nvidia-smi reports fewer GPUs on 192.168.10.200 than the maximum seen in the last 6 hours while
                  collection stays healthy. There is exactly ONE card in this box (RTX 2070 SUPER at 01:00.0), so
                  this means it is gone while the driver still answers - the 2026-08-09 WPR2 wedge, and the
                  condition that went unnoticed for ~23 hours. Check dmesg for "unexpected WPR2 already up" and
                  "RmInitAdapter failed", then follow the no-reboot recovery procedure. Never silence this one.
      - eval_time: 40m
        alertname: NvidiaGpuExporterCollectionFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_xid_last_timestamp_seconds{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s", xid="79"}'
        values: "540x15"
      - series: 'nvidia_smi_xid_last_timestamp_seconds{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s", xid="13"}'
        values: "540x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: NvidiaGpuXidCritical
        exp_alerts:
          - exp_labels:
              job: truenas-gpu-exporter
              instance: 192.168.10.200
              uuid: GPU-2070s
              xid: "79"
              severity: critical
              component: truenas-gpu
            exp_annotations:
              summary: "Critical GPU Xid error on 192.168.10.200"
              description: >-
                  GPU GPU-2070s reported Xid 79, a critical error, in the last 10 minutes. Among the default
                  codes, 48/62/64/95/119/120 mean an uncorrectable memory, microcontroller or GSP fault: reset
                  the GPU. Xid 79 means the GPU fell off the PCIe bus. Xid 74 is an NVLink fault. Check dmesg for
                  the matching NVRM Xid line. REQUIRES THE NVML BACKEND - the exporter must run the `-nvml` image
                  flavor or this series does not exist.

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_xid_last_timestamp_seconds{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s", xid="79"}'
        values: "540x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: NvidiaGpuXidCritical
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_gpu_recovery_action{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s"}'
        values: "2x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: NvidiaGpuRecoveryActionNeeded
        exp_alerts:
          - exp_labels:
              job: truenas-gpu-exporter
              instance: 192.168.10.200
              uuid: GPU-2070s
              severity: critical
              component: truenas-gpu
            exp_annotations:
              summary: "A GPU on 192.168.10.200 needs a recovery action"
              description: >-
                  The NVIDIA driver itself reports that GPU GPU-2070s needs recovery. The value names the action:
                  1 = reset the GPU, 2 = reboot the node, 3 = drain peer-to-peer workloads, 4 = drain and reset
                  (current value: 2). Stop ollama and Jellyfin first - nothing may hold /dev/nvidia* during a
                  reset.

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_last_collect_duration_seconds{job="truenas-gpu-exporter", instance="192.168.10.200"}'
        values: "6x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: NvidiaGpuExporterCollectionSlow
        exp_alerts:
          - exp_labels:
              job: truenas-gpu-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-gpu
            exp_annotations:
              summary: "GPU metric collection is slow on 192.168.10.200"
              description: >-
                  Collecting GPU metrics on 192.168.10.200 takes longer than 5 seconds. A healthy collection
                  answers well under a second when the persistence daemon runs. Check that nvidia-persistenced is
                  up (0-truenas/scripts/gpu-persistenced.sh) and read dmesg for Xid messages: sustained slowness
                  often precedes a wedged driver. Collections that hang entirely are caught by
                  NvidiaGpuExporterCollectionFailing instead of this one.

  - interval: 1m
    input_series:
      - series: 'node_zfs_arc_c_max{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "33285996544x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: TruenasArcCapDrift
        exp_alerts:
          - exp_labels:
              job: truenas-node-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-memory
            exp_annotations:
              summary: "TrueNAS ZFS ARC cap is no longer 12 GiB"
              description: >-
                  node_zfs_arc_c_max on 192.168.10.200 reads 3.3285996544e+10 instead of the 12884901888 (12 GiB)
                  cap applied during the 2026-08-09 recovery. Uncapped ARC on this 31 GB box is the suspected
                  trigger of the WPR2 GPU wedge: the driver hit NV_ERR_NO_MEMORY part-way through initialising
                  the GSP firmware. Re-apply the ZFS tunable AND the /etc/modprobe.d/zfs.conf boot copy.

  - interval: 1m
    input_series:
      - series: 'node_zfs_arc_size{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "12895364840x30"
      - series: 'node_zfs_arc_c_max{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "12884901888x30"
      - series: 'node_zfs_arc_memory_throttle_count{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: TruenasArcCapDrift
        exp_alerts: []
      - eval_time: 25m
        alertname: TruenasArcOverCap
        exp_alerts: []
      - eval_time: 25m
        alertname: TruenasArcForcedShrink
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'node_zfs_arc_size{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "14173392076x30"
      - series: 'node_zfs_arc_c_max{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "12884901888x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: TruenasArcOverCap
        exp_alerts:
          - exp_labels:
              job: truenas-node-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-memory
            exp_annotations:
              summary: "TrueNAS ZFS ARC is sustained above its own cap"
              description: >-
                  ARC on 192.168.10.200 has been more than 5% above its own c_max for 15 minutes (ratio
                  1.0999999999379118). The baseline export (issue #1113, 0-truenas/scripts/arc-baseline/)
                  never saw the overshoot pass 1.0021, not even in the 2026-09-12/13 ollama load window
                  that took the host to 3.4% free memory, so a sustained >1.05 is the cap not being
                  enforced rather than a warm cache. Check the zfs_arc_max tunable and
                  /etc/modprobe.d/zfs.conf, and watch the GPU: uncapped ARC on this 31 GB box is the
                  suspected trigger of the 2026-08-09 WPR2 wedge.

  - interval: 1m
    input_series:
      - series: 'node_zfs_arc_memory_throttle_count{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "0x10 1+1x20"
    alert_rule_test:
      - eval_time: 25m
        alertname: TruenasArcForcedShrink
        exp_alerts:
          - exp_labels:
              job: truenas-node-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-memory
            exp_annotations:
              summary: "TrueNAS ZFS ARC was throttled by memory pressure"
              description: >-
                  node_zfs_arc_memory_throttle_count on 192.168.10.200 increased by 15 in 15 minutes; it was
                  0 and static before, and stayed 0 through the 2026-09-12/13 ollama load window that took
                  the host to 3.4% free memory (issue #1113, export in 0-truenas/scripts/arc-baseline/) -
                  eviction absorbed that load, so a nonzero reading is real throttling. ZFS is being forced
                  to give memory back under pressure, which is the condition the driver hit
                  NV_ERR_NO_MEMORY under on 2026-08-09. Find what is asking for the memory (ollama model
                  load, a large transcode) and check nvidia-smi still sees the card.

  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{device="pool1",device_error="",fstype="zfs",instance="192.168.10.200",job="truenas-node-exporter",mountpoint="/mnt/pool1"}'
        values: "429496729599x90"  # 400 GiB - 1, below both pool1 thresholds
    alert_rule_test:
      - eval_time: 70m
        alertname: TruenasPool1FreeLow
        exp_alerts:
          - exp_labels:
              job: truenas-node-exporter
              instance: 192.168.10.200
              device: pool1
              fstype: zfs
              mountpoint: /mnt/pool1
              severity: warning
              component: truenas-storage
            exp_annotations:
              summary: "pool1 free space is under 1 TiB (~92% used)"
              description: >-
                  The pool1 root dataset's node_filesystem_avail_bytes has been under 1 TiB for an hour. That
                  metric is the POOL-WIDE free space, not the root dataset's own: every pool1 dataset reports the
                  same value because none of them is quota-bound for statfs purposes (verified against all 8
                  pool1 datasets, 2026-09-05). It is statfs avail, so it reads lower than `zpool list free` by
                  the ZFS slop reservation (~3% of the pool, ~0.7 TiB here). Never build a used% from
                  node_filesystem_size_bytes on pool1: the root dataset is quota-bounded, so its size label is
                  2.25 TiB against a 21.8 TiB pool - take used% from `zpool list` or
                  0-truenas/scripts/pool-capacity-forecast.py. pool1 has sat near 88% since August 2026; with no
                  disk budget until ~2027-02 the headroom plan is the media deletion service (owner decision in
                  #805, 2026-08-21), and the weekly growth measurement and runway forecast live in
                  0-truenas/scripts/pool-capacity-forecast.py (#805). This alert is the floor between the weekly
                  runs: check what grew (`zfs list -o space -r pool1` sorted by used) before deleting anything,
                  and remember dapc-backup is a permanent keep (#807).
      - eval_time: 70m
        alertname: TruenasPool1FreeCritical
        exp_alerts:
          - exp_labels:
              job: truenas-node-exporter
              instance: 192.168.10.200
              device: pool1
              fstype: zfs
              mountpoint: /mnt/pool1
              severity: critical
              component: truenas-storage
            exp_annotations:
              summary: "pool1 free space is under 400 GiB (~95% used) - the ZFS floor"
              description: >-
                  Pool-wide free space on pool1 (same metric semantics and size-label caveat as
                  TruenasPool1FreeLow) has been under 400 GiB for 30 minutes. 95% used is the practical ZFS
                  floor: CoW has no room to write, fragmentation climbs and writes start failing before the pool
                  reads as technically full. This is the "stops being enough" date the #805 forecast tracks,
                  arrived early. Reclaim space now (the #609 download reclaim and #968 snapshot paths are the
                  catalogued candidates; dapc-backup is a permanent keep per #807) and treat every write to pool1
                  as at-risk until free space is back above 1 TiB.

  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{device="pool1",device_error="",fstype="zfs",instance="192.168.10.200",job="truenas-node-exporter",mountpoint="/mnt/pool1"}'
        values: "2199023255552x90"  # 2 TiB, above both thresholds (live 2026-09-05: 1.72 TiB)
    alert_rule_test:
      - eval_time: 70m
        alertname: TruenasPool1FreeLow
        exp_alerts: []
      - eval_time: 70m
        alertname: TruenasPool1FreeCritical
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'kube_node_spec_unschedulable{node="k3s-master-52"}'
        values: "1x25"
      - series: 'kube_node_spec_unschedulable{node="k3s-worker-61"}'
        values: "0x25"
      - series: 'kube_node_status_condition{condition="Ready",node="k3s-master-52",status="true"}'
        values: "1x25"
      - series: 'kube_node_status_condition{condition="Ready",node="k3s-worker-61",status="true"}'
        values: "1x25"
    alert_rule_test:
      - eval_time: 20m
        alertname: K3sNodeCordoned
        exp_alerts:
          - exp_labels:
              node: k3s-master-52
              severity: warning
              component: system-upgrade
            exp_annotations:
              summary: "Node k3s-master-52 is Ready but cordoned for over 15 minutes"
              description: >-
                Node k3s-master-52 has spec.unschedulable=1 while Ready, for more than
                15 minutes. Nothing schedules onto it, and a check that only counts Ready
                shows it green: the STATUS column prints Ready,SchedulingDisabled, which an
                exact-match Ready count silently drops - that off-by-one is how the 2026-08-22
                strand of k3s-master-52 sat unnoticed for 6h (#1087). Two automations cordon
                nodes and are supposed to uncordon within minutes: system-upgrade-controller
                plan jobs, whose uncordon is applied only when the controller processes the job
                completion (a Failed job leaves the node cordoned), and the node-os-updater
                CronJob (Saturdays 02:00, 2-k3s/maintenance/node-os-updater-cronjob.yaml),
                whose safe_reboot cordons before drain and reboot, so any failed step in
                between strands the node until Phase 0 of the next run. If no roll is in
                progress, confirm with
                kubectl --context epaflix get node k3s-master-52 -o jsonpath='{.spec.unschedulable}',
                check the latest jobs in -n system-upgrade and -n kube-system, then
                kubectl --context epaflix uncordon k3s-master-52.

  - interval: 1m
    input_series:
      - series: 'kube_node_spec_unschedulable{node="k3s-master-52"}'
        values: "0x10 1x10"
      - series: 'kube_node_status_condition{condition="Ready",node="k3s-master-52",status="true"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: K3sNodeCordoned
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'kube_node_spec_unschedulable{node="k3s-master-52"}'
        values: "1x25"
      - series: 'kube_node_status_condition{condition="Ready",node="k3s-master-52",status="true"}'
        values: "0x25"
    alert_rule_test:
      - eval_time: 20m
        alertname: K3sNodeCordoned
        exp_alerts: []

  # VpnAgentFallbackServer #1031: the old expr was the lifetime counter
  # (vpn_agent_switches_total{reason="fallback"} > 0) and stayed red for 12 days
  # after a later ranked switch had long left `quick`. The windowed expr fires
  # on a fallback inside the last 24 h and goes silent once it ages out.
  - interval: 1m
    input_series:
      - series: 'vpn_agent_switches_total{namespace="servarr",pod="qbittorrent-abc",reason="fallback"}'
        values: "0+0x10 1+0x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: VpnAgentFallbackServer
        exp_alerts:
          - exp_labels:
              namespace: servarr
              pod: qbittorrent-abc
              reason: fallback
              severity: warning
              component: servarr
            exp_annotations:
              summary: "vpn-picker agent fell back to `quick`, the ranked pool failed"
              description: "qbittorrent-abc has recorded 1 fallback switch(es) in the last 24 h - every ranked candidate failed to come up, so the agent connected via `airconnect quick` and is on an unmeasured server. Each switch also drops every peer and re-announces to private trackers, and the agent is capped at VPN_AGENT_MAX_SWITCHES_PER_DAY (3), so once the cap is hit it will not try again today. Check the agent logs for `ended on quick` / `passed no traffic` (Grafana → Explore → Loki: {namespace=\"servarr\", container=\"agent\"}) (#555, #505). Scoped to a 24 h window in #1031: the old expr was the lifetime counter and stayed red for 12 days after a later ranked switch had long left `quick`; a pod restart also clears it, which matches the pod-lifetime counter underneath."

  - interval: 1m
    input_series:
      # One fallback 26 h ago, nothing since: the lifetime latch would still be
      # firing here. The 24 h window must not.
      - series: 'vpn_agent_switches_total{namespace="servarr",pod="qbittorrent-abc",reason="fallback"}'
        values: "1x1560"
    alert_rule_test:
      - eval_time: 1560m
        alertname: VpnAgentFallbackServer
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'argocd_app_info{name="argocd",namespace="argocd",project="default",repo="https://github.com/SpyrosPsarras/epaflix.git",sync_status="OutOfSync",health_status="Healthy",autosync_enabled="false"}'
        values: "1x40"
      - series: 'argocd_app_info{name="servarr",namespace="argocd",project="default",repo="https://github.com/SpyrosPsarras/epaflix.git",sync_status="Synced",health_status="Healthy",autosync_enabled="true"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: ArgoCDAppOutOfSync
        exp_alerts:
          - exp_labels:
              name: argocd
              namespace: argocd
              project: default
              repo: https://github.com/SpyrosPsarras/epaflix.git
              sync_status: OutOfSync
              health_status: Healthy
              autosync_enabled: "false"
              severity: warning
              component: gitops
            exp_annotations:
              summary: "ArgoCD application argocd has been OutOfSync for 30m"
              description: "Application argocd has disagreed with git for 30m. For manual-sync Applications (argocd, system-upgrade-controller) every merged change to their git path is INERT until a human triggers the sync: kubectl --context epaflix -n argocd patch application argocd --type merge -p '{\"operation\":{\"initiatedBy\":{\"username\":\"<you>-manual\"},\"sync\":{\"revision\":\"main\",\"syncStrategy\":{\"apply\":{}}}}}'. This is how the argocd Application sat OutOfSync since 2026-06-24 while nine chart bumps and the #715/#1039 values never went live (#1050). For automated apps, selfHeal is not converging - read the app status conditions (ComparisonError) before acting."

  - interval: 1m
    input_series:
      - series: 'argocd_app_info{name="argocd",namespace="argocd",project="default",repo="https://github.com/SpyrosPsarras/epaflix.git",sync_status="OutOfSync",health_status="Healthy",autosync_enabled="false"}'
        values: "1 0 1x45"  # OutOfSync at t=0, one Synced sample at t=1, OutOfSync from t=2 - the blip resets the 30m timer
    alert_rule_test:
      - eval_time: 30m
        alertname: ArgoCDAppOutOfSync
        exp_alerts: []
      - eval_time: 40m
        alertname: ArgoCDAppOutOfSync
        exp_alerts:
          - exp_labels:
              name: argocd
              namespace: argocd
              project: default
              repo: https://github.com/SpyrosPsarras/epaflix.git
              sync_status: OutOfSync
              health_status: Healthy
              autosync_enabled: "false"
              severity: warning
              component: gitops
            exp_annotations:
              summary: "ArgoCD application argocd has been OutOfSync for 30m"
              description: "Application argocd has disagreed with git for 30m. For manual-sync Applications (argocd, system-upgrade-controller) every merged change to their git path is INERT until a human triggers the sync: kubectl --context epaflix -n argocd patch application argocd --type merge -p '{\"operation\":{\"initiatedBy\":{\"username\":\"<you>-manual\"},\"sync\":{\"revision\":\"main\",\"syncStrategy\":{\"apply\":{}}}}}'. This is how the argocd Application sat OutOfSync since 2026-06-24 while nine chart bumps and the #715/#1039 values never went live (#1050). For automated apps, selfHeal is not converging - read the app status conditions (ComparisonError) before acting."
