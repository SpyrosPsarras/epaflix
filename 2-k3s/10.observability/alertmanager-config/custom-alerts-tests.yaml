        alertname: ArgoCDAppOutOfSync
        exp_alerts:
          - exp_labels:
              name: argocd
              namespace: argocd
              project: default
              repo: https://github.com/SpyrosPsarras/epaflix.git
              sync_status: OutOfSync
              health_status: Healthy
              autosync_enabled: "true"
              severity: warning
              component: gitops
            exp_annotations:
              summary: "ArgoCD application argocd has been OutOfSync for 30m"
              description: >-
                Application argocd has disagreed with git for 30m.
                Automated Applications, including argocd, should self-heal.
                Read the app status conditions (ComparisonError) and last sync
                operation's message before acting. Manual-sync Applications
                (no syncPolicy.automated) stay OutOfSync until someone syncs them:
                kubectl --context epaflix -n argocd patch application argocd --type merge -p
                '{"operation":{"initiatedBy":{"username":"<you>-manual"},"sync":{"revision":"main","syncStrategy":{"apply":{}}}}}'.

  - interval: 1m
    input_series:
      - series: 'argocd_app_info{name="argocd",namespace="argocd",project="default",repo="https://github.com/SpyrosPsarras/epaflix.git",sync_status="OutOfSync",health_status="Healthy",autosync_enabled="true"}'
        values: "1 0 1x45"  # OutOfSync at t=0, one Synced sample at t=1, OutOfSync from t=2 - the blip resets the 30m timer
    alert_rule_test:
      - eval_time: 30m
        alertname: ArgoCDAppOutOfSync
        exp_alerts: []
      - eval_time: 40m
        alertname: ArgoCDAppOutOfSync
        exp_alerts:
          - exp_labels:
              name: argocd
              namespace: argocd
              project: default
              repo: https://github.com/SpyrosPsarras/epaflix.git
              sync_status: OutOfSync
              health_status: Healthy
              autosync_enabled: "true"
              severity: warning
              component: gitops
            exp_annotations:
              summary: "ArgoCD application argocd has been OutOfSync for 30m"
              description: >-
                Application argocd has disagreed with git for 30m.
                Automated Applications, including argocd, should self-heal.
                Read the app status conditions (ComparisonError) and last sync
                operation's message before acting. Manual-sync Applications
                (no syncPolicy.automated) stay OutOfSync until someone syncs them:
                kubectl --context epaflix -n argocd patch application argocd --type merge -p
                '{"operation":{"initiatedBy":{"username":"<you>-manual"},"sync":{"revision":"main","syncStrategy":{"apply":{}}}}}'.

  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{integration="webhook",pod="alertmanager-0"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 30m
        alertname: AlertmanagerWebhookDeliveryFailing
        exp_alerts:
          - exp_labels:
              integration: webhook
              pod: alertmanager-0
              severity: critical
              component: observability
            exp_annotations:
              description: 'alertmanager_notifications_failed_total rose on alertmanager-0 in the last 30m: Alertmanager attempted a webhook delivery and it FAILED. This fires only on attempted-and-failed delivery, so it never confuses "no alerts fired" with "no delivery" (#1108). The k8s-alertmanager leg to cover is the `ntfy` receiver (posts in-cluster to http://ntfy.observability.svc.cluster.local:8091), but Alertmanager does not label notification metrics per receiver, so the `deadman` webhook (Watchdog -> hc-ping) counts here too — check the Alertmanager logs to tell them apart. If ntfy delivery is what broke, you are likely NOT seeing this on the phone: read it in the Alertmanager UI or Grafana, and expect NtfyCanaryPublishFailing to be failing for the same window. Start with `kubectl logs -n observability -l app.kubernetes.io/name=alertmanager --tail=100` and `kubectl get pods -n observability -l app=ntfy`. Self-clears 30m after the last failed attempt.'
              summary: Alertmanager failed to deliver to a webhook receiver (alertmanager-0)

  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{integration="webhook",pod="alertmanager-0"}'
        values: "0x30"
      - series: 'alertmanager_notifications_total{integration="webhook",pod="alertmanager-0"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 30m
        alertname: AlertmanagerWebhookDeliveryFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'alertmanager_notifications_total{integration="webhook",pod="alertmanager-0"}'
        values: "0+1x30"
    alert_rule_test:
      # Delivery attempts all succeeded and the failed counter was never
      # touched - the failed series is absent entirely. "No alerts" must
      # not look like "no delivery" (#1108).
      - eval_time: 30m
        alertname: AlertmanagerWebhookDeliveryFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'kube_job_status_start_time{namespace="observability",job_name="ntfy-canary-check-1900"}'
        values: "1750000000x30"
      - series: 'kube_job_failed{namespace="observability",job_name="ntfy-canary-check-1900"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: NtfyCanaryPublishFailing
        exp_alerts:
          - exp_labels:
              job_name: ntfy-canary-check-1900
              severity: critical
              component: observability
            exp_annotations:
              description: 'The hourly ntfy-canary-check Job (ntfy-canary-check-1900) failed — the canary POST through the ntfy publish path (https://ntfy.epaflix.com/pve-backups-canary, same server and Title/Tags/Priority headers as PVE target ntfy-pve in 1-proxmox/pbs/notifications.cfg) did not return 200 with a message id, or could not connect at all. A real PVE notification would fail the same way right now: this is the #1076 signature (twelve days of failed backups surfaced only as `could not notify via target` in a vzdump task log). ntfy code 40014 in the Job log means NTFY_MESSAGE_SIZE_LIMIT=32k regressed to the 4096 default on the ntfy Deployment (#1105) — `kubectl set env deployment/ntfy -n observability NTFY_MESSAGE_SIZE_LIMIT=32k` then `kubectl rollout restart deployment/ntfy -n observability`. Any other status or an exit 2: check `kubectl get pods -n observability -l app=ntfy` and the Traefik ingressroute for ntfy.epaflix.com. Exit 1 and exit 2 are both findings (#1108) — a canary that cannot verify must never count as a clean run (#725). One failed run right after a deploy may be transient; the alert needs the latest run to stay failed for 5m, and it clears by itself once the next hourly run succeeds.'
              summary: ntfy canary publish failed — the real PVE notification target is broken (or the check could not run)

  - interval: 1m
    input_series:
      - series: 'kube_job_status_start_time{namespace="observability",job_name="ntfy-canary-check-1900"}'
        values: "1750000000x30"
      - series: 'kube_job_failed{namespace="observability",job_name="ntfy-canary-check-1900"}'
        values: "1x30"
      - series: 'kube_job_status_start_time{namespace="observability",job_name="ntfy-canary-check-1912"}'
        values: "1750000720x30"
      - series: 'kube_job_failed{namespace="observability",job_name="ntfy-canary-check-1912"}'
        values: "0x30"
    alert_rule_test:
      # The 1912 run succeeded, so the lingering 1900 failure is history,
      # not the current state - the alert only covers the LATEST run.
      - eval_time: 20m
        alertname: NtfyCanaryPublishFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'kube_job_status_start_time{namespace="kube-system",job_name="aaaa-tripwire-29581040"}'
        values: "1750000000x30"
      - series: 'kube_job_failed{namespace="kube-system",job_name="aaaa-tripwire-29581040"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: AaaaTripwireCheckFailed
        exp_alerts:
          - exp_labels:
              job_name: aaaa-tripwire-29581040
              severity: warning
              component: dns
            exp_annotations:
              summary: "AAAA leak guard check failed (or could not run)"
              description: >-
                The nightly aaaa-tripwire Job (aaaa-tripwire-29581040) failed — either an
                internal *.epaflix.com name lost its AAAA guard, the Pi-hole could not be
                checked at all, or IPv6 is live on a host that must stay IPv4-only. Read the
                FAIL lines in the Job log:
                aaaa/<name> means the name's dnsmasq `address=` target is a LAN IP, no guard
                covers it any more (the Unbound local-zone in
                /etc/unbound/unbound.conf.d/no-aaaa-leak.conf on the Pi-hole LXC 1030 was
                removed, or its exact DNS-only Cloudflare record was deleted), and the
                proxied wildcard's synthesized AAAA now answers LAN AAAA queries for it.
                guard/<name> is the same no-guard case, caught before the AAAA probes run.
                records/read means the SSH reach failed and NOTHING was verified — an
                unverifiable tripwire is not a clean one (#725 shape). ipv6/* means a host
                grew a global v6 address or route, the #882 trigger: while that is true,
                every unguarded name is leaking live, not latent. The guard policy and the
                fix recipe live in 1-proxmox/pihole/aaaa-tripwire.sh and
                1-proxmox/pihole/unbound-no-aaaa-leak.conf; the wildcard decision is #966,
                the cliproxy fix that started the nightly runs is #1079. Fix on the Pi-hole,
                then `kubectl delete job -n kube-system <job>` to let the next run confirm
                green (or run the script from the workstation for the two SKIPped
                hypervisor IPv6 checks). Clears by itself once the next nightly run passes.

  - interval: 1m
    input_series:
      - series: 'kube_job_status_start_time{namespace="kube-system",job_name="aaaa-tripwire-29581040"}'
        values: "1750000000x30"
      - series: 'kube_job_failed{namespace="kube-system",job_name="aaaa-tripwire-29581040"}'
        values: "1x30"
      - series: 'kube_job_status_start_time{namespace="kube-system",job_name="aaaa-tripwire-29582040"}'
        values: "1750000720x30"
      - series: 'kube_job_failed{namespace="kube-system",job_name="aaaa-tripwire-29582040"}'
        values: "0x30"
    alert_rule_test:
      # The 2040 run passed, so the earlier failure is history - the alert
      # only covers the LATEST run, same semantics as the ntfy canary.
      - eval_time: 20m
        alertname: AaaaTripwireCheckFailed
        exp_alerts: []

  # KubeJobFailedLastRun, ntfy spam fix: an hourly reporter keeps failing.
  # Each new run makes the previous failure "not latest" while it is still
  # running; keyed on job_name, the alert resolved then and re-fired 15m after
  # the new run failed. Keyed on the CronJob with keep_firing_for 90m, it fires
  # once and stays firing through every later failed run.
  - interval: 1m
    input_series:
      - series: 'kube_job_status_start_time{namespace="servarr",job_name="example-reporter-29862365"}'
        values: "1750000000x190"
      - series: 'kube_job_owner{namespace="servarr",job_name="example-reporter-29862365",owner_kind="CronJob",owner_name="example-reporter",owner_is_controller="true"}'
        values: "1x190"
      - series: 'kube_job_failed{namespace="servarr",job_name="example-reporter-29862365",condition="true"}'
        values: "1x190"
      - series: 'kube_job_failed{namespace="servarr",job_name="example-reporter-29862365",condition="false"}'
        values: "0x190"
      # Next run starts at 60m and fails 6m later.
      - series: 'kube_job_status_start_time{namespace="servarr",job_name="example-reporter-29862425"}'
        values: "_x60 1750003600x130"
      - series: 'kube_job_owner{namespace="servarr",job_name="example-reporter-29862425",owner_kind="CronJob",owner_name="example-reporter",owner_is_controller="true"}'
        values: "_x60 1x130"
      - series: 'kube_job_failed{namespace="servarr",job_name="example-reporter-29862425",condition="true"}'
        values: "_x66 1x124"
      # And the one after that at 120m, failing 6m later again.
      - series: 'kube_job_status_start_time{namespace="servarr",job_name="example-reporter-29862485"}'
        values: "_x120 1750007200x70"
      - series: 'kube_job_owner{namespace="servarr",job_name="example-reporter-29862485",owner_kind="CronJob",owner_name="example-reporter",owner_is_controller="true"}'
        values: "_x120 1x70"
      - series: 'kube_job_failed{namespace="servarr",job_name="example-reporter-29862485",condition="true"}'
        values: "_x126 1x64"
    alert_rule_test:
      - eval_time: 10m
        alertname: KubeJobFailedLastRun
        exp_alerts: []
      - eval_time: 16m
        alertname: KubeJobFailedLastRun
        exp_alerts: &kjflr_reporter
          - exp_labels:
              namespace: servarr
              owner_name: example-reporter
              severity: warning
              component: kubernetes
            exp_annotations:
              summary: "The latest run of CronJob servarr/example-reporter failed"
              description: "The latest Job of CronJob servarr/example-reporter failed and no later run has succeeded, so this is the CURRENT state rather than a retained old failure (newest Job: kubectl -n servarr get jobs --sort-by=.status.startTime | grep example-reporter). The alert is keyed on the CronJob and stays firing while the next run is in flight, so a CronJob that keeps failing is one long alert, not one per run. For the servarr reporter CronJobs a non-zero exit is a FINDING, not a crash - read the Job log for the report before touching anything. This alert clears by itself 90m after a later run starts, unless that run fails too; deleting the failed Job object is not required and is not a fix."
      # Run 2 in flight: the old rule resolved here (the :06 ping).
      - eval_time: 63m
        alertname: KubeJobFailedLastRun
        exp_alerts: *kjflr_reporter
      # Run 2 failed under 15m ago: the old rule was pending here and re-fired
      # at 81m (the :21 ping).
      - eval_time: 75m
        alertname: KubeJobFailedLastRun
        exp_alerts: *kjflr_reporter
      - eval_time: 123m
        alertname: KubeJobFailedLastRun
        exp_alerts: *kjflr_reporter
      - eval_time: 185m
        alertname: KubeJobFailedLastRun
        exp_alerts: *kjflr_reporter
    promql_expr_test:
      # Firing at every evaluation from 15m to 185m, with one label set.
      - expr: count_over_time(ALERTS{alertname="KubeJobFailedLastRun",alertstate="firing"}[170m])
        eval_time: 185m
        exp_samples:
          - labels: '{alertname="KubeJobFailedLastRun",alertstate="firing",namespace="servarr",owner_name="example-reporter",severity="warning",component="kubernetes"}'
            value: 170

  # A failed run followed by a successful one: the alert resolves 90m
  # (keep_firing_for) after the good run starts at 60m.
  - interval: 1m
    input_series:
      - series: 'kube_job_status_start_time{namespace="servarr",job_name="example-reporter-29862365"}'
        values: "1750000000x160"
      - series: 'kube_job_owner{namespace="servarr",job_name="example-reporter-29862365",owner_kind="CronJob",owner_name="example-reporter",owner_is_controller="true"}'
        values: "1x160"
      - series: 'kube_job_failed{namespace="servarr",job_name="example-reporter-29862365",condition="true"}'
        values: "1x160"
      - series: 'kube_job_status_start_time{namespace="servarr",job_name="example-reporter-29862425"}'
        values: "_x60 1750003600x100"
      - series: 'kube_job_owner{namespace="servarr",job_name="example-reporter-29862425",owner_kind="CronJob",owner_name="example-reporter",owner_is_controller="true"}'
        values: "_x60 1x100"
      - series: 'kube_job_succeeded{namespace="servarr",job_name="example-reporter-29862425"}'
        values: "_x61 1x99"
    alert_rule_test:
      - eval_time: 16m
        alertname: KubeJobFailedLastRun
        exp_alerts: *kjflr_reporter
      - eval_time: 145m
        alertname: KubeJobFailedLastRun
        exp_alerts: *kjflr_reporter
      - eval_time: 151m
        alertname: KubeJobFailedLastRun
        exp_alerts: []

  # A run allowed by the Star download CronJobs' 6h deadlines can outlast
  # the 90m hold. Reuse the reporter labels to isolate this duration limit:
  # start at 60m, resolve at 151m, fail at 200m, fire again after the 15m wait.
  - interval: 1m
    input_series:
      - series: 'kube_job_status_start_time{namespace="servarr",job_name="example-reporter-29862365"}'
        values: "1750000000x220"
      - series: 'kube_job_owner{namespace="servarr",job_name="example-reporter-29862365",owner_kind="CronJob",owner_name="example-reporter",owner_is_controller="true"}'
        values: "1x220"
      - series: 'kube_job_failed{namespace="servarr",job_name="example-reporter-29862365",condition="true"}'
        values: "1x220"
      - series: 'kube_job_status_start_time{namespace="servarr",job_name="example-reporter-29862425"}'
        values: "_x60 1750003600x160"
      - series: 'kube_job_owner{namespace="servarr",job_name="example-reporter-29862425",owner_kind="CronJob",owner_name="example-reporter",owner_is_controller="true"}'
        values: "_x60 1x160"
      - series: 'kube_job_failed{namespace="servarr",job_name="example-reporter-29862425",condition="true"}'
        values: "_x200 1x20"
    alert_rule_test:
      - eval_time: 16m
        alertname: KubeJobFailedLastRun
        exp_alerts: *kjflr_reporter
      - eval_time: 145m
        alertname: KubeJobFailedLastRun
        exp_alerts: *kjflr_reporter
      - eval_time: 151m
        alertname: KubeJobFailedLastRun
        exp_alerts: []
      - eval_time: 205m
        alertname: KubeJobFailedLastRun
        exp_alerts: []
      - eval_time: 216m
        alertname: KubeJobFailedLastRun
        exp_alerts: *kjflr_reporter

  # The CronJobs with a dedicated alert stay excluded after the regrouping,
  # and a failed Job with no CronJob owner still alerts under its own name.
  - interval: 1m
    input_series:
      - series: 'kube_job_status_start_time{namespace="servarr",job_name="blind-queue-check-29862400"}'
        values: "1750000000x30"
      - series: 'kube_job_owner{namespace="servarr",job_name="blind-queue-check-29862400",owner_kind="CronJob",owner_name="blind-queue-check",owner_is_controller="true"}'
        values: "1x30"
      - series: 'kube_job_failed{namespace="servarr",job_name="blind-queue-check-29862400",condition="true"}'
        values: "1x30"
      - series: 'kube_job_status_start_time{namespace="t3code",job_name="t3code-image-prepull"}'
        values: "1750000000x30"
      - series: 'kube_job_owner{namespace="t3code",job_name="t3code-image-prepull",owner_kind="<none>",owner_name="<none>",owner_is_controller="<none>"}'
        values: "1x30"
      - series: 'kube_job_failed{namespace="t3code",job_name="t3code-image-prepull",condition="true"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: KubeJobFailedLastRun
        exp_alerts:
          - exp_labels:
              namespace: t3code
              job_name: t3code-image-prepull
              severity: warning
              component: kubernetes
            exp_annotations:
              summary: "Job t3code/t3code-image-prepull failed"
              description: "Job t3code/t3code-image-prepull (no CronJob owner) failed. For the servarr reporter CronJobs a non-zero exit is a FINDING, not a crash - read the Job log for the report before touching anything. This alert clears by itself 90m after a later run starts, unless that run fails too; deleting the failed Job object is not required and is not a fix."

  - name: Vaultwarden backup exceeds 30 hours with duplicate KSM series
    interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="vaultwarden",cronjob="vaultwarden-backup",instance="ksm-1",pod="ksm-1"}'
        values: "-107940x10"
      - series: 'kube_cronjob_status_last_successful_time{namespace="vaultwarden",cronjob="vaultwarden-backup",instance="ksm-2",pod="ksm-2"}'
        values: "-107940x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: VaultwardenBackupOverdue
        exp_alerts: []
      - eval_time: 6m
        alertname: VaultwardenBackupOverdue
        exp_alerts: []
      - eval_time: 7m
        alertname: VaultwardenBackupOverdue
        exp_alerts: &vaultwarden_backup_overdue
          - exp_labels:
              namespace: vaultwarden
              cronjob: vaultwarden-backup
              severity: critical
              component: vaultwarden
            exp_annotations:
              summary: "Vaultwarden backup is overdue"
              description: "No successful Vaultwarden backup in over 30 hours, or the CronJob has never succeeded. Check vaultwarden-backup Job logs and the vaultwarden.epaflix.com/backup-paused Deployment annotation. Restore runbook: 2-k3s/26.vaultwarden/OPERATIONS.md."

  - name: Vaultwarden CronJob exists but has never succeeded
    interval: 1m
    input_series:
      - series: 'kube_cronjob_info{namespace="vaultwarden",cronjob="vaultwarden-backup",instance="ksm-1",pod="ksm-1",schedule="30 2 * * *"}'
        values: "1x10"
      - series: 'kube_cronjob_info{namespace="vaultwarden",cronjob="vaultwarden-backup",instance="ksm-2",pod="ksm-2",schedule="30 2 * * *"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 4m
        alertname: VaultwardenBackupOverdue
        exp_alerts: []
      - eval_time: 5m
        alertname: VaultwardenBackupOverdue
        exp_alerts: *vaultwarden_backup_overdue

  - name: Vaultwarden zero success timestamp also means never succeeded
    interval: 1m
    input_series:
      - series: 'kube_cronjob_info{namespace="vaultwarden",cronjob="vaultwarden-backup"}'
        values: "1x10"
      - series: 'kube_cronjob_status_last_successful_time{namespace="vaultwarden",cronjob="vaultwarden-backup"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: VaultwardenBackupOverdue
        exp_alerts: *vaultwarden_backup_overdue

  - name: Vaultwarden recent backup is not overdue
    interval: 1m
    input_series:
      - series: 'kube_cronjob_info{namespace="vaultwarden",cronjob="vaultwarden-backup"}'
        values: "1x20"
      - series: 'kube_cronjob_status_last_successful_time{namespace="vaultwarden",cronjob="vaultwarden-backup"}'
        values: "60x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: VaultwardenBackupOverdue
        exp_alerts: []

  - name: Missing Vaultwarden CronJob does not imply it has never succeeded
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 10m
        alertname: VaultwardenBackupOverdue
        exp_alerts: []
      - eval_time: 10m
        alertname: VaultwardenBackupFailed
        exp_alerts: []

  - name: Only the latest failed Vaultwarden Job alerts once across KSM replicas
    interval: 1m
    input_series:
      - series: 'kube_job_status_start_time{namespace="vaultwarden",job_name="vaultwarden-backup-100",instance="ksm-1",pod="ksm-1"}'
        values: "100x20"
      - series: 'kube_job_status_start_time{namespace="vaultwarden",job_name="vaultwarden-backup-100",instance="ksm-2",pod="ksm-2"}'
        values: "100x20"
      - series: 'kube_job_failed{condition="true",namespace="vaultwarden",job_name="vaultwarden-backup-100",instance="ksm-1",pod="ksm-1"}'
        values: "1x20"
      - series: 'kube_job_failed{condition="true",namespace="vaultwarden",job_name="vaultwarden-backup-100",instance="ksm-2",pod="ksm-2"}'
        values: "1x20"
      - series: 'kube_job_status_start_time{namespace="vaultwarden",job_name="vaultwarden-backup-200",instance="ksm-1",pod="ksm-1"}'
        values: "200x20"
      - series: 'kube_job_status_start_time{namespace="vaultwarden",job_name="vaultwarden-backup-200",instance="ksm-2",pod="ksm-2"}'
        values: "200x20"
      - series: 'kube_job_failed{condition="true",namespace="vaultwarden",job_name="vaultwarden-backup-200",instance="ksm-1",pod="ksm-1"}'
        values: "1x20"
      - series: 'kube_job_failed{condition="true",namespace="vaultwarden",job_name="vaultwarden-backup-200",instance="ksm-2",pod="ksm-2"}'
        values: "1x20"
      - series: 'kube_job_owner{namespace="vaultwarden",job_name="vaultwarden-backup-100",owner_kind="CronJob",owner_name="vaultwarden-backup",instance="ksm-1",pod="ksm-1"}'
        values: "1x20"
      - series: 'kube_job_owner{namespace="vaultwarden",job_name="vaultwarden-backup-100",owner_kind="CronJob",owner_name="vaultwarden-backup",instance="ksm-2",pod="ksm-2"}'
        values: "1x20"
      - series: 'kube_job_owner{namespace="vaultwarden",job_name="vaultwarden-backup-200",owner_kind="CronJob",owner_name="vaultwarden-backup",instance="ksm-1",pod="ksm-1"}'
        values: "1x20"
      - series: 'kube_job_owner{namespace="vaultwarden",job_name="vaultwarden-backup-200",owner_kind="CronJob",owner_name="vaultwarden-backup",instance="ksm-2",pod="ksm-2"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: VaultwardenBackupFailed
        exp_alerts: []
      - eval_time: 5m
        alertname: VaultwardenBackupFailed
        exp_alerts: &vaultwarden_backup_failed
          - exp_labels:
              namespace: vaultwarden
              job_name: vaultwarden-backup-200
              severity: critical
              component: vaultwarden
            exp_annotations:
              summary: "Latest Vaultwarden backup failed"
              description: "Vaultwarden backup Job vaultwarden-backup-200 failed. Check its Job logs and the vaultwarden.epaflix.com/backup-paused Deployment annotation if Vaultwarden stayed at zero replicas. Restore runbook: 2-k3s/26.vaultwarden/OPERATIONS.md."

      - eval_time: 20m
        alertname: VaultwardenBackupFailed
        exp_alerts: *vaultwarden_backup_failed
      - eval_time: 20m
        alertname: KubeJobFailedLastRun
        exp_alerts: []

  - name: Old failed Vaultwarden Job does not alert after a newer run starts
    interval: 1m
    input_series:
      - series: 'kube_job_status_start_time{namespace="vaultwarden",job_name="vaultwarden-backup-100"}'
        values: "100x15"
      - series: 'kube_job_failed{condition="true",namespace="vaultwarden",job_name="vaultwarden-backup-100"}'
        values: "1x15"
      - series: 'kube_job_status_start_time{namespace="vaultwarden",job_name="vaultwarden-backup-200"}'
        values: "_x5 360x9"
      - series: 'kube_job_failed{condition="true",namespace="vaultwarden",job_name="vaultwarden-backup-200"}'
        values: "_x5 0x9"
    alert_rule_test:
      - eval_time: 12m
        alertname: VaultwardenBackupFailed
        exp_alerts: []

  - name: Vaultwarden failed HTTP probe fires after 15 minutes despite healthy replicas
    interval: 1m
    input_series:
      - series: 'probe_success{job="vaultwarden-probe",instance="https://vaultwarden.epaflix.com/alive"}'
        values: "0x20"
      - series: 'kube_deployment_status_replicas_available{namespace="vaultwarden",deployment="vaultwarden"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 14m
        alertname: VaultwardenDown
        exp_alerts: []
      - eval_time: 15m
        alertname: VaultwardenDown
        exp_alerts: &vaultwarden_down
          - exp_labels:
              severity: critical
              component: vaultwarden
            exp_annotations:
              summary: "Vaultwarden is unavailable"
              description: "Vaultwarden /alive is unreachable or no replica has been available for 15 minutes. Check the Deployment and backup Job logs, including the vaultwarden.epaflix.com/backup-paused Deployment annotation if a backup left it at zero replicas. Restore runbook: 2-k3s/26.vaultwarden/OPERATIONS.md."

  - name: Vaultwarden zero replicas fires once despite duplicated KSM and a healthy probe
    interval: 1m
    input_series:
      - series: 'probe_success{job="vaultwarden-probe",instance="https://vaultwarden.epaflix.com/alive"}'
        values: "1x20"
      - series: 'kube_deployment_status_replicas_available{namespace="vaultwarden",deployment="vaultwarden",instance="ksm-1",pod="ksm-1"}'
        values: "0x20"
      - series: 'kube_deployment_status_replicas_available{namespace="vaultwarden",deployment="vaultwarden",instance="ksm-2",pod="ksm-2"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 14m
        alertname: VaultwardenDown
        exp_alerts: []
      - eval_time: 15m
        alertname: VaultwardenDown
        exp_alerts: *vaultwarden_down

  - name: Vaultwarden simultaneous probe and replica failures yield one alert
    interval: 1m
    input_series:
      - series: 'probe_success{job="vaultwarden-probe",instance="https://vaultwarden.epaflix.com/alive"}'
        values: "0x20"
      - series: 'kube_deployment_status_replicas_available{namespace="vaultwarden",deployment="vaultwarden"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: VaultwardenDown
        exp_alerts: *vaultwarden_down

  - name: Vaultwarden brief backup scale-down does not alert
    interval: 1m
    input_series:
      - series: 'probe_success{job="vaultwarden-probe",instance="https://vaultwarden.epaflix.com/alive"}'
        values: "1x5 0 1x20"
      - series: 'kube_deployment_status_replicas_available{namespace="vaultwarden",deployment="vaultwarden"}'
        values: "1x5 0 1x20"
    alert_rule_test:
      - eval_time: 6m
        alertname: VaultwardenDown
        exp_alerts: []
      - eval_time: 25m
        alertname: VaultwardenDown
        exp_alerts: []

  - name: Vaultwarden healthy service and unrelated TLS failure do not alert
    interval: 1m
    input_series:
      - series: 'probe_success{job="vaultwarden-probe",instance="https://vaultwarden.epaflix.com/alive"}'
        values: "1x20"
      - series: 'probe_success{job="tls-probe",instance="https://truenas.epaflix.com"}'
        values: "0x20"
      - series: 'kube_deployment_status_replicas_available{namespace="vaultwarden",deployment="vaultwarden"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: VaultwardenDown
        exp_alerts: []
