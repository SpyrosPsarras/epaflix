      # Series stale from 16m; the 6h hold keeps the alert.
      - eval_time: 30m
        alertname: CredentialRedactedFromLogs
        exp_alerts: *credential_first_hit
      - eval_time: 375m
        alertname: CredentialRedactedFromLogs
        exp_alerts: *credential_first_hit
      # Last live sample 15m: resolved at 376m.
      - eval_time: 376m
        alertname: CredentialRedactedFromLogs
        exp_alerts: []

  # Several flat samples precede the first rule evaluation.
  - interval: 15s
    input_series:
      - series: 'loki_process_custom_credential_lines_redacted_total{namespace="cloudflare-tunnel",container="cloudflared",pod="cloudflared-8fcb9c9b5-bbbbb",job="cloudflare-tunnel/cloudflared-8fcb9c9b5-bbbbb",component_id="loki.process.pods",component_path="/",filename="/var/log/pods/x/0.log",stream="stdout",instance="10.42.0.10:12345"}'
        values: "_x42 1x20 stale"
    alert_rule_test:
      - eval_time: 11m
        alertname: CredentialRedactedFromLogs
        exp_alerts:
          - exp_labels:
              namespace: cloudflare-tunnel
              container: cloudflared
              severity: warning
              component: security
            exp_annotations:
              summary: "Credential-shaped log content detected in cloudflare-tunnel"
              description: "cloudflare-tunnel/cloudflared logged a line with a credential-shaped key=value. alloy counts those lines per log stream in loki_process_custom_credential_lines_redacted_total and drops a series once 5m pass without a matching line (max_idle_duration), so a live series means a hit within about the last 5m. This fires while any is live. The latest reading was 1: lines counted since alloy created the live series, not a count over a fixed window. The alert stays firing until 6h pass with no live series. alloy redacts pattern-matched segments before Loki ingestion. Raw pod stdout can retain the original value, visible via `kubectl logs`. Unknown credential formats can still leak into Loki. The alloy chart's ServiceMonitor sets honorLabels, so namespace/pod/container name the offending app, not alloy (#911 was the exported_* shape under promtail, #1381). Known sources: sonarr/radarr/prowlarr restarting and logging their Postgres connection string (#634), traefik access lines carrying jellyfin's query-string ApiKey (#702), cloudflared logging Jellyfin request URLs with an ApiKey query parameter, and sonarr logging Prowlarr Torznab feed URLs with an apikey parameter. If it is a new offender treat that credential as exposed and rotate it. Do NOT grep Loki for the literal value."

  # First sample above 1 (several lines before the first scrape) counts in full.
