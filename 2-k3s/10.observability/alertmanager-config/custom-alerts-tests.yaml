# promtool cannot read the PrometheusRule CR. Generate the bare rules file, then run:
#   python3 -c "import yaml;yaml.safe_dump(yaml.safe_load(open('custom-alerts.yaml'))['spec'],open('custom-alerts-rules.yaml','w'))"
#   promtool test rules custom-alerts-tests.yaml
rule_files:
  - custom-alerts-rules.yaml

evaluation_interval: 1m

tests:
  # OnDelete updates wait for idle users in all three t3code environments.
  - interval: 1m
    input_series:
      - series: 'kube_statefulset_status_current_revision{namespace="t3code",statefulset="t3code",job="kube-state-metrics",cluster="epaflix",revision="old"}'
        values: "1+0x30"
      - series: 'kube_statefulset_status_update_revision{namespace="t3code",statefulset="t3code",job="kube-state-metrics",cluster="epaflix",revision="new"}'
        values: "1+0x30"
      - series: 'kube_statefulset_replicas{namespace="t3code",statefulset="t3code",job="kube-state-metrics",cluster="epaflix"}'
        values: "1+0x30"
      - series: 'kube_statefulset_status_replicas_updated{namespace="t3code",statefulset="t3code",job="kube-state-metrics",cluster="epaflix"}'
        values: "0+0x30"
      - series: 'kube_statefulset_status_current_revision{namespace="t3code-homelab",statefulset="t3code",job="kube-state-metrics",cluster="epaflix",revision="old"}'
        values: "1+0x30"
      - series: 'kube_statefulset_status_update_revision{namespace="t3code-homelab",statefulset="t3code",job="kube-state-metrics",cluster="epaflix",revision="new"}'
        values: "1+0x30"
      - series: 'kube_statefulset_replicas{namespace="t3code-homelab",statefulset="t3code",job="kube-state-metrics",cluster="epaflix"}'
        values: "1+0x30"
      - series: 'kube_statefulset_status_replicas_updated{namespace="t3code-homelab",statefulset="t3code",job="kube-state-metrics",cluster="epaflix"}'
        values: "0+0x30"
      - series: 'kube_statefulset_status_current_revision{namespace="t3code-work",statefulset="t3code",job="kube-state-metrics",cluster="epaflix",revision="old"}'
        values: "1+0x30"
      - series: 'kube_statefulset_status_update_revision{namespace="t3code-work",statefulset="t3code",job="kube-state-metrics",cluster="epaflix",revision="new"}'
        values: "1+0x30"
      - series: 'kube_statefulset_replicas{namespace="t3code-work",statefulset="t3code",job="kube-state-metrics",cluster="epaflix"}'
        values: "1+0x30"
      - series: 'kube_statefulset_status_replicas_updated{namespace="t3code-work",statefulset="t3code",job="kube-state-metrics",cluster="epaflix"}'
        values: "0+0x30"
    alert_rule_test:
      - eval_time: 30m
        alertname: KubeStatefulSetUpdateNotRolledOut
        exp_alerts: []

  # Other StatefulSets in t3code namespaces and t3code elsewhere still alert.
  - interval: 1m
    input_series:
      - series: 'kube_statefulset_status_current_revision{namespace="t3code-work",statefulset="other",job="kube-state-metrics",cluster="epaflix",revision="old"}'
        values: "1+0x30"
      - series: 'kube_statefulset_status_update_revision{namespace="t3code-work",statefulset="other",job="kube-state-metrics",cluster="epaflix",revision="new"}'
        values: "1+0x30"
      - series: 'kube_statefulset_replicas{namespace="t3code-work",statefulset="other",job="kube-state-metrics",cluster="epaflix"}'
        values: "1+0x30"
      - series: 'kube_statefulset_status_replicas_updated{namespace="t3code-work",statefulset="other",job="kube-state-metrics",cluster="epaflix"}'
        values: "0+0x30"
      - series: 'kube_statefulset_status_current_revision{namespace="other",statefulset="t3code",job="kube-state-metrics",cluster="epaflix",revision="old"}'
        values: "1+0x30"
      - series: 'kube_statefulset_status_update_revision{namespace="other",statefulset="t3code",job="kube-state-metrics",cluster="epaflix",revision="new"}'
        values: "1+0x30"
      - series: 'kube_statefulset_replicas{namespace="other",statefulset="t3code",job="kube-state-metrics",cluster="epaflix"}'
        values: "1+0x30"
      - series: 'kube_statefulset_status_replicas_updated{namespace="other",statefulset="t3code",job="kube-state-metrics",cluster="epaflix"}'
        values: "0+0x30"
    alert_rule_test:
      - eval_time: 14m
        alertname: KubeStatefulSetUpdateNotRolledOut
        exp_alerts: []
      - eval_time: 15m
        alertname: KubeStatefulSetUpdateNotRolledOut
        exp_alerts:
          - exp_labels:
              namespace: t3code-work
              statefulset: other
              job: kube-state-metrics
              cluster: epaflix
              severity: warning
            exp_annotations:
              description: "StatefulSet t3code-work/other update has not been rolled out on cluster epaflix."
              runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubestatefulsetupdatenotrolledout
              summary: "StatefulSet update has not been rolled out."
          - exp_labels:
              namespace: other
              statefulset: t3code
              job: kube-state-metrics
              cluster: epaflix
              severity: warning
            exp_annotations:
              description: "StatefulSet other/t3code update has not been rolled out on cluster epaflix."
              runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubestatefulsetupdatenotrolledout
              summary: "StatefulSet update has not been rolled out."

  # Match the credential_lines_redacted 5m idle TTL in alloy-values.yaml.

  # A logger still matching every minute: the live counter is the total.
  - interval: 1m
    input_series:
      - series: 'loki_process_custom_credential_lines_redacted_total{namespace="traefik-system",container="traefik",pod="traefik-6444675d5-x6mdf",job="traefik-system/traefik-6444675d5-x6mdf",component_id="loki.process.pods",component_path="/",filename="/var/log/pods/x/0.log",stream="stdout",instance="10.42.0.10:12345"}'
        values: "1+1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: CredentialRedactedFromLogs
        exp_alerts:
          - exp_labels:
              namespace: traefik-system
              container: traefik
              severity: warning
              component: security
            exp_annotations:
              summary: "Credential-shaped log content detected in traefik-system"
              description: "traefik-system/traefik logged a line with a credential-shaped key=value. alloy counts those lines per log stream in loki_process_custom_credential_lines_redacted_total and drops a series once 5m pass without a matching line (max_idle_duration), so a live series means a hit within about the last 5m. This fires while any is live. The latest reading was 21: lines counted since alloy created the live series, not a count over a fixed window. The alert stays firing until 6h pass with no live series. alloy redacts pattern-matched segments before Loki ingestion. Raw pod stdout can retain the original value, visible via `kubectl logs`. Unknown credential formats can still leak into Loki. The alloy chart's ServiceMonitor sets honorLabels, so namespace/pod/container name the offending app, not alloy (#911 was the exported_* shape under promtail, #1381). Known sources: sonarr/radarr/prowlarr restarting and logging their Postgres connection string (#634), traefik access lines carrying jellyfin's query-string ApiKey (#702), cloudflared logging Jellyfin request URLs with an ApiKey query parameter, and sonarr logging Prowlarr Torznab feed URLs with an apikey parameter. If it is a new offender treat that credential as exposed and rotate it. Do NOT grep Loki for the literal value."

