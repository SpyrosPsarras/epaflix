      # The series is gone from 17m; the alert remains held.
      - eval_time: 30m
        alertname: CredentialRedactedFromLogs
        exp_alerts: *credential_one_line
      - eval_time: 199m
        alertname: CredentialRedactedFromLogs
        exp_alerts: *credential_one_line
      - eval_time: 200m
        alertname: CredentialRedactedFromLogs
        exp_alerts: *credential_one_line
      - eval_time: 565m
        alertname: CredentialRedactedFromLogs
        exp_alerts: *credential_one_line
      - eval_time: 566m
        alertname: CredentialRedactedFromLogs
        exp_alerts: []
    promql_expr_test:
      # Firing at every evaluation from 11m to 565m: one alert, no resolve gap.
      - expr: count_over_time(ALERTS{alertname="CredentialRedactedFromLogs",alertstate="firing"}[560m])
        eval_time: 565m
        exp_samples:
          - labels: '{alertname="CredentialRedactedFromLogs",alertstate="firing",namespace="remote-pi",container="cliproxy",severity="warning",component="security"}'
            value: 555

