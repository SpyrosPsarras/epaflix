            exp_annotations:
              summary: "Credential-shaped log content detected in servarr"
              description: "servarr/sonarr logged a line with a credential-shaped key=value. alloy counts those lines per log stream in loki_process_custom_credential_lines_redacted_total and drops a series once 5m pass without a matching line (max_idle_duration), so a live series means a hit within about the last 5m. This fires while any is live. The latest reading was 4: lines counted since alloy created the live series, not a count over a fixed window. The alert stays firing until 6h pass with no live series. alloy redacts pattern-matched segments before Loki ingestion. Raw pod stdout can retain the original value, visible via `kubectl logs`. Unknown credential formats can still leak into Loki. The alloy chart's ServiceMonitor sets honorLabels, so namespace/pod/container name the offending app, not alloy (#911 was the exported_* shape under promtail, #1381). Known sources: sonarr/radarr/prowlarr restarting and logging their Postgres connection string (#634), traefik access lines carrying jellyfin's query-string ApiKey (#702), cloudflared logging Jellyfin request URLs with an ApiKey query parameter, and sonarr logging Prowlarr Torznab feed URLs with an apikey parameter. If it is a new offender treat that credential as exposed and rotate it. Do NOT grep Loki for the literal value."
      - eval_time: 366m
        alertname: CredentialRedactedFromLogs
        exp_alerts: []
      - eval_time: 399m
        alertname: CredentialRedactedFromLogs
        exp_alerts: []
      - eval_time: 400m
        alertname: CredentialRedactedFromLogs
        exp_alerts:
          - exp_labels:
              namespace: servarr
              container: sonarr
              severity: warning
              component: security
            exp_annotations:
              summary: "Credential-shaped log content detected in servarr"
              description: "servarr/sonarr logged a line with a credential-shaped key=value. alloy counts those lines per log stream in loki_process_custom_credential_lines_redacted_total and drops a series once 5m pass without a matching line (max_idle_duration), so a live series means a hit within about the last 5m. This fires while any is live. The latest reading was 3: lines counted since alloy created the live series, not a count over a fixed window. The alert stays firing until 6h pass with no live series. alloy redacts pattern-matched segments before Loki ingestion. Raw pod stdout can retain the original value, visible via `kubectl logs`. Unknown credential formats can still leak into Loki. The alloy chart's ServiceMonitor sets honorLabels, so namespace/pod/container name the offending app, not alloy (#911 was the exported_* shape under promtail, #1381). Known sources: sonarr/radarr/prowlarr restarting and logging their Postgres connection string (#634), traefik access lines carrying jellyfin's query-string ApiKey (#702), cloudflared logging Jellyfin request URLs with an ApiKey query parameter, and sonarr logging Prowlarr Torznab feed URLs with an apikey parameter. If it is a new offender treat that credential as exposed and rotate it. Do NOT grep Loki for the literal value."
      - eval_time: 403m
        alertname: CredentialRedactedFromLogs
        exp_alerts:
