# promtool cannot read the PrometheusRule CR. Generate the bare rules file, then run:
#   python3 -c "import yaml;yaml.safe_dump(yaml.safe_load(open('custom-alerts.yaml'))['spec'],open('custom-alerts-rules.yaml','w'))"
#   promtool test rules custom-alerts-tests.yaml
rule_files:
  - custom-alerts-rules.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'promtail_custom_credential_lines_redacted_total{namespace="observability",pod="promtail-abc",container="promtail",exported_namespace="traefik-system",exported_container="traefik",exported_pod="traefik-6444675d5-x6mdf"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: CredentialRedactedFromLogs
        exp_alerts:
          - exp_labels:
              exported_namespace: traefik-system
              exported_container: traefik
              severity: warning
              component: security
            exp_annotations:
              summary: "An app logged a credential in traefik-system (redacted before Loki)"
              description: "15 log line(s) from traefik-system/traefik contained a credential-shaped key=value in the last 15m. promtail redacted the value before pushing, so it is NOT in Loki - but it IS in the pod's own stdout and visible via `kubectl logs`. The exported_* labels name the offending app; plain namespace/pod/container are promtail itself (#911). Most likely causes: sonarr/radarr/prowlarr restarting and logging their Postgres connection string (#634), or traefik access lines carrying jellyfin's query-string ApiKey (#702). If it is a new offender treat that credential as exposed and rotate it. Do NOT grep Loki for the literal value."

  - interval: 1m
    input_series:
      - series: 'promtail_custom_credential_lines_redacted_total{namespace="observability",pod="promtail-abc",container="promtail",exported_namespace="servarr",exported_container="sonarr",exported_pod="sonarr-68855b8c7f-s8879"}'
        values: "4x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: CredentialRedactedFromLogs
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_last_collect_success{job="truenas-gpu-exporter", instance="192.168.10.200"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: NvidiaGpuExporterCollectionFailing
        exp_alerts:
          - exp_labels:
              job: truenas-gpu-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-gpu

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_last_collect_success{job="truenas-gpu-exporter", instance="192.168.10.200"}'
        values: "1x45"
      - series: 'nvidia_smi_last_collect_duration_seconds{job="truenas-gpu-exporter", instance="192.168.10.200"}'
        values: "0.12x45"
      - series: 'nvidia_smi_gpu_info{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s"}'
        values: "1x45"
      - series: 'nvidia_smi_gpu_recovery_action{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s"}'
        values: "0x45"
    alert_rule_test:
      - eval_time: 40m
        alertname: NvidiaGpuExporterCollectionFailing
        exp_alerts: []
      - eval_time: 40m
        alertname: NvidiaGpuExporterCollectionSlow
        exp_alerts: []
      - eval_time: 40m
        alertname: NvidiaGpuMissing
        exp_alerts: []
      - eval_time: 40m
        alertname: NvidiaGpuRecoveryActionNeeded
        exp_alerts: []
      - eval_time: 40m
        alertname: NvidiaGpuXidCritical
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_gpu_info{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s"}'
        values: "1x15"
      - series: 'nvidia_smi_last_collect_success{job="truenas-gpu-exporter", instance="192.168.10.200"}'
        values: "1x45"
    alert_rule_test:
      - eval_time: 40m
        alertname: NvidiaGpuMissing
        exp_alerts:
          - exp_labels:
              job: truenas-gpu-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-gpu
      - eval_time: 40m
        alertname: NvidiaGpuExporterCollectionFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_xid_last_timestamp_seconds{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s", xid="79"}'
        values: "540x15"
      - series: 'nvidia_smi_xid_last_timestamp_seconds{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s", xid="13"}'
        values: "540x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: NvidiaGpuXidCritical
        exp_alerts:
          - exp_labels:
              job: truenas-gpu-exporter
              instance: 192.168.10.200
              uuid: GPU-2070s
              xid: "79"
              severity: critical
              component: truenas-gpu

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_xid_last_timestamp_seconds{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s", xid="79"}'
        values: "540x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: NvidiaGpuXidCritical
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_gpu_recovery_action{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s"}'
        values: "2x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: NvidiaGpuRecoveryActionNeeded
        exp_alerts:
          - exp_labels:
              job: truenas-gpu-exporter
              instance: 192.168.10.200
              uuid: GPU-2070s
              severity: critical
              component: truenas-gpu

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_last_collect_duration_seconds{job="truenas-gpu-exporter", instance="192.168.10.200"}'
        values: "6x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: NvidiaGpuExporterCollectionSlow
        exp_alerts:
          - exp_labels:
              job: truenas-gpu-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-gpu

  - interval: 1m
    input_series:
      - series: 'node_zfs_arc_c_max{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "33285996544x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: TruenasArcCapDrift
        exp_alerts:
          - exp_labels:
              job: truenas-node-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-memory

  - interval: 1m
    input_series:
      - series: 'node_zfs_arc_size{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "12895364840x30"
      - series: 'node_zfs_arc_c_max{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "12884901888x30"
      - series: 'node_zfs_arc_memory_throttle_count{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: TruenasArcCapDrift
        exp_alerts: []
      - eval_time: 25m
        alertname: TruenasArcOverCap
        exp_alerts: []
      - eval_time: 25m
        alertname: TruenasArcForcedShrink
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'node_zfs_arc_size{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "14173392076x30"
      - series: 'node_zfs_arc_c_max{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "12884901888x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: TruenasArcOverCap
        exp_alerts:
          - exp_labels:
              job: truenas-node-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-memory

  - interval: 1m
    input_series:
      - series: 'node_zfs_arc_memory_throttle_count{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "0x10 1+1x20"
    alert_rule_test:
      - eval_time: 25m
        alertname: TruenasArcForcedShrink
        exp_alerts:
          - exp_labels:
              job: truenas-node-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-memory

  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{device="pool1",device_error="",fstype="zfs",instance="192.168.10.200",job="truenas-node-exporter",mountpoint="/mnt/pool1"}'
        values: "429496729599x90"  # 400 GiB - 1, below both pool1 thresholds
    alert_rule_test:
      - eval_time: 70m
        alertname: TruenasPool1FreeLow
        exp_alerts:
          - exp_labels:
              job: truenas-node-exporter
              instance: 192.168.10.200
              device: pool1
              device_error: ""
              fstype: zfs
              mountpoint: /mnt/pool1
              severity: warning
              component: truenas-storage
      - eval_time: 70m
        alertname: TruenasPool1FreeCritical
        exp_alerts:
          - exp_labels:
              job: truenas-node-exporter
              instance: 192.168.10.200
              device: pool1
              device_error: ""
              fstype: zfs
              mountpoint: /mnt/pool1
              severity: critical
              component: truenas-storage

  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{device="pool1",device_error="",fstype="zfs",instance="192.168.10.200",job="truenas-node-exporter",mountpoint="/mnt/pool1"}'
        values: "2199023255552x90"  # 2 TiB, above both thresholds (live 2026-09-05: 1.72 TiB)
    alert_rule_test:
      - eval_time: 70m
        alertname: TruenasPool1FreeLow
        exp_alerts: []
      - eval_time: 70m
        alertname: TruenasPool1FreeCritical
        exp_alerts: []
