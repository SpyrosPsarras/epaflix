rule_files:
  - custom-alerts-rules.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'nvidia_smi_last_collect_success{job="truenas-gpu-exporter", instance="192.168.10.200"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: NvidiaGpuExporterCollectionFailing
        exp_alerts:
          - exp_labels:
              job: truenas-gpu-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-gpu

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_last_collect_success{job="truenas-gpu-exporter", instance="192.168.10.200"}'
        values: "1x45"
      - series: 'nvidia_smi_last_collect_duration_seconds{job="truenas-gpu-exporter", instance="192.168.10.200"}'
        values: "0.12x45"
      - series: 'nvidia_smi_gpu_info{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s"}'
        values: "1x45"
      - series: 'nvidia_smi_gpu_recovery_action{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s"}'
        values: "0x45"
    alert_rule_test:
      - eval_time: 40m
        alertname: NvidiaGpuExporterCollectionFailing
        exp_alerts: []
      - eval_time: 40m
        alertname: NvidiaGpuExporterCollectionSlow
        exp_alerts: []
      - eval_time: 40m
        alertname: NvidiaGpuMissing
        exp_alerts: []
      - eval_time: 40m
        alertname: NvidiaGpuRecoveryActionNeeded
        exp_alerts: []
      - eval_time: 40m
        alertname: NvidiaGpuXidCritical
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_gpu_info{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s"}'
        values: "1x15"
      - series: 'nvidia_smi_last_collect_success{job="truenas-gpu-exporter", instance="192.168.10.200"}'
        values: "1x45"
    alert_rule_test:
      - eval_time: 40m
        alertname: NvidiaGpuMissing
        exp_alerts:
          - exp_labels:
              job: truenas-gpu-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-gpu
      - eval_time: 40m
        alertname: NvidiaGpuExporterCollectionFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_xid_last_timestamp_seconds{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s", xid="79"}'
        values: "540x15"
      - series: 'nvidia_smi_xid_last_timestamp_seconds{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s", xid="13"}'
        values: "540x15"
    alert_rule_test:
      - eval_time: 10m
        alertname: NvidiaGpuXidCritical
        exp_alerts:
          - exp_labels:
              job: truenas-gpu-exporter
              instance: 192.168.10.200
              uuid: GPU-2070s
              xid: "79"
              severity: critical
              component: truenas-gpu

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_xid_last_timestamp_seconds{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s", xid="79"}'
        values: "540x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: NvidiaGpuXidCritical
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_gpu_recovery_action{job="truenas-gpu-exporter", instance="192.168.10.200", uuid="GPU-2070s"}'
        values: "2x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: NvidiaGpuRecoveryActionNeeded
        exp_alerts:
          - exp_labels:
              job: truenas-gpu-exporter
              instance: 192.168.10.200
              uuid: GPU-2070s
              severity: critical
              component: truenas-gpu

  - interval: 1m
    input_series:
      - series: 'nvidia_smi_last_collect_duration_seconds{job="truenas-gpu-exporter", instance="192.168.10.200"}'
        values: "6x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: NvidiaGpuExporterCollectionSlow
        exp_alerts:
          - exp_labels:
              job: truenas-gpu-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-gpu

  - interval: 1m
    input_series:
      - series: 'node_zfs_arc_c_max{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "33285996544x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: TruenasArcCapDrift
        exp_alerts:
          - exp_labels:
              job: truenas-node-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-memory

  - interval: 1m
    input_series:
      - series: 'node_zfs_arc_size{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "12895364840x30"
      - series: 'node_zfs_arc_c_max{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "12884901888x30"
      - series: 'node_zfs_arc_memory_throttle_count{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: TruenasArcCapDrift
        exp_alerts: []
      - eval_time: 25m
        alertname: TruenasArcOverCap
        exp_alerts: []
      - eval_time: 25m
        alertname: TruenasArcForcedShrink
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'node_zfs_arc_size{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "14173392076x30"
      - series: 'node_zfs_arc_c_max{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "12884901888x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: TruenasArcOverCap
        exp_alerts:
          - exp_labels:
              job: truenas-node-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-memory

  - interval: 1m
    input_series:
      - series: 'node_zfs_arc_memory_throttle_count{job="truenas-node-exporter", instance="192.168.10.200"}'
        values: "0x10 1+1x20"
    alert_rule_test:
      - eval_time: 25m
        alertname: TruenasArcForcedShrink
        exp_alerts:
          - exp_labels:
              job: truenas-node-exporter
              instance: 192.168.10.200
              severity: warning
              component: truenas-memory
