---
# pve-exporter config. Applied imperatively from .github/instructions/secrets.yml
# (deploy.sh sed-substitutes <PROXMOX_API_TOKEN_VALUE>) — placeholder only in git
# so the real Proxmox API token never lands in the repo.
#
# The pve-exporter binary reads /etc/prometheus/pve.yml. We mount this Secret
# at that path, replacing the older ConfigMap that embedded the token inline.
# Single "default" module is the only one the ServiceMonitor scrapes (with
# target=192.168.10.11) — Proxmox clustering means one host returns the
# whole cluster.
apiVersion: v1
kind: Secret
metadata:
  name: pve-exporter-secrets
  namespace: observability
type: Opaque
stringData:
  pve.yml: |
    default:
      user: root@pam
      token_name: grafana
      token_value: <PROXMOX_API_TOKEN_VALUE>
      verify_ssl: false
