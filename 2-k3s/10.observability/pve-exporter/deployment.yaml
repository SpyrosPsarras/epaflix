---
# Proxmox VE Exporter Deployment
# Scrapes metrics from Proxmox hosts
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pve-exporter
  namespace: observability
  labels:
    app: pve-exporter
spec:
  replicas: 1 # Single replica - Proxmox clustering means one exporter gets all nodes
  selector:
    matchLabels:
      app: pve-exporter
  template:
    metadata:
      labels:
        app: pve-exporter
    spec:
      containers:
        - name: pve-exporter
          image: prompve/prometheus-pve-exporter:latest
          ports:
            - containerPort: 9221
              name: metrics
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
          # NO cpu limit, on purpose (#912). Point-in-time measurement,
          # 2026-08-21. These numbers drift, so re-run the queries rather than
          # trusting them:
          #   sum(rate(container_cpu_cfs_throttled_periods_total{container="pve-exporter"}[24h]))
          #     / sum(rate(container_cpu_cfs_periods_total{container="pve-exporter"}[24h]))
          #     -> 0.406
          #   quantile_over_time(0.99, sum by (pod) (rate(container_cpu_usage_seconds_total{container="pve-exporter"}[5m]))[24h:5m])
          #     -> 0.0291 cores
          # 40.6% of CFS periods throttled at 15% of the old 200m limit is quota
          # granularity on a bursty scrape handler, not an undersized limit. The
          # memory limit and both requests stay.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: config
          secret:
            secretName: pve-exporter-secrets
