---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pve-exporter
  namespace: observability
  labels:
    app: pve-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: pve-exporter
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
      path: /pve
      params:
        target: ["192.168.10.11"]
        module: ["default"]
      relabelings:
        - action: replace
          targetLabel: instance
          replacement: "192.168.10.11"
        - action: replace
          targetLabel: cluster
          replacement: "e-pavli"
