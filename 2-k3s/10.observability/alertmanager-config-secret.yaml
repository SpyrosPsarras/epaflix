---
# Full Alertmanager configuration. Applied imperatively from
# .github/instructions/secrets.yml — placeholder only in git, because the
# kube-prometheus-stack chart's `alertmanager.config:` block cannot reference
# `$__file{}` mounts or env-vars and we will not commit the SMTP password.
#
# Referenced by prometheus-values.yaml via
#   alertmanager.alertmanagerSpec.configSecret: alertmanager-config-secret
#
# The Alertmanager StatefulSet mounts this Secret at /etc/alertmanager/config
# and reads the key alertmanager.yaml as the full config.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config-secret
  namespace: observability
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: mail.epaflix.com:587
      smtp_from: noreply@epaflix.com
      smtp_auth_username: truenas_admin
      smtp_auth_password: "<SMTP_PASSWORD>"
      smtp_require_tls: true
    route:
      group_by: ["alertname", "cluster", "namespace", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: email
      routes:
        - match:
            severity: critical
          receiver: email
          continue: true
    receivers:
      - name: email
        email_configs:
          - to: admin@epaflix.com
            headers:
              Subject: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] Kubernetes Alert: {{ .GroupLabels.alertname }}'
            html: |
              {{ range .Alerts }}
              <b>Alert:</b> {{ .Labels.alertname }}<br>
              <b>Severity:</b> {{ .Labels.severity }}<br>
              <b>Namespace:</b> {{ .Labels.namespace }}<br>
              <b>Description:</b> {{ .Annotations.description }}<br>
              <b>Summary:</b> {{ .Annotations.summary }}<br>
              <hr>
              {{ end }}
