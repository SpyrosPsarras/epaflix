---
# Grafana admin credentials. Applied imperatively from
# .github/instructions/secrets.yml — placeholder only in git.
# Referenced by prometheus-values.yaml via grafana.admin.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: observability
type: Opaque
stringData:
  admin-user: admin
  admin-password: "<GRAFANA_ADMIN_PASSWORD>"
