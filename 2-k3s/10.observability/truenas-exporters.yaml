---
apiVersion: v1
kind: Service
metadata:
  name: truenas-node-exporter
  namespace: observability
  labels:
    app: truenas-node-exporter
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http-metrics
      port: 9100
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: truenas-node-exporter
  namespace: observability
  labels:
    kubernetes.io/service-name: truenas-node-exporter
addressType: IPv4
ports:
  - name: http-metrics
    port: 9100
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.10.200
    conditions:
      ready: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: truenas-node-exporter
  namespace: observability
  labels:
    app: truenas-node-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: truenas-node-exporter
  endpoints:
    - port: http-metrics
      interval: 60s
      scrapeTimeout: 30s
      path: /metrics
      relabelings:
        - action: replace
          targetLabel: instance
          replacement: "192.168.10.200"
---
