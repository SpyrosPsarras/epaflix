---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nvidia-gpu-exporter
  namespace: observability
  labels:
    app: nvidia-gpu-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: nvidia-gpu-exporter
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
      path: /metrics
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: instance
