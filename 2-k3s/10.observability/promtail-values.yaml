# Promtail Helm Values
# DaemonSet log collector

daemonset:
  enabled: true

config:
  # Client configuration
  clients:
    - url: http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push
      tenant_id: 1

  # Scrape configs
  snippets:
    scrapeConfigs: |
      # Pods with standard logging
      - job_name: kubernetes-pods
        pipeline_stages:
        - cri: {}
        - multiline:
            firstline: '^\d{4}-\d{2}-\d{2}|^[A-Z]{1}\d{4}'
            max_wait_time: 3s
        # --- credential redaction (#634, #702) ---------------------------------
        # Some apps print secrets into their own stdout. Sonarr, Radarr and
        # Prowlarr each log the full Postgres connection string INCLUDING the
        # plaintext password at Info level on every start:
        #   [Info] MigrationController: *** Migrating Database=...;Password=...;
        # That is upstream behaviour, not our config - but the consequence is
        # ours, because promtail then ships it to Loki where it is searchable in
        # Grafana for the whole 31-day retention window.
        #
        # TWO STAGES, in this order, and the order matters:
        #   1. `match` + `metrics` COUNTS the line while the secret is still
        #      visible, exporting promtail_custom_credential_lines_redacted_total.
        #   2. `replace` then REDACTS the value before the line is pushed.
        #
        # Counting first is what keeps this detectable. If we only redacted, the
        # stored line would read `Password=<REDACTED>`, the log-content alert
        # CredentialInLogs could never match it again, and a leaking app would
        # become invisible - we would have hidden the symptom and lost the
        # signal. The counter is the durable signal; the log-content rule stays
        # as a catch-all for any credential SHAPE this regex does not recognise.
        #
        # Redaction happens in promtail, so it protects Loki and Grafana. It does
        # NOT clean `kubectl logs` on the pod itself - the app still prints it to
        # its own stdout. Fixing that needs an upstream change or for the apps to
        # stop logging connection strings.
        - match:
            selector: '{namespace=~".+"} |~ "(?i)(password|passwd|apikey|api_key|api-key|client_secret)="'
            stages:
            - metrics:
                credential_lines_redacted_total:
                  type: Counter
                  description: "Log lines containing a credential-shaped key=value that promtail redacted before pushing to Loki (#634)."
                  config:
                    # match_all is REQUIRED here and its absence is silent. With
                    # no `source`, the metrics stage otherwise looks for an
                    # EXTRACTED FIELD named after the metric, never finds one, and
                    # never increments - the counter is not even registered, so
                    # /metrics has no such series and any alert on it sits at "no
                    # data" forever. Verified the failure and the fix on the live
                    # DaemonSet: before, 0 of 7 promtail pods exposed the counter
                    # (including the one on radarr's node, while that same pod
                    # served 113 other promtail_* series, so metrics themselves
                    # were healthy). The `match` stage above already does the
                    # selecting; match_all just means "count every entry that
                    # reaches this stage".
                    match_all: true
                    action: inc
        - replace:
            # Only the capture group - the VALUE - is replaced, so the key name
            # survives and stays greppable/alertable. Value charset stops at the
            # delimiters that actually terminate these: `;` in a connection
            # string, `&` in a URL query, quotes and whitespace.
            #
            # It ALSO excludes regex metacharacters ([ ] { } ^ $ * ( ) | \ < >)
            # and requires 8+ characters. That is not cosmetic - without it the
            # first version of this matched PATTERN TEXT, not just secrets. Loki
            # logs the LogQL of every delete request it accepts, so submitting a
            # purge for `apikey=[A-Za-z0-9]{16,}` (#751) produced a log line
            # containing that string, promtail matched `[A-Za-z0-9]{16,}` as if it
            # were a value, and CredentialRedactedFromLogs fired on our own
            # tooling. Observed live: 6 increments, all container=loki, all from
            # delete-request and query logs.
            #
            # A real credential does not contain regex syntax, so excluding those
            # characters removes that whole false-positive class while still
            # catching `Password=SuperS3cret!x` (symbols like ! @ # are still
            # allowed on purpose - real passwords have them).
            #
            # Deliberately NOT excluding container="loki" instead: if somebody
            # ever queries Loki for a LITERAL credential value, Loki will log it
            # and that SHOULD match. That is a true positive worth paging on, and
            # it is exactly what the alert description warns against doing.
            expression: '(?i)(?:password|passwd|apikey|api_key|api-key|client_secret)=([^;&"''\s\[\]{}^$*()|\\<>]{8,})'
            replace: '<REDACTED>'
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: __host__
        # NOTE: no blanket `labelmap` of pod labels here. Mapping every pod label
        # into a Loki stream label pushed busy pods (argocd, postgres) past Loki's
        # max_label_names_per_series (15) → those streams were dropped with HTTP 400
        # and never stored. It also explodes index cardinality. We keep only the
        # curated low-cardinality labels below (namespace/pod/container/job/host);
        # filter on app/container or line content in LogQL instead.
        - action: replace
          replacement: $1
          separator: /
          source_labels:
          - __meta_kubernetes_namespace
          - __meta_kubernetes_pod_name
          target_label: job
        - action: replace
          source_labels:
          - __meta_kubernetes_namespace
          target_label: namespace
        - action: replace
          source_labels:
          - __meta_kubernetes_pod_name
          target_label: pod
        - action: replace
          source_labels:
          - __meta_kubernetes_pod_container_name
          target_label: container
        - replacement: /var/log/pods/*$1/*.log
          separator: /
          source_labels:
          - __meta_kubernetes_pod_uid
          - __meta_kubernetes_pod_container_name
          target_label: __path__
        - action: replace
          regex: true/(.*)
          replacement: /var/log/pods/*$1/*.log
          separator: /
          source_labels:
          - __meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash
          - __meta_kubernetes_pod_annotation_kubernetes_io_config_hash
          - __meta_kubernetes_pod_container_name
          target_label: __path__

# Resources
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Tolerations for master nodes
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# Service Monitor
serviceMonitor:
  enabled: true
