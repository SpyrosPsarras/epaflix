
daemonset:
  enabled: true

config:
  clients:
    - url: http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push
      tenant_id: 1

  snippets:
    scrapeConfigs: |
      - job_name: kubernetes-pods
        pipeline_stages:
        - cri: {}
        - multiline:
            firstline: '^\d{4}-\d{2}-\d{2}|^[A-Z]{1}\d{4}'
            max_wait_time: 3s
        - match:
            selector: '{namespace=~".+"} |~ "(?i)(password|passwd|apikey|api_key|api-key|client_secret)="'
            stages:
            - metrics:
                credential_lines_redacted_total:
                  type: Counter
                  description: "Log lines containing a credential-shaped key=value that promtail redacted before pushing to Loki (#634)."
                  config:
                    match_all: true
                    action: inc
        - replace:
            expression: '(?i)(?:password|passwd|apikey|api_key|api-key|client_secret)=([^;&"''\s\[\]{}^$*()|\\<>]{8,})'
            replace: '<REDACTED>'
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: __host__
        - action: replace
          replacement: $1
          separator: /
          source_labels:
          - __meta_kubernetes_namespace
          - __meta_kubernetes_pod_name
          target_label: job
        - action: replace
          source_labels:
          - __meta_kubernetes_namespace
          target_label: namespace
        - action: replace
          source_labels:
          - __meta_kubernetes_pod_name
          target_label: pod
        - action: replace
          source_labels:
          - __meta_kubernetes_pod_container_name
          target_label: container
        - replacement: /var/log/pods/*$1/*.log
          separator: /
          source_labels:
          - __meta_kubernetes_pod_uid
          - __meta_kubernetes_pod_container_name
          target_label: __path__
        - action: replace
          regex: true/(.*)
          replacement: /var/log/pods/*$1/*.log
          separator: /
          source_labels:
          - __meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash
          - __meta_kubernetes_pod_annotation_kubernetes_io_config_hash
          - __meta_kubernetes_pod_container_name
          target_label: __path__

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

serviceMonitor:
  enabled: true
