# ksops generator — decrypts the 5 observability Secrets at render time.
# Decryption performed inside argocd-repo-server via the ksops binary
# (see 2-k3s/11.argocd/helm-values.yaml).
#
# Paths are relative to the parent kustomization
# (2-k3s/10.observability/kustomization.yaml).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: observability-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - secrets/grafana-db-secret.enc.yaml
  - secrets/grafana-oauth-secret.enc.yaml
  - secrets/grafana-admin-secret.enc.yaml
  - secrets/alertmanager-config-secret.enc.yaml
  - secrets/pve-exporter-secrets.enc.yaml
