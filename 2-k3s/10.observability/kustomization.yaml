
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - alertmanager-config/custom-alerts.yaml
  - alertmanager-config/tls-alerts.yaml
  - alertmanager-config/loki-log-alerts.yaml
  - ingress/grafana-ingressroute.yaml
  - pve-exporter/service.yaml
  - pve-exporter/deployment.yaml
  - pve-exporter/servicemonitor.yaml
  - ntfy.yaml
  - ingress/ntfy-ingressroute.yaml
  - control-plane-endpointslices.yaml
  - truenas-exporters.yaml

generators:
  - secrets/ksops-generator.yaml

patches:
  - target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: .*\.monitoring\.coreos\.com
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Prune=false,Delete=false,ServerSideApply=true

helmCharts:
  - name: prometheus-blackbox-exporter
    repo: oci://ghcr.io/prometheus-community/charts
    version: "11.20.2"
    releaseName: blackbox-exporter
    namespace: observability
    valuesFile: blackbox-values.yaml
    includeCRDs: false
  - name: kube-prometheus-stack
    repo: oci://ghcr.io/prometheus-community/charts
    version: "92.13.1"
    releaseName: kube-prometheus-stack
    namespace: observability
    valuesFile: prometheus-values.yaml
    includeCRDs: true
  - name: loki
    repo: oci://ghcr.io/grafana/helm-charts
    version: "7.5.0"
    releaseName: loki
    namespace: observability
    valuesFile: loki-values.yaml
    includeCRDs: false
  - name: alloy
    repo: https://grafana.github.io/helm-charts
    version: "1.14.3"
    releaseName: alloy
    namespace: observability
    valuesFile: alloy-values.yaml
    includeCRDs: false
