# Kustomize + Helm inflation for the observability stack. Rendered by ArgoCD's
# repo-server with `kustomize build --enable-helm` (set via
# configs.cm.kustomize.buildOptions in 2-k3s/11.argocd/helm-values.yaml).
#
# Three Helm releases share one namespace and one CRD set:
#   - kube-prometheus-stack: Prometheus + Grafana + Alertmanager + node-exporter
#                            + kube-state-metrics + Prometheus Operator + CRDs
#   - loki:                  SingleBinary log store
#   - promtail:              DaemonSet log shipper
#
# Single Application avoids the sync-wave ordering problem that would arise if
# promtail/loki ServiceMonitors landed before kube-prometheus-stack's CRDs.
#
# Reconciled via the ksops generator below
# (secrets/ksops-generator.yaml — Issue #29 / PR #58, follow-up #62):
#   - grafana-db-secret           (Grafana → Postgres password)
#   - grafana-oauth-secret        (Grafana → Authentik client_secret)
#   - grafana-admin-secret        (Grafana admin user/password)
#   - alertmanager-config-secret  (full alertmanager.yaml incl. SMTP creds)
#   - pve-exporter-secrets        (Proxmox API token; carries pve.yml as a
#                                  stringData key, mounted at /etc/prometheus
#                                  by the pve-exporter Deployment — replaces
#                                  the previous in-cluster ConfigMap)
#
# Also excluded:
#   - storage/{prometheus,loki}-pvc.yaml — DEAD CODE. The kube-prometheus-stack
#     chart creates the Prometheus PVC via `prometheus.prometheusSpec.storageSpec
#     .volumeClaimTemplate`, and the loki chart creates the Loki PVC via
#     `singleBinary.persistence`. Rendering these manifests would create a
#     second, orphan PVC with a different name on each sync.
#   - postgres-setup-job.yaml, deploy.sh, *.md — one-shot bootstrap + docs.
#
# CRDs (`includeCRDs: false`) stay operator-managed from the original Helmfile
# install, matching Traefik and Authentik. Re-rendering CRDs through ArgoCD
# with SSA produces field-manager conflicts.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NO top-level `namespace:` transformer here on purpose.
#
# A blanket `namespace: observability` force-rewrites EVERY namespaced resource,
# including kube-prometheus-stack's control-plane exporter Services
# (kube-controller-manager / kube-scheduler / kube-etcd / coredns) which the
# chart deliberately templates into `kube-system` so their manually-managed
# Endpoints resolve against the control-plane nodes. Moving them to
# `observability` produces endpoint-less Service shells that scrape nothing,
# while the real (kube-system) Services drift out of git and become prune bait.
#
# Instead: each Helm release pins its own namespace via `helmCharts[*].namespace`
# (release namespace = observability), and every local resource below carries an
# explicit `namespace: observability` in its own manifest. Control-plane
# exporter Services correctly stay in kube-system. See issue #53 / the
# prune-enable work for the regression this prevents.
resources:
  - namespace.yaml
  - alertmanager-config/custom-alerts.yaml
  - ingress/grafana-ingressroute.yaml
  - pve-exporter/service.yaml
  - pve-exporter/deployment.yaml
  - pve-exporter/servicemonitor.yaml
  # Static EndpointSlices in kube-system that back the chart's selector-less
  # control-plane exporter Services (kube-controller-manager / kube-scheduler /
  # kube-etcd). Git-durable, selfHeal-recreatable replacement for the chart's
  # out-of-band v1 Endpoints that ArgoCD's global exclusion silently drops
  # (issue #147; #121). Each object carries its own `namespace: kube-system`
  # — there is no top-level namespace transformer, so they are NOT rewritten to
  # observability (intentional: they must resolve against the control plane).
  - control-plane-endpointslices.yaml

generators:
  - secrets/ksops-generator.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: "86.2.0"
    releaseName: kube-prometheus-stack
    namespace: observability
    valuesFile: prometheus-values.yaml
    includeCRDs: false
  - name: loki
    repo: https://grafana.github.io/helm-charts
    version: "7.0.0"
    releaseName: loki
    namespace: observability
    valuesFile: loki-values.yaml
    includeCRDs: false
  - name: promtail
    repo: https://grafana.github.io/helm-charts
    version: "6.17.1"
    releaseName: promtail
    namespace: observability
    valuesFile: promtail-values.yaml
    includeCRDs: false
