
prometheus:
  prometheusSpec:
    replicas: 1 # Single replica due to PV limitations
    retention: 8d
    retentionSize: "20GB"

    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 25Gi

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    serviceDiscoveryRole: EndpointSlice

    additionalScrapeConfigs:
      - job_name: "cilium-agent"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kube-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_k8s_app]
            action: keep
            regex: cilium
          - source_labels: [__address__]
            action: replace
            regex: '([^:]+)(?::\d+)?'
            replacement: "${1}:9962"
            target_label: __address__

      - job_name: "hubble"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kube-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_k8s_app]
            action: keep
            regex: cilium
          - source_labels: [__address__]
            action: replace
            regex: '([^:]+)(?::\d+)?'
            replacement: "${1}:9965"
            target_label: __address__

grafana:
  enabled: true
  replicas: 2

  annotations:
    secret.reloader.stakater.com/reload: "grafana-admin-secret"

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: grafana

  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password

  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: false

  extraSecretMounts:
    - name: grafana-db-secret
      secretName: grafana-db-secret
      defaultMode: 0440
      mountPath: /etc/secrets/grafana-db
      readOnly: true
    - name: grafana-oauth-secret
      secretName: grafana-oauth-secret
      defaultMode: 0440
      mountPath: /etc/secrets/grafana-oauth
      readOnly: true

  grafana.ini:
    server:
      domain: grafana.epaflix.com
      root_url: https://grafana.epaflix.com
      serve_from_sub_path: false

    database:
      type: postgres
      host: postgres-rw.postgres-system.svc.cluster.local:5432
      name: observability
      user: observability
      password: $__file{/etc/secrets/grafana-db/password}

    auth:
      disable_login_form: false
      oauth_auto_login: false

    auth.generic_oauth:
      enabled: true
      name: Authentik
      client_id: m4oQzhxf8oVyJY7EOrL7lCM81BUQ42Uc3w9OXDAs
      client_secret: $__file{/etc/secrets/grafana-oauth/client_secret}
      scopes: openid email profile
      auth_url: https://auth.epaflix.com/application/o/authorize/
      token_url: https://auth.epaflix.com/application/o/token/
      api_url: https://auth.epaflix.com/application/o/userinfo/
      role_attribute_path: contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'
      allow_sign_up: true
      auto_login: false
      use_pkce: true

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
          access: proxy
          isDefault: true

        - name: Loki
          type: loki
          url: http://loki-gateway.observability.svc.cluster.local
          access: proxy
          jsonData:
            maxLines: 1000
            httpHeaderName1: "X-Scope-OrgID"
          secureJsonData:
            httpHeaderValue1: "1"

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "kubernetes-cluster"
          orgId: 1
          folder: "Kubernetes Cluster"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/kubernetes-cluster

        - name: "network-service-mesh"
          orgId: 1
          folder: "Network & Service Mesh"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/network-service-mesh

        - name: "infrastructure"
          orgId: 1
          folder: "Infrastructure"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/infrastructure

        - name: "logs"
          orgId: 1
          folder: "Logs"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/logs

  dashboards: {}

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  ingress:
    enabled: false

alertmanager:
  alertmanagerSpec:
    replicas: 3
    configSecret: alertmanager-config-secret

    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: alertmanager

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

prometheus-node-exporter:
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      memory: 200Mi

kube-state-metrics:
  replicas: 2

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: kube-state-metrics

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: true
    kubeApiserverSlos: true
    kubelet: true
    kubeProxy: false # Disabled because using Cilium
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
  disabled:
    KubeJobFailed: true

kubelet:
