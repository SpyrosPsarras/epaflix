---
# Internal entry point only (192.168.10.102): reachable from the LAN and Tailscale, 404 from the internet.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: deltasync-internal
  namespace: deltasync
spec:
  entryPoints:
    - internal
  routes:
    - match: Host(`deltasync.epaflix.com`)
      kind: Rule
      services:
        - name: deltasync
          port: 80
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
