apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: t3code-homelab

components:
  - ../13.t3code
resources:
  - namespace.yaml
  - statefulset.yaml
  - storage.yaml
  - service.yaml
  - network-policy.yaml

configMapGenerator:
  - name: t3code-machine-info
    literals:
      - 'machine-info=PRETTY_HOSTNAME="homelab"'
  - name: t3code-homelab-ssh
    files:
      - files/homelab-ssh.conf
      - files/homelab-ssh.md
      - files/ssh-config.sh

patches:
  - target:
      kind: ConfigMap
      name: t3code-scripts
    patch: |-
      - op: remove
        path: /data/homelab-ssh.md

replacements:
  - source:
      kind: StatefulSet
      name: t3code
      fieldPath: spec.template.spec.containers.[name=t3].image
    targets:
      - select:
          kind: StatefulSet
          name: t3code
        fieldPaths:
          - spec.template.spec.initContainers.[name=vault-storage].image
          - spec.template.spec.containers.[name=vault].image
