apiVersion: v1
kind: ServiceAccount
metadata:
  name: homelab-agent
  namespace: t3code-homelab
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-agent-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: homelab-agent
    namespace: t3code-homelab
