apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: remote-pi

# Two persistent T3 Code environments (env/). Lives at this level, not in env/,
# because kustomize only reads files below the kustomization root and
# files/cliproxy-models.js is shared with the LXC setup.
resources:
  - env/statefulset.yaml
  - env/service.yaml
  - env/ingress.yaml

configMapGenerator:
  # Content hashes change the pod template on tool or script updates.
  # ArgoCD rolls the pods, then PruneLast removes superseded ConfigMaps.
  - name: t3env-tools
    files:
      - env/tools/package.json
      - env/tools/package-lock.json
  - name: t3env-scripts
    files:
      - env/files/entrypoint.sh
      - env/files/private-config.py
      - env/files/git-credential-github.sh
      - files/cliproxy-models.js

generators:
  - env/ksops-generator.yaml

replacements:
  - source:
      kind: Secret
      name: t3env-private-config
      fieldPath: metadata.annotations.[t3code.epaflix.com/private-revision]
    targets:
      - select:
          kind: StatefulSet
          name: t3env
        fieldPaths:
          - spec.template.metadata.annotations.[t3code.epaflix.com/private-revision]
        options:
          create: true
