apiVersion: batch/v1
kind: Job
metadata:
  name: t3code-v2-image-prepull
  namespace: t3code
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '-2'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 1
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: k3s-worker-65
      containers:
        - name: pull
          image: ghcr.io/spyrospsarras/t3-runtime-v2@sha256:56807ef2e631b5350b75b7780ddac6705268750864ca187b77bd2601ae725461
          imagePullPolicy: IfNotPresent
          command: ['true']
