apiVersion: batch/v1
kind: Job
metadata:
  name: t3code-v2-image-prepull
  namespace: t3code
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '-2'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 1
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: k3s-worker-65
      containers:
        - name: pull
          image: ghcr.io/spyrospsarras/t3-runtime-v2@sha256:75f99b75a7fba4ccf7e2b3e3922d5bf9d0d51316b4db80511c564d44eaf76bb1
          imagePullPolicy: IfNotPresent
          command: ['true']
