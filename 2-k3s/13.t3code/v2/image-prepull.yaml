apiVersion: batch/v1
kind: Job
metadata:
  name: t3code-v2-image-prepull
  namespace: t3code
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '-2'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 1
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: k3s-worker-65
      containers:
        - name: pull
          image: ghcr.io/spyrospsarras/t3-runtime-v2@sha256:67a5f96f1b83835ec331dfaffed33d4dc43e6febd63f3ae81053dd9bbfe5af1a
          imagePullPolicy: IfNotPresent
          command: ['true']
