apiVersion: v1
kind: ServiceAccount
metadata:
  name: t3code-v2-rollout
  namespace: t3code
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: t3code-v2-rollout
  namespace: t3code
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
rules:
  - apiGroups: ['']
    resources: [pods]
    resourceNames: [t3code-v2-0]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods/exec]
    resourceNames: [t3code-v2-0]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: t3code-v2-rollout
  namespace: t3code
  annotations:
    argocd.argoproj.io/sync-wave: '-3'
subjects:
  - kind: ServiceAccount
    name: t3code-v2-rollout
    namespace: t3code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: t3code-v2-rollout
---
apiVersion: batch/v1
kind: Job
metadata:
  name: t3code-v2-rollout
  namespace: t3code
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      serviceAccountName: t3code-v2-rollout
      restartPolicy: Never
      containers:
        - name: gate
          image: ghcr.io/spyrospsarras/t3-runtime:inputs-de0baaa22ef10175ade9f0ed68a5c272
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              # A 404 allows initial creation only. Other API failures block.
              result=$(kubectl -n t3code get pod t3code-v2-0 --ignore-not-found -o name)
              [[ -n "$result" ]] || exit 0
              elapsed=0
              while (( elapsed < 900 )); do
                if kubectl -n t3code exec t3code-v2-0 -c t3-v2 -- python3 /v2/rollout-ready.py --home /home/spyros/.t3 --credential /home/spyros/.t3/monitor.json; then
                  elapsed=$((elapsed + 15))
                else
                  elapsed=0
                fi
                sleep 15
              done
              kubectl -n t3code exec t3code-v2-0 -c t3-v2 -- python3 /v2/rollout-ready.py --home /home/spyros/.t3 --credential /home/spyros/.t3/monitor.json
              kubectl -n t3code exec t3code-v2-0 -c t3-v2 -- python3 /v2/backup.py --home /home/spyros/.t3 --label "$(date -u +%Y%m%dT%H%M%SZ)"
              kubectl -n t3code exec t3code-v2-0 -c t3-v2 -- python3 /v2/rollout-ready.py --home /home/spyros/.t3 --credential /home/spyros/.t3/monitor.json
