apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: t3code

# The T3 Code server behind t3code.epaflix.com. It replaced the t3code LXC and
# the two remote-pi/t3env replicas (migration/README.md).
#
# Kustomize refuses to read above its root, so tools/ and most of files/ are
# byte copies of ../env inputs; tools/sync-shared.sh refreshes them and CI
# diffs them (files/hub_clients.py is a copy of 23.mcp-hub/tools/hub_clients.py).
# files/entrypoint.sh, files/sshd.sh, files/ssh-config.sh, files/opencode-refresh.mjs
# and files/opencode-fast-version.sh are this overlay's own.
resources:
  - namespace.yaml
  - storage.yaml
  - statefulset.yaml
  - service.yaml
  - image-prepull.yaml
  - idle-rollout.yaml

configMapGenerator:
  # Not in t3code-scripts: the job pipes t3-idle.py into the running pod, which
  # may predate it, and a new file there would itself wait for a rollout.
  - name: t3code-idle-rollout
    files:
      - files/idle-rollout.sh
      - files/t3-idle.py
  - name: t3code-tools
    files:
      - tools/package.json
      - tools/package-lock.json
  - name: t3code-scripts
    files:
      - files/entrypoint.sh
      - files/pi.sh
      - files/pi-setup.py
      - files/t3-pi-settings.py
      - files/cc-safety-net-install.py
      - files/cc-safety-net.patch
      - files/cc-safety-net-hashes.json
      - files/private-config.py
      - files/git-credential-github.sh
      - files/hub_clients.py
      - files/cliproxy-models.js
      - files/jev-auto.js
      - files/jev-guard.js
      - files/opencode-compat.js
      - files/opencode-v1-backup.py
      - files/opencode-plugin-check.mjs
      - files/opencode-refresh.mjs
      - files/ssh-policy.py
      - files/vault-ssh-agent.py
      - files/vault-run.py
      - files/homelab-ssh.conf
      - files/homelab-ssh.md
      - files/sshd-authorized-keys
      - files/sshd.sh
      - files/ssh-config.sh
      - files/jev-checks.md
      - files/opencode-fast-version.sh

generators:
  - ksops-generator.yaml

replacements:
  - source:
      kind: Secret
      name: t3code-private-config
      fieldPath: metadata.annotations.[t3code.epaflix.com/private-revision]
    targets:
      - select:
          kind: StatefulSet
          name: t3code
        fieldPaths:
          - spec.template.metadata.annotations.[t3code.epaflix.com/private-revision]
        options:
          create: true
  # MCP_HUB_TOKEN is env; a new pod token (23.mcp-hub/tools/add-client.py t3code) rolls T3.
  - source:
      kind: Secret
      name: mcp-hub-client
      fieldPath: metadata.annotations.[mcp-hub.epaflix.com/revision]
    targets:
      - select:
          kind: StatefulSet
          name: t3code
        fieldPaths:
          - spec.template.metadata.annotations.[mcp-hub.epaflix.com/token-revision]
        options:
          create: true
  - source:
      kind: StatefulSet
      name: t3code
      fieldPath: spec.template.spec.containers.[name=t3].image
    targets:
      - select:
          kind: Job
          name: t3code-image-prepull
        fieldPaths:
          - spec.template.spec.containers.[name=pull].image
      - select:
          kind: CronJob
          name: t3code-idle-rollout
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=rollout].image
  - source:
      kind: StatefulSet
      name: t3code
      fieldPath: spec.template.spec.containers.[name=t3].image
    targets:
      - select:
          kind: StatefulSet
          name: t3code
        fieldPaths:
          - spec.template.spec.initContainers.[name=runtime-state].image
          - spec.template.spec.containers.[name=sshd].image
  - source:
      kind: StatefulSet
      name: t3code
      fieldPath: spec.template.spec.affinity
    targets:
      - select:
          kind: Job
          name: t3code-image-prepull
        fieldPaths:
          - spec.template.spec.affinity
      - select:
          kind: CronJob
          name: t3code-idle-rollout
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.affinity
