apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: t3code

# One merged T3 Code server. Replaces the LXC host (t3code.epaflix.com) and the
# two remote-pi/t3env replicas after migration/cutover.sh runs.
#
# Kustomize refuses to read above its root, so tools/ and most of files/ are
# byte copies of ../env inputs; tools/sync-shared.sh refreshes them and CI
# diffs them. files/entrypoint.sh and files/searxng-mcp.py are this overlay's
# own: the live t3env pods keep the untouched env/ entrypoint until sunset.
resources:
  - namespace.yaml
  - storage.yaml
  - statefulset.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: t3code-tools
    files:
      - tools/package.json
      - tools/package-lock.json
  - name: t3code-scripts
    files:
      - files/entrypoint.sh
      - files/private-config.py
      - files/git-credential-github.sh
      - files/keepass-remote.sh
      - files/cliproxy-models.js
      - files/searxng-mcp.py

generators:
  - ksops-generator.yaml

replacements:
  - source:
      kind: Secret
      name: t3code-private-config
      fieldPath: metadata.annotations.[t3code.epaflix.com/private-revision]
    targets:
      - select:
          kind: StatefulSet
          name: t3code
        fieldPaths:
          - spec.template.metadata.annotations.[t3code.epaflix.com/private-revision]
        options:
          create: true
