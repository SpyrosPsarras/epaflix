---
apiVersion: batch/v1
kind: Job
metadata:
  name: t3code-image-prepull
  namespace: t3code
  labels:
    app.kubernetes.io/name: t3code
    app.kubernetes.io/component: image-prepull
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t3code
        app.kubernetes.io/component: image-prepull
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity: {}
      containers:
        - name: pull
          image: t3-runtime-from-statefulset
          imagePullPolicy: IfNotPresent
          command:
            - "true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
