---
# The one T3 server. It replaced the t3code LXC and the two remote-pi/t3env
# replicas, and runs as the old LXC identity (/home/spyros) so merged state, skills
# and secrets keep their paths. The env homes are mounted read-write so their
# provider instances can append to their own Codex/Claude/OpenCode stores.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: t3code
  namespace: t3code
  labels:
    app.kubernetes.io/name: t3code
    app.kubernetes.io/component: server
spec:
  serviceName: t3code
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: t3code
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t3code
        app.kubernetes.io/component: server
    spec:
      # Token only for the vault bridge (keepass-remote.sh); the Role in
      # 15.syncthing/keepass.yaml is all it grants.
      serviceAccountName: t3code
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  # Most free local-path disk on 2026-09-21. local-path pins the
                  # PVCs to this node after first bind; moving them is a copy.
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s-worker-65
      containers:
        - name: t3
          image: ghcr.io/spyrospsarras/t3-runtime:inputs-587c23aff48a8ba1631f186f111aaf0b
          imagePullPolicy: Always
          command:
            - bash
            - /scripts/entrypoint.sh
          env:
            - name: HOME
              value: /home/spyros
            - name: JEV_OPENROUTER_KEY_FILE
              value: /run/jev/openrouter-key
            - name: T3CODE_HOME
              value: /home/spyros/.t3
            - name: T3_PROJECT_DIR
              value: /home/spyros/epaflix
            - name: ANTHROPIC_BASE_URL
              value: http://cliproxy.remote-pi.svc.cluster.local:8317
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cliproxy-secrets
                  key: omp-api-key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cliproxy-secrets
                  key: github-token
            - name: GH_TOKEN
              value: $(GITHUB_TOKEN)
          ports:
            - name: http
              containerPort: 3773
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: jev-key
              mountPath: /run/jev
              readOnly: true
            - name: home-spyros
              mountPath: /home/spyros
            - name: home-t3env-0
              mountPath: /home/t3env-0
            - name: home-t3env-1
              mountPath: /home/t3env-1
            - name: private-config
              mountPath: /private-agent-config
              readOnly: true
            - name: github-ssh
              mountPath: /run/t3-github-ssh
              readOnly: true
            - name: lock
              mountPath: /runtime-pins
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              memory: "12Gi"
      volumes:
        - name: jev-key
          secret:
            secretName: t3code-jev
            defaultMode: 0440
        - name: home-spyros
          persistentVolumeClaim:
            claimName: home-spyros
        - name: home-t3env-0
          persistentVolumeClaim:
            claimName: home-t3env-0
        - name: home-t3env-1
          persistentVolumeClaim:
            claimName: home-t3env-1
        - name: private-config
          secret:
            secretName: t3code-private-config
            defaultMode: 0440
        - name: github-ssh
          secret:
            secretName: t3code-github-ssh
            defaultMode: 0440
        - name: lock
          configMap:
            name: t3code-tools
        - name: scripts
          configMap:
            name: t3code-scripts
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: t3code
  namespace: t3code
automountServiceAccountToken: false
