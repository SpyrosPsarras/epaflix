---
# The one T3 server. It replaced the t3code LXC and the two remote-pi/t3env
# replicas, and runs as the old LXC identity (/home/spyros) so merged state, skills
# and secrets keep their paths.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: t3code
  namespace: t3code
  labels:
    app.kubernetes.io/name: t3code
    app.kubernetes.io/component: server
spec:
  serviceName: t3code
  replicas: 1
  # A new revision waits for 30 idle minutes; see idle-rollout.yaml.
  updateStrategy:
    type: OnDelete
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: t3code
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t3code
        app.kubernetes.io/component: server
      # Live value from a `kubectl rollout restart`. Dropping it makes a new
      # revision that idle-rollout rolls. Restart with `kubectl delete pod`.
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-09-29T19:54:28+02:00"
    spec:
      serviceAccountName: manager-agent
      automountServiceAccountToken: false
      enableServiceLinks: false
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  # Most free local-path disk on 2026-09-21. local-path pins the
                  # PVCs to this node after first bind; moving them is a copy.
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s-worker-65
      # A subPath mount of a missing path becomes a directory; the runtime
      # state mount below needs a file.
      initContainers:
        - name: runtime-state
          image: t3-runtime-from-t3-container
          command: [touch, /runtime-state/server-runtime.json]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtime-state
              mountPath: /runtime-state
      containers:
        - name: t3
          image: ghcr.io/spyrospsarras/t3-runtime:inputs-3e30f2714378e47792575e5f056cbdba
          imagePullPolicy: Always
          command:
            - bash
            - /scripts/entrypoint.sh
          env:
            - name: HOME
              value: /home/spyros
            - name: T3CODE_HOME
              value: /home/spyros/.t3
            - name: T3_PROJECT_DIR
              value: /home/spyros/epaflix
            - name: ANTHROPIC_BASE_URL
              value: http://cliproxy.remote-pi.svc.cluster.local:8317
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cliproxy-secrets
                  key: omp-api-key
            - name: KUBECONFIG
              value: /run/t3-manager/kubeconfig
          ports:
            - name: http
              containerPort: 3773
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: machine-info
              mountPath: /etc/machine-info
              subPath: machine-info
              readOnly: true
            - name: home-spyros
              mountPath: /home/spyros
            # Only the entrypoint writes it; see files/entrypoint.sh.
            - name: runtime-state
              mountPath: /home/spyros/.t3/userdata/server-runtime.json
              subPath: server-runtime.json
            - name: private-config
              mountPath: /private-agent-config
              readOnly: true
            - name: manager-kubeconfig
              mountPath: /run/t3-manager
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # Allow the reviewed safety-net build to finish before T3 listens.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 1080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1536Mi"
            limits:
              memory: "12Gi"
        # `ssh t3code` and the T3 app's tunnel. Its own container, so a failed
        # probe restarts sshd and leaves T3 and its sessions running. sshd
        # runs only while T3 does (files/sshd.sh).
        - name: sshd
          image: t3-runtime-from-t3-container
          # The tag is content-addressed; a liveness restart must not wait on ghcr.
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - /scripts/sshd.sh
          env:
            - name: HOME
              value: /home/spyros
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: home-spyros
              mountPath: /home/spyros
            - name: runtime-state
              mountPath: /home/spyros/.t3/userdata/server-runtime.json
              subPath: server-runtime.json
              readOnly: true
            - name: manager-kubeconfig
              mountPath: /run/t3-manager
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # No startup or readiness probe: a not-ready container would take T3
          # out of its Services too. The check passes while sshd waits for T3.
          livenessProbe:
            exec:
              command: [bash, /scripts/sshd.sh, check]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            # `ssh t3code` sessions run here.
            limits:
              memory: 8Gi
      volumes:
        - name: machine-info
          configMap:
            name: t3code-machine-info
        - name: home-spyros
          persistentVolumeClaim:
            claimName: home-spyros
        - name: private-config
          secret:
            secretName: t3code-private-config
            defaultMode: 0440
        - name: manager-kubeconfig
          secret:
            secretName: manager-kubeconfig
            defaultMode: 0440
            items:
              - key: kubeconfig
                path: kubeconfig
        - name: scripts
          configMap:
            name: t3code-scripts
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
        - name: runtime-state
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
