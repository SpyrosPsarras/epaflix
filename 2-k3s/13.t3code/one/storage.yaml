---
# Active server home, retaining the original /home/spyros paths.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-spyros
  namespace: t3code
  labels:
    app.kubernetes.io/name: t3code
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 40Gi
