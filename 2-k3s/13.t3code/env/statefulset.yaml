---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: t3env
  namespace: remote-pi
  labels:
    app.kubernetes.io/name: t3env
    app.kubernetes.io/component: server
spec:
  serviceName: t3env
  replicas: 2
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: t3env
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t3env
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  # These workers are pinned to different physical Proxmox hosts
                  # by 1-proxmox/t3env/pin-vm-host.sh. No fallback worker.
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s-worker-62
                      - k3s-worker-65
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: t3env
      containers:
        - name: t3
          # Derived from public build inputs by env/tools/runtime-tag.sh.
          image: ghcr.io/spyrospsarras/t3-runtime:inputs-ba0207823ea374aceb2c40db60e3d162
          imagePullPolicy: Always
          command:
            - bash
            - /scripts/entrypoint.sh
          env:
            - name: HOME
              value: /home/t3
            - name: T3CODE_HOME
              value: /home/t3/.t3
            - name: ANTHROPIC_BASE_URL
              value: http://cliproxy.remote-pi.svc.cluster.local:8317
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cliproxy-secrets
                  key: omp-api-key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cliproxy-secrets
                  key: github-token
            - name: GH_TOKEN
              value: $(GITHUB_TOKEN)
          ports:
            - name: http
              containerPort: 3773
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: home
              mountPath: /home/t3
            - name: private-config
              mountPath: /private-agent-config
              readOnly: true
            - name: vault-access
              mountPath: /run/t3-credentials
              readOnly: true
            - name: lock
              mountPath: /runtime-pins
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              memory: "6Gi"
      volumes:
        - name: vault-access
          secret:
            secretName: t3env-vault-access
            defaultMode: 0440
        - name: private-config
          secret:
            secretName: t3env-private-config
            defaultMode: 0440
        - name: lock
          configMap:
            name: t3env-tools
        - name: scripts
          configMap:
            name: t3env-scripts
            # Git executes credential.helper directly.
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: home
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
