---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: t3env
  namespace: remote-pi
  labels:
    app.kubernetes.io/name: t3env
    app.kubernetes.io/component: server
spec:
  serviceName: t3env
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: t3env
  template:
    metadata:
      labels:
        app.kubernetes.io/name: t3env
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  # These workers are pinned to different physical Proxmox hosts
                  # by 1-proxmox/t3env/pin-vm-host.sh. No fallback worker.
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s-worker-62
                      - k3s-worker-65
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: t3env
      initContainers:
        # No published T3 image exists, so the pinned CLIs are installed into an
        # emptyDir at every pod start from a committed lockfile (`npm ci`), so
        # the tree is identical across restarts and across both pods. Cost:
        # ~1-2 min per restart. Upgrade path: build an image from the same lock
        # once restarts become frequent enough to matter.
        - name: install-tools
          image: docker.io/library/node:24-bookworm@sha256:6dac556d980b7f0e5498d08f08cee0ca67798b4ad6c23964a9214920e67758d0
          command:
            - bash
            - -euo
            - pipefail
            - -c
            - |
              cp /lock/package.json /lock/package-lock.json /tools/
              cd /tools
              # Install scripts stay on: claude-code, opencode-ai and node-pty
              # (a t3 dependency) need their postinstall to place binaries.
              npm ci --no-fund --no-audit
              ./node_modules/.bin/t3 --version
          env:
            - name: HOME
              value: /tmp
            - name: npm_config_cache
              value: /tmp/npm-cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: lock
              mountPath: /lock
              readOnly: true
            - name: tools
              mountPath: /tools
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
      containers:
        - name: t3
          image: docker.io/library/node:24-bookworm@sha256:6dac556d980b7f0e5498d08f08cee0ca67798b4ad6c23964a9214920e67758d0
          command:
            - bash
            - /scripts/entrypoint.sh
          env:
            - name: HOME
              value: /home/t3
            - name: T3CODE_HOME
              value: /home/t3/.t3
            - name: ANTHROPIC_BASE_URL
              value: http://cliproxy.remote-pi.svc.cluster.local:8317
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cliproxy-secrets
                  key: omp-api-key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cliproxy-secrets
                  key: github-token
            - name: GH_TOKEN
              value: $(GITHUB_TOKEN)
          ports:
            - name: http
              containerPort: 3773
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: home
              mountPath: /home/t3
            - name: tools
              mountPath: /tools
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              memory: "6Gi"
      volumes:
        - name: lock
          configMap:
            name: t3env-tools
        - name: scripts
          configMap:
            name: t3env-scripts
            # Git executes credential.helper directly.
            defaultMode: 0555
        - name: tools
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: home
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
