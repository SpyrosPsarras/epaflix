# Kernel mode: only tailnet addresses use tailscale0, so T3 links to tailnet peers without a proxy.
# Serve forwards tailnet TCP 3773 to T3 on loopback, so owner devices reach T3 without T3 binding a pod address.
# No probes and a ten-year boot timeout: a not-yet-enrolled sidecar must not restart or hold the pod NotReady.
- op: add
  path: /spec/template/spec/containers/-
  value:
    name: tailscale
    image: tailscale/tailscale:v1.102.3
    env:
    - name: TS_HOSTNAME
      valueFrom:
        fieldRef: {fieldPath: metadata.namespace}
    - {name: TS_USERSPACE, value: 'false'}
    - {name: TS_STATE_DIR, value: /var/lib/tailscale}
    - {name: TS_KUBE_SECRET, value: ''}
    - {name: TS_AUTH_ONCE, value: 'true'}
    - {name: TS_BOOT_TIMEOUT, value: 87600h}
    - {name: TS_ACCEPT_DNS, value: 'false'}
    - {name: TS_EXTRA_ARGS, value: '--advertise-tags=tag:t3code --accept-routes=false --netfilter-mode=off'}
    - {name: TS_DISABLE_PORTMAPPER, value: 'true'}
    - {name: TS_SERVE_CONFIG, value: /etc/tailscale-serve/serve.json}
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
        add: [NET_ADMIN]
    volumeMounts:
    - {name: tailscale-state, mountPath: /var/lib/tailscale}
    - {name: tun, mountPath: /dev/net/tun}
    - {name: tailscale-serve, mountPath: /etc/tailscale-serve, readOnly: true}
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 256Mi}
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: tailscale-state
    persistentVolumeClaim: {claimName: t3code-tailscale}
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: tun
    hostPath: {path: /dev/net/tun, type: CharDevice}
# T3 links over plain http only to *.ts.net names; MagicDNS is off, so pin the laptop's name.
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: tailscale-serve
    configMap: {name: t3code-tailscale-serve}
- op: add
  path: /spec/template/spec/hostAliases
  value:
  - ip: 100.119.235.123
    hostnames: [spylinux.tailea078a.ts.net]
