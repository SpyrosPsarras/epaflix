---
# Single-label hostnames so the existing *.epaflix.com wildcard covers them.
# Pihole: t3env0.epaflix.com and t3env1.epaflix.com -> 192.168.10.102 (Traefik
# internal LB), same as t3code.epaflix.com.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: t3env-https
  namespace: remote-pi
  labels:
    app.kubernetes.io/name: t3env
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - internal
  routes:
    - match: Host(`t3env0.epaflix.com`)
      kind: Rule
      services:
        - name: t3env-0
          port: 3773
    - match: Host(`t3env1.epaflix.com`)
      kind: Rule
      services:
        - name: t3env-1
          port: 3773
  tls:
    certResolver: cloudflare
    domains:
      - main: epaflix.com
        sans:
          - "*.epaflix.com"
