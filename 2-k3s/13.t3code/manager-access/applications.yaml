apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-applications
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["t3code-homelab", "t3code-work", "mcp-hub-homelab", "mcp-hub-work"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manager-applications
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manager-applications
subjects:
  - kind: ServiceAccount
    name: manager-agent
    namespace: t3code
