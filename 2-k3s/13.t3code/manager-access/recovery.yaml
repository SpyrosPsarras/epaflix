apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manager-recovery
  namespace: t3code-homelab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manager-recovery
  namespace: t3code-homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manager-recovery
subjects:
  - kind: ServiceAccount
    name: manager-agent
    namespace: t3code
---
