apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: t3-build

# Builds and one-shot containers for the homelab and work T3 pods. See README.md.
resources:
  - namespace.yaml
  - rbac.yaml
  - network-policy.yaml
  - limits.yaml

configMapGenerator:
  # Read by /scripts/t3-build in the pods; not a live Job. No hash suffix: nothing mounts it.
  - name: kaniko-job
    files:
      - files/kaniko-job.yaml
    options:
      disableNameSuffixHash: true
