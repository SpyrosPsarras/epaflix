apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# One builder namespace per T3 pod; the homelab/ and work/ overlays set the name. See ../README.md.
resources:
  - namespace.yaml
  - rbac.yaml
  - network-policy.yaml
  - limits.yaml

configMapGenerator:
  # Read by /scripts/t3-build in the pods; not a live Job. No hash suffix: nothing mounts it.
  - name: kaniko-job
    files:
      - files/kaniko-job.yaml
    options:
      disableNameSuffixHash: true
