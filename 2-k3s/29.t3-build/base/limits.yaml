apiVersion: v1
kind: ResourceQuota
metadata:
  name: builder
spec:
  hard:
    pods: "10"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    limits.ephemeral-storage: 40Gi
---
# Defaults for pods that set nothing (t3-run), so the quota above can count them.
apiVersion: v1
kind: LimitRange
metadata:
  name: builder
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 1Gi
      default:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 4Gi
      max:
        cpu: "2"
        memory: 4Gi
        ephemeral-storage: 20Gi
