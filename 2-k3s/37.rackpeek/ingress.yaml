---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rackpeek-https
  namespace: rackpeek
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`rackpeek.epaflix.com`)
      kind: Rule
      priority: 10
      middlewares:
        - name: security-headers
          namespace: traefik-system
        - name: authentik-forwardauth
          namespace: traefik-system
      services:
        - name: rackpeek
          port: 8080
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rackpeek-outpost-https
  namespace: rackpeek
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`rackpeek.epaflix.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      kind: Rule
      priority: 15
      services:
        - name: authentik-server
          namespace: app-authentik
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rackpeek-http
  namespace: rackpeek
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`rackpeek.epaflix.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik-system
      services:
        - name: rackpeek
          port: 8080
