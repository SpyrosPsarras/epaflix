apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bread

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: bread-html
    files:
      - index.html

images:
  - name: nginxinc/nginx-unprivileged
    newTag: 1.31.5-alpine
