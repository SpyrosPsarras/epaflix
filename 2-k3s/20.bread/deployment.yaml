---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bread
  namespace: bread
  labels:
    app: bread
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bread
  template:
    metadata:
      labels:
        app: bread
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.5-alpine   # tag tracked via kustomization.yaml images override (Renovate)
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
      volumes:
        - name: html
          configMap:
            name: bread-html
