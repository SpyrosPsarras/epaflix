apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No top-level namespace: the DatabaseRole, Database and role Secret must land in postgres-system.
resources:
  - namespace.yaml
  - storage.yaml
  - database.yaml
  - ingressroute.yaml
  - network-policy.yaml

generators:
  - ksops-generator.yaml

helmCharts:
  - name: immich
    repo: oci://ghcr.io/immich-app/immich-charts
    version: "0.13.4"
    releaseName: immich
    namespace: immich
    valuesFile: values.yaml
