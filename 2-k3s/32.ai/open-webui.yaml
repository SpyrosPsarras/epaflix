apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ai
  labels:
    app: open-webui
  annotations:
    secret.reloader.stakater.com/reload: "open-webui-env,open-webui-redis-env"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      securityContext:
        supplementalGroups: [568]
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.12.5-ollama
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: open-webui-env
          env:
            - {name: CORS_ALLOW_ORIGIN, value: "*"}
            - {name: ENV, value: dev}
            - {name: GID, value: "568"}
            - {name: GROUP_ID, value: "568"}
            - {name: HOST, value: "0.0.0.0"}
            - {name: NVIDIA_VISIBLE_DEVICES, value: void}
            - {name: PGID, value: "568"}
            - {name: PORT, value: "31028"}
            - {name: PUID, value: "568"}
            - {name: TZ, value: Europe/Oslo}
            - {name: UID, value: "568"}
            - {name: UMASK, value: "002"}
            - {name: UMASK_SET, value: "002"}
            - {name: USER_ID, value: "568"}
            - {name: USE_OLLAMA_DOCKER, value: "false"}
            - {name: OLLAMA_BASE_URL, value: "http://ollama.ai.svc.cluster.local:30068"}
            - {name: OLLAMA_BASE_URLS, value: "http://ollama.ai.svc.cluster.local:30068"}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: open-webui-redis-env
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@127.0.0.1:6379/0"
          ports:
            - name: http
              containerPort: 31028
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: models
              mountPath: /root/.ollama
        - name: redis
          image: ghcr.io/valkey-io/valkey:9.1.3
          args: ["--port", "6379", "--requirepass", "$(REDIS_PASSWORD)"]
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: open-webui-redis-env
          env:
            - {name: GID, value: "568"}
            - {name: GROUP_ID, value: "568"}
            - {name: NVIDIA_VISIBLE_DEVICES, value: void}
            - {name: PGID, value: "568"}
            - {name: PUID, value: "568"}
            - {name: TZ, value: Europe/Oslo}
            - {name: UID, value: "568"}
            - {name: UMASK, value: "002"}
            - {name: UMASK_SET, value: "002"}
            - {name: USER_ID, value: "568"}
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "2"
              memory: 512Mi
          readinessProbe:
            exec:
              command: [redis-cli, -h, "127.0.0.1", -p, "6379", ping]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: [redis-cli, -h, "127.0.0.1", -p, "6379", ping]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: models
          persistentVolumeClaim:
            claimName: ollama-data
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ai
  labels:
    app: open-webui
spec:
  type: ClusterIP
  selector:
    app: open-webui
  ports:
    - name: http
      port: 31028
      targetPort: http
