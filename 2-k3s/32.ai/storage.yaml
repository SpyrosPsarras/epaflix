---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ollama-data-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gpu-local
  claimRef:
    namespace: ai
    name: ollama-data
  local:
    path: /srv/ollama
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-worker-64
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gpu-local
  volumeName: ollama-data-pv
  resources:
    requests:
      storage: 100Gi
---
