apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: open-webui-internal
  namespace: ai
spec:
  entryPoints:
    - internal
  routes:
    - match: Host(`open-webui.epaflix.com`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: traefik-system
      services:
        - name: open-webui
          port: 31028
  tls: {}
