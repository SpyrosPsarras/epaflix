---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: renovate
  namespace: renovate
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: renovate
  labels:
    app.kubernetes.io/name: renovate
spec:
  # Every 6h, not hourly: each run writes ~3 GB into the emptyDirs below, 73 GB/day on
  # worker-65's root disk, which PBS then re-uploaded every night (#1075 follow-up).
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          serviceAccountName: renovate
          # Never, so a failed pod (and its logs) survives next to the Job; OnFailure let the job controller delete it.
          restartPolicy: Never
          containers:
            - name: renovate
              image: ghcr.io/renovatebot/renovate
              imagePullPolicy: IfNotPresent
              args:
                - "SpyrosPsarras/epaflix"
              env:
                - name: RENOVATE_ALLOWED_COMMANDS
                  value: '["^bash 2-k3s/13\\.t3code/env/tools/sync-runtime-image\\.sh$", "^bash 2-k3s/13\\.t3code/one/tools/sync-shared\\.sh$"]'
                - name: RENOVATE_PLATFORM
                  value: github
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-secrets
                      key: RENOVATE_TOKEN
                - name: RENOVATE_GIT_AUTHOR
                  value: "Renovate Bot <renovate@epaflix.com>"
                - name: RENOVATE_ONBOARDING
                  value: "false"
                - name: RENOVATE_REQUIRE_CONFIG
                  value: "required"
                - name: LOG_LEVEL
                  value: info
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  # 1Gi OOMKilled 3 runs in a row on 2026-09-23; a 2Gi run peaked at 1146Mi.
                  memory: 2Gi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: cache
                  mountPath: /opt/renovate/cache
          volumes:
            - name: tmp
              emptyDir: {}
            - name: cache
              emptyDir: {}
