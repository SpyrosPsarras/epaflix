---
# Renovate runtime secret — applied imperatively from secrets.yml.
# Picked up by the renovate CronJob via env. Kept OUT of git for the same
# reason the argocd:git-creds Secret is — fine-grained PAT with write
# scope on this repo.
#
# Deliberately NOT a SOPS *.enc.yaml, and deliberately not in this overlay's
# kustomization resources. Everything else the cluster needs is encrypted in
# git, but this one credential can write to THIS repo - committing it here,
# even encrypted, hands repo-write to anyone who can read the age key. Keep
# it imperative. Do not "fix" this by converting it to ksops.
#
# Apply (substitute the placeholder with gh_PAT_renovate-k3s from
# .github/instructions/secrets.yml first):
#   kubectl apply -f secret-app.yaml
#
# Rotation is just a re-apply. The CronJob resolves this secretKeyRef fresh
# when each scheduled Pod is created, so no restart is needed - the #299
# stale-env problem only bites long-lived Deployments.
#
# PAT permissions needed (GitHub fine-grained PAT, repo SpyrosPsarras/epaflix):
#   - Contents: read+write       (branch + commit + push)
#   - Pull requests: read+write  (open and update the PR)
#   - Workflows: read+write      (REQUIRED - see below)
#   - Metadata: read             (mandatory, granted automatically)
#
# Workflows: read+write is NOT optional, whatever this comment claimed
# before. The built-in github-actions manager and the HELM_VERSION /
# KUSTOMIZE_VERSION customManagers all build branches that touch
# .github/workflows/ci.yml. GitHub rejects any push touching that path from
# a token without it, and Renovate gives up with:
#   Workflows update rejection - aborting branch
# 44 of those were logged before the cause was found. A token missing this
# looks healthy - the run goes green and simply never opens the PR (#486).
apiVersion: v1
kind: Secret
metadata:
  name: renovate-secrets
  namespace: renovate
type: Opaque
stringData:
  RENOVATE_TOKEN: "<gh_PAT_renovate-k3s>"
