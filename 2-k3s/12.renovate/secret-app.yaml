---
# Renovate runtime secret — applied imperatively from secrets.yml.
# Picked up by the renovate CronJob via env. Kept OUT of git for the same
# reason the argocd:git-creds Secret is — fine-grained PAT with write
# scope on this repo.
#
# Apply (substitute placeholder from .github/instructions/secrets.yml first):
#   kubectl apply -f secret-app.yaml
#
# PAT scopes needed (GitHub fine-grained PAT, single-repo SpyrosPsarras/epaflix):
#   - Contents: read+write  (branch + commit + push)
#   - Pull requests: read+write
#   - Metadata: read
#   - (optional) Workflows: read+write — only if Renovate needs to bump
#     versions inside .github/workflows/*.yml; not needed for this repo today
apiVersion: v1
kind: Secret
metadata:
  name: renovate-secrets
  namespace: renovate
type: Opaque
stringData:
  RENOVATE_TOKEN: "<RENOVATE_GITHUB_PAT>"
