apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp-hub

# Streamable-HTTP MCP hub behind mcp.epaflix.com (internal) and
# mcp-hub.mcp-hub.svc:8000 (in-cluster). README.md covers the Gmail OAuth
# bootstrap and how clients are wired.
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: mcp-hub-app
    files:
      - files/mcp_hub.py
      - files/gmail_mcp.py

generators:
  - ksops-generator.yaml

# The Secrets feed env vars read at start, and no Reloader watches this
# namespace. Each Secret carries a plaintext revision annotation (sops only
# encrypts stringData) that is copied into the pod template, so a new token
# or refresh token rolls the pod. Writers bump it: tools/bootstrap-gmail.py,
# and the Rotation snippet in README.md.
replacements:
  - source:
      kind: Secret
      name: mcp-hub-gmail
      fieldPath: metadata.annotations.[mcp-hub.epaflix.com/revision]
    targets:
      - select:
          kind: Deployment
          name: mcp-hub
        fieldPaths:
          - spec.template.metadata.annotations.[mcp-hub.epaflix.com/gmail-revision]
        options:
          create: true
  - source:
      kind: Secret
      name: mcp-hub-token
      fieldPath: metadata.annotations.[mcp-hub.epaflix.com/revision]
    targets:
      - select:
          kind: Deployment
          name: mcp-hub
        fieldPaths:
          - spec.template.metadata.annotations.[mcp-hub.epaflix.com/token-revision]
        options:
          create: true
