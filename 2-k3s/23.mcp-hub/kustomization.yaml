apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp-hub

# The MCP hub behind mcp.epaflix.com (internal) and mcp-hub.mcp-hub.svc:8000
# (in-cluster). README.md covers vocabulary, clients, secrets and bootstraps.
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - kubernetes-mcp.yaml
  - jev-mcp.yaml
  - vaultwarden-mcp.yaml

configMapGenerator:
  - name: mcp-hub-app
    files:
      - files/mcp_hub.py
      - files/gmail_mcp.py
      - files/searxng_mcp.py
      - files/upstream.py
      - files/notion_grant.py
      # Client name -> SHA-256 of its hub token (tools/add-client.py). The
      # generated name hash rolls the hub when a client is added or revoked.
      - files/clients.json
  - name: kubernetes-mcp-config
    files:
      - config.toml=files/kubernetes-mcp.toml
  # The generated name hash rolls jev-mcp when the pinned version changes.
  - name: jev-mcp-app
    files:
      - files/jev-mcp/package.json
      - files/jev-mcp/package-lock.json
  # Name hashes roll vaultwarden-mcp when the server or the bw pin changes.
  - name: vaultwarden-mcp-app
    files:
      - files/vaultwarden_mcp.py
  - name: vaultwarden-mcp-bw
    files:
      - files/vaultwarden-mcp/package.json
      - files/vaultwarden-mcp/package-lock.json

generators:
  - ksops-generator.yaml

# The Secrets feed env vars read at start, and no Reloader watches this
# namespace. Each Secret carries a plaintext revision annotation (sops only
# encrypts stringData) that is copied into the pod template, so a new
# secret rolls the pod. Writers bump it: tools/bootstrap-gmail.py and
# tools/sops_secret.py.
replacements:
  - source:
      kind: Secret
      name: mcp-hub-gmail
      fieldPath: metadata.annotations.[mcp-hub.epaflix.com/revision]
    targets:
      - select:
          kind: Deployment
          name: mcp-hub
        fieldPaths:
          - spec.template.metadata.annotations.[mcp-hub.epaflix.com/gmail-revision]
        options:
          create: true
  - source:
      kind: Secret
      name: mcp-hub-jev
      fieldPath: metadata.annotations.[mcp-hub.epaflix.com/revision]
    targets:
      - select:
          kind: Deployment
          name: mcp-hub
        fieldPaths:
          - spec.template.metadata.annotations.[mcp-hub.epaflix.com/jev-revision]
        options:
          create: true
      - select:
          kind: Deployment
          name: jev-mcp
        fieldPaths:
          - spec.template.metadata.annotations.[mcp-hub.epaflix.com/jev-revision]
        options:
          create: true
  - source:
      kind: Secret
      name: mcp-hub-keepass
      fieldPath: metadata.annotations.[mcp-hub.epaflix.com/revision]
    targets:
      - select:
          kind: Deployment
          name: mcp-hub
        fieldPaths:
          - spec.template.metadata.annotations.[mcp-hub.epaflix.com/keepass-revision]
        options:
          create: true
  - source:
      kind: Secret
      name: mcp-hub-vaultwarden
      fieldPath: metadata.annotations.[mcp-hub.epaflix.com/revision]
    targets:
      - select:
          kind: Deployment
          name: mcp-hub
        fieldPaths:
          - spec.template.metadata.annotations.[mcp-hub.epaflix.com/vaultwarden-revision]
        options:
          create: true
      - select:
          kind: Deployment
          name: vaultwarden-mcp
        fieldPaths:
          - spec.template.metadata.annotations.[mcp-hub.epaflix.com/vaultwarden-revision]
        options:
          create: true
