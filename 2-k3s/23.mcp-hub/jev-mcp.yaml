---
# Upstream for the hub's /jev path (client name jev): the published
# @jkudish/jev-mcp server (https://github.com/jkudish/jev-mcp) in stateless
# HTTP mode, pinned by files/jev-mcp/package-lock.json. It calls Jev through
# OpenRouter with the key in Secret mcp-hub-jev. The hub holds the same
# Secret's auth-token and sends it as the upstream bearer; the NetworkPolicy
# also keeps every pod but the hub off the MCP port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jev-mcp
  namespace: mcp-hub
  labels:
    app: jev-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jev-mcp
  template:
    metadata:
      labels:
        app: jev-mcp
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: docker.io/library/node:22-alpine
          # ponytail: npm ci from the pinned lockfile on every start (~10s), like
          # the hub's pip install. Bake an image if restarts get frequent.
          command:
            - sh
            - -c
            - >-
              cp /app/package.json /app/package-lock.json /opt/jev/ &&
              cd /opt/jev &&
              npm ci --omit=dev --no-audit --no-fund --loglevel=error &&
              exec node node_modules/@jkudish/jev-mcp/dist/index.js --http
          # Names from the package README "Configuration" and "Remote / HTTP".
          env:
            - name: HOME
              value: /tmp
            - name: npm_config_cache
              value: /tmp/.npm
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8080"
            - name: JEV_PROVIDER
              value: openrouter
            - name: JEV_MCP_MODEL
              value: typesafe/jev-1.13
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-hub-jev
                  key: openrouter-key
            - name: JEV_MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-hub-jev
                  key: auth-token
          ports:
            - containerPort: 8080
              name: mcp
          # exec, not httpGet: the NetworkPolicy admits only hub pods.
          readinessProbe:
            exec:
              command: [wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: jev
              mountPath: /opt/jev
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            name: jev-mcp-app
        - name: jev
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jev-mcp
  namespace: mcp-hub
  labels:
    app: jev-mcp
spec:
  type: ClusterIP
  selector:
    app: jev-mcp
  ports:
    - name: mcp
      port: 8080
      targetPort: mcp
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jev-mcp-from-hub
  namespace: mcp-hub
spec:
  podSelector:
    matchLabels:
      app: jev-mcp
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mcp-hub
      ports:
        - port: 8080
          protocol: TCP
