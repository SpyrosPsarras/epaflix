apiVersion: batch/v1
kind: Job
metadata:
  name: vault-reader-canary
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 6600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: vault-reader-canary
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: canary
          image: ghcr.io/spyrospsarras/t3-runtime:homelab-inputs-9d4b693e43202df827d9174567fab10d
          imagePullPolicy: IfNotPresent
          command: [python3, /canary/canary.py]
          env:
            - name: HOME
              value: /home/canary
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /canary
              readOnly: true
            - name: inputs
              mountPath: /run/vault-canary-client
              readOnly: true
            - name: home
              mountPath: /home/canary
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: vault-reader-canary
        - name: inputs
          secret:
            secretName: vault-canary-client
            defaultMode: 0440
            items:
              - key: token
                path: token
              - key: services.json
                path: services.json
              - key: canary.json
                path: canary.json
        - name: home
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
