apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-reader
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vault-reader
  template:
    metadata:
      annotations:
        vault-reader.epaflix.com/inputs-revision: "unprovisioned"
      labels:
        app: vault-reader
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reader
          image: ghcr.io/spyrospsarras/vault-reader:inputs-c502b763a5485774679c1b81b577f667
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: inputs
              mountPath: /run/vault-reader-inputs
              readOnly: true
            - name: state
              mountPath: /run/vault-reader
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: inputs
          secret:
            secretName: vault-reader-inputs
            defaultMode: 0440
            items:
              - key: config.json
                path: config.json
              - key: client-id
                path: client-id
              - key: client-secret
                path: client-secret
              - key: password
                path: password
              - key: metadata-token
                path: metadata-token
              - key: broker-token
                path: broker-token
        - name: state
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
