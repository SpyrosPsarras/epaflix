apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-reader
spec:
  podSelector:
    matchLabels:
      app: vault-reader
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-hub-homelab
          podSelector:
            matchLabels:
              app: mcp-hub
      ports:
        - protocol: TCP
          port: 8000
