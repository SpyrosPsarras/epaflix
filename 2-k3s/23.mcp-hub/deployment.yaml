---
# The MCP hub (README.md): one long-lived streamable-HTTP gateway for every
# agent client (the T3 pod in-cluster, LAN PCs over the internal entry point).
# Paths are listed in files/mcp_hub.py: modules in-process, upstreams
# forwarded (keepass in ns syncthing, kubernetes-mcp.yaml, hosted Notion).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-hub
  namespace: mcp-hub
---
# The Notion grant rotates on every refresh; the hub writes each new pair back
# (files/notion_grant.py). This Secret is not in git: tools/bootstrap-notion.py
# creates it. No other API rights.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-hub-notion-grant
  namespace: mcp-hub
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [mcp-hub-notion-grant]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-hub-notion-grant
  namespace: mcp-hub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-hub-notion-grant
subjects:
  - kind: ServiceAccount
    name: mcp-hub
    namespace: mcp-hub
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-hub
  namespace: mcp-hub
  labels:
    app: mcp-hub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mcp-hub
  template:
    metadata:
      labels:
        app: mcp-hub
    spec:
      serviceAccountName: mcp-hub
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub
          image: docker.io/library/python:3.13-alpine
          # ponytail: installs the pinned SDK on every start (~20s), same as the
          # keepass pod. Bake an image if restarts get frequent.
          command:
            - sh
            - -c
            - >-
              pip install -q --no-cache-dir --disable-pip-version-check
              --target /opt/py mcp==2.2.0 &&
              python /app/mcp_hub.py --selftest &&
              exec python /app/mcp_hub.py
          env:
            - name: HOME
              value: /tmp
            - name: PYTHONPATH
              value: /opt/py
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: KEEPASS_HUB_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcp-hub-keepass
                  key: secret
            - name: GMAIL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: mcp-hub-gmail
                  key: client-id
            - name: GMAIL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcp-hub-gmail
                  key: client-secret
            - name: GMAIL_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-hub-gmail
                  key: refresh-token
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: py
              mountPath: /opt/py
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: app
          configMap:
            name: mcp-hub-app
        - name: py
          emptyDir: {}
        - name: tmp
          emptyDir: {}
