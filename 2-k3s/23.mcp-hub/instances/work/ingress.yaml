apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mcp-hub-internal
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  entryPoints: [internal]
  routes:
    - match: Host(`mcp-work.epaflix.com`)
      kind: Rule
      services:
        - name: mcp-hub
          port: 8000
  tls: {}
