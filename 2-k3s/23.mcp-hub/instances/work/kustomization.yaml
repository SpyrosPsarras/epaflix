apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp-hub-work

resources:
  - ../base
  - namespace.yaml
  - ingress.yaml
  - ../searxng

configMapGenerator:
  - name: mcp-hub-instance-settings
    literals:
      - environment=work

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: searxng-mcp
      spec:
        selector:
          matchLabels:
            app: work-searxng-mcp
        template:
          metadata:
            labels:
              app: work-searxng-mcp
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: searxng-mcp
      spec:
        selector:
          app: work-searxng-mcp
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-hub
      spec:
        template:
          metadata:
            annotations:
              mcp-hub.epaflix.com/inputs-revision: "r3"
