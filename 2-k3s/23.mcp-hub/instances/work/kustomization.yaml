apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp-hub-work

resources:
  - ../base
  - namespace.yaml
  - ingress.yaml
  - searxng.yaml

configMapGenerator:
  - name: work-searxng-runner
    files:
      - searxng.py
  - name: mcp-hub-instance-settings
    literals:
      - environment=work

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-hub
      spec:
        template:
          metadata:
            annotations:
              mcp-hub.epaflix.com/inputs-revision: "r2"
