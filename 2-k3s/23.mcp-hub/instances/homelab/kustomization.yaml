apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp-hub-homelab

resources:
  - ../base
  - namespace.yaml
  - ingress.yaml

configMapGenerator:
  - name: mcp-hub-instance-settings
    literals:
      - environment=homelab

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-hub
      spec:
        template:
          metadata:
            annotations:
              mcp-hub.epaflix.com/inputs-revision: "r2"
