apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-hub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-hub-notion-grant
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [mcp-hub-notion-grant]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-hub-notion-grant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-hub-notion-grant
subjects:
  - kind: ServiceAccount
    name: mcp-hub
