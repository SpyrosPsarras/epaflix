name: build-vpn-picker


on:
  push:
    branches: [main]
    paths: ['images/vpn-picker/**', '.github/workflows/build-vpn-picker.yml']
  pull_request:
    paths: ['images/vpn-picker/**', '.github/workflows/build-vpn-picker.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the image before publishing anything
        run: |
          cd images/vpn-picker
          docker build -t vpn-picker:dev .
          chmod +x test.sh && ./test.sh

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/vpn-picker
          push: true
          tags: |
            ghcr.io/spyrospsarras/vpn-picker:${{ github.sha }}
            ghcr.io/spyrospsarras/vpn-picker:latest

      - name: Print the digest to pin
        if: github.event_name != 'pull_request'
        run: docker buildx imagetools inspect ghcr.io/spyrospsarras/vpn-picker:${{ github.sha }} --format '{{.Manifest.Digest}}'
