name: dns-tripwire

on:
  pull_request:
    paths:
      - 1-proxmox/pihole/**
      - 2-k3s/**
  push:
    branches: [main]
    paths:
      - 1-proxmox/pihole/**
      - 2-k3s/**
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tripwire:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !startsWith(github.head_ref, 'renovate/') &&
       github.event.pull_request.user.login != 'homelab-windmill-bot[bot]' &&
       !startsWith(github.head_ref, 'bots/'))
    # One run at a time across all refs: every run touches the same live Pi-hole.
    # Renovate branches skip it: a cancelled queued run stalls Renovate's automerge,
    # and their skipped job gets its own group so it cannot be cancelled either.
    # Bot PRs skip it too, so their skipped job cannot displace a queued run.
    concurrency:
      group: ${{ (startsWith(github.head_ref, 'renovate/') || startsWith(github.head_ref, 'bots/') || github.event.pull_request.user.login == 'homelab-windmill-bot[bot]') && github.run_id || 'dns-tripwire' }}
      cancel-in-progress: false
    runs-on: [self-hosted, epaflix]
    timeout-minutes: 15
    env:
      PIHOLE: 192.168.10.30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dig
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils

      # SIGHUP flushes FTL's DNS cache without stopping it. The old restart
      # caused a DNS gap on every run, and a 2 min outage for LAN and
      # Tailscale clients when two runs overlapped on 2026-09-27.
      - name: Flush pihole-FTL cache
        run: |
          set -euo pipefail
          ssh -n -o ConnectTimeout=8 -o BatchMode=yes "root@${PIHOLE}" \
            'systemctl kill --kill-whom=main -s HUP pihole-FTL && systemctl is-active pihole-FTL'
          sleep 1
          out=$(dig +short +time=3 +tries=1 A pi.hole "@${PIHOLE}")
          if [ -z "$out" ]; then
            echo "pihole-FTL is not answering after the cache flush; refusing to run the tripwire against a dead resolver" >&2
            exit 1
          fi
          echo "pihole-FTL cache flushed and answering: pi.hole -> ${out}"

      - name: Run aaaa-tripwire
        run: bash 1-proxmox/pihole/aaaa-tripwire.sh
