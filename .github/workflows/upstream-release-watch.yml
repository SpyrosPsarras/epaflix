name: upstream-release-watch

# One data-driven watch for every `blocked-external` issue whose blocker is the
# SAME common shape: "we are pinned to <version> (or to a dev branch) because
# upstream has not cut a release past it yet".
#
# The re-check is pure API work, so a machine does it instead of a human
# remembering. That is the whole point: an issue closed with this watch on it
# gets re-opened the day upstream moves, while an issue left open just
# accumulates identical "still blocked" comments nobody reads.
#
# Behaviour per row:
#   - silent while upstream has not moved (no comment, no issue churn)
#   - upstream moved -> reopen the tracked issue with the new tag AND the
#     concrete next action, but ONLY if the issue is currently CLOSED, so a
#     weekly re-check never spams an issue somebody already reopened by hand
#   - upstream state unreadable -> FAIL the job. A watch that silently stops
#     watching is worse than no watch at all.
#
# Sibling: `seerr-oidc-watch.yml` stays a bespoke file on purpose - its trigger
# is "a stable release whose git tree contains OIDC source paths", which this
# table cannot express. Anything that IS just "is there a newer release?"
# belongs here.

on:
  schedule:
    - cron: "40 8 * * 1" # Mondays 08:40 UTC (k3s-stable-drift 08:00, seerr-oidc-watch 08:20)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    strategy:
      # ADDING THE NEXT WATCHED ISSUE IS A ONE-ROW DIFF. Append one `- issue:`
      # block below - no new file, no new job, no new workflow. Fields:
      #   issue                - the issue in THIS repo that tracks the blocker
      #   upstreamRepo         - owner/name of the upstream GitHub repo
      #   pinnedVersion        - the release tag we are stuck at / behind
      #   whatToDoWhenItMoves  - the concrete next action, pasted into the
      #                          reopen comment. Write it for a stranger: name
      #                          the file to edit and what to verify.
      fail-fast: false
      matrix:
        include:
          - issue: "270"
            upstreamRepo: "lingarr-translate/lingarr"
            pinnedVersion: "1.2.4"
            whatToDoWhenItMoves: "Confirm the release notes (or its git log) contain upstream #432 `6f9d879d` \"fix: on npgsql convert DateTime to utc\" - without it the Bazarr->Lingarr 500 comes back. Then replace the `newTag: main@sha256:...` entry for `ghcr.io/lingarr-translate/lingarr` in `2-k3s/08.servarr/kustomization.yaml` with a plain release tag, drop the `:main` reference in `2-k3s/08.servarr/lingarr/lingarr.yaml`, and delete the now-pointless lingarr `automerge: false` rule in `.github/renovate.json` (it exists only because `:main` is a dev branch). Restarting lingarr rolls the pod - check the open soak/timeout issues first."

    name: "#${{ matrix.issue }} ${{ matrix.upstreamRepo }}"

    env:
      UPSTREAM: ${{ matrix.upstreamRepo }}
      PINNED: ${{ matrix.pinnedVersion }}
      TRACKING_ISSUE: ${{ matrix.issue }}
      NEXT_ACTION: ${{ matrix.whatToDoWhenItMoves }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve latest upstream stable release
        id: resolve
        run: |
          set -euo pipefail

          # Fetch the list ONCE and filter locally with jq, deliberately not
          # with `gh api --jq`. On a 404 (repo renamed, deleted, made private)
          # `gh api --jq` prints the raw error OBJECT to stdout instead of
          # applying the filter, so `--jq '...[0].tag_name'` yields the JSON
          # blob `{"message":"Not Found",...}` - a non-empty string that sails
          # straight past an `[ -z ]` guard. Asserting the body is an array is
          # what actually catches an unreadable upstream.
          #
          # No --paginate: page 1 is 30 releases, newest first, which is plenty
          # to find the newest stable one.
          RELEASES=$(gh api "repos/$UPSTREAM/releases") || RELEASES=""
          if [ -z "$RELEASES" ] || [ "$(printf '%s' "$RELEASES" | jq -r 'type')" != "array" ]; then
            echo "signal=error" >> "$GITHUB_OUTPUT"
            echo "detail=could not read repos/$UPSTREAM/releases - upstream renamed, deleted or private?" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STABLE=$(printf '%s' "$RELEASES" | jq -r '[.[] | select(.draft == false and .prerelease == false)][0]')
          LATEST=$(printf '%s' "$STABLE" | jq -r '.tag_name // ""')
          PUBLISHED=$(printf '%s' "$STABLE" | jq -r '.published_at // "unknown"')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "signal=error" >> "$GITHUB_OUTPUT"
            echo "detail=$UPSTREAM has no non-draft, non-prerelease release on page 1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Sanity-check the baseline still exists upstream. If the pinned tag
          # was retracted or renamed, the comparison has no basis and we must
          # not guess.
          if ! gh api "repos/$UPSTREAM/releases/tags/$PINNED" --jq '.tag_name' >/dev/null 2>&1; then
            echo "signal=error" >> "$GITHUB_OUTPUT"
            echo "detail=pinned baseline release $PINNED no longer exists in $UPSTREAM - the watch row needs re-basing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "$UPSTREAM: latest stable=$LATEST (published $PUBLISHED), pinned baseline=$PINNED"

          if [ "$LATEST" = "$PINNED" ]; then
            echo "signal=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Differs - make sure it differs FORWARD. A backwards move means
          # upstream deleted or re-cut releases; that is not "shipped", it is a
          # state we refuse to interpret.
          NEWEST=$(printf '%s\n%s\n' "$PINNED" "$LATEST" | sort -V | tail -n 1)
          if [ "$NEWEST" = "$LATEST" ]; then
            echo "signal=moved" >> "$GITHUB_OUTPUT"
          else
            echo "signal=error" >> "$GITHUB_OUTPUT"
            echo "detail=latest stable $LATEST sorts OLDER than pinned baseline $PINNED in $UPSTREAM" >> "$GITHUB_OUTPUT"
          fi

      - name: Reopen the tracking issue when upstream moved
        if: steps.resolve.outputs.signal == 'moved'
        env:
          LATEST: ${{ steps.resolve.outputs.latest }}
          PUBLISHED: ${{ steps.resolve.outputs.published }}
        run: |
          set -euo pipefail

          STATE=$(gh issue view "$TRACKING_ISSUE" --json state --jq '.state')
          if [ "$STATE" != "CLOSED" ]; then
            echo "#$TRACKING_ISSUE is already $STATE - not commenting again (latest=$LATEST)."
            exit 0
          fi

          BODY=$(cat <<EOF
          ## Upstream moved - reopened automatically

          \`$UPSTREAM\` now has a stable release **\`$LATEST\`** (published $PUBLISHED). We were waiting on anything past \`$PINNED\`, so the blocker is gone.

          Observed by \`.github/workflows/upstream-release-watch.yml\` on $(date -u +%Y-%m-%d).

          ## Next step

          $NEXT_ACTION

          ## Verify by hand

          \`\`\`shell
          gh api repos/$UPSTREAM/releases --jq '[.[]|select(.draft==false and .prerelease==false)][0].tag_name'
          \`\`\`

          Release page: https://github.com/$UPSTREAM/releases
          EOF
          )

          gh issue reopen "$TRACKING_ISSUE" --comment "$BODY"
          echo "Reopened #$TRACKING_ISSUE - $UPSTREAM shipped $LATEST."

      - name: Unchanged - nothing to do
        if: steps.resolve.outputs.signal == 'unchanged'
        run: |
          echo "$UPSTREAM latest stable is still $PINNED. Condition unmet, leaving #$TRACKING_ISSUE as is."

      - name: Fail loudly if upstream state could not be resolved
        if: steps.resolve.outputs.signal == 'error'
        run: |
          echo "::error::upstream-release-watch could not read upstream state for #$TRACKING_ISSUE: ${{ steps.resolve.outputs.detail }}"
          exit 1
