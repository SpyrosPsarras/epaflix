name: upstream-release-watch


on:
  schedule:
    - cron: "40 8 * * 1" # Mondays 08:40 UTC (k3s-stable-drift 08:00, seerr-oidc-watch 08:20)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - issue: "270"
            upstreamRepo: "lingarr-translate/lingarr"
            pinnedVersion: "1.2.4"
            whatToDoWhenItMoves: "Confirm the release notes (or its git log) contain upstream #432 `6f9d879d` \"fix: on npgsql convert DateTime to utc\" - without it the Bazarr->Lingarr 500 comes back. Then replace the `newTag: main@sha256:...` entry for `ghcr.io/lingarr-translate/lingarr` in `2-k3s/08.servarr/kustomization.yaml` with a plain release tag, drop the `:main` reference in `2-k3s/08.servarr/lingarr/lingarr.yaml`, and delete the now-pointless lingarr `automerge: false` rule in `.github/renovate.json` (it exists only because `:main` is a dev branch). Restarting lingarr rolls the pod - check the open soak/timeout issues first."
          - issue: "290"
            upstreamRepo: "prometheus-community/helm-charts"
            probe: "kps-control-plane-endpointslice"
            whatToDoWhenItMoves: "Upstream now offers native EndpointSlice for the control-plane exporters, so `2-k3s/10.observability/control-plane-endpointslices.yaml` (the 3 static `discovery.k8s.io/v1` slices from #147) can be retired. Turn the new chart toggle on in `2-k3s/10.observability/prometheus-values.yaml`, then delete `control-plane-endpointslices.yaml` and its entry in `2-k3s/10.observability/kustomization.yaml`. Check FIRST that the chart-rendered slice carries the same master IPs and the `http-metrics` port name, and confirm all 9 control-plane targets are still UP in Prometheus before deleting anything - this is a live observability change, so give it its own PR and watch the targets. ArgoCD's cluster-global `core/v1 Endpoints` exclusion stays either way (#199 Option A rejected - not scopable)."
          - issue: "870"
            upstreamRepo: "lingarr-translate/lingarr"
            pinnedVersion: "1.2.4"
            whatToDoWhenItMoves: "Check whether the release notes (or its git log) show `TranslationRequestService.ResumeTranslationRequests()` no longer re-enqueues Pending/InProgress requests unconditionally, or that `TranslationJob` gained `[DisableConcurrentExecution]`. Either one retires the boot-time guard. If so, delete `2-k3s/08.servarr/lingarr/files/reconcile-job-queue.sql`, its `lingarr-jobqueue-guard` entry in the `configMapGenerator:` block of `2-k3s/08.servarr/kustomization.yaml`, and in `2-k3s/08.servarr/lingarr/lingarr.yaml` the `psql -f /sql/reconcile-job-queue.sql` line, the `jobqueue-guard` volumeMount and the `jobqueue-guard` volume. Keep the `enforce-db-invariants` initContainer itself - it still enforces `request_timeout` (#844). If neither is fixed, leave everything as it is and close this issue again."

    name: "#${{ matrix.issue }} ${{ matrix.upstreamRepo }}"

    env:
      UPSTREAM: ${{ matrix.upstreamRepo }}
      PINNED: ${{ matrix.pinnedVersion }}
      TRACKING_ISSUE: ${{ matrix.issue }}
      NEXT_ACTION: ${{ matrix.whatToDoWhenItMoves }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve latest upstream stable release
        id: resolve
        if: ${{ !matrix.probe }}
        run: |
          set -euo pipefail

          RELEASES=$(gh api "repos/$UPSTREAM/releases") || RELEASES=""
          if [ -z "$RELEASES" ] || [ "$(printf '%s' "$RELEASES" | jq -r 'type')" != "array" ]; then
            echo "signal=error" >> "$GITHUB_OUTPUT"
            echo "detail=could not read repos/$UPSTREAM/releases - upstream renamed, deleted or private?" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          STABLE=$(printf '%s' "$RELEASES" | jq -r '[.[] | select(.draft == false and .prerelease == false)][0]')
          LATEST=$(printf '%s' "$STABLE" | jq -r '.tag_name // ""')
          PUBLISHED=$(printf '%s' "$STABLE" | jq -r '.published_at // "unknown"')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "signal=error" >> "$GITHUB_OUTPUT"
            echo "detail=$UPSTREAM has no non-draft, non-prerelease release on page 1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh api "repos/$UPSTREAM/releases/tags/$PINNED" --jq '.tag_name' >/dev/null 2>&1; then
            echo "signal=error" >> "$GITHUB_OUTPUT"
            echo "detail=pinned baseline release $PINNED no longer exists in $UPSTREAM - the watch row needs re-basing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "$UPSTREAM: latest stable=$LATEST (published $PUBLISHED), pinned baseline=$PINNED"

          if [ "$LATEST" = "$PINNED" ]; then
            echo "signal=unchanged" >> "$GITHUB_OUTPUT"
            echo "observed=latest stable is still $PINNED." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEWEST=$(printf '%s\n%s\n' "$PINNED" "$LATEST" | sort -V | tail -n 1)
          if [ "$NEWEST" != "$LATEST" ]; then
            echo "signal=error" >> "$GITHUB_OUTPUT"
            echo "detail=latest stable $LATEST sorts OLDER than pinned baseline $PINNED in $UPSTREAM" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "signal=moved" >> "$GITHUB_OUTPUT"
          {
            echo 'headline<<DETECTOR_EOF'
            echo "\`$UPSTREAM\` now has a stable release **\`$LATEST\`** (published $PUBLISHED). We were waiting on anything past \`$PINNED\`, so the blocker is gone."
            echo 'DETECTOR_EOF'
            echo 'verify<<DETECTOR_EOF'
            echo "gh api repos/$UPSTREAM/releases --jq '[.[]|select(.draft==false and .prerelease==false)][0].tag_name'"
            echo 'DETECTOR_EOF'
            echo "linkLine=Release page: https://github.com/$UPSTREAM/releases"
          } >> "$GITHUB_OUTPUT"

      - name: Install pinned helm (probe rows only)
        if: ${{ matrix.probe }}
        run: |
          set -euo pipefail
          # `.github/workflows/ci.yml`: an inline `# renovate:` marker on the
          HELM_VERSION=3.21.4  # renovate: datasource=github-releases depName=helm/helm

          tmp=$(mktemp -d)
          helm_tgz="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          for asset in "$helm_tgz" "${helm_tgz}.sha256sum"; do
            n=0
            until curl -fsSL -o "$tmp/$asset" "https://get.helm.sh/$asset"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                echo "::error::download failed after 3 attempts: $asset"
                exit 1
              fi
              sleep $((n*5))
            done
          done
          ( cd "$tmp" && sha256sum -c "${helm_tgz}.sha256sum" )
          tar -xzf "$tmp/$helm_tgz" -C "$tmp"
          sudo mv "$tmp/linux-amd64/helm" /usr/local/bin/helm
          rm -rf "$tmp"
          helm version --short

      - name: Probe the rendered shape upstream
        id: probe
        if: ${{ matrix.probe }}
        env:
          PROBE: ${{ matrix.probe }}
        run: |
          set -euo pipefail

          if [ "$PROBE" != "kps-control-plane-endpointslice" ]; then
            echo "signal=error" >> "$GITHUB_OUTPUT"
            echo "detail=row #$TRACKING_ISSUE names probe '$PROBE', which this step does not implement" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts >/dev/null
          helm repo update prometheus-community >/dev/null

          CHART=$(helm search repo prometheus-community/kube-prometheus-stack --output json \
                    | jq -r '[.[] | select(.name == "prometheus-community/kube-prometheus-stack")][0].version // ""')
          if [ -z "$CHART" ]; then
            echo "signal=error" >> "$GITHUB_OUTPUT"
            echo "detail=could not read the newest kube-prometheus-stack version from the prometheus-community Helm repo index" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="kube-prometheus-stack-$CHART"
          echo "newest published chart: $CHART (release tag $TAG)"

          helm template kps prometheus-community/kube-prometheus-stack --version "$CHART" \
            --set kubeControllerManager.endpoints={10.0.0.1} \
            --set kubeScheduler.endpoints={10.0.0.1} \
            --set kubeEtcd.endpoints={10.0.0.1} > rendered.yaml

          awk '/^# Source:/ { src = $3 }
               /^kind: (Endpoints|EndpointSlice)$/ &&
               src ~ /\/templates\/exporters\/(kube-controller-manager|kube-scheduler|kube-etcd)\// { print $2 }' \
            rendered.yaml | sort | uniq -c | tee kinds.txt
          ES=$(awk '$2 == "EndpointSlice" { print $1 }' kinds.txt)
          EP=$(awk '$2 == "Endpoints" { print $1 }' kinds.txt)
          ES=${ES:-0}
          EP=${EP:-0}

          helm show values prometheus-community/kube-prometheus-stack --version "$CHART" > values.yaml
          KEYS=$(python3 - <<'PY'
          import yaml

          values = yaml.safe_load(open("values.yaml")) or {}
          hits = []
          for block in ("kubeControllerManager", "kubeScheduler", "kubeEtcd"):
              node = values.get(block)
              if isinstance(node, dict):
                  hits += ["%s.%s" % (block, key) for key in node if "endpointslice" in key.lower()]
          print(" ".join(sorted(hits)))
          PY
          )
          echo "control-plane EndpointSlice values keys: ${KEYS:-none}"

          if [ "$ES" -eq 0 ] && [ "$EP" -eq 3 ] && [ -z "$KEYS" ]; then
            echo "signal=unchanged" >> "$GITHUB_OUTPUT"
            echo "observed=chart $CHART still renders kind: Endpoints for all 3 control-plane exporters, and values.yaml still has no EndpointSlice key for them." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$ES" -eq 0 ] && [ -z "$KEYS" ]; then
            echo "signal=error" >> "$GITHUB_OUTPUT"
            echo "detail=chart $CHART rendered $EP kind: Endpoints and $ES kind: EndpointSlice under templates/exporters for the 3 control-plane exporters - expected exactly 3 Endpoints, so this probe needs re-basing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "signal=moved" >> "$GITHUB_OUTPUT"
          echo "latest=$CHART" >> "$GITHUB_OUTPUT"
          {
            echo 'headline<<DETECTOR_EOF'
            echo "kube-prometheus-stack **\`$CHART\`** no longer backs the control-plane exporters with hardcoded \`v1 Endpoints\` only:"
            echo ""
            echo "- rendered under \`templates/exporters/{kube-controller-manager,kube-scheduler,kube-etcd}\`: **$ES** \`kind: EndpointSlice\`, **$EP** \`kind: Endpoints\`"
            echo "- control-plane EndpointSlice keys in \`values.yaml\`: ${KEYS:-none}"
            echo ""
            echo "That is the exact condition #290 was closed on, so the static slices can be retired now."
            echo 'DETECTOR_EOF'
            echo 'verify<<DETECTOR_EOF'
            echo "helm repo add prometheus-community https://prometheus-community.github.io/helm-charts"
            echo "helm template kps prometheus-community/kube-prometheus-stack --version $CHART \\"
            echo "  --set kubeControllerManager.endpoints={10.0.0.1} \\"
            echo "  --set kubeScheduler.endpoints={10.0.0.1} \\"
            echo "  --set kubeEtcd.endpoints={10.0.0.1} | grep -E '^kind: (Endpoints|EndpointSlice)\$'"
            echo 'DETECTOR_EOF'
            echo "linkLine=Chart templates: https://github.com/prometheus-community/helm-charts/tree/$TAG/charts/kube-prometheus-stack/templates/exporters"
          } >> "$GITHUB_OUTPUT"

      - name: Reopen the tracking issue when upstream moved
        if: ${{ (steps.resolve.outputs.signal || steps.probe.outputs.signal) == 'moved' }}
        env:
          LATEST: ${{ steps.resolve.outputs.latest || steps.probe.outputs.latest }}
          HEADLINE: ${{ steps.resolve.outputs.headline || steps.probe.outputs.headline }}
          VERIFY: ${{ steps.resolve.outputs.verify || steps.probe.outputs.verify }}
          LINK_LINE: ${{ steps.resolve.outputs.linkLine || steps.probe.outputs.linkLine }}
        run: |
          set -euo pipefail

          STATE=$(gh issue view "$TRACKING_ISSUE" --json state --jq '.state')
          if [ "$STATE" != "CLOSED" ]; then
            echo "#$TRACKING_ISSUE is already $STATE - not commenting again (upstream now at $LATEST)."
            exit 0
          fi

          BODY=$(cat <<EOF

          $HEADLINE

          Observed by \`.github/workflows/upstream-release-watch.yml\` on $(date -u +%Y-%m-%d).


          $NEXT_ACTION


          \`\`\`shell
          $VERIFY
          \`\`\`

          $LINK_LINE
          EOF
          )

          gh issue reopen "$TRACKING_ISSUE" --comment "$BODY"
          echo "Reopened #$TRACKING_ISSUE - upstream moved to $LATEST."

      - name: Unchanged - nothing to do
        if: ${{ (steps.resolve.outputs.signal || steps.probe.outputs.signal) == 'unchanged' }}
        env:
          OBSERVED: ${{ steps.resolve.outputs.observed || steps.probe.outputs.observed }}
        run: |
          echo "$UPSTREAM: $OBSERVED Condition unmet, leaving #$TRACKING_ISSUE as is."

      - name: Fail loudly if upstream state could not be resolved
        if: ${{ (steps.resolve.outputs.signal || steps.probe.outputs.signal) == 'error' }}
        env:
          DETAIL: ${{ steps.resolve.outputs.detail || steps.probe.outputs.detail }}
        run: |
          echo "::error::upstream-release-watch could not read upstream state for #$TRACKING_ISSUE: $DETAIL"
          exit 1
