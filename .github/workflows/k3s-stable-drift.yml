name: k3s-stable-drift


on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PLANS_FILE: 2-k3s/maintenance/system-upgrade/plans/system-upgrade-plans.yaml
      ISSUE_TITLE: "chore(k3s): pinned system-upgrade version is behind stable channel"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned vs stable
        id: resolve
        run: |
          set -euo pipefail
          PINNED=$(grep -oP 'version:\s*\K\S+' "$PLANS_FILE" | sort -u | head -1 || true)
          STABLE=$(curl -fsS -o /dev/null -w '%{url_effective}' -L \
            https://update.k3s.io/v1-release/channels/stable | sed 's#.*/tag/##')
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "Pinned: ${PINNED:-<none>} | Stable: ${STABLE:-<none>}"
          if [ -z "$PINNED" ] || [ -z "$STABLE" ]; then
            echo "drift=error" >> "$GITHUB_OUTPUT"
          elif [ "$PINNED" = "$STABLE" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update drift issue
        if: steps.resolve.outputs.drift == 'true'
        env:
          PINNED: ${{ steps.resolve.outputs.pinned }}
          STABLE: ${{ steps.resolve.outputs.stable }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          The K3s \`stable\` channel has advanced past the version pinned in the system-upgrade Plans.

          - **Pinned (\`$PLANS_FILE\`):** \`$PINNED\`
          - **Latest stable:** \`$STABLE\`

          Review the changelog, then bump \`spec.version\` to \`$STABLE\` on **both** the \`k3s-server\` and \`k3s-agent\` Plans in a PR, follow the Future-Upgrade SOP, and merge to roll the fleet during a supervised window.

          - Auto-generated by \`.github/workflows/k3s-stable-drift.yml\` (follow-up to #130 / #169). This issue is updated in place each run and auto-closed once pinned == stable again.
          - K3s releases: https://github.com/k3s-io/k3s/releases
          EOF
          )
          EXISTING=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
            echo "Updated existing drift issue #$EXISTING"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$BODY"
          fi

      - name: Close drift issue when back in sync
        if: steps.resolve.outputs.drift == 'false'
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Pinned version now matches stable (\`${{ steps.resolve.outputs.pinned }}\`). Closing automatically."
            echo "Closed drift issue #$EXISTING"
          else
            echo "In sync, no open drift issue. Nothing to do."
          fi

      - name: Fail loudly if versions could not be resolved
        if: steps.resolve.outputs.drift == 'error'
        run: |
          echo "::error::Could not resolve pinned ('${{ steps.resolve.outputs.pinned }}') and/or stable ('${{ steps.resolve.outputs.stable }}') K3s version."
          exit 1
