name: build-keepass-mcp


on:
  push:
    branches: [main]
    paths: ['images/keepass-mcp/**', '.github/workflows/build-keepass-mcp.yml']
  pull_request:
    paths: ['images/keepass-mcp/**', '.github/workflows/build-keepass-mcp.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the image before publishing anything
        run: docker build -t keepass-mcp:dev images/keepass-mcp

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/keepass-mcp
          push: true
          tags: |
            ghcr.io/spyrospsarras/keepass-mcp:${{ github.sha }}
            ghcr.io/spyrospsarras/keepass-mcp:latest

      - name: Print the digest to pin
        if: github.event_name != 'pull_request'
        run: docker buildx imagetools inspect ghcr.io/spyrospsarras/keepass-mcp:${{ github.sha }} --format '{{.Manifest.Digest}}'
