name: build-homelab-sync


on:
  push:
    branches: [main]
    paths: ['images/homelab-sync/**', '1-proxmox/homelab-scan/**', '.github/workflows/build-homelab-sync.yml']
  pull_request:
    paths: ['images/homelab-sync/**', '1-proxmox/homelab-scan/**', '.github/workflows/build-homelab-sync.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'homelab-windmill-bot[bot]' &&
       !startsWith(github.head_ref, 'bots/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the image before publishing anything
        run: |
          docker build -f images/homelab-sync/Dockerfile -t homelab-sync:dev .
          bash images/homelab-sync/test.sh

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/homelab-sync/Dockerfile
          push: true
          tags: |
            ghcr.io/spyrospsarras/homelab-sync:${{ github.sha }}
            ghcr.io/spyrospsarras/homelab-sync:latest

      - name: Print the digest to pin
        if: github.event_name != 'pull_request'
        run: docker buildx imagetools inspect ghcr.io/spyrospsarras/homelab-sync:${{ github.sha }} --format '{{.Manifest.Digest}}'
