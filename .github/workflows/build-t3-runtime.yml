name: build-t3-runtime
on:
  push:
    branches: [main]
    paths:
      - '2-k3s/13.t3code/**'
      - '2-k3s/13.t3code-homelab/**'
      - '2-k3s/13.t3code-work/**'
      - '.github/workflows/build-t3-runtime.yml'
  pull_request:
    paths:
      - '2-k3s/13.t3code/**'
      - '2-k3s/13.t3code-homelab/**'
      - '2-k3s/13.t3code-work/**'
      - '.github/workflows/build-t3-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [mixed, homelab, work]
    env:
      T3_RUNTIME_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and boot without production credentials
        run: |
          bash 2-k3s/13.t3code/env/tools/sync-runtime-image.sh
          git diff --exit-code -- 2-k3s/13.t3code/one/statefulset.yaml 2-k3s/13.t3code-homelab/statefulset.yaml 2-k3s/13.t3code-work/statefulset.yaml
          bash 2-k3s/13.t3code/one/tools/sync-shared.sh --check
          bash 2-k3s/13.t3code/env/tools/smoke.sh
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name != 'pull_request'
        run: |
          image=ghcr.io/spyrospsarras/t3-runtime
          variant=${{ matrix.variant }}
          tag=$(bash 2-k3s/13.t3code/env/tools/runtime-tag.sh "$variant")
          source=t3-runtime:dev
          prefix=
          if [[ $variant != mixed ]]; then source=t3-runtime:$variant-dev; prefix=$variant-; fi
          for target in "${prefix}inputs-$tag" "${prefix}${{ github.sha }}" "${prefix}latest"; do
            docker tag "$source" "$image:$target"
            docker push "$image:$target"
          done
