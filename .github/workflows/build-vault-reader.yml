name: build-vault-reader
on:
  push:
    branches: [main]
    paths:
      - '2-k3s/23.mcp-hub/files/reader*'
      - '2-k3s/23.mcp-hub/files/vaultwarden_reader*'
      - '2-k3s/23.mcp-hub/reader/**'
      - '2-k3s/23.mcp-hub/tests/**'
      - '2-k3s/13.t3code/one/files/vault-restricted.py'
      - '.github/workflows/build-vault-reader.yml'
  pull_request:
    paths:
      - '2-k3s/23.mcp-hub/files/reader*'
      - '2-k3s/23.mcp-hub/files/vaultwarden_reader*'
      - '2-k3s/23.mcp-hub/reader/**'
      - '2-k3s/23.mcp-hub/tests/**'
      - '2-k3s/13.t3code/one/files/vault-restricted.py'
      - '.github/workflows/build-vault-reader.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check source-derived image reference
        run: |
          bash 2-k3s/23.mcp-hub/reader/sync-image.sh
          git diff --exit-code -- 2-k3s/23.mcp-hub/reader/homelab/deployment.yaml
      - name: Build and test without account credentials
        run: bash 2-k3s/23.mcp-hub/reader/smoke.sh
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested source-derived reference
        if: github.event_name != 'pull_request'
        run: |
          tag=$(bash 2-k3s/23.mcp-hub/reader/image-tag.sh)
          image=ghcr.io/spyrospsarras/vault-reader:inputs-$tag
          docker tag vault-reader:dev "$image"
          docker push "$image"
