name: test-t3-v2-recovery
on:
  workflow_dispatch:
  push:
    branches: [t3code/a5bf2355-v2-recovery]
    paths: ['.github/workflows/test-t3-v2-recovery.yml']
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore synthetic recovery state using prior image
        run: |
          set -euo pipefail
          current=$(python3 -c 'import json;print(json.load(open("2-k3s/13.t3code/v2/runtime.json"))["image"])')
          prior=ghcr.io/spyrospsarras/t3-runtime-v2@sha256:67254575fb9d92c2a2a306040b07b8e2daf242cfa89fd057d7fbad4f76e81948
          mkdir -m 700 /tmp/v2-recovery-state
          timeout 120 docker run --rm --network none --user 0 --entrypoint python3 \
            -v /tmp/v2-recovery-state:/state "$current" -c '
          import pathlib,sqlite3,subprocess,time,urllib.request
          h=pathlib.Path("/state"); project=h/"project";project.mkdir();subprocess.run(["git","init","-q",str(project)],check=True)
          server=subprocess.Popen(["/runtime/t3","start","--no-browser","--host","127.0.0.1","--port","13773","--base-dir",str(h/"t3"),str(project)])
          try:
            for _ in range(60):
              try:urllib.request.urlopen("http://127.0.0.1:13773/health",timeout=1).close();break
              except OSError:time.sleep(1)
            else:raise RuntimeError("Current image startup timed out")
            subprocess.run(["python3","/v2/backup.py","--home",str(h/"t3"),"--label","rehearsal"],check=True)
          finally:server.terminate();server.wait(timeout=40)
          recovery=h/"recovered/userdata";recovery.mkdir(parents=True)
          import shutil
          shutil.copy2(h/"t3/backups/rehearsal/statev2.sqlite",recovery/"statev2.sqlite")
          '
          timeout 120 docker run --rm --network none --user 0 --entrypoint python3 \
            -v /tmp/v2-recovery-state:/state "$prior" -c '
          import json,pathlib,sqlite3,subprocess,time,urllib.request
          h=pathlib.Path("/state/recovered")
          with sqlite3.connect(h/"userdata/statev2.sqlite") as db:
            assert db.execute("select count(*) from projection_projects").fetchone()[0]==1
            assert db.execute("pragma integrity_check").fetchone()[0]=="ok"
          server=subprocess.Popen(["/runtime/t3","start","--no-browser","--host","127.0.0.1","--port","13773","--base-dir",str(h),"/state/project"])
          try:
            for _ in range(60):
              try:
                response=json.load(urllib.request.urlopen("http://127.0.0.1:13773/.well-known/t3/environment",timeout=1))
                assert response["orchestrationProtocolVersion"]==2
                with sqlite3.connect(h/"userdata/statev2.sqlite") as db:
                  assert db.execute("select count(*) from projection_projects").fetchone()[0]==1
                  assert db.execute("pragma integrity_check").fetchone()[0]=="ok"
                print("PASS: prior image boots recovered synthetic database with project intact");break
              except OSError:time.sleep(1)
            else:raise RuntimeError("Prior-image restored boot timed out")
          finally:server.terminate();server.wait(timeout=40)
          '
