name: build-llama-prism

on:
  push:
    branches: [main]
    paths: ['images/llama-prism/**', '.github/workflows/build-llama-prism.yml']
  pull_request:
    paths: ['images/llama-prism/**', '.github/workflows/build-llama-prism.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'homelab-windmill-bot[bot]' &&
       !startsWith(github.head_ref, 'bots/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the image before publishing anything
        run: |
          set -euo pipefail
          docker build -t llama-prism:dev images/llama-prism
          release=$(awk -F'=' '/^ARG PRISM_RELEASE=/ {print $2}' images/llama-prism/Dockerfile)
          build=$(echo "$release" | sed -E 's/^prism-b([0-9]+)-.*/\1/')
          docker run --rm llama-prism:dev --version 2>&1 | tee version.txt
          grep -q "build $build," version.txt

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/llama-prism
          push: true
          tags: |
            ghcr.io/spyrospsarras/llama-prism:${{ github.sha }}

      - name: Print the digest to pin
        if: github.event_name != 'pull_request'
        run: docker buildx imagetools inspect ghcr.io/spyrospsarras/llama-prism:${{ github.sha }} --format '{{.Manifest.Digest}}'
