name: build-openclaw-discord


on:
  push:
    branches: [main]
    paths: ['images/openclaw-discord/**', '.github/workflows/build-openclaw-discord.yml']
  pull_request:
    paths: ['images/openclaw-discord/**', '.github/workflows/build-openclaw-discord.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'homelab-windmill-bot[bot]' &&
       !startsWith(github.head_ref, 'bots/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the image before publishing anything
        run: |
          cd images/openclaw-discord
          docker build -t openclaw-discord:dev .
          chmod +x test.sh && ./test.sh

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/openclaw-discord
          push: true
          tags: |
            ghcr.io/spyrospsarras/openclaw-discord:${{ github.sha }}
            ghcr.io/spyrospsarras/openclaw-discord:latest

      - name: Print the digest to pin
        if: github.event_name != 'pull_request'
        run: docker buildx imagetools inspect ghcr.io/spyrospsarras/openclaw-discord:${{ github.sha }} --format '{{.Manifest.Digest}}'
