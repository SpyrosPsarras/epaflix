name: ci

# Secret-free validation gate so Renovate's platform auto-merge has a required
# check to wait on. Validates exactly Renovate's change surface — malformed
# YAML, unresolvable Helm chart pins, broken kustomize overlays — WITHOUT
# needing the SOPS age key (so sops/ksops dirs are never fully rendered here).
# See issue #88.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    # Fork-guard: only run for PRs from branches in THIS repo (and pushes to
    # main). Fork PRs trigger nothing — no fork-authored workflow code ever
    # executes on the runner. Public repo, so this is the safety boundary.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: No tracked file matches .gitignore
        run: |
          set -euo pipefail
          # Server-side complement to the local pre-commit hook (PR #302):
          # fail if any tracked file matches .gitignore (via `git commit
          # --no-verify` or a clone without hooks installed). Widened from
          # the secrets-only check (#303/PR #388) to the general case now
          # that .history/*.{md,sh} and .a5c/processes/* have real negations
          # instead of dead ones (#389) — this is a strict superset, so it
          # also covers the original secrets.yml scenario for free.
          tracked_ignored=$(git ls-files -ci --exclude-standard)
          if [ -n "$tracked_ignored" ]; then
            echo "ERROR: the following tracked files match .gitignore:" >&2
            echo "$tracked_ignored" >&2
            echo "Untrack with: git rm --cached <path>, or add a negation if it should stay tracked." >&2
            exit 1
          fi
          echo "No tracked file matches .gitignore."

      - name: No blanket-ignore reintroduced for .a5c/processes/
        run: |
          set -euo pipefail
          # #659: a `.a5c/processes/*` glob-ignore + per-file `!` negations
          # is exactly the pattern that let 143 of 154 real process
          # definitions go untracked (fixed by dropping the ignore - see
          # .gitignore). The pre-commit hook (check-processes-tracked.sh)
          # guards against untracked drift locally; this is the server-side
          # complement that fails the build if the trap pattern itself is
          # ever reintroduced (e.g. via `git commit --no-verify`, or a clone
          # without hooks installed).
          if grep -qE '^\.a5c/processes/\*?$' .gitignore; then
            echo "ERROR: .gitignore re-ignores .a5c/processes/ - this is the pattern #659 fixed." >&2
            echo "       Process definitions must stay tracked by default." >&2
            exit 1
          fi
          echo "No blanket-ignore for .a5c/processes/."

      - name: Install tools
        run: |
          set -euo pipefail
          # Pinned, direct release-asset downloads only — NO unauthenticated
          # GitHub API tag lookup (the install_kustomize.sh rate-limit flake,
          # issue #164) and NO curl|bash from a moving branch. Renovate keeps
          # the two pins below fresh via a customManager regex.
          KUSTOMIZE_VERSION=5.8.1  # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize
          HELM_VERSION=3.21.0      # renovate: datasource=github-releases depName=helm/helm

          # Bounded retry: 3 attempts, 5s then 10s backoff, so a transient
          # CDN blip self-heals instead of red-flagging the required check.
          dl() {
            url=$1; out=$2; n=0
            until curl -fsSL -o "$out" "$url"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                echo "download failed after 3 attempts: $url" >&2
                return 1
              fi
              sleep $((n*5))
            done
          }

          tmp=$(mktemp -d)

          # helm — official dist CDN (get.helm.sh), with checksum verification.
          # Keep the canonical asset filename: the published .sha256sum line
          # references "helm-v${HELM_VERSION}-linux-amd64.tar.gz", so `sha256sum -c`
          # must run against that exact name.
          helm_tgz="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          dl "https://get.helm.sh/${helm_tgz}" "$tmp/${helm_tgz}"
          dl "https://get.helm.sh/${helm_tgz}.sha256sum" "$tmp/${helm_tgz}.sha256sum"
          ( cd "$tmp" && sha256sum -c "${helm_tgz}.sha256sum" )
          tar -xzf "$tmp/${helm_tgz}" -C "$tmp"
          sudo mv "$tmp/linux-amd64/helm" /usr/local/bin/helm

          # kustomize — GitHub release-asset CDN (302 -> objects.githubusercontent.com)
          dl "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" "$tmp/kustomize.tar.gz"
          tar -xzf "$tmp/kustomize.tar.gz" -C "$tmp"
          sudo mv "$tmp/kustomize" /usr/local/bin/kustomize

          rm -rf "$tmp"
          helm version
          kustomize version

      - name: YAML parse check (syntax only, no style)
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in glob.glob("**/*.yaml", recursive=True) + glob.glob("**/*.yml", recursive=True):
              if "/charts/" in f:  # vendored chart caches, if any
                  continue
              try:
                  list(yaml.safe_load_all(open(f)))
              except yaml.YAMLError as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("Malformed YAML:")
              print("\n".join(bad))
              sys.exit(1)
          print("All YAML parses cleanly.")
          PY

      - name: Helm chart pins resolve
        run: |
          python3 - <<'PY'
          import glob, subprocess, sys, yaml, os, time
          os.makedirs("/tmp/charts", exist_ok=True)

          # Several pins are GitHub-release-hosted charts (argo-cd, authentik,
          # loki) whose CDN intermittently 504s, hard-failing this required gate
          # and blocking Renovate auto-merge — same transient-flake class as the
          # install-tools download retry (#164). Retry ONLY on transient
          # network/5xx markers; a genuine error (404 / chart-not-found /
          # invalid version) is non-transient and fast-fails on attempt 1, so
          # every pin is still validated.
          def helm_pull(cmd, attempts=4):
              for i in range(attempts):
                  r = subprocess.run(cmd, capture_output=True, text=True)
                  if r.returncode == 0:
                      return r
                  blob = (r.stderr + r.stdout).lower()
                  TRANSIENT = any(m in blob for m in (
                      "504", "502", "503", "gateway", "timed out", "timeout",
                      "connection reset", "reset by peer", "eof",
                      "tls handshake", "temporary failure", "i/o timeout",
                  ))
                  if not TRANSIENT or i == attempts - 1:
                      return r  # let caller record the failure
                  wait = (i + 1) * 5
                  print(f"  transient pull error (attempt {i+1}/{attempts}), "
                        f"retrying in {wait}s", file=sys.stderr)
                  time.sleep(wait)
              return r

          fail = []
          for f in glob.glob("2-k3s/**/kustomization.yaml", recursive=True):
              doc = yaml.safe_load(open(f)) or {}
              for c in doc.get("helmCharts", []):
                  name, repo, ver = c.get("name"), c.get("repo"), str(c.get("version", ""))
                  if not (name and repo and ver):
                      continue
                  print(f"[{f}] {name} {ver} <- {repo}")
                  if repo.startswith("oci://"):
                      cmd = ["helm", "pull", f"{repo}/{name}", "--version", ver, "-d", "/tmp/charts", "--untar"]
                  else:
                      cmd = ["helm", "pull", name, "--repo", repo, "--version", ver, "-d", "/tmp/charts", "--untar"]
                  r = helm_pull(cmd)
                  if r.returncode != 0:
                      fail.append(f"{name} {ver} ({repo}): {r.stderr.strip()}")
                      continue
                  # Validate the values file against the chart's values.schema.json.
                  # ArgoCD's repo-server enforces it at inflation; plain `helm pull`
                  # does NOT — the gap that let traefik v41's stale `logs:` key pass
                  # CI yet break the live render (#386, #384/#385). No age key needed:
                  # schema enforcement happens before any ksops decryption.
                  vf = c.get("valuesFile")
                  tcmd = ["helm", "template", name, f"/tmp/charts/{name}"]
                  if vf:
                      tcmd += ["-f", os.path.join(os.path.dirname(f), vf)]
                  t = subprocess.run(tcmd, capture_output=True, text=True)
                  if t.returncode != 0:
                      fail.append(f"{name} {ver} values schema: {t.stderr.strip()}")
          if fail:
              print("\nUnresolvable Helm chart pins or invalid values:")
              print("\n".join(fail))
              sys.exit(1)
          print("\nAll Helm chart pins resolve and values validate.")
          PY

      - name: Kustomize build (sops-free dirs)
        run: |
          set -euo pipefail
          # Only dirs with neither helmCharts nor sops/ksops generators — these
          # render fully offline. sops/helm dirs are covered by the YAML parse
          # and Helm-pin checks above (full render needs the age key, withheld).
          dirs="
            2-k3s/01.kube-vip
            2-k3s/03.kube-vip-cloud-provider
            2-k3s/04.coredns
            2-k3s/06.postgres/operator-kustomization
            2-k3s/11.argocd/apps
            2-k3s/12.renovate
            2-k3s/maintenance
            2-k3s/maintenance/system-upgrade/controller
          "
          for d in $dirs; do
            echo "kustomize build $d"
            kustomize build "$d" >/dev/null
          done
          echo "All sops-free overlays build."
