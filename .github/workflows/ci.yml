name: ci


on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No tracked file matches .gitignore
        run: |
          set -euo pipefail
          tracked_ignored=$(git ls-files -ci --exclude-standard)
          if [ -n "$tracked_ignored" ]; then
            echo "ERROR: the following tracked files match .gitignore:" >&2
            echo "$tracked_ignored" >&2
            echo "Untrack with: git rm --cached <path>, or add a negation if it should stay tracked." >&2
            exit 1
          fi
          echo "No tracked file matches .gitignore."

      - name: Hook fixture suites + plaintext Secret guard
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            -r .github/hooks/requirements.txt
          ./.github/hooks/test-check-sops-encrypted.sh
          ./.github/hooks/test-check-authentik-blueprint.sh
          ./.github/hooks/test-check-kube-context.sh
          ./.github/hooks/test-keystatus-check.sh
          ./.github/hooks/test-pool-capacity-forecast.sh
          ./.github/hooks/test-print-age-key-backup.sh
          ./.github/hooks/check-sops-encrypted.sh --full-tree

      - name: Install tools
        run: |
          set -euo pipefail
          KUSTOMIZE_VERSION=5.8.1  # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize
          HELM_VERSION=3.21.4      # renovate: datasource=github-releases depName=helm/helm

          dl() {
            url=$1; out=$2; n=0
            until curl -fsSL -o "$out" "$url"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                echo "download failed after 3 attempts: $url" >&2
                return 1
              fi
              sleep $((n*5))
            done
          }

          tmp=$(mktemp -d)

          helm_tgz="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          dl "https://get.helm.sh/${helm_tgz}" "$tmp/${helm_tgz}"
          dl "https://get.helm.sh/${helm_tgz}.sha256sum" "$tmp/${helm_tgz}.sha256sum"
          ( cd "$tmp" && sha256sum -c "${helm_tgz}.sha256sum" )
          tar -xzf "$tmp/${helm_tgz}" -C "$tmp"
          sudo mv "$tmp/linux-amd64/helm" /usr/local/bin/helm

          dl "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" "$tmp/kustomize.tar.gz"
          tar -xzf "$tmp/kustomize.tar.gz" -C "$tmp"
          sudo mv "$tmp/kustomize" /usr/local/bin/kustomize

          rm -rf "$tmp"
          helm version
          kustomize version

      - name: YAML parse check (syntax only, no style)
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in glob.glob("**/*.yaml", recursive=True) + glob.glob("**/*.yml", recursive=True):
              if "/charts/" in f:  # vendored chart caches, if any
                  continue
              try:
                  list(yaml.safe_load_all(open(f)))
              except yaml.YAMLError as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("Malformed YAML:")
              print("\n".join(bad))
              sys.exit(1)
          print("All YAML parses cleanly.")
          PY

      - name: Helm chart pins resolve
        run: |
          python3 - <<'PY'
          import glob, subprocess, sys, yaml, os, time
          os.makedirs("/tmp/charts", exist_ok=True)

          def helm_pull(cmd, attempts=4):
              for i in range(attempts):
                  r = subprocess.run(cmd, capture_output=True, text=True)
                  if r.returncode == 0:
                      return r
                  blob = (r.stderr + r.stdout).lower()
                  TRANSIENT = any(m in blob for m in (
                      "504", "502", "503", "gateway", "timed out", "timeout",
                      "connection reset", "reset by peer", "eof",
                      "tls handshake", "temporary failure", "i/o timeout",
                  ))
                  if not TRANSIENT or i == attempts - 1:
                      return r  # let caller record the failure
                  wait = (i + 1) * 5
                  print(f"  transient pull error (attempt {i+1}/{attempts}), "
                        f"retrying in {wait}s", file=sys.stderr)
                  time.sleep(wait)
              return r

          fail = []
          pulled = set()  # (name, repo, ver) already untarred into /tmp/charts/<name> —
          for f in glob.glob("2-k3s/**/kustomization.yaml", recursive=True):
              doc = yaml.safe_load(open(f)) or {}
              for c in doc.get("helmCharts", []):
                  name, repo, ver = c.get("name"), c.get("repo"), str(c.get("version", ""))
                  if not (name and repo and ver):
                      continue
                  print(f"[{f}] {name} {ver} <- {repo}")
                  key = (name, repo, ver)
                  if key not in pulled:
                      if repo.startswith("oci://"):
                          cmd = ["helm", "pull", f"{repo}/{name}", "--version", ver, "-d", "/tmp/charts", "--untar"]
                      else:
                          cmd = ["helm", "pull", name, "--repo", repo, "--version", ver, "-d", "/tmp/charts", "--untar"]
                      r = helm_pull(cmd)
                      if r.returncode != 0:
                          fail.append(f"{name} {ver} ({repo}): {r.stderr.strip()}")
                          continue
                      pulled.add(key)
                  vf = c.get("valuesFile")
                  tcmd = ["helm", "template", name, f"/tmp/charts/{name}"]
                  if vf:
                      tcmd += ["-f", os.path.join(os.path.dirname(f), vf)]
                  t = subprocess.run(tcmd, capture_output=True, text=True)
                  if t.returncode != 0:
                      fail.append(f"{name} {ver} values schema: {t.stderr.strip()}")
          if fail:
              print("\nUnresolvable Helm chart pins or invalid values:")
              print("\n".join(fail))
              sys.exit(1)
          print("\nAll Helm chart pins resolve and values validate.")
          PY

      - name: CLIProxyAPI plugin pins match upstream checksums
        run: |
          python3 - <<'PY'
          import sys, urllib.request, urllib.error, yaml, posixpath

          DEPLOY = "2-k3s/17.remote-pi/cliproxy/deployment.yaml"
          spec = yaml.safe_load(open(DEPLOY))["spec"]["template"]["spec"]

          pins, fail, warn = [], [], []
          for c in spec.get("initContainers", []):
              if not any("fetch-plugin.sh" in t for t in (c.get("command") or [])):
                  continue
              args = c.get("args") or []
              if len(args) != 4:
                  fail.append(f"{c['name']}: expected 4 args, got {len(args)}: {args}")
                  continue
              pins.append((c["name"], *args))

          if not pins:
              print(f"No fetch-plugin.sh initContainer found in {DEPLOY}")
              sys.exit(1)

          for name, plugin_id, version, sha256, repo in pins:
              asset = f"{plugin_id}_{version}_linux_amd64.zip"
              base = f"https://github.com/{repo}/releases/download/v{version}"
              url = f"{base}/checksums.txt"
              print(f"[{name}] {plugin_id} {version} <- {repo}")
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      body = r.read().decode()
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      fail.append(
                          f"{plugin_id} {version}: {url} is 404, so that release does "
                          f"not exist. fetch-plugin.sh fails OPEN on a 404, so this "
                          f"would start the proxy with the plugin silently missing."
                      )
                  else:
                      warn.append(f"{plugin_id} {version}: could not fetch {url}: {e}")
                  continue
              except (urllib.error.URLError, TimeoutError) as e:
                  warn.append(f"{plugin_id} {version}: could not fetch {url}: {e}")
                  continue
              upstream = {
                  parts[1].lstrip("*"): parts[0]
                  for line in body.splitlines()
                  if len(parts := line.split()) == 2
              }
              want = upstream.get(asset)
              if want is None:
                  fail.append(
                      f"{plugin_id} {version}: {asset} absent from {url}. "
                      f"Assets there: {sorted(upstream) or 'none parsed'}. "
                      f"Either the version does not exist or the release names its "
                      f"asset differently, which fetch-plugin.sh would 404 on."
                  )
              elif want.lower() != sha256.lower():
                  fail.append(
                      f"{plugin_id} {version}: pinned sha256 {sha256} does not match "
                      f"upstream {want} for {asset}. If Renovate raised this PR, copy "
                      f"the upstream value into the {name} args before merging: an "
                      f"unmatched checksum fails the initContainer and stops the proxy."
                  )
              else:
                  print(f"  sha256 matches upstream checksums.txt ({sha256[:12]}...)")

          for w in warn:
              print(f"WARNING: {w}")
          if fail:
              print("\nPlugin pin problems:")
              print("\n".join(fail))
              sys.exit(1)
          print(f"\nAll {len(pins)} plugin pins checked ({len(warn)} unreachable).")
          PY

      - name: Kustomize build (sops-free dirs)
        run: |
          set -euo pipefail
          dirs="
            2-k3s/01.kube-vip
            2-k3s/03.kube-vip-cloud-provider
            2-k3s/04.coredns
            2-k3s/06.postgres/operator-kustomization
            2-k3s/11.argocd/apps
            2-k3s/12.renovate
            2-k3s/maintenance
            2-k3s/maintenance/system-upgrade/controller
          "
          for d in $dirs; do
            echo "kustomize build $d"
            kustomize build "$d" >/dev/null
          done
          echo "All sops-free overlays build."
