# Bazarr 1.6.2 app/logger.py console formatter includes a padded logger and hex thread ID.
- name: bazarr-error-multiline
  matches: true
  before: '2026-10-11 12:00:00,123 - root                             (7f12ab345678) :  INFO (get_providers:88) - Starting lookup'
  line: |
    2026-10-11 12:00:00,123 - root                             (7f12ab345678) :  ERROR (get_providers:88) - Lookup failed
    Traceback (most recent call last):
      File "worker.py", line 88, in get_providers
        raise RuntimeError("connection closed")
    RuntimeError: connection closed
