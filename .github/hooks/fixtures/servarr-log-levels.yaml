# Synthetic messages with observed console layouts, never copied credentials.
# Each line/block is written as raw CRI records through the shipped Alloy process.
# `before` is a separate event immediately preceding each block in the same stream.
- name: seerr-debug-dns-retry
  matches: false
  line: "2026-10-11T12:00:00.000Z [\e[34mdebug\e[39m][DNS]: Retry lookup {\"error\":{\"code\":\"EAI_AGAIN\"}}"
- name: json-debug-error-field
  matches: false
  line: '{"level":"debug","message":"DNS retry","error":{"code":"EAI_AGAIN"}}'
- name: json-info-nested-fatal-level
  matches: false
  line: '{"level":"info","error":{"level":"fatal","message":"previous error"}}'
- name: json-missing-level
  matches: false
  line: '{"error":"fatal panic","message":"diagnostic payload"}'
- name: json-debug-multiline
  matches: false
  line: |
    {
      "level": "debug",
      "error": {"level": "fatal", "message": "panic"}
    }
- name: console-debug-multiline
  matches: false
  line: |
    [Debug] DNS: Retrying after an error
      {"error":{"level":"fatal","message":"panic"}}
      [Error] quoted diagnostic, not the entry's severity
      2026-10-11 12:00:00.000|Fatal|quoted diagnostic
- name: console-debug-followed-by-error-records
  matches: true
  expected_matches: 52
  entries:
    - '[Debug] Worker: Reading diagnostics'
    - '[Error] Worker: Lookup failed'
    - '2026-10-11 12:00:00.000|Fatal|Worker|Worker stopped'
  line: |
    [Debug] Worker: Reading diagnostics
    [Error] Worker: Lookup failed
    2026-10-11 12:00:00.000|Fatal|Worker|Worker stopped
- name: console-info-error-text
  matches: false
  line: '[Info] Worker: Previous fatal error recovered'
- name: json-error
  matches: true
  before: '{"level":"info","message":"Starting lookup"}'
  line: '{"level":"error","message":"Lookup failed"}'
- name: json-fatal
  matches: true
  line: '{"message":"Worker stopped","level":"fatal"}'
- name: json-panic
  matches: true
  line: '{"level":"panic","message":"Worker stopped"}'
- name: json-critical
  matches: true
  line: '{"level":"CRITICAL","message":"Worker stopped"}'
- name: json-info-nested-critical-level
  matches: false
  line: '{"level":"info","error":{"level":"critical","message":"previous error"}}'
