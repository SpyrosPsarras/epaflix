# Each case gets its own stream and 20-minute slot so cases in one namespace never add up.
- name: agent-five-errors
  alert: DiscordAgentErrors
  namespace: discord-media
  container: openclaw
  entries: 9
  lines:
    - '{"time":"2026-11-09T12:00:00.000+00:00","level":"info","subsystem":"gateway","message":"ready"}'
    - '{"time":"2026-11-09T12:00:01.000+00:00","level":"error","subsystem":"gateway/channels/discord","message":"send failed"}'
    - '{"time":"2026-11-09T12:00:02.000+00:00","level":"info","subsystem":"agent","message":"run started"}'
    - '{"time":"2026-11-09T12:00:03.000+00:00","level":"error","subsystem":"agent","message":"model call failed"}'
    - '{"time":"2026-11-09T12:00:04.000+00:00","level":"error","subsystem":"agent","message":"model call failed"}'
    - '{"time":"2026-11-09T12:00:05.000+00:00","level":"warn","subsystem":"agent","message":"retrying"}'
    - '{"time":"2026-11-09T12:00:06.000+00:00","level":"fatal","subsystem":"gateway","message":"stopped"}'
    - '{"time":"2026-11-09T12:00:07.000+00:00","level":"info","subsystem":"gateway","message":"ready"}'
    - '{"time":"2026-11-09T12:00:08.000+00:00","level":"error","subsystem":"gateway/channels/discord","message":"send failed"}'
  fires: true
- name: agent-four-errors
  alert: DiscordAgentErrors
  namespace: discord-windmill
  container: openclaw
  entries: 6
  lines:
    - '{"time":"2026-11-09T12:00:00.000+00:00","level":"error","subsystem":"agent","message":"model call failed"}'
    - '{"time":"2026-11-09T12:00:01.000+00:00","level":"error","subsystem":"agent","message":"model call failed"}'
    - '{"time":"2026-11-09T12:00:02.000+00:00","level":"error","subsystem":"agent","message":"model call failed"}'
    - '{"time":"2026-11-09T12:00:03.000+00:00","level":"error","subsystem":"agent","message":"model call failed"}'
    - '{"time":"2026-11-09T12:00:04.000+00:00","level":"info","subsystem":"agent","message":"previous error recovered"}'
    - '{"time":"2026-11-09T12:00:05.000+00:00","level":"warn","subsystem":"agent","message":"error rate high"}'
  fires: false
- name: agent-error-text-not-level
  alert: DiscordAgentErrors
  namespace: discord-media
  container: openclaw
  entries: 5
  lines:
    - '{"time":"2026-11-09T12:00:00.000+00:00","level":"info","subsystem":"agent","message":"tool returned an error"}'
    - '{"time":"2026-11-09T12:00:01.000+00:00","level":"debug","error":{"level":"error"},"subsystem":"agent","message":"retry"}'
    - '{"time":"2026-11-09T12:00:02.000+00:00","level":"info","subsystem":"agent","message":"fatal: not a git repository"}'
    - '{"time":"2026-11-09T12:00:03.000+00:00","level":"warn","subsystem":"agent","message":"level error"}'
    - 'Error: plain text without a level'
  fires: false
- name: token-sidecar-failing
  alert: DiscordAgentErrors
  namespace: discord-windmill
  container: gh-token
  lines:
    - 'gh-token: fetch failed ECONNRESET'
    - 'gh-token: fetch failed ECONNRESET'
    - 'gh-token: GitHub returned 401 '
    - 'gh-token: GitHub returned 401 '
    - 'gh-token: GitHub returned 401 '
  fires: true
- name: token-sidecar-healthy
  alert: DiscordAgentErrors
  namespace: discord-windmill
  container: gh-token
  lines:
    - 'gh-token: refreshed'
    - 'gh-token: refreshed'
    - 'gh-token: refreshed'
    - 'gh-token: refreshed'
    - 'gh-token: refreshed'
  fires: false
- name: deploy-failed
  alert: WindmillDeployFailed
  namespace: windmill
  container: windmill-deploy
  lines:
    - 'Computing the files to update on the remote to match local'
    - '{"commit":"0123456789abcdef0123456789abcdef01234567","outcome":"failed","error":"wmill exited with 1"}'
  fires: true
- name: deploy-ok
  alert: WindmillDeployFailed
  namespace: windmill
  container: windmill-deploy
  lines:
    - 'Computing the files to update on the remote to match local'
    - '{"commit":"0123456789abcdef0123456789abcdef01234567","outcome":"deployed"}'
  fires: false
